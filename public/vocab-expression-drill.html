<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>표현 학습 — 두 섹션</title>
<style>
  :root { --bg:#aed7fc; --ink:#394042; --green:#0f9a69; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:#eef3f9; color:var(--ink); display:flex; justify-content:center; }
  .app { width:100%; max-width:460px; min-height:100vh; padding:14px 16px 40px; background:var(--bg); }
  h1 { font-size:17px; margin:2px 2px 10px; color:#fff; text-shadow:0 1px 2px rgba(30,60,110,.25); }

  /* 섹션 탭 — 패턴화 가능 / 불가는 학습 방식이 다르다 */
  .tabs { display:flex; gap:6px; margin:0 0 8px; }
  .tabs button { flex:1; border:none; border-radius:13px; padding:9px 8px; font-size:14px; font-weight:800; cursor:pointer; background:rgba(255,255,255,.45); color:#35506f; }
  .tabs button.on { background:#fff; color:#2f3e52; box-shadow:0 3px 10px rgba(30,60,110,.12); }
  .tabs .c { display:block; font-size:11.5px; font-weight:700; color:#8a98ad; margin-top:2px; }
  /* UI안 — 새 UI(제안안) / 지금 앱 UI만(대체안) */
  .seg { display:flex; background:rgba(255,255,255,.4); border-radius:12px; padding:3px; gap:3px; }
  .seg button { flex:1; border:none; border-radius:9px; padding:7px 6px; font-size:12.5px; font-weight:800; cursor:pointer; background:none; color:#35506f; }
  .seg button.on { background:#4b83d6; color:#fff; }
  .segd { font-size:11.5px; color:#35506f; margin:5px 4px 10px; line-height:1.45; }

  .units { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .unit { border:1px solid rgba(255,255,255,.8); background:rgba(255,255,255,.35); color:#35506f; border-radius:20px;
    padding:6px 12px; font-size:13px; font-weight:700; cursor:pointer; }
  .unit.on { background:#4b83d6; border-color:#4b83d6; color:#fff; }
  .unit.rand { border-style:dashed; }
  .find-u { display:flex; margin-bottom:10px; }
  .find-u input { flex:1; min-width:0; border:none; border-radius:11px; padding:8px 11px; font-size:13px; background:rgba(255,255,255,.7); color:#2f3e52; }

  .top { display:flex; align-items:center; gap:8px; margin:4px 2px 30px; }
  .bar { flex:1; height:10px; background:rgba(255,255,255,.55); border-radius:6px; overflow:hidden; }
  .bar i { display:block; height:100%; background:#3f8ef0; border-radius:6px; transition:width .3s; }
  .top .n { font-size:12px; font-weight:800; color:#fff; }
  .top .back { font-size:22px; cursor:pointer; padding:0 4px; }
  .modes { margin-bottom:10px; }
  /* 학습하기 홈 — vocab-expression.html 의 시작 카드 */
  .start { background:#fff; border-radius:22px; padding:22px 20px; margin-top:8px; box-shadow:0 6px 16px rgba(30,60,110,.12); text-align:center; }
  .start .sf { font-size:13px; font-weight:700; color:#5d6f88; line-height:1.6; } .start .sf span { color:#a3afc0; }
  .start .sc { font-size:16px; color:#33465c; margin:12px 0 4px; } .start .sc b { color:#3f8ef0; }
  .start .sn { font-size:12.5px; color:#8a98ad; margin-bottom:16px; }
  .start .sbtn { width:100%; border:none; border-radius:14px; padding:16px; font-size:16px; font-weight:800; color:#fff; background:#8571ef; cursor:pointer; }
  .start .rbtn { width:100%; border:none; background:none; margin-top:8px; padding:8px; font-size:13px; color:#8a98ad; cursor:pointer; }
  /* 어휘 빈칸 */
  .vko { font-size:18px; font-weight:600; color:#222; line-height:1.5; } .vko.note { font-size:13.5px; font-weight:400; color:#8a98ad; }
  .ven { font-size:20px; line-height:1.9; color:#394042; }
  .vin { font:inherit; font-size:20px; field-sizing:content; min-width:64px; border:none; border-bottom:2px solid #3f8ef0; background:#f3f7fd; border-radius:6px 6px 0 0; padding:0 6px; color:#2f3e52; outline:none; }
  .vin.done { border-bottom-color:var(--green); background:#f4fdf8; color:#237a4a; font-weight:700; }
  .vin::placeholder { color:#a3afc0; }
  .vnote { margin-top:8px; font-size:13px; color:#8a98ad; } .vnote b { color:#33465c; margin-left:6px; }
  .wc { color:#d24b3a; font-weight:800; }

  /* 앱 문제 카드 — 레벨 탭 · 상단(분홍) · 문제 영역(흰색) */
  .cardwrap { position:relative; }
  .ctab .cq { display:inline-flex; align-items:center; justify-content:center; width:13px; height:13px; margin-left:4px; border-radius:50%; background:#fff; color:#8ac4f2; font-size:9px; vertical-align:1px; }
  .ctab { position:absolute; top:-19px; left:8px; background:#8ac4f2; color:#fff; font-size:11px; font-weight:800; border-radius:10px 10px 0 0; padding:4px 12px 8px; }
  .cnew { position:absolute; top:-16px; right:10px; background:#fa5555; color:#fff; font-size:10.5px; font-weight:800; border-radius:8px; padding:3px 9px 7px; }
  .acard { position:relative; background:#fff; border-radius:24px; overflow:hidden; box-shadow:0 6px 16px rgba(30,60,110,.14); }
  .ahead { background:#fdf0f0; padding:24px 20px 20px; min-height:104px; }
  .hk { font-size:19px; font-weight:600; color:#222; line-height:1.5; }
  .hx { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  .hguide { font-size:13px; font-weight:700; color:#6b7a90; }
  .he { font-size:18px; font-weight:600; color:#222; line-height:1.45; }
  .he .g, .ahead .g { color:var(--green); font-weight:800; }
  .hs { font-size:13px; color:#8a98ad; margin-top:2px; }
  .tgt { color:var(--green); font-weight:800; }
  .abody { background:#fcfcfc; padding:18px 18px 20px; min-height:160px; }
  .sp { border:none; background:none; padding:0 2px; cursor:pointer; font-size:15px; }

  /* 정답 줄 — 고정 낱말 + 빈칸(밑줄). 정답 줄 아래 번역 */
  .aline { display:flex; flex-wrap:wrap; align-items:center; gap:10px 7px; min-height:48px; font-size:20px; }
  .sw { color:#5a6268; font-weight:500; }
  .sw.p { margin-left:-5px; }
  .ul { display:inline-flex; align-items:center; justify-content:center; min-width:58px; height:38px; border-bottom:2px solid #c3cbd6; cursor:pointer; }
  .ul .w { margin:0; }
  .ul.ok .w { background:#f4fdf8; border-color:#8ed9ac; color:#237a4a; }
  .ul.bad .w { background:#fdeee6; border-color:#f0c4a8; color:#b5541c; }
  .atrans { font-size:14.5px; color:#8a98ad; margin-top:12px; }
  .aline.arr { border-bottom:2px solid #e2e9f3; padding-bottom:10px; }

  /* 단어 카드 — 앱 GrammarDraggableWord */
  .bank { display:flex; flex-wrap:wrap; gap:6px; }
  .w { font:inherit; font-size:19px; font-weight:400; color:#394042; padding:5px 9px; border:1px solid #d5d9e8; background:#fff; border-radius:8px; cursor:pointer; line-height:1.3; }
  .w:active { transform:translateY(1px); }
  .w.g { background:#f4fdf8; border-color:#8ed9ac; color:#237a4a; }
  .w.used { background:#f0f0f5; border-color:#f0f0f5; color:transparent; pointer-events:none; }
  .w.up { background:#eef2fb; border-color:#eef2fb; }
  .w.ok { background:#f4fdf8; border-color:#8ed9ac; color:#237a4a; }
  .w.bad { background:#fdeee6; border-color:#f0c4a8; color:#b5541c; }
  .w.trapx { background:#fdeee6; border-color:#f0c4a8; color:#b5541c; text-decoration:line-through; }

  /* 하단 — 단어 카드 영역 + 버튼 */
  .abot { background:#fff; margin:18px -16px 0; padding:16px 18px 18px; min-height:230px; display:flex; flex-direction:column; gap:14px; }
  .abtns { display:flex; gap:8px; margin-top:auto; }
  .abtns button { border:none; color:#fff; font-size:15px; font-weight:700; border-radius:12px; padding:15px 8px; cursor:pointer; }
  .abtns .lb { width:86px; background:#af85f2; font-size:12.5px; }
  .abtns .ok { flex:1; background:#8571ef; }
  .abtns .ok:disabled { background:#cfd4e3; cursor:default; }


  /* 예시 말풍선 (제안안 — 새 UI) */
  .model { display:flex; gap:8px; align-items:flex-start; margin:0 0 12px; }
  .model .av { flex:0 0 26px; height:26px; border-radius:50%; background:#8ac4f2; color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; font-size:12px; margin-top:4px; }
  .model .bub { flex:1; background:#fff; border:1px solid #d5d9e8; border-radius:12px; padding:8px 12px; }
  .model .en { font-size:16px; font-weight:600; line-height:1.45; }
  .model .en .g { color:var(--green); font-weight:800; }
  .model .k { font-size:12.5px; color:#8a98ad; margin-top:2px; }
  .newui { display:inline-block; font-size:10.5px; font-weight:800; color:#c4632c; background:#fdeadf; border-radius:6px; padding:1px 6px; margin-bottom:8px; }

  /* 찾기 두 줄 (제안안 — 새 UI) */
  .fl { padding:6px 0 10px; }
  .fl .kr { font-size:15.5px; font-weight:600; margin-bottom:6px; }
  .wline { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .wk.miss { color:#aab7c8; border-color:#e6eaf0; text-decoration:underline; text-decoration-color:#e3c9b0; }
  .wk.plain { border-color:transparent; background:none; padding:5px 1px; cursor:default; }
  .note { font-size:13.5px; color:#3a6bb0; background:#eef4fd; border-radius:10px; padding:7px 10px; line-height:1.45; }

  /* 결과 */
  /* 카드 정답 · 오답 효과(앱 grammar_card_correct · grammar_card_wrong) — 글자 없이 카드만 */
  .acard.cok { animation:cok .5s ease; } .acard.cno { animation:cno .45s ease; }
  @keyframes cok { 0%{ box-shadow:0 0 0 0 rgba(15,154,105,.55); } 100%{ box-shadow:0 0 0 14px rgba(15,154,105,0); } }
  @keyframes cno { 0%,100%{ transform:none; } 20%{ transform:translateX(-7px); } 40%{ transform:translateX(6px); } 60%{ transform:translateX(-4px); } 80%{ transform:translateX(2px); } }
  .guide { margin-top:12px; background:#fff6d8; color:#6b5313; border-radius:10px; padding:8px 11px; font-size:14px; font-weight:600; line-height:1.45; }
  .guide.blue { background:#eaf2fe; color:#2f5fa6; }
  .w.need { border-color:#f2c14e; box-shadow:0 0 0 2px #fbe3a2 inset; }
  .cardwrap { animation:up .25s ease both; }
  @keyframes up { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  /* 결과 설명 카드(앱에 있는 것) */
  .xcard { position:relative; background:#fff; border-radius:22px; margin:34px 0 0; padding:20px 18px 16px; box-shadow:0 6px 16px rgba(30,60,110,.12); }
  .xcard .xtab { position:absolute; top:-18px; left:10px; background:#8ac4f2; color:#fff; font-size:11px; font-weight:800; border-radius:10px 10px 0 0; padding:4px 12px 8px; }
  .xt { font-size:14px; font-weight:800; color:#33465c; }
  .xf { font-size:22px; font-weight:800; color:var(--green); text-align:center; margin:12px 0 2px; }
  .xm { font-size:13.5px; color:#8a98ad; text-align:center; }
  .xp { font-size:15px; font-weight:600; text-align:center; margin-top:8px; }
  .xp b { color:var(--green); }
  .xd { margin-top:12px; background:#f4f6fa; border-radius:10px; padding:8px 11px; font-size:13px; color:#5d6f88; line-height:1.45; }
  .xd.know { color:#33465c; } .xd.know b { display:block; font-size:12px; color:#5d6f88; margin-bottom:2px; }
  /* 바텀시트 — 하단 영역이 둥근 시트로 올라온다(표현 바텀시트 · 규칙 공개) */
  .abot.sheet { border-radius:24px 24px 0 0; box-shadow:0 -8px 20px rgba(30,60,110,.10); animation:up .3s ease both; }
  .xsheet .xt { color:var(--green); }
  .xd.know.empty div { color:#a3afc0; font-style:italic; }
  .acts { display:flex; justify-content:space-around; margin-top:16px; font-size:11.5px; color:#8a98ad; }
  .xe { font-size:12.5px; color:#8a98ad; margin:14px 0 6px; border-top:1px dashed #e3e8f0; padding-top:12px; }
  .xs { font-size:15.5px; font-weight:600; line-height:1.45; margin-bottom:8px; }
  .xs .g { color:var(--green); font-weight:800; }
  .xs .k { font-size:12.5px; color:#8a98ad; font-weight:400; }

  .uiwho { font-size:11.5px; color:#35506f; margin:10px 2px 0; line-height:1.45; }
  .uiwho b { color:#2f3e52; }

  /* 완료 */

  /* 단계표 — 이 유닛이 단계마다 실제로 쓰는 문장 */
  .table { background:#fff; border-radius:16px; padding:10px 12px; margin-top:16px; box-shadow:0 4px 12px rgba(30,60,110,.1); }
  .table summary { cursor:pointer; font-size:13px; font-weight:800; color:#3a6bb0; list-style:none; }
  .table summary::-webkit-details-marker { display:none; }
  .table summary::after { content:' ▾'; color:#9aa8bc; }
  .table[open] summary::after { content:' ▴'; }
  .st { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
  .st th { text-align:left; color:#8a98ad; font-weight:800; padding:4px 3px; border-bottom:1px solid #eef2f8; }
  .st td { padding:6px 3px; border-bottom:1px solid #f2f5fa; vertical-align:top; line-height:1.45; }
  .st td .g { color:#1f7a49; font-weight:800; }
  .st td .ui { display:block; color:#8a98ad; font-size:11px; }
  .st td .ui.n { color:#c4632c; }
  .st tr.cur td { background:#eef4fd; }
  .st tr.cur td:first-child { box-shadow:inset 3px 0 0 #4b83d6; }
  .st .mk { font-weight:800; } .st .o { color:#2e9e57; } .st .x { color:#c46a2c; }
  .st .tg { display:inline-block; font-size:10.5px; font-weight:800; border-radius:6px; padding:0 5px; }
  .tg.b { background:#e3edfb; color:#3a6bb0; } .tg.r { background:#fdeadf; color:#c4632c; }
  .rules { font-size:11.5px; color:#6b7c93; line-height:1.55; margin:8px 0 2px; }
  .rules b { color:#3d5778; }
</style>
</head>
<body>
<div class="app">
  <h1>표현 학습 — 어휘 → 표현 NEW</h1>
  <div class="seg modes" id="modes"><button data-m="learn">학습하기</button><button data-m="explore">유닛 살펴보기 (기획)</button></div>
  <div id="explore">
  <div class="tabs" id="tabs"></div>
  <div class="seg" id="uiSeg"><button data-u="new">제안안 · 새 UI</button><button data-u="now">대체안 · 지금 앱 UI만</button></div>
  <div class="segd" id="uiDesc"></div>
  <div class="units" id="units"></div>
  <div class="find-u"><input id="q" type="search" placeholder="유닛 id나 카드 초록으로 찾기 (예: 10065, stop)" enterkeyhint="search"></div>
  </div>
  <div id="home"></div>
  <div class="top" id="top"><span class="n back" id="back">‹</span><div class="bar"><i id="barI"></i></div><span class="n" id="barN"></span></div>
  <div id="stage"></div>
  <details class="table" id="tbl" open><summary>단계표 — 이 유닛이 단계마다 쓰는 문장</summary><div id="tblBody"></div></details>
</div>

<script>
/* 패턴화 가능과 불가는 학습 방식이 다르다 — 섹션을 나눈다. 화면은 앱(통합모드 표현 첫 학습)의 카드 모양을 따른다.
   UI안 둘을 나란히 둔다.
   제안안(new) — 예시 말풍선 · 찾기(두 문장에서 낱말 누르기)를 새로 만든다. 찾은 규칙은 결과 설명 카드가 보여 준다.
   대체안(now) — 앱에 이미 있는 것만 쓴다: 드래그 카드 「표현만」(정답 줄의 표현 자리만 탭해 채움, 상단 뜻 줄 + 정답 줄 아래 번역)
                · 「문장 전체」 배열 · 결과 설명 카드. 예시는 상단 뜻 줄에, 규칙 공개는 결과 설명 카드가 맡는다.
   문장은 단계마다 src 로 정한다(아래 '문장 고르기').
   단계는 정오답과 상관없이 차례로 간다. 한 번이라도 틀리면(헤매면) 마지막에 처음 틀린 단계를 '한 번 더' — 유닛에 한 번.
   head : 카드 상단 — trans(풀 문장의 번역, [ ] 초록) · mean(카드 뜻, 전체 초록) · example(S1 영어 예시) · ask(지시문)
   alt  : 뱅크에 헷갈리는 낱말 1개(정답 대신 놓기 쉬운 원형·다른 꼴·다른 쪽 — 코드 이름 ALT) · green : 뱅크의 [ ] 낱말을 초록으로(앱 첫 학습 색 — 헷갈리는 낱말이 있으면 답이 새서 끈다)
   badge : 카드 우상단 태그 — 지원이 줄어드는 순서(기초 → 응용 → 실전), 한 번 더는 '한 번 더'(앱의 '재도전'은 다른 뜻이라 쓰지 않는다)
   sheet : 끝나면 표현 바텀시트(가능 1단계 — 모든 유닛) · reveal : 끝나면 규칙 공개 시트(불가)
   알아 두기(KNOW) : 유닛이 처음 띄우는 결과 설명 카드의 팁 자리 — 그런 카드가 없는 흐름은 1단계 뒤에 띄운다 */
const LONG = { kind:'long', head:'trans', tag:'r', badge:'실전', name:'문장 배열 + 트랩', ui:'문장 전체 카드 + 트랩 3개' };
const FLOWS = {
  new:{
    pattern:{
      '1':{ kind:'fill', src:'s1', ex:'v12', head:'trans', models:'ex', tag:'b', badge:'기초', name:'보고 만들기', noAgain:true, sheet:true, ui:'새 UI — 예시 말풍선(1-2) + 빈칸 → 표현 바텀시트', newUi:true },
      '2':{ kind:'arrange', src:'s1', head:'trans', tag:'b', badge:'응용', name:'문장 배열', ui:'문장 전체 카드' },
      '3':{ ...LONG, src:'v2' } },
    rule:{
      '1':{ kind:'find', src:'v12', head:'ask', tag:'b', badge:'기초', name:'찾기', ask:'초록 뜻에 해당하는 영어를 두 문장에서 눌러 보세요', reveal:true, ui:'새 UI — 두 문장에서 낱말 누르기 → 결과 설명 카드(규칙 공개)', newUi:true },
      '2':{ kind:'fill', src:'v13', head:'trans', models:'found', alt:true, tag:'b', badge:'응용', name:'규칙 적용', ui:'새 UI — 예시 말풍선 2개 + 빈칸 + 헷갈리는 낱말', newUi:true },
      '3':{ kind:'arrange', src:'s1', head:'trans', alt:true, tag:'r', badge:'응용', name:'문장 배열', ui:'문장 전체 카드 + 헷갈리는 낱말' },
      '4':{ ...LONG, src:'v12' } },
  },
  now:{
    pattern:{
      '1':{ kind:'fill', src:'s1', ex:'v12', head:'example', green:true, tag:'b', badge:'기초', name:'보고 만들기', noAgain:true, sheet:true, ui:'표현만 카드 — 상단 뜻 줄에 1-2 예시 → 표현 바텀시트' },
      '2':{ kind:'arrange', src:'s1', head:'trans', green:true, tag:'b', badge:'응용', name:'문장 배열', ui:'문장 전체 카드' },

    if (hit === undefined) { wrong++; b.classList.add('miss'); $('#nt').innerHTML = `<div class="note">초록 뜻과 다른 말이에요</div>`; return; }
    got[n].add(hit); $(`.wk[data-r="${n}"][data-j="${hit}"]`).classList.add('ok');
    $('#nt').innerHTML = left() ? `<div class="note">${left()}낱말 더 있어요</div>` : '';
    if (!left()) done(false);
  });
  $('#lb').onclick = () => { if (!fin) done(true); };
}

/* 표현만 카드 — 정답 줄의 [ ] 자리만 빈칸(밑줄), 나머지 낱말은 그대로. 뱅크 = [ ] 낱말 (+ 헷갈리는 낱말).
   예시: 제안안은 카드 안 말풍선(새 UI), 대체안은 상단 뜻 줄. 표현 보기 = 앱 sub 1 — 빈칸을 정답으로 채워 공개(정답 보기와 같은 취급) */
function quizFill(s, i) {
  const u = unit(), x = u.s[i], br = brIdx(x), alt = s.alt ? altOf(u, i) : null;
  const models = s.models === 'found' ? (run.found || [0]) : s.models === 'ex' ? [run.plan.ex[run.stage === 'again' ? run.firstMiss : run.stage] || 0] : [];
  const line = `<div class="aline">${x.t.map((t, j) => br.includes(j) ? `<span class="ul" data-j="${j}"></span>` : `<span class="sw">${esc(t[0])}</span>`).join('')}<span class="sw p">${esc(x.p)}</span></div>`;
  shell(s, x, models.map((r, n) => bubbleHtml(u.s[r], n)).join('') + line + (s.head !== 'trans' ? `<div class="atrans">${esc(plain(x.kr))}</div>` : ''));
  const tiles = shuffle([...br.map(j => x.t[j][0]), ...(alt ? [alt.w] : [])]), green = s.green && !alt;
  $('#bank').innerHTML = tiles.map((w, k) => `<button class="w${green ? ' g' : ''}" data-k="${k}">${esc(tileText(w))}</button>`).join('');
  $('#btns').innerHTML = `<button class="lb" id="lb">표현 보기</button><button class="ok" id="ok">확인</button>`;
  const put = {}; let fin = false, checked = false;
  const want = br.map(j => x.t[j][0]), got = () => br.map(j => put[j] === undefined ? null : tiles[put[j]]);
  const draw = () => {
    const jd = checked ? judge(want, got()) : null;
    $$('.aline .ul').forEach(e => { const k = put[e.dataset.j], n = br.indexOf(+e.dataset.j); e.classList.remove('ok', 'bad');
      e.innerHTML = k === undefined ? '' : `<span class="w up${green && !run.tried ? ' g' : ''}${jd && jd.st[n] && jd.st[n] !== 'ok' ? ' bad' : ''}">${esc(tileText(tiles[k]))}</span>`; });
    $$('#bank .w').forEach(b => b.classList.toggle('used', Object.values(put).includes(+b.dataset.k)));
    if (jd) { $('#tip').innerHTML = jd.correct ? '' : autoNote(jd); markNeed(jd, b => tiles[+b.dataset.k]); }
  };
  $$('#bank .w').forEach(b => b.onclick = () => { if (fin) return; const j = br.find(j => put[j] === undefined); if (j === undefined) return; put[j] = +b.dataset.k; draw(); });
  $$('.aline .ul').forEach(e => e.onclick = () => { if (fin) return; delete put[e.dataset.j]; draw(); });
  $('#lb').onclick = () => { if (fin) return; fin = true; $('#tip').innerHTML = '';
    $$('.aline .ul').forEach(e => { e.innerHTML = `<span class="w up${green ? ' g' : ''}">${esc(tileText(x.t[e.dataset.j][0]))}</span>`; e.classList.add('ok'); });
    $$('#bank .w').forEach(b => { b.classList.add('used'); b.classList.remove('need'); });
    complete(i, true); };
  $('#ok').onclick = () => { if (fin) return;
    const jd = judge(want, got());
    if (jd.correct) { fin = true; $('#tip').innerHTML = ''; $$('.aline .ul').forEach(e => e.classList.add('ok'));
      $$('.aline .ul .w').forEach(w => { if (green) w.classList.add('g'); }); return complete(i, false); }
    if (jd.empty) { $('#tip').innerHTML = autoNote(jd); return; }
    run.tried = true; checked = true; cardAnim('cno'); draw(); };
  draw();
}

/* 문장 전체 카드 — 한국어(상단)만 보고 통째로. extra 는 뱅크에 섞이는 낱말(헷갈리는 낱말 · 트랩).
   정답 보기 = 문장 전체를 정답으로 채워 공개(헤맨 것으로 친다). 틀리면 그 자리에서 다시 — 표시 · 오답노트는 quizFill 과 같다 */
function arrangeIn(s, i, extra) {
  const u = unit(), x = u.s[i], seq = x.t.map(t => t[0]);
  shell(s, x, `<div class="aline arr" id="fill"></div>`);
  const green = s.green && !extra.length;
  const items = [...x.t.map(t => ({ w:t[0], g:green && t[1] })), ...extra.map(w => ({ w, trap:true }))];
  const order = shuffle(items.map((_, k) => k)), placed = [];
  let fin = false, checked = false;
  const tile = (it, attr, cls = '') => `<button class="w${it.g ? ' g' : ''}${cls}" ${attr}>${esc(tileText(it.w))}</button>`;
  $('#bank').innerHTML = order.map(k => tile(items[k], `data-k="${k}"`)).join('');
  $('#btns').innerHTML = `<button class="lb" id="lb">정답 보기</button><button class="ok" id="ok">확인</button>`;
  const got = () => seq.map((_, j) => placed[j] === undefined ? null : items[placed[j]].w);
  const draw = () => {
    const jd = checked ? judge(seq, got()) : null;
    $('#fill').innerHTML = placed.map((k, j) => tile({ ...items[k], g:items[k].g && !run.tried }, `data-j="${j}"`, ' up' + (jd && jd.st[j] !== 'ok' ? ' bad' : ''))).join('') + '<span class="ul"></span>'.repeat(seq.length - placed.length) + (placed.length === seq.length && x.p ? `<span class="sw p">${esc(x.p)}</span>` : '');
    $$('#bank .w').forEach(b => b.classList.toggle('used', placed.includes(+b.dataset.k)));
    $$('#fill .w').forEach(b => b.onclick = () => { if (fin) return; placed.splice(+b.dataset.j, 1); draw(); });
    if (jd) { $('#tip').innerHTML = jd.correct ? '' : autoNote(jd); markNeed(jd, b => items[+b.dataset.k].w); }
  };
  $$('#bank .w').forEach(b => b.onclick = () => { if (fin || placed.length >= seq.length) return; placed.push(+b.dataset.k); draw(); });
  $('#lb').onclick = () => { if (fin) return; fin = true; checked = false; $('#tip').innerHTML = ''; placed.splice(0, placed.length, ...seq.map((_, j) => j)); draw();
    $$('#fill .w').forEach(b => b.classList.add('ok')); $$('#bank .w').forEach(b => b.classList.remove('need')); complete(i, true); };
  $('#ok').onclick = () => { if (fin) return;
    const jd = judge(seq, got());
    if (jd.correct) { fin = true; checked = false; draw(); $$('#fill .w').forEach(b => b.classList.add('ok')); return complete(i, false); }
    if (jd.empty) { $('#tip').innerHTML = autoNote(jd); return; }
    run.tried = true; checked = true; cardAnim('cno'); draw(); };
  draw();
}
function quizArrange(s, i) { const alt = s.alt ? altOf(unit(), i) : null; arrangeIn(s, i, alt ? [alt.w] : []); }
function quizLong(s, i) { arrangeIn(s, i, trapsOf(unit(), i)); }

/* 친구 말 고쳐 주기 — 틀린 곳 계산. bad 와 고칠 문장 x 를 낱말로 나눠 앞 · 뒤에서 같은 낱말을 걷어 내고 남는 가운데:
   span = bad 에서 틀린 낱말의 자리, fix = x 에서 그 자리에 들어갈 낱말. 둘 중 하나라도 비면 쓸 수 없는 실수다(ok:false) */
function fixParts(f, x) {
  const m = f.bad.match(/^(.*?)([.!?]*)$/), toks = m[1].split(' '), p = m[2], good = x.t.map(t => t[0]);
  let a = 0; while (a < toks.length && a < good.length && norm(toks[a]) === norm(good[a])) a++;
  let z = 0; while (z < toks.length - a && z < good.length - a && norm(toks[toks.length - 1 - z]) === norm(good[good.length - 1 - z])) z++;
  const span = toks.map((_, j) => j).slice(a, toks.length - z), fix = good.slice(a, good.length - z);
  return { toks, span, p, fix, pre:toks.slice(0, a), post:toks.slice(toks.length - z), good, ok:span.length > 0 && fix.length > 0 && p === x.p };
}
/* 친구가 한 말 한 줄 — 낱말을 눌러 틀린 곳을 짚는다. 틀린 곳의 낱말 중 아무거나 하나를 누르면 맞힌 것이고 틀린 곳 전체가 표시된다
   (Turn off it 에서 off · it 어느 쪽이든). 틀린 곳 밖을 누르면 '그 부분은 맞아요' — 헤맨 것으로 세지 않는다.
   짚으면 그 자리가 빈칸이 되고 단어 카드가 나온다 — 그다음은 표현만 카드(quizFill)와 같다: 뱅크 = fix 낱말 + 친구가 쓴 틀린 낱말 + 같은 부류 낱말 */
function quizFix(s, i) {
  const u = unit(), x = u.s[i], P = fixParts(FIX[u.id], x);
  shell(s, x, `<div class="aline" id="fline">${P.toks.map((t, j) => `<button class="w wk" data-j="${j}">${esc(t)}</button>`).join('')}<span class="sw p">${esc(P.p)}</span></div>`);
  $('#bank').innerHTML = '';
  $('#btns').innerHTML = `<button class="lb" id="lb">정답 보기</button><button class="ok" id="ok" disabled>확인</button>`;
  const used = new Set(P.good.map(norm)), extra = [];
  P.span.forEach(j => { const w = P.toks[j]; if (!P.fix.some(v => norm(v) === norm(w)) && !extra.some(v => norm(v) === norm(w))) extra.push(w); });
  const seed = [...x.en].reduce((a, c) => a + c.charCodeAt(0), 0);
  P.fix.forEach(w => { const pool = TRAP_BUCKETS.find(b => b.includes(norm(w))); if (!pool || extra.length >= 2) return;
    const c = pool.filter(v => !used.has(v) && !extra.some(e => norm(e) === v)); if (c.length) extra.push(c[seed % c.length]); });
  const tiles = shuffle([...P.fix, ...extra]), put = [];
  let fin = false, spotted = false, checked = false;
  const got = () => P.fix.map((_, n) => put[n] === undefined ? null : tiles[put[n]]);
  const draw = () => {
    const jd = checked ? judge(P.fix, got()) : null;
    $('#fline').innerHTML = P.pre.map(t => `<span class="sw">${esc(t)}</span>`).join('')
      + P.fix.map((_, n) => `<span class="ul" data-n="${n}">${put[n] === undefined ? '' : `<span class="w up${jd && jd.st[n] !== 'ok' ? ' bad' : ''}">${esc(tileText(tiles[put[n]]))}</span>`}</span>`).join('')
      + P.post.map(t => `<span class="sw">${esc(t)}</span>`).join('') + `<span class="sw p">${esc(P.p)}</span>`;
    $$('#fline .ul').forEach(e => e.onclick = () => { if (fin) return; put.splice(+e.dataset.n, 1); draw(); });
    $$('#bank .w').forEach(b => b.classList.toggle('used', put.includes(+b.dataset.k)));
    if (jd) { $('#tip').innerHTML = jd.correct ? '' : autoNote(jd); markNeed(jd, b => tiles[+b.dataset.k]); }
  };
  const openFix = () => { spotted = true; $('#tip').innerHTML = ''; $('#ok').disabled = false;
    $('#bank').innerHTML = tiles.map((w, k) => `<button class="w" data-k="${k}">${esc(tileText(w))}</button>`).join('');
    $$('#bank .w').forEach(b => b.onclick = () => { if (fin || put.length >= P.fix.length) return; put.push(+b.dataset.k); draw(); });
    draw(); };
  const settle = revealed => { fin = true; checked = false; $('#tip').innerHTML = '';
    if (revealed) { if (!spotted) openFix(); fin = true; put.splice(0, put.length, ...P.fix.map(w => tiles.indexOf(w))); draw(); }
    $$('#fline .ul').forEach(e => e.classList.add('ok')); $$('#fline .ul .w').forEach(w => w.classList.add('g'));
    $$('#bank .w').forEach(b => { b.classList.add('used'); b.classList.remove('need'); });
    complete(i, revealed); };
  $$('#fline .wk').forEach(b => b.onclick = () => { if (fin || spotted) return;
    if (P.span.includes(+b.dataset.j)) { P.span.forEach(j => $(`#fline .wk[data-j="${j}"]`).classList.add('bad')); setTimeout(openFix, 350); return; }
    b.classList.add('miss'); $('#tip').innerHTML = `<div class="guide">그 부분은 맞아요. 다른 곳을 눌러 보세요.</div>`; });
  $('#lb').onclick = () => { if (!fin) settle(true); };
  $('#ok').onclick = () => { if (fin || !spotted) return;
    const jd = judge(P.fix, got());
    if (jd.correct) return settle(false);
    if (jd.empty) { $('#tip').innerHTML = autoNote(jd); return; }
    run.tried = true; checked = true; cardAnim('cno'); draw(); };
}

/* 결과창 — 유닛 끝에 한 번, 앱 결과 화면 구성. 맨 위 카드 = 마지막에 푼 문장(표현 초록) · 태그 'n일 뒤 실력 확인'(일수는 앱이 복습 주기로 채운다),
   아래 학습 정보(앞에서 시트를 봤으면 '한 번 더 확인!'). 틀렸던 곳 목록은 두지 않는다 — 정오답은 1~3일 뒤 헷갈리는 낱말 · 트랩과 함께 다시 나올 때 판별한다 */
function finish() {
  run.phase = 'done'; run.stage = null; refresh();
  const u = unit(), x = u.s[run.lastI];
  $('#stage').innerHTML = `<div class="cardwrap">${levelTab(u)}<div class="cnew">n일 뒤 실력 확인</div><div class="acard">
      <div class="ahead"><div class="hk">${krHtml(x.kr)}</div></div>
      <div class="abody"><div class="aline">${x.t.map(t => `<span class="w${t[1] ? ' ok' : ' up'}">${esc(t[0])}</span>`).join('')}<span class="sw p">${esc(x.p)}</span></div>
        <div class="acts"><span>다시 듣기</span><span>듣기 평가 속도</span><span>다시 말하기</span><span>발음 진단</span></div></div></div></div>
    ${xcardHtml(u, run.revealed ? '💡 한 번 더 확인!' : '💡 새로운 표현을 배웠어요')}
    <div class="abot" style="min-height:0"><div class="abtns"><button class="lb" id="again">다시</button><button class="ok" id="nxu">다음 문제</button></div></div>`;
  if (mode === 'learn') { $('#again').remove(); $('#nxu').onclick = nextItem; return; }
  $('#again').onclick = () => open(uid);
  $('#nxu').onclick = () => $('#rand').click();
}

/* ── 학습하기 ── */
function setMode(m) {
  if (run) clearTimeout(run.timer);
  mode = m; save();
  $$('#modes button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('#explore').style.display = $('#tbl').style.display = m === 'explore' ? '' : 'none';
  if (m === 'learn') { ui = 'now'; return renderHome(); }
  ui = exploreUi; $('#home').innerHTML = ''; $('#top').style.display = ''; open(uid);
}
function renderHome() {
  if (run) clearTimeout(run.timer);
  $('#top').style.display = 'none'; $('#stage').innerHTML = '';
  const N = LS.items.length, pos = Math.min(getPos(), N), rest = N - pos;
  $('#home').innerHTML = `<div class="seg" id="s3seg" style="margin-bottom:6px"><button data-v="trap">3단계 · 문장 배열 + 트랩</button><button data-v="fix">3단계 · 친구 말 고쳐 주기</button></div>
    <div class="segd">${step3 === 'fix' ? `친구가 한 말에서 틀린 곳을 눌러 배운 표현으로 고쳐요 — 대표 ${N}유닛만 문장을 써 뒀어요` : '기획서 흐름 — 마지막 문장을 트랩 3개가 섞인 뱅크로 통째 배열해요'}</div>
    <div class="start"><div class="sf">어휘 빈칸 <span>→</span> 보고 만들기 <span>→</span> 표현 바텀시트 <span>→</span> 문장 배열 <span>→</span> ${step3 === 'fix' ? '친구 말 고쳐 주기' : '문장 배열 + 트랩'} <span>→</span> 결과</div>
    <div class="sc">${rest ? `남은 <b>${rest}</b>문항 · 총 ${N}문항` : `${N}문항을 모두 풀었어요`}</div>
    <div class="sn">문항마다 어휘를 익히고, 그 어휘로 쓰는 표현을 배워요 — 대체안(지금 앱 UI)</div>
    <button class="sbtn" id="startBtn">${!rest ? '다시 처음부터 ▶' : pos ? '이어서 풀기 ▶' : '학습 시작 ▶'}</button>
    ${pos && rest ? '<button class="rbtn" id="restartBtn">처음부터 다시 풀기</button>' : ''}</div>`;
  $$('#s3seg button').forEach(b => { b.classList.toggle('on', b.dataset.v === step3); b.onclick = () => { if (b.dataset.v === step3) return; step3 = b.dataset.v;
    try { localStorage.setItem('vedrill:step3', step3); } catch (e) {} pickItems(); renderHome(); }; });
  $('#startBtn').onclick = () => startLearn(rest ? pos : 0);
  if ($('#restartBtn')) $('#restartBtn').onclick = () => startLearn(0);
}
function pickItems() { LS.items = step3 === 'fix' ? LS.all.filter(x => fixOk(x.u)) : LS.all; }
function startLearn(i) { LS.idx = i; setPos(i); $('#home').innerHTML = ''; $('#top').style.display = ''; renderVocab(); }
function nextItem() { LS.idx++; setPos(LS.idx); if (LS.idx >= LS.items.length) return renderHome(); renderVocab(); }
function diffSpell(typed, answer) {
  let html = '', wrong = 0;
  for (let i = 0; i < Math.max(typed.length, answer.length); i++) {
    const t = typed[i];
    if (i >= typed.length) { html += '<span class="wc">_</span>'; wrong++; }
    else if (t.toLowerCase() === (answer[i] || '').toLowerCase()) html += esc(t);
    else { html += `<span class="wc">${esc(t)}</span>`; wrong++; }
  }
  return { html, wrong };
}
/* 어휘 빈칸 — vocab-expression.html 의 [1] 과 같다: 맞는 철자가 되는 순간 확인 없이 정답, 다 쳤는데 다르면 다른 글자 표시,
   힌트는 순차(앞 2글자 → 정답 보기). 정답 보기는 placeholder 로 보이므로 입력값을 비우고 문장 아래 정답을 남긴다 */
function renderVocab() {
  LS.phase = 'vocab'; if (run) clearTimeout(run.timer); drawBar();
  const it = LS.items[LS.idx], v = it.v.vocabA, answer = v.answer;
  let hint = 0, done = false;
  const ko = v.koLines.map(l => `<div class="vko${/^\s*\(/.test(l) ? ' note' : ''}">${krHtml(l)}</div>`).join('') + (v.hint ? `<div class="vko note">빈칸 뜻 <span class="tgt">${esc(v.hint)}</span></div>` : '');
  const en = v.enLines.map(l => `<div class="ven">${esc(l).replace(/\[[^\]]+\]/, '<input class="vin" id="vin" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">')}</div>`).join('');
  $('#stage').innerHTML = `<div class="cardwrap"><div class="ctab">레벨 ${esc(it.v.level)}<span class="cq">?</span></div><div class="cnew">NEW</div>
    <div class="acard"><div class="ahead">${ko}</div><div class="abody">${en}<div id="vwrong"></div><div id="vnote"></div></div></div></div>
    <div class="abot"><div class="abtns" id="btns"><button class="lb" id="vhint">힌트 보기</button></div></div>
    <div class="uiwho"><b>어휘 빈칸</b> · ${esc(it.v.word)} → 표현 유닛 ${esc(it.u)} · ${esc(byId[it.u].form)}</div>`;
  const vin = $('#vin');
  const ph = () => { vin.placeholder = hint >= 2 ? answer : hint === 1 ? answer.slice(0, 2) + [...answer.slice(2)].map(c => c === ' ' ? ' ' : '_').join('') : ''; };
  const ok = () => { done = true; vin.value = answer; vin.readOnly = true; vin.classList.add('done'); vin.placeholder = ''; $('#vwrong').innerHTML = ''; cardAnim('cok'); say(plain(v.enLines.join(' ')));
    $('#btns').innerHTML = `<button class="ok" id="vnext">다음</button>`; $('#vnext').onclick = startExpr; };
  vin.oninput = () => { if (done) return; if (norm(vin.value) === norm(answer)) return ok();
    const t = vin.value.trim();
    if (t.length && t.length >= answer.replace(/ /g, '').length) { const d = diffSpell(t, answer); $('#vwrong').innerHTML = `<div class="guide blue">${d.html} - 정답과 ${d.wrong}글자 달라요.</div>`; }
    else $('#vwrong').innerHTML = ''; };
  $('#vhint').onclick = () => { if (done) return;
    if (hint === 0) { hint = 1; $('#vhint').textContent = '정답 보기'; }
    else { hint = 2; if (vin.value) { vin.value = ''; $('#vwrong').innerHTML = ''; } $('#vnote').innerHTML = `<div class="vnote">정답 <b>${esc(answer)}</b></div>`; }
    ph(); vin.focus(); };
  ph(); setTimeout(() => vin.focus(), 60);
  window.scrollTo({ top:0 });
}
function startExpr() { LS.phase = 'expr'; open(LS.items[LS.idx].u); }

fetch('units/flow-units.gen.json').then(r => r.json()).then(d => {
  U = d.units.filter(u => brIdx(u.s[0]).length && u.s.some((x, i) => i > 0 && brIdx(x).length)); U.forEach(u => byId[u.id] = u);
  const fn = new Set(TRAP_BUCKETS.flat()), seen = new Set();
  U.forEach(u => u.s.forEach(x => brIdx(x).forEach(j => { const w = norm(x.t[j][0]); if (w.length >= 3 && /^[a-z]+$/.test(w) && !fn.has(w) && !seen.has(w)) { seen.add(w); CONTENT_POOL.push(w); } })));
  CONTENT_POOL.sort();
  if (!byId[uid]) uid = FEATURED[sec][0];
  if (!FLOWS[ui]) ui = exploreUi = 'new';
  const q = $('#q');
  q.onkeydown = e => {
    if (e.key !== 'Enter') return;
    const v = q.value.trim().toLowerCase(); if (!v) return;
    const hit = U.find(x => x.id.toLowerCase() === v) || U.find(x => x.form.toLowerCase().includes(v) || x.mean.includes(v));
    if (hit) { open(hit.id); q.value = ''; q.blur(); } else { q.value = ''; q.placeholder = `"${v}" 에 맞는 유닛이 없어요`; }
  };
  $$('#modes button').forEach(b => b.onclick = () => { if (b.dataset.m !== mode || b.dataset.m === 'learn') setMode(b.dataset.m); });
  $('#back').onclick = () => { if (mode === 'learn') renderHome(); };
  return fetch('vocab-expression.data.json').then(r => r.json()).catch(() => null).then(vd => {
    LS.all = (vd ? vd.items : []).map(v => { const id = String(v.unit), base = id.split('-')[0];
      const u = byId[id] ? id : byId[base] ? base : null; return u && v.vocabA ? { v, u } : null; })
      /* 학습하기는 기획서(대체안 · 가능) 흐름만 — 불가 문항은 흐름이 확정될 때까지 뺀다(유닛 살펴보기에는 남는다) */
      .filter(x => x && byId[x.u].pat === '가능');
    pickItems();
    setMode(LS.items.length ? mode : 'explore');
  });
}).catch(e => { $('#stage').innerHTML = `<div class="acard"><div class="abody">문장을 불러오지 못했어요. (${esc(e.message)})</div></div>`; });
</script>
</body>
</html>
