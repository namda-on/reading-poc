<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>표현 학습 — 두 섹션</title>
<style>
  :root { --bg:#aed7fc; --ink:#394042; --green:#0f9a69; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:#eef3f9; color:var(--ink); display:flex; justify-content:center; }
  .app { width:100%; max-width:460px; min-height:100vh; padding:14px 16px 40px; background:var(--bg); }
  h1 { font-size:17px; margin:2px 2px 10px; color:#fff; text-shadow:0 1px 2px rgba(30,60,110,.25); }

  /* 섹션 탭 — 패턴화 가능 / 불가는 학습 방식이 다르다 */
  .tabs { display:flex; gap:6px; margin:0 0 8px; }
  .tabs button { flex:1; border:none; border-radius:13px; padding:9px 8px; font-size:14px; font-weight:800; cursor:pointer; background:rgba(255,255,255,.45); color:#35506f; }
  .tabs button.on { background:#fff; color:#2f3e52; box-shadow:0 3px 10px rgba(30,60,110,.12); }
  .tabs .c { display:block; font-size:11.5px; font-weight:700; color:#8a98ad; margin-top:2px; }
  /* UI안 — 새 UI(제안안) / 지금 앱 UI만(대체안) */
  .seg { display:flex; background:rgba(255,255,255,.4); border-radius:12px; padding:3px; gap:3px; }
  .seg button { flex:1; border:none; border-radius:9px; padding:7px 6px; font-size:12.5px; font-weight:800; cursor:pointer; background:none; color:#35506f; }
  .seg button.on { background:#4b83d6; color:#fff; }
  .segd { font-size:11.5px; color:#35506f; margin:5px 4px 10px; line-height:1.45; }

  .units { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .unit { border:1px solid rgba(255,255,255,.8); background:rgba(255,255,255,.35); color:#35506f; border-radius:20px;
    padding:6px 12px; font-size:13px; font-weight:700; cursor:pointer; }
  .unit.on { background:#4b83d6; border-color:#4b83d6; color:#fff; }
  .unit.rand { border-style:dashed; }
  .find-u { display:flex; margin-bottom:10px; }
  .find-u input { flex:1; min-width:0; border:none; border-radius:11px; padding:8px 11px; font-size:13px; background:rgba(255,255,255,.7); color:#2f3e52; }

  .top { display:flex; align-items:center; gap:8px; margin:4px 2px 30px; }
  .bar { flex:1; height:10px; background:rgba(255,255,255,.55); border-radius:6px; overflow:hidden; }
  .bar i { display:block; height:100%; background:#3f8ef0; border-radius:6px; transition:width .3s; }
  .top .n { font-size:12px; font-weight:800; color:#fff; }

  /* 앱 문제 카드 — 레벨 탭 · 상단(분홍) · 문제 영역(흰색) */
  .cardwrap { position:relative; }
  .ctab { position:absolute; top:-19px; left:8px; background:#8ac4f2; color:#fff; font-size:11px; font-weight:800; border-radius:10px 10px 0 0; padding:4px 12px 8px; }
  .cnew { position:absolute; top:-16px; right:10px; background:#fa5555; color:#fff; font-size:10.5px; font-weight:800; border-radius:8px; padding:3px 9px 7px; }
  .acard { position:relative; background:#fff; border-radius:24px; overflow:hidden; box-shadow:0 6px 16px rgba(30,60,110,.14); }
  .ahead { background:#fdf0f0; padding:24px 20px 20px; min-height:104px; }
  .hk { font-size:19px; font-weight:600; color:#222; line-height:1.5; }
  .hx { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  .chip { font-size:11px; font-weight:800; color:#6b55d9; background:#efeafd; border-radius:8px; padding:2px 8px; }
  .he { font-size:18px; font-weight:600; color:#222; line-height:1.45; }
  .he .g, .ahead .g { color:var(--green); font-weight:800; }
  .hs { font-size:13px; color:#8a98ad; margin-top:2px; }
  .tgt { color:var(--green); font-weight:800; }
  .abody { background:#fcfcfc; padding:18px 18px 20px; min-height:160px; }
  .sp { border:none; background:none; padding:0 2px; cursor:pointer; font-size:15px; }

  /* 정답 줄 — 고정 낱말 + 빈칸(밑줄). 정답 줄 아래 번역 */
  .aline { display:flex; flex-wrap:wrap; align-items:center; gap:10px 7px; min-height:48px; font-size:20px; }
  .sw { color:#5a6268; font-weight:500; }
  .sw.p { margin-left:-5px; }
  .ul { display:inline-flex; align-items:center; justify-content:center; min-width:58px; height:38px; border-bottom:2px solid #c3cbd6; cursor:pointer; }
  .ul .w { margin:0; }
  .ul.ok .w { background:#f4fdf8; border-color:#8ed9ac; color:#237a4a; }
  .ul.bad .w { background:#fdeee6; border-color:#f0c4a8; color:#b5541c; }
  .atrans { font-size:14.5px; color:#8a98ad; margin-top:12px; }
  .aline.arr { border-bottom:2px solid #e2e9f3; padding-bottom:10px; }

  /* 단어 카드 — 앱 GrammarDraggableWord */
  .bank { display:flex; flex-wrap:wrap; gap:6px; }
  .w { font:inherit; font-size:19px; font-weight:400; color:#394042; padding:5px 9px; border:1px solid #d5d9e8; background:#fff; border-radius:8px; cursor:pointer; line-height:1.3; }
  .w:active { transform:translateY(1px); }
  .w.g { background:#f4fdf8; border-color:#8ed9ac; color:#237a4a; }
  .w.used { background:#f0f0f5; border-color:#f0f0f5; color:transparent; pointer-events:none; }
  .w.up { background:#eef2fb; border-color:#eef2fb; }
  .w.ok { background:#f4fdf8; border-color:#8ed9ac; color:#237a4a; }
  .w.bad { background:#fdeee6; border-color:#f0c4a8; color:#b5541c; }
  .w.trapx { background:#fdeee6; border-color:#f0c4a8; color:#b5541c; text-decoration:line-through; }

  /* 하단 — 단어 카드 영역 + 버튼 */
  .abot { background:#fff; margin:18px -16px 0; padding:16px 18px 18px; min-height:230px; display:flex; flex-direction:column; gap:14px; }
  .abtns { display:flex; gap:8px; margin-top:auto; }
  .abtns button { border:none; color:#fff; font-size:15px; font-weight:700; border-radius:12px; padding:15px 8px; cursor:pointer; }
  .abtns .lb { width:86px; background:#af85f2; font-size:12.5px; }
  .abtns .ok { flex:1; background:#8571ef; }
  .abtns .ok:disabled { background:#cfd4e3; cursor:default; }

  /* 표현 보기 → 오답노트 팁 (앱에 있는 것) */
  .tipbox { margin-top:14px; background:#fff8db; border-radius:12px; padding:10px 12px; font-size:14.5px; line-height:1.5; color:#5b4a14; }
  .tipbox b { color:var(--green); }

  /* 예시 말풍선 (제안안 — 새 UI) */
  .model { display:flex; gap:8px; align-items:flex-start; margin:0 0 12px; }
  .model .av { flex:0 0 26px; height:26px; border-radius:50%; background:#8ac4f2; color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; font-size:12px; margin-top:4px; }
  .model .bub { flex:1; background:#fff; border:1px solid #d5d9e8; border-radius:12px; padding:8px 12px; }
  .model .en { font-size:16px; font-weight:600; line-height:1.45; }
  .model .en .g { color:var(--green); font-weight:800; }
  .model .k { font-size:12.5px; color:#8a98ad; margin-top:2px; }
  .newui { display:inline-block; font-size:10.5px; font-weight:800; color:#c4632c; background:#fdeadf; border-radius:6px; padding:1px 6px; margin-bottom:8px; }

  /* 찾기 두 줄 (제안안 — 새 UI) */
  .fl { padding:6px 0 10px; }
  .fl .kr { font-size:15.5px; font-weight:600; margin-bottom:6px; }
  .wline { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .wk.miss { color:#aab7c8; border-color:#e6eaf0; text-decoration:underline; text-decoration-color:#e3c9b0; }
  .wk.plain { border-color:transparent; background:none; padding:5px 1px; cursor:default; }
  .note { font-size:13.5px; color:#3a6bb0; background:#eef4fd; border-radius:10px; padding:7px 10px; line-height:1.45; }

  /* 결과 */
  .res { border-radius:14px; padding:12px 14px; animation:up .25s ease both; }
  .res.ok { background:#edf9f1; } .res.no { background:#fdf3ec; }
  .res .h { font-size:15px; font-weight:800; margin-bottom:4px; }
  .res.ok .h { color:#1f7a49; } .res.no .h { color:#b5541c; }
  .res .a { font-size:16px; font-weight:600; color:#33465c; line-height:1.55; }
  .res .a .g, .miss .yes .g { color:#1f7a49; font-weight:800; }
  .res .why { font-size:13.5px; color:#8a5a2e; margin-top:5px; font-weight:700; }
  @keyframes up { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  /* 규칙 패널(제안안 찾기) · 결과 설명 카드(앱에 있는 것) */
  .rule { background:#f4fdf8; border:1px solid #8ed9ac; border-radius:12px; padding:10px 12px; }
  .rule .f { font-size:16px; font-weight:800; color:#1f7a49; }
  .rule .p { font-size:15px; font-weight:600; color:#33465c; margin-top:4px; }
  .rule .p b { color:#1f7a49; }
  .rule .d { font-size:13px; color:#5d6f88; margin-top:4px; line-height:1.45; }
  .xcard { position:relative; background:#fff; border-radius:22px; margin:34px 0 0; padding:20px 18px 16px; box-shadow:0 6px 16px rgba(30,60,110,.12); }
  .xcard .xtab { position:absolute; top:-18px; left:10px; background:#8ac4f2; color:#fff; font-size:11px; font-weight:800; border-radius:10px 10px 0 0; padding:4px 12px 8px; }
  .xt { font-size:14px; font-weight:800; color:#33465c; }
  .xf { font-size:22px; font-weight:800; color:var(--green); text-align:center; margin:12px 0 2px; }
  .xm { font-size:13.5px; color:#8a98ad; text-align:center; }
  .xp { font-size:15px; font-weight:600; text-align:center; margin-top:8px; }
  .xp b { color:var(--green); }
  .xd { margin-top:12px; background:#f4f6fa; border-radius:10px; padding:8px 11px; font-size:13px; color:#5d6f88; line-height:1.45; }
  .xe { font-size:12.5px; color:#8a98ad; margin:14px 0 6px; border-top:1px dashed #e3e8f0; padding-top:12px; }
  .xs { font-size:15.5px; font-weight:600; line-height:1.45; margin-bottom:8px; }
  .xs .g { color:var(--green); font-weight:800; }
  .xs .k { font-size:12.5px; color:#8a98ad; font-weight:400; }

  .uiwho { font-size:11.5px; color:#35506f; margin:10px 2px 0; line-height:1.45; }
  .uiwho b { color:#2f3e52; }

  /* 완료 */
  .intro { text-align:center; padding:4px 0; }
  .intro .f { font-size:22px; font-weight:800; color:var(--green); margin:6px 0 4px; }
  .intro .m { font-size:14.5px; color:#5d6f88; }
  .sec { text-align:left; margin-top:16px; }
  .sec .t { font-size:12.5px; font-weight:800; color:#8a98ad; margin-bottom:6px; }
  .sec .d { font-size:13.5px; color:#5d6f88; background:#f4f6fa; border-radius:10px; padding:8px 11px; line-height:1.45; }
  .miss { padding:8px 10px; border-radius:10px; background:#fff8f3; font-size:14.5px; font-weight:600; line-height:1.55; margin-bottom:6px; }
  .miss .no { color:#b5541c; text-decoration:line-through; text-decoration-color:#e0874f; }
  .miss .st2 { font-size:11.5px; color:#a6b3c4; margin-left:4px; }

  /* 단계표 — 이 유닛이 단계마다 실제로 쓰는 문장 */
  .table { background:#fff; border-radius:16px; padding:10px 12px; margin-top:16px; box-shadow:0 4px 12px rgba(30,60,110,.1); }
  .table summary { cursor:pointer; font-size:13px; font-weight:800; color:#3a6bb0; list-style:none; }
  .table summary::-webkit-details-marker { display:none; }
  .table summary::after { content:' ▾'; color:#9aa8bc; }
  .table[open] summary::after { content:' ▴'; }
  .st { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
  .st th { text-align:left; color:#8a98ad; font-weight:800; padding:4px 3px; border-bottom:1px solid #eef2f8; }
  .st td { padding:6px 3px; border-bottom:1px solid #f2f5fa; vertical-align:top; line-height:1.45; }
  .st td .g { color:#1f7a49; font-weight:800; }
  .st td .ui { display:block; color:#8a98ad; font-size:11px; }
  .st td .ui.n { color:#c4632c; }
  .st tr.cur td { background:#eef4fd; }
  .st tr.cur td:first-child { box-shadow:inset 3px 0 0 #4b83d6; }
  .st .mk { font-weight:800; } .st .o { color:#2e9e57; } .st .x { color:#c46a2c; }
  .st .tg { display:inline-block; font-size:10.5px; font-weight:800; border-radius:6px; padding:0 5px; }
  .tg.b { background:#e3edfb; color:#3a6bb0; } .tg.r { background:#fdeadf; color:#c4632c; }
  .rules { font-size:11.5px; color:#6b7c93; line-height:1.55; margin:8px 0 2px; }
  .rules b { color:#3d5778; }
</style>
</head>
<body>
<div class="app">
  <h1>표현 학습 — 패턴화 가능 / 불가 두 섹션</h1>
  <div class="tabs" id="tabs"></div>
  <div class="seg" id="uiSeg"><button data-u="new">제안안 · 새 UI</button><button data-u="now">대체안 · 지금 앱 UI만</button></div>
  <div class="segd" id="uiDesc"></div>
  <div class="units" id="units"></div>
  <div class="find-u"><input id="q" type="search" placeholder="유닛 id나 카드 초록으로 찾기 (예: 10065, stop)" enterkeyhint="search"></div>
  <div class="top"><span class="n">‹</span><div class="bar"><i id="barI"></i></div><span class="n" id="barN"></span></div>
  <div id="stage"></div>
  <details class="table" id="tbl" open><summary>단계표 — 이 유닛이 단계마다 쓰는 문장</summary><div id="tblBody"></div></details>
</div>

<script>
/* 패턴화 가능과 불가는 학습 방식이 다르다 — 섹션을 나눈다. 화면은 앱(통합모드 표현 첫 학습)의 카드 모양을 따른다.
   UI안 둘을 나란히 둔다.
   제안안(new) — 예시 말풍선 · 찾기(두 문장에서 낱말 누르기) · 규칙 패널을 새로 만든다.
   대체안(now) — 앱에 이미 있는 것만 쓴다: 드래그 카드 「표현만」(정답 줄의 표현 자리만 탭해 채움, 상단 뜻 줄 + 정답 줄 아래 번역)
                · 「문장 전체」 배열 · 결과 설명 카드. 예시는 상단 뜻 줄에, 규칙 공개는 결과 설명 카드가 맡는다.
   단계는 정오답과 상관없이 차례로 간다. 한 번이라도 틀리면(헤매면) 마지막에 처음 틀린 단계를 문장1-2로 '한 번 더' — 유닛에 한 번.
   head : 카드 상단 — trans(풀 문장의 번역, [ ] 초록) · mean(카드 뜻, 전체 초록) · example(S1 영어 예시) · ask(지시문)
   alt  : 뱅크에 헷갈리는 낱말 1개(정답 대신 놓기 쉬운 원형·다른 꼴·다른 쪽 — 코드 이름 ALT) · green : 뱅크의 [ ] 낱말을 초록으로(앱 첫 학습 색 — 헷갈리는 낱말이 있으면 답이 새서 끈다)
   reveal : 끝나면 결과 설명 카드(형태 · 뜻 · 원형 → 꼴 · 설명 · 예문 2) */
const LONG = { kind:'long', src:'hard', head:'trans', tag:'r', name:'긴 문장 + 트랩', ui:'문장 전체 카드 + 트랩 3개' };
const FLOWS = {
  new:{
    pattern:{
      '1':{ kind:'fill', src:'new', head:'trans', models:'s1', tag:'b', name:'보고 만들기', noAgain:true, ui:'새 UI — 예시 말풍선(S1) + 빈칸', newUi:true },
      '2':{ kind:'arrange', src:'s1', head:'trans', tag:'b', name:'문장 배열', ui:'문장 전체 카드' },
      '3':LONG },
    rule:{
      '1':{ kind:'find', src:'new', head:'ask', tag:'b', name:'찾기', ask:'초록 뜻에 해당하는 영어를 두 문장에서 눌러 보세요', ui:'새 UI — 두 문장에서 낱말 누르기 + 규칙 패널', newUi:true },
      '2':{ kind:'fill', src:'new', head:'trans', models:'found', alt:true, tag:'b', name:'규칙 적용', ui:'새 UI — 예시 말풍선 2개 + 빈칸 + 헷갈리는 낱말', newUi:true },
      '3':{ kind:'arrange', src:'s1', head:'trans', alt:true, tag:'r', name:'문장 배열', ui:'문장 전체 카드 + 헷갈리는 낱말' },
      '4':LONG },
  },
  now:{
    pattern:{
      '1':{ kind:'fill', src:'new', head:'example', green:true, tag:'b', name:'보고 만들기', noAgain:true, ui:'표현만 카드 — 상단 뜻 줄에 S1 예시' },
      '2':{ kind:'arrange', src:'s1', head:'trans', green:true, tag:'b', name:'문장 배열', ui:'문장 전체 카드' },
      '3':LONG },
    rule:{
      '1':{ kind:'fill', src:'s1', head:'mean', alt:true, tag:'b', name:'표현 넣기', ui:'표현만 카드 + 헷갈리는 낱말' },
      '2':{ kind:'arrange', src:'s1', head:'trans', alt:true, reveal:true, tag:'b', name:'문장 배열', ui:'문장 전체 카드 + 헷갈리는 낱말 → 결과 설명 카드(규칙 공개)' },
      '3':{ kind:'fill', src:'new', head:'example', alt:true, tag:'r', name:'규칙 적용', ui:'표현만 카드 + 헷갈리는 낱말 — 상단 뜻 줄에 S1 예시' },
      '4':LONG },
  },
};
const UI_DESC = {
  new:'예시 말풍선 · 찾기(두 문장에서 낱말 누르기) · 규칙 패널을 <b>새로 만든다</b>.',
  now:'앱에 있는 드래그 카드(<b>표현만 · 문장 전체</b>)와 <b>결과 설명 카드</b>만 쓴다 — 예시는 상단 뜻 줄에, 규칙 공개는 결과 설명 카드에. 불가는 S1에서 먼저 익히고 새 문장에 적용한다.',
};
const SRC_LABEL = { s1:'S1', new:'첫 기본 / 문장2', hard:'어려운 중 가장 긴 것 / 문장3', variant:'문장1-2' };
const CHOICE = {
  '10031':['Maybe','Actually','Unfortunately'], '10054':['once','twice'], '10088':['myself','yourself','himself','herself'],
  '10328':['on','off'], '10379':['Frankly','Generally','Strictly'], '10383':['when','while','before','until','since'],
  '10391':['where','when'], '10396':['Whoever','Whatever','Whichever'], '10397':['where','why','how','when'],
  '10403':['However','Wherever','Whenever'],
};
const NO_BASE = new Set(['10374', '10344']);
const FEATURED = { pattern:['10033', '10001', '10000', '10369-A', '10078-B'], rule:['10065', '10299', '10041', '10006', '10017-A', '10084', '10383'] };
/* 트랩 — 같은 자리에 올 수 있는 같은 부류 낱말(그 한국어 뜻으로는 틀린 말). 한 부류에서 몰아 뽑지 않게 라운드로빈.
   부류로 못 채우면 다른 유닛의 핵심 낱말(길이가 비슷한 것)로 메운다. 3개 고정 — 1~2개는 과잉으로 보이지 않는다 */
const TRAP_BUCKETS = [

  ["don't","doesn't","didn't","isn't","aren't","wasn't","weren't","won't","can't","couldn't","shouldn't","haven't","hasn't"],
  ['do','does','did','is','are','was','were','am','will','would','can','could','should','have','has','had'],
  ['i','you','he','she','it','we','they'],
  ['me','him','her','us','them'],
  ['my','your','his','its','our','their'],

/* 바꿔 넣어도 맞는 말이 되는 조동사 짝 — 문장에 한쪽이 있으면 다른 쪽은 트랩으로 쓰지 않는다(Can I get → Could I get) */
const NEAR = [['can', 'could'], ['will', 'would'], ['may', 'might'], ["can't", "couldn't"], ["won't", "wouldn't"]];
let CONTENT_POOL = [];

let U = [], byId = {}, sec = 'pattern', uid = '10033', ui = 'new', run = null;
try { const s = JSON.parse(localStorage.getItem('vedrill') || 'null'); if (s) { uid = s.uid; sec = s.sec || sec; ui = s.ui || ui; } } catch (e) {}

const $ = s => document.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

const plain = s => s.replace(/[[\]]/g, '');
const norm = w => String(w).toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9' -]/g, '').replace(/\s+/g, ' ').trim();
const tileText = w => /^I('|$)/.test(w) ? w : w.toLowerCase();
const shuffle = a => { const b = a.slice(); for (let n = 0; n < 30; n++) { for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } if (a.length < 2 || b.some((x, k) => x !== a[k])) break; } return b; };
const unit = () => byId[uid];
const secOf = u => u.pat === '가능' ? 'pattern' : 'rule';
const STAGES = () => FLOWS[ui][secOf(unit())];
const stageOf = id => id === 'again' ? run.again : STAGES()[id];
function say(text) { try { const v = new SpeechSynthesisUtterance(plain(text)); v.lang = 'en-US'; v.rate = .9; speechSynthesis.cancel(); speechSynthesis.speak(v); } catch (e) {} }
function greenRuns(ws) {
  const out = [];
  ws.forEach(([w, g]) => { if (g && out.length && out.at(-1).g) out.at(-1).w.push(w); else out.push({ g, w:[w] }); });
  return out.map(r => r.g ? `<span class="g">${esc(r.w.join(' '))}</span>` : esc(r.w.join(' '))).join(' ');
}
const brIdx = x => x.t.map((t, j) => t[1] ? j : -1).filter(j => j >= 0);
const brKey = x => norm(brIdx(x).map(j => x.t[j][0]).join(' '));
const sentHtml = x => greenRuns(x.t.map(t => [t[0], t[1]])) + esc(x.p);

/* 일치 규칙의 주어 — 의문문은 조동사 뒤(소유격이면 두 낱말: your kids), 평서문은 앞(I do like) */
const DET = new Set(['your', 'my', 'his', 'her', 'our', 'their', 'the']);
const subjectOf = (x, at) => at === 0 ? (DET.has(norm(x.t[1][0])) ? `${x.t[1][0]} ${x.t[2][0]}` : x.t[1][0]) : x.t[at - 1][0];
/* ALT — 뱅크에 핵심 말고 하나 더 오는 낱말(형태 규칙은 원형, 일치 규칙은 다른 꼴, 뜻으로 고르는 목록은 다른 쪽)과 그걸 놓았을 때 보여 줄 한 줄 */
function altOf(u, i) {
  const x = u.s[i], br = brIdx(x), has = w => br.some(j => norm(x.t[j][0]) === norm(w));

    const v = u.plan && u.plan.info && u.plan.info[i];
    if (v && !v.peri && !/\s/.test(v.base) && norm(v.base) !== norm(v.w) && !has(v.base))
      return { w:v.base, why:norm(v.wrong || '') === norm(v.base) && v.why ? `${v.base} — ${v.why}` : `${v.base} 말고 ${v.w} 꼴이 와요` };
  }
  if (u.kind === 'agree') {
    const opts = (u.plan.decide && u.plan.decide.opts) || [];
    const at = br.find(j => opts.some(o => norm(o) === norm(x.t[j][0])));
    if (at !== undefined) { const o = opts.find(o => norm(o) !== norm(x.t[at][0]));
      if (o) return { w:o, why:`${subjectOf(x, at)} 에는 ${o.toLowerCase()} 말고 ${x.t[at][0].toLowerCase()}` }; }
  }
  const list = CHOICE[u.id];
  if (list) {
    const at = br.find(j => list.some(o => norm(o) === norm(x.t[j][0])));
    if (at !== undefined) {
      const mine = norm(x.t[at][0]);
      const seen = u.s.map(y => ({ y, j:brIdx(y).find(j => list.some(o => norm(o) === norm(y.t[j][0])) && norm(y.t[j][0]) !== mine) })).filter(z => z.j !== undefined);
      const o = seen.length ? seen[0].y.t[seen[0].j][0] : list.find(o => norm(o) !== mine);
      const kr = seen.length ? seen[0].y.kr.replace(/\[([^\]]+)\]/g, '‘$1’') : '';
      return { w:o, why:kr ? `${o.toLowerCase()}: ${kr}` : `여기선 ${o.toLowerCase()} 말고 ${x.t[at][0].toLowerCase()}` };

/* 트랩 3개 — ALT 먼저, 그다음 문장 속 기능어와 같은 부류, 모자라면 다른 유닛의 핵심 낱말 */
function trapsOf(u, i) {
  const x = u.s[i], used = new Set(x.t.map(t => norm(t[0]))), out = [];
  NEAR.forEach(([a, b]) => { if (used.has(a)) used.add(b); if (used.has(b)) used.add(a); });
  const push = w => { const b = norm(w); if (b && !used.has(b) && !out.some(y => norm(y) === b)) out.push(w); };
  const alt = altOf(u, i); if (alt) push(alt.w);
  const seed = [...x.en].reduce((a, c) => a + c.charCodeAt(0), 0);
  const hits = x.t.map(t => TRAP_BUCKETS.find(b => b.includes(norm(t[0])))).filter(Boolean);
  for (let round = 0; round < 3 && out.length < 3 && hits.length; round++)
    hits.forEach(pool => { if (out.length >= 3) return; const c = pool.filter(w => !used.has(w) && !out.some(y => norm(y) === w)); if (c.length) push(c[(seed + out.length + round) % c.length]); });
  const avg = Math.round(x.t.reduce((a, t) => a + norm(t[0]).length, 0) / x.t.length);
  const near = CONTENT_POOL.filter(w => !used.has(w) && Math.abs(w.length - avg) <= 2);
  for (let k = 0; out.length < 3 && k < near.length; k++) push(near[(seed + k * 7) % near.length]);
  return out.slice(0, 3);
}

/* 문장 고르기 — 단계마다 쓸 문장 칸이 정해져 있다(src). 한 유닛 안에서 이미 쓴 문장은 다시 쓰지 않는다(S1 만 예외).
   s1      = S1(트리거 단어가 든 대표 문장)
   new     = 첫 기본 / 문장2 — 그 문장의 [ ] 낱말이 S1 과 똑같으면 다음 기본
   hard    = 어려운 중 낱말 수가 가장 많은 것 / 문장3(5문장 유닛)
   variant = 문장1-2 → 1-3(헤맸을 때 '한 번 더' — S1 과 주어·낱말 하나만 달라 같은 판단만 한 번 더) */
function pickIn(u, src, used) {
  const all = u.s.map((_, i) => i).filter(i => i > 0 && brIdx(u.s[i]).length);
  const free = a => a.filter(i => !used.has(i)), tag = i => u.s[i].tag, len = i => u.s[i].t.length;
  const vari = all.filter(i => tag(i).startsWith('문장1-'));
  const basic = all.filter(i => tag(i) === '기본' || tag(i) === '문장2');
  const hard = all.filter(i => tag(i) === '어려운' || tag(i) === '문장3');
  const rest = () => free(all.filter(i => !vari.includes(i)))[0] ?? free(vari)[0] ?? all[0];
  if (src === 's1') return 0;
  if (src === 'variant') return free(vari)[0] ?? rest();
  if (src === 'hard') return free(hard).sort((a, b) => len(b) - len(a))[0] ?? rest();
  const c = free(basic);
  return c.find(i => brKey(u.s[i]) !== brKey(u.s[0])) ?? c[0] ?? free(hard).sort((a, b) => len(a) - len(b))[0] ?? rest();
}
/* 유닛을 열 때 단계마다 쓸 문장을 미리 정한다 — 단계표가 그대로 보여 준다 */
function planFor(u) {
  const st = FLOWS[ui][secOf(u)], used = new Set([0]), plan = {};
  for (const k of Object.keys(st)) { const i = pickIn(u, st[k].src, used); used.add(i); plan[k] = i; }
  plan.again = pickIn(u, 'variant', used);
  return plan;
}

const short = u => { const f = u.form.replace(/\s+/g, ' '); return f.length > 20 ? f.slice(0, 19) + '…' : f; };

function drawTable() {

    <b>문장</b> S1 = 트리거 어휘가 든 대표 문장 · 첫 기본/문장2 = S1 다음의 독립 문장(그 [ ] 낱말이 S1 과 똑같으면 다음 기본) · 긴 문장 = 어려운 중 낱말이 가장 많은 것(5문장 유닛은 문장3) · 한 번 더 = 문장1-2</div>`;

function drawBar() {

function headHtml(s, x) {

/* 다음 단계 — 차례대로. 끝나면 처음 틀린 단계를 다른 문장으로 한 번 더(유닛에 한 번). 찾기를 헤맸으면 규칙 적용을 한 번 더.

/* correct = 맞혔는가, ok = 한 번 더 판정(표현 보기 · 정답 보기를 썼으면 헤맨 것).
   결과창은 유닛 끝에 한 번(finish) — 정답이면 0.9초 머문 뒤 결과 없이 다음 단계로 간다(앱 첫 학습의 sub 1 → 2 전환과 같다).
   틀렸거나 표현 보기 · 정답 보기를 썼으면 그 자리에서 고쳐 주고(정답 문장 + 이유 1줄) 읽을 수 있게 다음 버튼을 둔다.

    $('#btns').innerHTML = '';

    run.timer = setTimeout(run.autoNext, 900);

/* 형태 유닛의 원형 → 꼴(바뀐 끝 굵게) */
function pairsOf(u, rows) {

  if (u.kind !== 'form' || !info) return [];
  const seen = new Set();
  return rows.map(i => info[i]).filter(v => v && !v.peri && norm(v.base) !== norm(v.w) && !seen.has(norm(v.w)) && seen.add(norm(v.w))).map(v => {
    let k = 0; while (k < v.base.length && k < v.w.length && v.base[k].toLowerCase() === v.w[k].toLowerCase()) k++;
    return `${esc(v.base)} → ${esc(v.w.slice(0, k))}<b>${esc(v.w.slice(k))}</b>`; });
}
function ruleHtml(u, rows) {

}
/* 결과 설명 카드(앱의 SummaryResult) — 형태 · 뜻 · (형태 유닛) 원형 → 꼴 · 설명 · 예문 최대 2(이 유닛 단계에서 안 쓰는 문장) */

  const usedIdx = new Set([0, 1, 2, ...Object.values(run.plan)]);
  const ex = u.s.map((x, i) => i).filter(i => !usedIdx.has(i) && brIdx(u.s[i]).length).slice(0, 2);
  const p = pairsOf(u, [0, run.plan['1'], ...ex]);
  return `<div class="xcard"><div class="xtab">학습 정보</div><div class="xt">${title}</div>
    <div class="xf">${esc(u.form)}</div><div class="xm">${esc(u.mean)}</div>${p.length ? `<div class="xp">${p.join(' &nbsp;·&nbsp; ')}</div>` : ''}
    ${u.desc ? `<div class="xd">${esc(u.desc)}</div>` : ''}
    ${ex.length ? `<div class="xe">ⓘ 단어만 바꿔서 이렇게도 말할 수 있어요</div>${ex.map(i => `<div class="xs">${sentHtml(u.s[i])}<div class="k">${esc(plain(u.s[i].kr))}</div></div>`).join('')}` : ''}</div>`;
}
const bubbleHtml = (m, n) => `<div class="model"><div class="av">${'AB'[n]}</div><div class="bub"><div class="en"><button class="sp" data-m="${unit().s.indexOf(m)}">🔊</button>${sentHtml(m)}</div><div class="k">${esc(plain(m.kr))}</div></div></div>`;

/* 찾기(제안안 — 새 UI) — S1 과 기본 한 줄에서 한국어 초록에 해당하는 영어를 누른다. 같은 낱말이 [ ] 밖에도 있으면 [ ] 쪽으로 친다.
   다 누르면 확인 없이 끝나고 바뀌는 방식(원형 → 꼴)과 카드 설명이 펼쳐진다 */
function quizFind(s, i) {
  const u = unit(), rows = [0, i];
  run.found = rows;
  shell(s, u.s[i], rows.map((r, n) => { const x = u.s[r];
    return `<div class="fl"><div class="kr">${krHtml(x.kr)}</div><div class="wline">${x.t.map((t, j) => /[A-Za-z0-9]/.test(t[0]) ? `<button class="w wk" data-r="${n}" data-j="${j}">${esc(t[0])}</button>` : `<span class="w wk plain">${esc(t[0])}</span>`).join('')}<span class="sw p">${esc(x.p)}</span></div></div>`; }).join('') + `<div id="nt"></div>`);
  $('#bank').style.display = 'none';
  $('#btns').innerHTML = `<button class="lb" id="lb">정답 보기</button>`;
  const br = rows.map(r => brIdx(u.s[r])), got = rows.map(() => new Set());
  let wrong = 0, fin = false;
  const left = () => br.reduce((a, b, n) => a + b.length - got[n].size, 0);
  const done = shown => { fin = true;
    $$('.wk[data-j]').forEach(b => { b.classList.toggle('ok', br[+b.dataset.r].includes(+b.dataset.j)); b.classList.remove('miss'); });
    $('#nt').innerHTML = ''; report(!wrong && !shown, !wrong && !shown, i, null, '', ruleHtml(u, rows)); };
  $$('.wk[data-j]').forEach(b => b.onclick = () => {
    if (fin) return; const n = +b.dataset.r, j = +b.dataset.j, x = u.s[rows[n]];
    const hit = br[n].includes(j) ? j : br[n].find(k => !got[n].has(k) && norm(x.t[k][0]) === norm(x.t[j][0]));
    if (hit === undefined) { wrong++; b.classList.add('miss'); $('#nt').innerHTML = `<div class="note">초록 뜻과 다른 말이에요</div>`; return; }
    got[n].add(hit); $(`.wk[data-r="${n}"][data-j="${hit}"]`).classList.add('ok');
    $('#nt').innerHTML = left() ? `<div class="note">${left()}낱말 더 있어요</div>` : '';
    if (!left()) done(false);
  });
  $('#lb').onclick = () => { wrong++; done(true); };
}

/* 표현만 카드 — 정답 줄의 [ ] 자리만 빈칸(밑줄), 나머지 낱말은 그대로. 뱅크 = [ ] 낱말 (+ ALT).
   예시: 제안안은 카드 안 말풍선(새 UI), 대체안은 상단 뜻 줄(S1 영어). 표현 보기 = 앱의 오답노트 팁 */
function quizFill(s, i) {
  const u = unit(), x = u.s[i], br = brIdx(x), alt = s.alt ? altOf(u, i) : null;
  const models = s.models === 'found' ? (run.found || [0]) : s.models === 's1' ? [0] : [];
  const line = `<div class="aline">${x.t.map((t, j) => br.includes(j) ? `<span class="ul" data-j="${j}"></span>` : `<span class="sw">${esc(t[0])}</span>`).join('')}<span class="sw p">${esc(x.p)}</span></div>`;
  shell(s, x, models.map((r, n) => bubbleHtml(u.s[r], n)).join('') + line + (s.head !== 'trans' ? `<div class="atrans">${esc(plain(x.kr))}</div>` : ''));
  const tiles = shuffle([...br.map(j => x.t[j][0]), ...(alt ? [alt.w] : [])]), green = s.green && !alt;
  $('#bank').innerHTML = tiles.map((w, k) => `<button class="w${green ? ' g' : ''}" data-k="${k}">${esc(tileText(w))}</button>`).join('');
  $('#btns').innerHTML = `<button class="lb" id="lb">표현 보기</button><button class="ok" id="ok" disabled>확인</button>`;
  const put = {}; let fin = false, hinted = false;
  const draw = () => {
    $$('.aline .ul').forEach(e => { const k = put[e.dataset.j]; e.innerHTML = k === undefined ? '' : `<span class="w up${green ? ' g' : ''}">${esc(tileText(tiles[k]))}</span>`; });
    $$('#bank .w').forEach(b => b.classList.toggle('used', Object.values(put).includes(+b.dataset.k)));
    $('#ok').disabled = br.some(j => put[j] === undefined);
  };
  $$('#bank .w').forEach(b => b.onclick = () => { if (fin) return; const j = br.find(j => put[j] === undefined); if (j === undefined) return; put[j] = +b.dataset.k; draw(); });
  $$('.aline .ul').forEach(e => e.onclick = () => { if (fin) return; delete put[e.dataset.j]; draw(); });
  $('#lb').onclick = () => { hinted = true; const p = pairsOf(u, [0, i]);
    $('#tip').innerHTML = `<div class="tipbox">💡 <b>${esc(u.form)}</b> · ${esc(u.mean)}${p.length ? `<br>${p.join(' · ')}` : ''}</div>`; };
  $('#ok').onclick = () => {
    fin = true;
    const correct = br.every(j => norm(tiles[put[j]]) === norm(x.t[j][0]));
    $$('.aline .ul').forEach(e => e.classList.add(norm(tiles[put[e.dataset.j]]) === norm(x.t[e.dataset.j][0]) ? 'ok' : 'bad'));
    const usedAlt = alt && br.some(j => norm(tiles[put[j]]) === norm(alt.w) && norm(x.t[j][0]) !== norm(alt.w));
    report(correct, correct && !hinted, i, x.t.map((t, j) => br.includes(j) ? tiles[put[j]] : t[0]).join(' ') + x.p, usedAlt ? alt.why : '');
  };
  draw();
}

/* 문장 전체 카드 — 한국어(상단)만 보고 통째로. extra 는 뱅크에 섞이는 낱말(ALT · 트랩). 정답 보기 = 정답 공개(헤맨 것으로 친다) */
function arrangeIn(s, i, extra) {
  const u = unit(), x = u.s[i], seq = x.t.map(t => t[0]);
  shell(s, x, `<div class="aline arr" id="fill"></div>`);
  const green = s.green && !extra.length;
  const items = [...x.t.map(t => ({ w:t[0], g:green && t[1] })), ...extra.map(w => ({ w, trap:true }))];
  const order = shuffle(items.map((_, k) => k)), placed = [];
  let fin = false;
  const tile = (it, attr, cls = '') => `<button class="w${it.g ? ' g' : ''}${cls}" ${attr}>${esc(tileText(it.w))}</button>`;
  $('#bank').innerHTML = order.map(k => tile(items[k], `data-k="${k}"`)).join('');
  $('#btns').innerHTML = `<button class="lb" id="lb">정답 보기</button><button class="ok" id="ok" disabled>확인</button>`;
  const draw = () => {
    $('#fill').innerHTML = placed.map((k, j) => tile(items[k], `data-j="${j}"`, ' up')).join('') + '<span class="ul"></span>'.repeat(seq.length - placed.length) + (placed.length === seq.length && x.p ? `<span class="sw p">${esc(x.p)}</span>` : '');
    $$('#bank .w').forEach(b => b.classList.toggle('used', placed.includes(+b.dataset.k)));
    $$('#fill .w').forEach(b => b.onclick = () => { if (fin) return; placed.splice(+b.dataset.j, 1); draw(); });
    $('#ok').disabled = placed.length !== seq.length;
  };
  $$('#bank .w').forEach(b => b.onclick = () => { if (fin || placed.length >= seq.length) return; placed.push(+b.dataset.k); draw(); });
  $('#lb').onclick = () => { fin = true; placed.splice(0, placed.length, ...seq.map((_, j) => j)); draw(); $$('#fill .w').forEach(b => b.classList.add('ok')); report(false, false, i, null); };
  $('#ok').onclick = () => {
    fin = true;
    const correct = placed.every((k, j) => norm(items[k].w) === norm(seq[j]));
    $$('#fill .w').forEach((b, j) => b.classList.add(norm(items[placed[j]].w) === norm(seq[j]) ? 'ok' : items[placed[j]].trap ? 'trapx' : 'bad'));
    const alt = altOf(u, i), trapUsed = placed.filter(k => items[k].trap).map(k => items[k].w);
    const why = alt && trapUsed.some(w => norm(w) === norm(alt.w)) ? alt.why : trapUsed.length ? `${trapUsed.map(w => tileText(w)).join(', ')} 는 이 문장에 쓰지 않아요` : '';
    report(correct, correct, i, placed.map(k => items[k].w).join(' ') + x.p, why);
  };
  draw();
}
function quizArrange(s, i) { const alt = s.alt ? altOf(unit(), i) : null; arrangeIn(s, i, alt ? [alt.w] : []); }
function quizLong(s, i) { arrangeIn(s, i, trapsOf(unit(), i)); }

/* 결과창 — 유닛 끝에 한 번. 틀렸던 곳(있을 때) + 복습 주기 + 결과 설명 카드(앞에서 이미 봤으면 '한 번 더 확인!').
   첫 학습의 정오답은 판정에 쓰지 않는다 — 1~3일 뒤 헷갈리는 낱말 · 트랩과 함께 다시 나올 때 판별한다 */
function finish() {
  run.phase = 'done'; run.stage = null; refresh();
  const u = unit();
  const miss = run.miss.map(m => `<div class="miss"><div class="no">${esc(m.given)}</div><div class="yes">→ ${sentHtml(u.s[m.i])}<span class="st2">${esc(m.name)}</span></div>${m.why ? `<div style="font-size:13px;color:#8a5a2e">${esc(m.why)}</div>` : ''}</div>`).join('');
  const clean = run.log.every(l => l.ok);
  $('#stage').innerHTML = `<div class="cardwrap"><div class="ctab">표현 · 결과</div><div class="cnew">NEW</div><div class="acard"><div class="abody">
      <div class="intro"><div class="f">${clean ? '모든 단계를 한 번에 맞혔어요' : '수고했어요'}</div><div class="m">📅 1~3일 뒤 복습 — 그때 헷갈리는 낱말 · 트랩과 함께 다시 나와요</div></div>
      ${miss ? `<div class="sec"><div class="t">틀렸던 곳</div>${miss}</div>` : ''}</div></div></div>
    ${xcardHtml(u, run.revealed ? '💡 한 번 더 확인!' : '💡 새로운 표현을 배웠어요')}
    <div class="abot" style="min-height:0"><div class="abtns"><button class="lb" id="again">다시</button><button class="ok" id="nxu">다음 유닛</button></div></div>`;
  $('#again').onclick = () => open(uid);
  $('#nxu').onclick = () => $('#rand').click();
}

fetch('units/flow-units.gen.json').then(r => r.json()).then(d => {
  U = d.units.filter(u => brIdx(u.s[0]).length && u.s.some((x, i) => i > 0 && brIdx(x).length)); U.forEach(u => byId[u.id] = u);
  const fn = new Set(TRAP_BUCKETS.flat()), seen = new Set();
  U.forEach(u => u.s.forEach(x => brIdx(x).forEach(j => { const w = norm(x.t[j][0]); if (w.length >= 3 && /^[a-z]+$/.test(w) && !fn.has(w) && !seen.has(w)) { seen.add(w); CONTENT_POOL.push(w); } })));
  CONTENT_POOL.sort();
  if (!byId[uid]) uid = FEATURED[sec][0];
  if (!FLOWS[ui]) ui = 'new';
  const q = $('#q');
  q.onkeydown = e => {
    if (e.key !== 'Enter') return;
    const v = q.value.trim().toLowerCase(); if (!v) return;
    const hit = U.find(x => x.id.toLowerCase() === v) || U.find(x => x.form.toLowerCase().includes(v) || x.mean.includes(v));
    if (hit) { open(hit.id); q.value = ''; q.blur(); } else { q.value = ''; q.placeholder = `"${v}" 에 맞는 유닛이 없어요`; }
  };
  open(uid);
}).catch(e => { $('#stage').innerHTML = `<div class="acard"><div class="abody">문장을 불러오지 못했어요. (${esc(e.message)})</div></div>`; });
</script>
</body>
</html>
