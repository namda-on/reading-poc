<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>패턴 찾기 실험 — 어휘→표현</title>
<style>
  /* 본 프로토타입(`vocab-expression.html`)의 `[2] 패턴 찾고 쓰기` 단계만 떼어 온 실험 페이지.
     본 파일은 본체를 건드리지 않는다 — 같은 데이터(`vocab-expression.data.json`)를 읽고
     두 가지 개선안을 **토글로 켜고 끄며** 현재 동작과 바로 비교한다.
       [1] 형태 슬롯 인정 — 프레임에 붙은 `~ing`·최상급까지 짚어도 막지 않는다
       [2] 연출 — 수렴(B) · 짚는 손맛(C)                                        */
  :root { --bg:#a9ccf2; --ink:#2f3e52; --sub:#6b7c93; --blue:#4b83d6; --green:#2e9e57; --purple:#7b6ef0; --purple-d:#5b3fb0; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--ink); display:flex; justify-content:center; }
  .app { width:100%; max-width:460px; height:100dvh; min-height:100vh; display:flex; flex-direction:column;
    background:linear-gradient(#aacdf3,#bfe0ef); }
  .hidden { display:none !important; }

  /* ── 실험실 상단바 — 본 프로토타입에는 없다(비교용 조작부) ────────────────── */
  .lab { flex-shrink:0; padding:10px 12px 8px; }
  .lab-nav { display:flex; align-items:center; gap:8px; }
  .lab-nav button { border:none; border-radius:9px; background:#fff; color:#3a6bb0; font-weight:800;
    font-size:13px; padding:7px 11px; cursor:pointer; box-shadow:0 1px 3px rgba(47,79,128,.12); }
  .lab-nav button:disabled { opacity:.45; cursor:default; }
  .lab-pos { flex:1; display:flex; align-items:center; justify-content:center; gap:4px;
    font-size:13px; font-weight:800; color:#3a6bb0; }
  .lab-pos input { width:58px; border:none; border-radius:8px; padding:6px 7px; text-align:center;
    font:inherit; font-weight:800; color:#3a6bb0; background:rgba(255,255,255,.75); outline:none; }
  .lab-sw { display:flex; gap:7px; margin-top:8px; }
  .lab-sw button { flex:1; border:1.5px solid rgba(255,255,255,.75); border-radius:11px; cursor:pointer;
    background:rgba(255,255,255,.3); color:#3f5876; text-align:left; padding:7px 10px; font:inherit; }
  .lab-sw button b { display:block; font-size:12.5px; font-weight:800; }
  .lab-sw button i { display:block; font-size:11px; font-style:normal; color:#5c7693; margin-top:1px; }
  .lab-sw button.on { background:#fff; border-color:#fff; color:#2e9e57; box-shadow:0 2px 6px rgba(30,60,110,.14); }
  .lab-sw button.on i { color:#6f8ba6; }
  .lab-note { font-size:11.5px; color:#476a93; margin-top:7px; line-height:1.5; }
  .lab-note b { color:#2e5f94; }

  .stage { flex:1; display:flex; flex-direction:column; min-height:0; }
  .stage-scroll { flex:1; overflow-y:auto; padding:22px 16px 10px; }
  .stage-bottom { flex-shrink:0; padding:6px 16px 16px; }

  /* ── 본 프로토타입에서 그대로 가져온 카드·입력 표기 ──────────────────────── */
  .chat-card { position:relative; background:linear-gradient(#e9f1fb 0%, #f4f8fd 42%, #ffffff 42%, #ffffff 100%);
    border-radius:22px; box-shadow:0 6px 18px rgba(30,60,110,.13); padding:22px 20px 16px; }
  .chat-card.correct { background:linear-gradient(#dff3e4 0%,#eaf8ee 46%,#fbfffc 46%,#fbfffc 100%); }
  .chat-card.rcg { background:linear-gradient(#e9f1fb 0,#f4f8fd 45px,#ffffff 45px,#ffffff 100%); }
  .chat-card.rcg.correct { background:#fbfffc; }
  .chat-tag { position:absolute; top:-13px; left:16px; background:#cfe0f5; color:#3a6bb0; font-size:12px; font-weight:800; border-radius:11px 11px 11px 3px; padding:3px 11px; display:flex; align-items:center; gap:5px; }
  .chat-tag .q { width:15px; height:15px; border-radius:50%; background:#a9c4e8; color:#fff; font-size:10px; display:inline-flex; align-items:center; justify-content:center; }
  .chat-badge { position:absolute; top:-11px; right:16px; font-size:12px; font-weight:800; padding:3px 10px; border-radius:9px 9px 3px 9px; background:#ff6f6f; color:#fff; }
  .check-mark { position:absolute; top:-22px; left:2px; font-size:46px; color:var(--green); text-shadow:0 2px 4px rgba(0,0,0,.12); animation:pop .3s ease; }
  @keyframes pop { from{opacity:0; transform:scale(.5) rotate(-15deg);} to{opacity:1; transform:none;} }
  .blank { field-sizing:content; min-width:66px; max-width:100%; background:#dbe8fb; border:none; border-radius:9px; padding:2px 10px;
    font:inherit; font-weight:800; color:#3a6bb0; text-align:center; outline:none; vertical-align:baseline; }
  .wrong-box { background:#cdd8f2; color:#42527a; border-radius:11px; padding:10px 14px; font-size:15px; font-weight:600; margin:14px 0 2px; }
  .wrong-box b { color:#e14b46; font-weight:800; }
  .reveal-note { margin-top:10px; font-size:13.5px; font-weight:700; color:#7d97b8; }
  .reveal-note b { font-size:16px; font-weight:800; color:#3a6bb0; margin-left:2px; }
  .vtools { display:flex; justify-content:space-between; align-items:center; padding:4px 6px; }
  .vtool { display:flex; align-items:center; gap:7px; background:#fff; border:none; border-radius:999px; cursor:pointer;
           color:#8a7fc0; font-size:13px; font-weight:800; padding:6px 14px 6px 7px; box-shadow:0 1px 3px rgba(47,79,128,.10); }
  .vtool .ic { width:24px; height:24px; border-radius:50%; background:#eae6fb; display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--purple-d); }
  .vtool.mic .ic { background:#eef1fb; color:#5b83b8; }
  .vtool:disabled { opacity:.85; cursor:default; }
  .arr-btns { display:flex; gap:10px; align-items:center; margin-top:12px; }
  .btn-confirm { flex:1; border:none; border-radius:14px; background:#6d7ff0; color:#fff; font-size:17px; font-weight:800;
    padding:15px 0; cursor:pointer; box-shadow:0 4px 0 #4f5fd0; }
  .btn-confirm:disabled { background:#c7d2e4; box-shadow:0 4px 0 #b2bfd4; cursor:default; }
  .vbtns { display:flex; gap:10px; margin-top:12px; }
  .vbtn { flex:1; display:flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:14px;
    background:#6d7ff0; color:#fff; font-size:16px; font-weight:800; padding:15px 0; cursor:pointer; box-shadow:0 4px 0 #4f5fd0; }

  /* ── 인식(패턴 찾기) ───────────────────────────────────────────────────── */
  .sp-q { font-size:13.5px; font-weight:700; color:#5b7c93; }
  .sp-q b { color:#22794a; font-weight:800; }
  .rc-list { position:relative; margin-top:12px; }
  .rc-row { max-height:300px; transition:max-height .34s cubic-bezier(.4,0,.2,1), opacity .24s ease; }
  .rc-row + .rc-row { margin-top:12px; padding-top:12px; border-top:1.5px solid #eef3f9; }
  .rc-row.ref { opacity:.82; }
  .rc-row.tgt { border-top-style:dashed; border-top-color:#d7e1ef; }
  .rc-row.fold { max-height:0; opacity:0; margin-top:0; padding-top:0; border-top-width:0;
    overflow:hidden; pointer-events:none; }
  .rc-line { font-size:17.5px; line-height:1.95; color:#2f3e52; font-weight:700; }
  .rc-w { display:inline-block; margin:0; padding:1px 3px; font:inherit; color:inherit;
          border:none; background:none; border-radius:8px; border-bottom:1.5px dotted #d7e1ef;
          transition:background .15s ease, color .15s ease; }
  button.rc-w { cursor:pointer; }
  .rc-w.plain { border-bottom-color:transparent; }
  .rc-w.on { background:#e2ebfb; color:#3a6bb0; font-weight:800; border-bottom-color:transparent; }
  .rc-w.ok { background:#dcf6e6; color:#1f7a49; font-weight:800; border-bottom-color:transparent; }
  .rc-w.pop, .rc-hl.pop { animation:rcPop .36s ease; }
  .rc-w.tap { animation:rcTap .3s ease; }
  @keyframes rcTap { 0%{transform:none;} 40%{transform:translateY(-4px) scale(1.06);} 100%{transform:none;} }
  @keyframes rcPop { 0%{transform:none;} 42%{transform:translateY(-5px) scale(1.09);} 100%{transform:none;} }
  .rc-list.shake { animation:rcShake .34s ease; }
  @keyframes rcShake { 0%,100%{transform:none;} 22%{transform:translateX(-5px);} 55%{transform:translateX(5px);} 82%{transform:translateX(-2px);} }
  .rc-w.bad { background:#fdeaea; color:#c0403b; border-bottom-color:transparent; }
  .rc-p { font-size:17.5px; font-weight:700; margin-left:-5px; }
  .rc-kr { font-size:13px; color:#9aa8bc; font-weight:600; margin-top:6px; }
  .rc-hl { background:#dcf6e6; color:#1f7a49; font-weight:800; border-radius:8px; padding:3px 7px;
           -webkit-box-decoration-break:clone; box-decoration-break:clone;
           transition:background .2s ease, color .2s ease; }
  .rc-dim { color:#c6cfdb; font-weight:600; transition:color .4s ease, font-size .34s ease, opacity .34s ease; }
  .rc-in { min-width:74px; font-size:17.5px; }
  .rc-in.bad { background:#fbdcda; color:#c0403b; }

  /* ── [1] 형태 슬롯 — 프레임(글자가 그대로)과 **다르게** 칠한다 ───────────── */
  /* 프레임은 꽉 찬 초록, 형태 슬롯은 **점선 테두리의 빈 초록**이다 — "자리는 같은데
     낱말이 바뀐다"를 색이 아니라 **채움 여부**로 말한다. 색만 흐리게 하면 '덜 맞은 것'으로
     읽히는데, 이건 덜 맞은 게 아니라 **다른 종류**다. */
  .rc-fm { background:#f1fbf5; color:#3f9268; font-weight:800; border:1.5px dashed #9fd9bb;
           border-radius:8px; padding:1px 6px;
           -webkit-box-decoration-break:clone; box-decoration-break:clone; }
  /* 형태 라벨은 **줄 안이 아니라 아래 범례**에 둔다 — 낱말 옆에 칩을 끼우면 문장이 두 줄로
     밀려 `players.` 만 다음 줄에 떨어진다(수렴도 그 줄에서 건너뛰게 된다). 범례 한 줄은
     자리를 늘 차지하지 않고, 점선이 무엇인지도 같이 말해 준다. */
  .rc-legend { display:flex; align-items:center; gap:7px; margin-top:14px; font-size:12px; font-weight:700; color:#8fa2b8; }
  .rc-legend .sw { display:inline-block; width:22px; height:14px; border-radius:5px;
                   background:#f1fbf5; border:1.5px dashed #9fd9bb; }
  .rc-legend b { color:#3f9268; font-weight:800; }
  /* 짚는 중에도 프레임 탭(파랑)과 구분해 둔다 — 통과 전에 이미 두 종류임이 보인다 */
  .rc-w.on.fm { background:#e9f7f0; color:#3f9268; }
  .rc-w.ok.fm { background:#f1fbf5; color:#3f9268; box-shadow:inset 0 0 0 1.5px #9fd9bb; }

  /* ── [2]-C 짚는 손맛 — pop 대신 알약이 좌→우로 채워진다 ──────────────────── */
  .fx .rc-w.on { background-color:transparent; background-image:linear-gradient(#e2ebfb,#e2ebfb);
                 background-repeat:no-repeat; background-size:100% 100%; }
  .fx .rc-w.on.fm { background-image:linear-gradient(#e9f7f0,#e9f7f0); }
  .fx .rc-w.tap { animation:rcWipe .22s ease-out; }
  @keyframes rcWipe { from { background-size:0% 100%; } to { background-size:100% 100%; } }

  /* ── [2]-B 수렴 — 슬롯이 제자리에서 줄어들고, 초록 조각이 세로로 맞춰진다 ── */
  .rc-line { transition:transform .46s cubic-bezier(.3,.02,.2,1); }
  .fx .rc-row.ref .rc-dim { font-size:.82em; opacity:.55; }
  .fx .rc-row.ref .rc-hl { box-shadow:0 2px 7px rgba(46,158,87,.22); }
</style>
</head>
<body>
<div class="app">
  <div class="lab">
    <div class="lab-nav">
      <button id="prevBtn">‹ 이전</button>
      <div class="lab-pos"><input id="posIn" type="text" inputmode="numeric" /> / <span id="posTot">—</span></div>
      <button id="nextItemBtn">다음 ›</button>
      <button id="nextFmBtn" title="형태 라벨이 붙는 문항으로">형태 ›</button>
    </div>
    <div class="lab-sw">
      <button id="swFm"><b>[1] 형태 슬롯 인정</b><i>~ing·최상급까지 짚어도 막지 않는다</i></button>
      <button id="swFx"><b>[2] 연출</b><i>수렴 · 짚는 손맛</i></button>
    </div>
    <div class="lab-note" id="labNote"></div>
  </div>
  <div class="stage" id="stage"></div>
</div>
<script>
// ── 데이터·헬퍼 — 본 프로토타입과 같은 구현을 그대로 옮긴 것 ────────────────────
let DATA=null, items=[], idx=0;
let fmOn=true, fxOn=true, onlyFm=false;

const el=id=>document.getElementById(id);
const stage=el('stage');
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function tokenize(sent){ return sent.trim().replace(/[.?!]+$/,'').split(/\s+/); }
function trailPunct(sent){ const m=sent.trim().match(/[.?!]+$/); return m?m[0]:''; }
const bare=w=>String(w).toLowerCase().replace(/[^a-z0-9']/g,'');

// 토큰이 몇 번째 seg 에 속하는지 — 형태 슬롯을 낱말이 아니라 **자리**로 칠하기 위해 쓴다
function segIndexOf(tokens, segs){
  const out=new Array(tokens.length).fill(-1);
  let ti=0;
  segs.forEach((sg,si)=>{
    const n=sg.s.split(/\s+/).map(bare).filter(Boolean).length;
    for(let k=0;k<n && ti<tokens.length;k++, ti++) out[ti]=si;
  });
  return out;
}
function frameFlags(tokens, segs){
  const flags=new Array(tokens.length).fill(false);
  let ti=0;
  segs.forEach(sg=>{
    const n=sg.s.split(/\s+/).map(bare).filter(Boolean).length;
    for(let k=0;k<n && ti<tokens.length;k++, ti++) if(sg.t==='frame') flags[ti]=true;
  });
  return flags;
}
function editDist(a,b){
  const m=a.length, n=b.length;
  if(Math.abs(m-n)>1) return 9;
  let prev2=null, prev=Array.from({length:n+1},(_,j)=>j), cur=null;
  for(let i=1;i<=m;i++){
    cur=[i];
    for(let j=1;j<=n;j++){
      const c=a[i-1]===b[j-1]?0:1;
      let v=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+c);
      if(i>1 && j>1 && a[i-1]===b[j-2] && a[i-2]===b[j-1]) v=Math.min(v, prev2[j-2]+1);
      cur[j]=v;
    }
    prev2=prev; prev=cur;
  }
  return prev[n];
}
function nearWord(a,b){ return a===b || (a.length>=4 && b.length>=4 && editDist(a,b)<=1); }

// 1박자의 비교 대상 두 문장 — 학습 문장은 쓰지 않는다(2박자에서 쓸 자리다).
// 본 프로토타입의 `rcgPair` 와 같은 구현.
function rcgPair(item){
  const part=(r,fr)=>{ const t=tokenize(r.en), f=frameFlags(t, r.segs);
    return new Set(t.filter((w,i)=>f[i]===fr).map(bare).filter(Boolean)); };
  const same=(a,b)=> a.size===b.size && [...a].every(w=>b.has(w));
  const shape=r=>{ const t=tokenize(r.en), f=frameFlags(t, r.segs); return t.length+':'+f.indexOf(true); };
  const aligned=r=> (r.segs||[]).reduce((n,g)=>n+String(g.s).trim().split(/\s+/).filter(Boolean).length, 0)
                    === tokenize(r.en).length;
  const own={en:item.sentence.en, segs:item.baseSegs};
  if(!aligned(own)) return null;
  const tset=part(own, true);
  const pool=(item.apply||[]).filter(a=>a.segs && a.en!==item.sentence.en)
    .filter(a=>aligned(a) && same(part(a, true), tset));
  if(pool.length<2) return null;
  let best=null, bk=null;
  for(let i=0;i<pool.length;i++) for(let j=i+1;j<pool.length;j++){
    const A=pool[i], B=pool[j], sa=part(A,false), sb=part(B,false);
    const k=[ [...sa].filter(w=>sb.has(w)).length,
              shape(A)===shape(B)?1:0,
              tokenize(A.en).length+tokenize(B.en).length ];
    if(!bk || k[0]<bk[0] || (k[0]===bk[0] && (k[1]<bk[1] || (k[1]===bk[1] && k[2]<bk[2])))){ best=[A,B]; bk=k; }
  }
  return best;
}

// ── [1] 형태 슬롯 ─────────────────────────────────────────────────────────────
// 프레임 옆 자리가 **문장마다 낱말은 바뀌지만 형태는 같은** 경우(`need ~ing`,
// `the ~est`)를 찾아 이름을 붙인다. 출처는 둘:
//   ① 저작된 `pattern.form` 의 마커(`___-ing`) — 데이터에 이미 있다(32문항)
//   ② 형제 문장에서 **같은 자리의 낱말이 모두 같은 접미사**를 쓰는 경우(50문항)
// 둘 다 없으면 라벨을 붙이지 않는다 — 없는 규칙을 지어내지 않는다.
// **`-s`는 쓰지 않는다** — 복수 명사(`potatoes`)·3인칭 단수 동사(`knows`)·축약형(`She's`)이
// 전부 `s`로 끝나는데 품사를 모르면 구분할 수 없다. `복수형`이라고 적으면 `She's`를
// 복수라고 가르치게 된다. 형태를 **틀리게 이름 붙이느니 안 붙인다**(점선 자리는 남는다).
const SUF=['ing','est','ed','er'];
const SUF_KO={ing:'~ing', est:'가장 ~한', er:'더 ~한', ed:'~ed'};
// 최상급·비교급은 **불규칙이 섞인다** — `one of the brightest/best/nicest/hardest` 처럼
// 하나만 불규칙이어도 접미사 규칙이 통째로 깨진다. 닫힌 목록이라 그냥 적어 둔다.
const IRR_EST=new Set(['best','worst','most','least','furthest','farthest','eldest']);
const IRR_ER =new Set(['better','worse','more','less','further','farther','elder']);
function sufOf(w){ const x=bare(w);
  if(IRR_EST.has(x)) return 'est';
  if(IRR_ER.has(x))  return 'er';
  for(const s of SUF) if(x.endsWith(s) && x.length>s.length+1) return s;
  return null; }

function formLabels(item){
  // 결과: { 낱말(bare) → 라벨 }  — 두 예시 줄에서 짚을 수 있는 낱말만 담는다
  const out=new Map();
  const base=item.baseSegs;
  const fams=[base].concat((item.apply||[]).map(a=>a.segs).filter(Boolean))
    .filter(f=>f.length===base.length && f.every((g,i)=>g.t===base[i].t));
  const slotIdx=base.map((g,i)=>g.t==='slot'?i:-1).filter(i=>i>=0);

  // ① 저작 form 마커 — 자리표시자를 **오른쪽부터** 슬롯에 맞춘다(form 은 앞의 주어를
  //    생략하는 일이 잦다: `the ___-est` ↔ 슬롯 `It's` + `smallest basket`).
  //    맞춘 자리에 그 접미사를 가진 낱말이 실제로 없으면 **버린다**(틀린 라벨 금지).
  const form=((item.pattern||{}).form||'');
  const holes=[...form.matchAll(/_{2,}(?:\s*-\s*([a-z]+))?/ig)].map(m=>(m[1]||'').toLowerCase());
  const off=slotIdx.length-holes.length;
  const mark=new Map();
  holes.forEach((h,k)=>{ const si=slotIdx[k+off]; if(h && si!==undefined) mark.set(si, h); });

  slotIdx.forEach(si=>{
    const fills=fams.map(f=>f[si].s.trim().split(/\s+/)).filter(x=>x.length);
    if(fills.length<2) return;
    let label=null, pickSuf=null;
    const m=mark.get(si);
    if(m && SUF_KO[m] && fills.some(ws=>ws.some(w=>sufOf(w)===m))) { pickSuf=m; label=SUF_KO[m]; }
    if(!label && fills.length>=3){
      // ② 관찰 — 왼쪽/오른쪽 양쪽 정렬로 같은 자리의 낱말을 비교한다
      for(const side of ['L','R']){
        const L=Math.min(...fills.map(x=>x.length));
        for(let k=0;k<L;k++){
          const ws=fills.map(x=> side==='L' ? x[k] : x[x.length-1-k]);
          if(new Set(ws.map(bare)).size<3) continue;    // 그 자리가 실제로 바뀌어야 한다
          const s0=sufOf(ws[0]);
          if(s0 && ws.every(w=>sufOf(w)===s0)){ pickSuf=s0; label=SUF_KO[s0]; break; }
        }
        if(label) break;
      }
    }
    if(!label) return;
    // 그 접미사를 가진 낱말들에 라벨을 건다
    fills.forEach(ws=>ws.forEach(w=>{ if(sufOf(w)===pickSuf && bare(w)) out.set(bare(w), label); }));
  });
  return out;
}

// ── 화면 ─────────────────────────────────────────────────────────────────────
function chatTag(item){ return `<div class="chat-tag">레벨 ${item.level}<span class="q">?</span></div>`; }
function nextBottom(label){ return `<div class="vbtns"><button class="vbtn" id="nextBtn">▶ ${label}</button></div>`; }

function render(){
  const item=items[idx];
  el('posIn').value=String(idx+1);
  document.body.classList.toggle('fx', fxOn);
  const pair=rcgPair(item);
  if(!pair){
    stage.innerHTML=`<div class="stage-scroll"><div class="chat-card"><div class="sp-q">
      이 문항은 낱말 경계에 맞지 않아 짚기가 성립하지 않습니다(본 프로토타입에서는 ver.2로 넘어갑니다).</div></div></div>`;
    el('labNote').innerHTML='이 문항은 <b>짚기 비대상</b>입니다.';
    return;
  }
  const mk=r=>{ const tok=tokenize(r.en);
    return {raw:r, kr:r.kr, tok, punct:trailPunct(r.en),
            flag:frameFlags(tok, r.segs), seg:segIndexOf(tok, r.segs)}; };
  const rows=pair.map(mk);
  const tgt=mk({en:item.sentence.en, kr:item.sentence.kr, segs:item.baseSegs});

  const head=rows[0], want=[];
  head.tok.forEach((w,i)=>{ if(!head.flag[i]) return; const b=bare(w); if(b && want.indexOf(b)<0) want.push(b); });
  const wantSet=new Set(want);
  const pieces=(tgt.raw.segs||[]).filter(g=>g.t==='frame').map(g=>g.s);
  const vals=pieces.map(()=>'');

  // 프레임에 **인접한** 슬롯 낱말만 추가로 짚을 수 있다 — 아무 데나 짚고 통과하는 것을 막는다
  const adj=new Set();
  rows.forEach(r=> r.tok.forEach((w,i)=>{
    if(r.flag[i]) return;
    if(r.flag[i-1] || r.flag[i+1]) { const b=bare(w); if(b) adj.add(b); }
  }));
  const labels=formLabels(item);
  const fmHere=[...adj].filter(w=>labels.has(w));
  el('labNote').innerHTML = `프레임 <b>${want.join(' · ')}</b> · 추가로 짚을 수 있는 자리 <b>${adj.size}</b>개`
    + (fmHere.length ? ` · 형태 라벨 <b>${fmHere.map(w=>labels.get(w)).filter((v,i,a)=>a.indexOf(v)===i).join(', ')}</b>` : ' · 형태 라벨 없음');

  const pick=new Set();
  let phase=1, hintLevel=0;

  const lineHtml=r=> r.tok.map(w=>{ const b=bare(w);
      return b ? `<button class="rc-w" data-b="${escapeHtml(b)}">${escapeHtml(w)}</button>`
               : `<span class="rc-w plain">${escapeHtml(w)}</span>`; }).join(' ')
    + (r.punct?`<span class="rc-p">${escapeHtml(r.punct)}</span>`:'');

  stage.innerHTML=`
    <div class="stage-scroll">
      <div class="chat-card rcg" id="card">
        ${chatTag(item)}<div class="chat-badge">NEW</div>
        <div class="sp-q" id="rcQ">아래 두 문장에서 <b>공통되는 패턴</b>을 찾아 눌러 보세요</div>
        <div class="rc-list" id="rcList">${rows.map(r=>`
          <div class="rc-row">
            <div class="rc-line">${lineHtml(r)}</div>
            <div class="rc-kr">${escapeHtml(r.kr)}</div>
          </div>`).join('')}
          <div class="rc-row tgt fold" id="rcTgt">
            <div class="rc-line"></div>
            <div class="rc-kr">${escapeHtml(tgt.kr)}</div>
          </div></div>
        <div class="rc-legend hidden" id="rcLegend"></div>
        <div class="wrong-box hidden" id="wrongBox"></div>
        <div class="reveal-note hidden" id="revealNote"></div>
      </div>
    </div>
    <div class="stage-bottom" id="bottom">
      <div class="vtools" id="vtools">
        <button class="vtool" id="hintBtn"><span class="ic">?</span><span id="hintLabel">첫 낱말 보기</span></button>
        <button class="vtool mic" disabled><span class="ic">🎤</span><span>음성 모드</span></button>
      </div>
      <div class="arr-btns"><button class="btn-confirm" id="okBtn" disabled>확인</button></div>
    </div>`;

  const wrongBox=el('wrongBox'), listEl=el('rcList');
  const rowEls=rows.map((r,i)=>listEl.querySelectorAll('.rc-row')[i]);
  const tgtEl=el('rcTgt');
  const wordEls=Array.from(listEl.querySelectorAll('button.rc-w'));

  // ── 1박자: 짚기 ───────────────────────────────────────────────────────────
  function sync(){
    wordEls.forEach(b=>{
      const on=pick.has(b.dataset.b);
      b.classList.toggle('on', on);
      // 형태 슬롯은 짚는 중에도 프레임과 다른 색이다 — 통과 전에 이미 두 종류임이 보인다
      b.classList.toggle('fm', fmOn && on && !wantSet.has(b.dataset.b));
    });
    el('okBtn').disabled = phase!==1 || !pick.size;
  }
  wordEls.forEach(b=> b.onclick=()=>{
    if(phase!==1) return;
    const w=b.dataset.b, on=!pick.has(w);
    if(on) pick.add(w); else pick.delete(w);
    wordEls.forEach(x=>x.classList.remove('bad'));
    wrongBox.classList.add('hidden');
    sync();
    if(!on) return;
    const hits=wordEls.filter(x=>x.dataset.b===w);
    hits.forEach((x,k)=>{ x.classList.remove('tap'); void x.offsetWidth;
      setTimeout(()=>{ if(x.isConnected) x.classList.add('tap'); }, k*(fxOn?60:40)); });
  });

  function checkPick(){
    const extra=[...pick].filter(w=>!wantSet.has(w));
    // **[1] 켜짐** — 프레임에 인접한 자리를 최대 2낱말까지 함께 짚는 것은 틀린 것이 아니다.
    // 학습자가 보는 패턴(`need ~ing`)이 프레임(`need`)보다 큰 경우가 있다.
    const allowed = fmOn ? extra.filter(w=>adj.has(w)) : [];
    const bad = extra.filter(w=>allowed.indexOf(w)<0);
    if(bad.length || allowed.length>2){
      const show = bad.length ? bad : allowed;
      wordEls.forEach(b=>{ if(show.indexOf(b.dataset.b)>=0) b.classList.add('bad'); });
      listEl.classList.remove('shake'); void listEl.offsetWidth; listEl.classList.add('shake');
      const cnt=w=>rowEls.filter(row=>row.querySelector(`button.rc-w[data-b="${w}"]`)).length;
      const ghost=show.filter(w=>cnt(w)>=rowEls.length);
      wrongBox.classList.remove('hidden');
      wrongBox.innerHTML = allowed.length>2 && !bad.length
        ? `패턴이 너무 넓어요. <b>문장마다 바뀌는 자리</b>는 한두 개까지만 함께 짚을 수 있어요.`
        : (ghost.length===show.length
            ? `<b>${escapeHtml(show.join(', '))}</b> 는 두 문장에 다 있지만 <b>패턴은 아니에요</b> — 바뀌는 자리에 우연히 같은 말이 온 거예요.`
            : `<b>${escapeHtml(show.join(', '))}</b> 는 문장마다 달라요. <b>두 문장에 다 있는</b> 말만 눌러 보세요.`);
      return;
    }
    const missing=want.filter(w=>!pick.has(w));
    if(missing.length){
      wrongBox.classList.remove('hidden');
      wrongBox.innerHTML=`같은 말이 <b>${missing.length}낱말</b> 더 있어요.`;
      return;
    }
    recognized(allowed);
  }

  // 통과한 줄을 문장으로 굳힌다 — 프레임은 꽉 찬 초록, 함께 짚은 **형태 슬롯**은 점선 초록,
  // 나머지 바뀌는 자리는 흐려진다. 세 종류가 한 줄에서 갈린다.
  // 짚은 낱말이 **어느 자리**의 것인지 모아 둔다 — 그 자리에 같은 형태의 낱말이 있으면
  // 다른 줄에서도 함께 점선으로 칠해야 한다(한 줄만 칠하면 `fixing 만 형태 슬롯`이 된다).
  function extraSlots(extras){
    const m=new Map();          // seg 인덱스 → 라벨
    rows.forEach(r=> r.tok.forEach((w,i)=>{
      const b=bare(w);
      if(r.flag[i] || extras.indexOf(b)<0) return;
      const lab=labels.get(b);
      if(lab) m.set(r.seg[i], lab);
    }));
    return m;
  }
  function settleHtml(r, extras, slotMap){
    const parts=[]; let run=[];
    const flush=()=>{ if(run.length){ parts.push(`<span class="rc-hl">${escapeHtml(run.join(' '))}</span>`); run=[]; } };
    r.tok.forEach((w,i)=>{
      if(r.flag[i]){ run.push(w); return; }
      flush();
      const b=bare(w);
      const lab=labels.get(b);
      // ① 내가 직접 짚은 낱말 ② 같은 자리에 선 **같은 형태**의 낱말
      const isFm = extras.indexOf(b)>=0 || (slotMap.get(r.seg[i]) && lab===slotMap.get(r.seg[i]));
      parts.push(isFm ? `<span class="rc-fm">${escapeHtml(w)}</span>`
                      : `<span class="rc-dim">${escapeHtml(w)}</span>`);
    });
    flush();
    return parts.join(' ') + (r.punct?`<span class="rc-dim">${escapeHtml(r.punct)}</span>`:'');
  }

  // ── [2]-B 수렴 — 두 줄의 초록 조각을 세로로 맞춘다 ─────────────────────────
  // 줄바꿈된 줄이나 밀어낼 자리가 모자란 줄이 하나라도 있으면 **건너뛴다**(어긋나 보이면
  // 수렴이 아니라 고장으로 읽힌다).
  function converge(){
    if(!fxOn) return;
    const box=listEl.getBoundingClientRect();
    const info=rowEls.map(row=>{
      const line=row.querySelector('.rc-line');
      const hl=line.querySelector('.rc-hl');
      if(!hl) return null;
      const lr=line.getBoundingClientRect(), hr=hl.getBoundingClientRect();
      if(lr.height>40) return null;                    // 두 줄 이상으로 감긴 줄
      const kids=Array.from(line.children);
      if(!kids.length) return null;
      const right=Math.max(...kids.map(k=>k.getBoundingClientRect().right));
      return {line, dx0:hr.left-lr.left, w:right-lr.left};   // 블록 폭이 아니라 **내용 폭**
    });
    if(info.some(x=>!x)) return;
    const target=Math.max(...info.map(x=>x.dx0));
    if(info.some(x=>x.w + (target-x.dx0) > box.width)) return;   // 밀면 넘치는 줄
    info.forEach(x=>{ x.line.style.transform=`translateX(${(target-x.dx0).toFixed(1)}px)`; });
  }

  function recognized(extras){
    phase=0;
    el('okBtn').disabled=true;
    wrongBox.classList.add('hidden'); el('revealNote').classList.add('hidden');
    wordEls.forEach(b=>{ if(pick.has(b.dataset.b)){ b.classList.remove('on'); b.classList.add('ok','pop');
      if(fmOn && !wantSet.has(b.dataset.b)) b.classList.add('fm'); } });
    setTimeout(()=>{ if(!listEl.isConnected) return;
      const slotMap=extraSlots(extras);
      rowEls.forEach((row,ri)=>{
        row.classList.add('ref');
        row.querySelector('.rc-line').innerHTML=settleHtml(rows[ri], extras, slotMap);
      });
      // 점선이 무엇인지와 그 자리의 형태를 한 줄로 — 짚은 것이 있을 때만 선다
      if(extras.length){
        const lab=[...new Set([...slotMap.values()])].join(' · ');
        el('rcLegend').classList.remove('hidden');
        el('rcLegend').innerHTML=`<span class="sw"></span>문장마다 바뀌는 자리`
          + (lab ? ` — 늘 <b>${escapeHtml(lab)}</b>` : '');
      }
      converge();
    }, 330);
    setTimeout(()=>{ if(listEl.isConnected) askWrite(); }, fxOn?780:620);
  }

  // ── 2박자: 그 패턴을 새 문장에 쓴다 ───────────────────────────────────────
  function writeLine(mode){
    const segs=tgt.raw.segs||[]; let k=0;
    const parts=segs.map(g=>{
      if(g.t==='slot') return `<span class="rc-dim">${escapeHtml(g.s)}</span>`;
      const i=k++, v=vals[i]||'';
      return mode==='done'
        ? `<span class="rc-hl">${escapeHtml(v)}</span>`
        : `<input class="blank rc-in" data-i="${i}" value="${escapeHtml(v)}" autocomplete="off" spellcheck="false">`;
    });
    return parts.join(' ') + (tgt.punct?`<span class="rc-dim">${escapeHtml(tgt.punct)}</span>`:'');
  }
  function bindInputs(){
    const ins=Array.from(listEl.querySelectorAll('input.rc-in'));
    ins.forEach((inp,k)=>{
      inp.oninput=()=>{ vals[+inp.dataset.i]=inp.value;
        wrongBox.classList.add('hidden');
        ins.forEach(x=>x.classList.remove('bad'));
        el('okBtn').disabled = phase!==2 || vals.some(v=>!String(v).trim()); };
      inp.onkeydown=e=>{ if(e.key!=='Enter') return; e.preventDefault();
        const nx=ins[k+1]; if(nx) nx.focus(); else if(!el('okBtn').disabled) checkWrite(); };
    });
    if(ins[0]) ins[0].focus();
  }
  function askWrite(){
    phase=2;
    el('rcQ').classList.remove('hidden');
    el('rcQ').innerHTML='찾은 패턴을 <b>아래 새 문장에</b> 써 보세요';
    tgtEl.querySelector('.rc-line').innerHTML=writeLine('input');
    tgtEl.classList.remove('fold');
    bindInputs();
    el('okBtn').disabled=true;
    hintLevel=0; el('hintBtn').disabled=false; el('hintLabel').textContent='정답 보기';
  }
  const normPiece=s=>String(s).toLowerCase().trim().replace(/\s+/g,' ').replace(/[^a-z0-9' ]/g,'');
  function pieceOk(typed, ans){
    const a=normPiece(typed).split(' ').filter(Boolean), b=normPiece(ans).split(' ').filter(Boolean);
    if(a.length!==b.length) return false;
    return a.every((w,i)=>nearWord(w, b[i]));
  }
  function checkWrite(){
    if(phase!==2) return;
    const ins=Array.from(listEl.querySelectorAll('input.rc-in'));
    const bad=pieces.map((p,i)=>!pieceOk(vals[i], p)).map((x,i)=>x?i:-1).filter(i=>i>=0);
    if(bad.length){
      bad.forEach(i=>{ const inp=ins.find(x=>+x.dataset.i===i); if(inp) inp.classList.add('bad'); });
      listEl.classList.remove('shake'); void listEl.offsetWidth; listEl.classList.add('shake');
      wrongBox.classList.remove('hidden');
      wrongBox.innerHTML=`위 두 문장의 초록색 패턴과 달라요. 철자를 다시 확인해 보세요.`;
      return;
    }
    pieces.forEach((p,i)=>{ vals[i]=p; });
    settled();
  }
  function settled(){
    phase=3;
    el('okBtn').disabled=true;
    wrongBox.classList.add('hidden'); el('revealNote').classList.add('hidden');
    el('rcQ').classList.add('hidden');
    el('card').classList.add('correct');
    if(!el('card').querySelector('.check-mark')){ const c=document.createElement('div'); c.className='check-mark'; c.textContent='✓'; el('card').appendChild(c); }
    const line=tgtEl.querySelector('.rc-line');
    line.innerHTML=writeLine('done');
    Array.from(line.querySelectorAll('.rc-hl')).forEach((h,k)=>
      setTimeout(()=>{ if(h.isConnected) h.classList.add('pop'); }, k*70));
    el('bottom').innerHTML=nextBottom('다음 문항');
    el('nextBtn').onclick=()=>go(1);
  }

  el('okBtn').onclick=()=>{ if(phase===1) checkPick(); else if(phase===2) checkWrite(); };

  const pickLadder=[ {label:'첫 낱말 보기', run:()=>{ pick.add(want[0]); sync(); },
                      note:()=>`첫 낱말<b>${escapeHtml(want[0])}</b>`},
                     {label:'정답 보기', run:()=>{ pick.clear(); want.forEach(w=>pick.add(w)); sync(); }} ];
  el('hintBtn').onclick=()=>{
    if(phase===2){ pieces.forEach((p,i)=>{ vals[i]=p; }); el('hintBtn').disabled=true; settled(); return; }
    const d=pickLadder[hintLevel]; if(!d) return;
    if(d.run) d.run();
    const rn=el('revealNote');
    if(d.note){ rn.classList.remove('hidden'); rn.innerHTML=d.note(); } else rn.classList.add('hidden');
    hintLevel++;
    const nx=pickLadder[hintLevel];
    if(nx) el('hintLabel').textContent=nx.label; else el('hintBtn').disabled=true;
  };
}

// ── 네비·토글 ────────────────────────────────────────────────────────────────
function go(d){ idx=(idx+d+items.length)%items.length; save(); render(); }
function save(){ try{ localStorage.setItem('vercg', JSON.stringify({idx, fmOn, fxOn, onlyFm})); }catch(e){} }
function paintSw(){ el('swFm').classList.toggle('on', fmOn); el('swFx').classList.toggle('on', fxOn); }

// 형태 라벨이 붙는 다음 문항으로 — `[1]`의 라벨을 훑어보려면 손으로 찾기엔 49/633이다
function hasLabel(i){
  const it=items[i], pair=rcgPair(it);
  if(!pair) return false;
  const labels=formLabels(it);
  for(const p of pair){
    const t=tokenize(p.en), f=frameFlags(t, p.segs);
    for(let k=0;k<t.length;k++){
      if(f[k]) continue;
      if((f[k-1]||f[k+1]) && labels.has(bare(t[k]))) return true;
    }
  }
  return false;
}
el('nextFmBtn').onclick=()=>{
  for(let d=1; d<=items.length; d++){
    const j=(idx+d)%items.length;
    if(hasLabel(j)){ idx=j; save(); render(); return; }
  }
};
el('prevBtn').onclick=()=>go(-1);
el('nextItemBtn').onclick=()=>go(1);
el('swFm').onclick=()=>{ fmOn=!fmOn; paintSw(); save(); render(); };
el('swFx').onclick=()=>{ fxOn=!fxOn; paintSw(); save(); render(); };
el('posIn').onchange=()=>{ const n=parseInt(el('posIn').value,10);
  if(n>=1 && n<=items.length){ idx=n-1; save(); render(); } else el('posIn').value=String(idx+1); };

fetch('/vocab-expression.data.json').then(r=>r.json()).then(d=>{
  DATA=d; items=d.items||d;
  try{ const s=JSON.parse(localStorage.getItem('vercg')||'{}');
    if(typeof s.idx==='number' && s.idx<items.length) idx=s.idx;
    if(typeof s.fmOn==='boolean') fmOn=s.fmOn;
    if(typeof s.fxOn==='boolean') fxOn=s.fxOn;
  }catch(e){}
  el('posTot').textContent=String(items.length);
  paintSw(); render();
});
</script>
