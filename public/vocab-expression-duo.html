<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>보고 따라 만들기</title>
<style>
  :root { --bg:#a9ccf2; --ink:#2f3e52; --green:#2e9e57; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--ink); display:flex; justify-content:center; }
  .app { width:100%; max-width:460px; min-height:100vh; padding:14px 16px 40px; background:linear-gradient(#aacdf3,#bfe0ef); }
  h1 { font-size:17px; margin:2px 2px 10px; color:#fff; text-shadow:0 1px 2px rgba(30,60,110,.25); }

  .units { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .unit { border:1px solid rgba(255,255,255,.8); background:rgba(255,255,255,.35); color:#35506f; border-radius:20px;
    padding:6px 12px; font-size:13px; font-weight:700; cursor:pointer; }
  .unit.on { background:#4b83d6; border-color:#4b83d6; color:#fff; }
  .unit.rand { border-style:dashed; }
  .find-u { display:flex; margin-bottom:10px; }
  .find-u input { flex:1; min-width:0; border:none; border-radius:11px; padding:8px 11px; font-size:13px; background:rgba(255,255,255,.7); color:#2f3e52; }

  .table { background:#fff; border-radius:16px; padding:10px 12px; margin-bottom:14px; box-shadow:0 4px 12px rgba(30,60,110,.1); }
  .table summary { cursor:pointer; font-size:13px; font-weight:800; color:#3a6bb0; list-style:none; }
  .table summary::-webkit-details-marker { display:none; }
  .table summary::after { content:' ▾'; color:#9aa8bc; }
  .table[open] summary::after { content:' ▴'; }
  .st { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
  .st th { text-align:left; color:#8a98ad; font-weight:800; padding:4px 3px; border-bottom:1px solid #eef2f8; }
  .st td { padding:5px 3px; border-bottom:1px solid #f2f5fa; vertical-align:top; }
  .st tr.cur td { background:#eef4fd; font-weight:800; }
  .st tr.cur td:first-child { box-shadow:inset 3px 0 0 #4b83d6; }
  .st .mk { font-weight:800; } .st .o { color:#2e9e57; } .st .x { color:#c46a2c; }
  .st .tg { display:inline-block; font-size:10.5px; font-weight:800; border-radius:6px; padding:0 5px; }
  .tg.b { background:#e3edfb; color:#3a6bb0; } .tg.r { background:#fdeadf; color:#c4632c; }
  .rules { font-size:11.5px; color:#6b7c93; line-height:1.55; margin:8px 0 2px; }
  .rules b { color:#3d5778; }

  .top { display:flex; align-items:center; gap:8px; margin:0 2px 14px; }
  .bar { flex:1; height:8px; background:rgba(255,255,255,.55); border-radius:6px; overflow:hidden; }
  .bar i { display:block; height:100%; background:#6f9fe6; border-radius:6px; transition:width .3s; }
  .top .n { font-size:12px; font-weight:800; color:#fff; }

  .card { position:relative; background:#fff; border-radius:22px; box-shadow:0 6px 18px rgba(30,60,110,.13); padding:22px 18px 18px; min-height:330px; }
  .tag { position:absolute; top:-12px; left:16px; font-size:12px; font-weight:800; border-radius:11px 11px 11px 3px; padding:3px 11px; }
  .tag.b { background:#cfe0f5; color:#3a6bb0; } .tag.r { background:#fbd9c5; color:#b5541c; }
  .stage { font-size:12.5px; font-weight:800; color:#8a98ad; margin-bottom:4px; }
  .ask { font-size:18px; font-weight:800; color:#2f3e52; margin-bottom:12px; }
  .kr { font-size:19px; font-weight:700; color:#33465c; line-height:1.5; margin-bottom:6px; }
  .kr.sm { font-size:15px; color:#5d6f88; }
  .tgt { color:var(--green); font-weight:800; }
  .spk { border:none; background:#eef4fd; color:#3a6bb0; border-radius:20px; padding:5px 11px; font-size:12.5px; font-weight:800; cursor:pointer; margin-bottom:6px; }

  /* 예시 말풍선 — 듀오링고 '같은 패턴으로 완성하세요'의 위쪽 문장 */
  .model { display:flex; gap:9px; align-items:flex-start; margin:2px 0 16px; }
  .model .av { flex:0 0 38px; height:38px; border-radius:50%; background:#e3edfb; color:#3a6bb0; font-weight:800; display:flex; align-items:center; justify-content:center; font-size:14px; }
  .model .bub { flex:1; border:1.5px solid #dbe6f5; border-radius:4px 16px 16px 16px; padding:9px 12px; }
  .model .en { font-size:17px; font-weight:700; line-height:1.5; }
  .model .en .g { color:#1f7a49; border-bottom:2px dotted #2e9e57; }
  .model .k { font-size:13px; color:#8a98ad; margin-top:2px; }
  .model .sp { border:none; background:none; padding:0 4px 0 0; cursor:pointer; font-size:15px; }

  /* 문장 위 빈칸 */
  .sline { font-size:18.5px; font-weight:700; line-height:2.3; margin:6px 0 16px; }
  .slot { display:inline-block; min-width:54px; height:36px; vertical-align:middle; border:1.5px dashed #7aa3dc; border-radius:9px; background:#f3f8ff; margin:0 2px;
    font-size:16.5px; font-weight:800; color:#2f3e52; line-height:33px; text-align:center; padding:0 9px; cursor:pointer; }
  .slot.on { border-style:solid; border-color:#d3e0f2; background:#fff; }
  .slot.ok { border-style:solid; border-color:#a9dec2; background:#dcf6e6; color:#1f7a49; }
  .slot.bad { border-style:solid; border-color:#f0c4a8; background:#fdeee6; color:#b5541c; }

  /* 짚기 */
  .wline { line-height:2.3; font-size:18px; }
  .wk { font:inherit; font-size:17.5px; font-weight:700; color:#2f3e52; padding:3px 9px; border:1px solid #dbe6f5; background:#fff; border-radius:10px; box-shadow:0 2px 0 #e7eef8; cursor:pointer; margin:2px 1px; }
  .wk:active { transform:translateY(2px); box-shadow:none; }
  .wk.ok { background:#dcf6e6; color:#1f7a49; border-color:#a9dec2; }
  .wk.miss { color:#aab7c8; border-color:#e6eaf0; box-shadow:none; text-decoration:underline; text-decoration-color:#e3c9b0; }
  .wk.plain { border-color:transparent; box-shadow:none; background:none; padding:3px 1px; cursor:default; }
  .note { font-size:13.5px; color:#3a6bb0; background:#eef4fd; border-radius:10px; padding:7px 10px; margin:10px 0 0; line-height:1.45; }

  /* 문장 구성 */
  .fill { display:flex; flex-wrap:wrap; align-items:center; gap:7px 5px; min-height:56px; padding:10px 0; border-bottom:2px solid #e2e9f3; margin:10px 0 14px; }
  .bank { display:flex; flex-wrap:wrap; gap:7px; }
  .w { font:inherit; font-size:16.5px; font-weight:700; color:#2f3e52; padding:8px 12px; border:1px solid #d3e0f2; background:#fff;
    border-radius:11px; box-shadow:0 2px 0 #e1e9f5; cursor:pointer; }
  .w:active { transform:translateY(2px); box-shadow:none; }
  .w.used { background:#e3e9f2; border-color:#dbe2ee; color:transparent; box-shadow:none; pointer-events:none; }
  .w.g { background:#dcf6e6; color:#1f7a49; border-color:#a9dec2; }
  .w.bad { background:#fdeee6; color:#b5541c; border-color:#f0c4a8; }
  .punct { margin-left:-3px; font-size:18px; font-weight:700; }

  .sent { font-size:19px; font-weight:700; line-height:2; margin:10px 0 14px; }
  .inp { font:inherit; font-size:18px; font-weight:800; color:#3a6bb0; border:none; border-bottom:2.5px solid #7aa3dc; background:#f3f8ff; border-radius:6px 6px 0 0; padding:1px 6px; outline:none; text-align:center; }
  .base { font-size:14px; font-weight:700; color:#8a98ad; margin-left:2px; }
  .lad { border:none; border-radius:20px; padding:7px 13px; font-size:12.5px; font-weight:800; cursor:pointer; background:#fff; color:#6b7c93; box-shadow:0 1px 4px rgba(30,60,110,.12); margin-top:12px; }

  .res { margin-top:16px; border-radius:16px; padding:12px 14px; animation:up .25s ease both; }
  .res.ok { background:#edf9f1; } .res.no { background:#fdf3ec; }
  .res .h { font-size:15px; font-weight:800; margin-bottom:4px; }
  .res.ok .h { color:#1f7a49; } .res.no .h { color:#b5541c; }
  .res .a { font-size:15.5px; font-weight:700; color:#33465c; line-height:1.55; }
  .res .a .g, .miss .yes .g { color:#1f7a49; background:#dcf6e6; border-radius:5px; padding:0 4px; }
  .res .why { font-size:13.5px; color:#8a5a2e; margin-top:5px; font-weight:700; }
  @keyframes up { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .btn { display:block; width:100%; border:none; border-radius:15px; padding:14px 8px; font-size:15.5px; font-weight:800; cursor:pointer; margin-top:16px;
    background:linear-gradient(#8b7cf0,#6f5bf0); color:#fff; }
  .btn:disabled { background:#d6dce6; color:#fff; cursor:default; }

  .intro { text-align:center; padding-top:20px; }
  .intro .f { font-size:24px; font-weight:800; color:#1f7a49; margin:10px 0 6px; }
  .intro .m { font-size:15px; color:#5d6f88; }
  .intro .d { margin-top:0; font-size:13.5px; color:#3a6bb0; background:#eef4fd; border-radius:12px; padding:9px 12px; text-align:left; line-height:1.5; }
  .src { margin-top:12px; text-align:right; font-size:11px; color:#a6b3c4; }
  .sec { text-align:left; margin-top:18px; }
  .sec .t { font-size:12.5px; font-weight:800; color:#8a98ad; margin-bottom:6px; }
  .miss { padding:8px 0; border-bottom:1px dashed #e7edf5; font-size:14.5px; font-weight:700; line-height:1.55; }
  .miss .no { color:#b5541c; text-decoration:line-through; text-decoration-color:#e0874f; }
  .miss .st2 { font-size:11.5px; color:#a6b3c4; margin-left:4px; }
</style>
</head>
<body>
<div class="app">
  <h1>보고 따라 만들기 — 듀오링고 '같은 패턴으로 완성하세요'</h1>
  <div class="units" id="units"></div>
  <div class="find-u"><input id="q" type="search" placeholder="유닛 id나 카드 초록으로 찾기 (예: 10065, stop)" enterkeyhint="search"></div>
  <div class="top"><div class="bar"><i id="barI"></i></div><span class="n" id="barN"></span></div>
  <div id="stage"></div>
  <details class="table" id="tbl" open style="margin-top:16px"><summary>단계표 — 지금 어디인지</summary><div id="tblBody"></div></details>
</div>

<script>
/* 모든 유닛이 같은 네 단계를 탄다. 다루는 부분은 언제나 데이터의 [ ] 하나다 — 1 찾고, 2 새 문장에 놓고, 3 새 문장을 통째로 만들고, 4 그 문장에서 직접 쓴다.
   유닛 유형이 정하는 것은 화면이 아니라 뱅크에 [ ] 말고 무엇이 하나 더 오느냐다(ALT): 패턴형은 아무것도(듀오링고 I am from 처럼 뱅크 = 정답 낱말),
   형태 규칙은 같은 낱말의 원형, 일치 규칙은 다른 꼴(Is/Are), 뜻으로 고르는 목록은 같은 유닛의 다른 쪽.
   왕초보 단계표와 같은 규칙: 다 맞히면 다음 단계, 틀리면 같은 퀴즈를 다른 문장으로 한 번 더, 그다음은 결과와 상관없이 다음 단계. */
const STAGES = {
  '1-1':{ kind:'find',    tag:'b', name:'찾기',                 ask:'초록 뜻에 해당하는 영어를 눌러 보세요', pass:'2-1', fail:'2-1' },
  '2-1':{ kind:'same',    tag:'b', name:'같은 패턴으로 완성',   ask:'같은 패턴으로 완성하세요',               pass:'3-1', fail:'2-2' },
  '2-2':{ kind:'same',    tag:'b', name:'같은 패턴으로 완성',   ask:'같은 패턴으로 완성하세요',               pass:'3-1', fail:'3-1' },
  '3-1':{ kind:'arrange', tag:'r', name:'문장 만들기',          ask:'',                                       pass:'4-1', fail:'3-2' },
  '3-2':{ kind:'arrange', tag:'r', name:'문장 만들기',          ask:'',                                       pass:'4-1', fail:'4-1' },
  '4-1':{ kind:'blank',   tag:'r', name:'빠진 부분 쓰기',       ask:'',                                       pass:null,  fail:'4-2' },
  '4-2':{ kind:'blank',   tag:'r', name:'빠진 부분 쓰기',       ask:'',                                       pass:null,  fail:null },
};
const ORDER = Object.keys(STAGES);
const NOTE = {
  '1':'S1 의 한국어 초록을 보고 영어 문장에서 해당하는 말을 짚는다 — 짚은 부분이 2단계의 예시가 된다(틀려도 다시 하지 않는다)',
  '2':'위에 S1(짚은 부분 초록) · 아래 새 문장은 [ ] 자리만 빈칸 — 뱅크의 낱말을 놓는다',
  '3':'남은 새 문장을 한국어만 보고 통째로 만든다 — 초록 없음, 뱅크에 ALT 하나',
  '4':'방금 만든 <b>같은 문장</b>에서 [ ] 가 빈칸 — 직접 쓴다(첫 글자 힌트 · 형태 규칙은 원형 힌트)',
};
/* 뜻으로 고르는 목록 — 같은 자리에 오는 다른 쪽이 그 한국어로는 틀린 말이 되는 유닛만. 뉘앙스 차이(can/could · will/would · may/might ·
   this/that · stay/keep · become/get · think/believe · although/though)와 열린 낱말 자리(the rich/poor · 시각)는 다른 쪽을 놓아도 맞는 말이 되거나
   다른 쪽이 학습 포인트가 아니어서 넣지 않는다. 10013 은 S1(제일 좋아하는 식당이 어디야 = What is)에서 Where 도 맞는 말이라 뺐다. */
const CHOICE = {
  '10031':['Maybe','Actually','Unfortunately'], '10054':['once','twice'], '10088':['myself','yourself','himself','herself'],
  '10328':['on','off'], '10379':['Frankly','Generally','Strictly'], '10383':['when','while','before','until','since'],
  '10391':['where','when'], '10396':['Whoever','Whatever','Whichever'], '10397':['where','why','how','when'],
  '10403':['However','Wherever','Whenever'],
};
const NO_BASE = new Set(['10374', '10344']);
const FEATURED = ['10001', '10033', '10369-A', '10065', '10299', '10041', '10006', '10383', '10084'];

let U = [], byId = {}, uid = '10001', run = null;
try { const s = JSON.parse(localStorage.getItem('veduo') || 'null'); if (s) uid = s.uid; } catch (e) {}

const $ = s => document.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const krHtml = s => esc(s).replace(/\[([^\]]+)\]/g, '<span class="tgt">$1</span>');
const plain = s => s.replace(/[[\]]/g, '');
const norm = w => String(w).toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9' -]/g, '').replace(/\s+/g, ' ').trim();
const tileText = w => /^I('|$)/.test(w) ? w : w.toLowerCase();
const shuffle = a => { const b = a.slice(); for (let n = 0; n < 30; n++) { for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } if (a.length < 2 || b.some((x, k) => x !== a[k])) break; } return b; };
const unit = () => byId[uid];
function say(text) { try { const v = new SpeechSynthesisUtterance(plain(text)); v.lang = 'en-US'; v.rate = .9; speechSynthesis.cancel(); speechSynthesis.speak(v); } catch (e) {} }
function greenRuns(ws) {
  const out = [];
  ws.forEach(([w, g]) => { if (g && out.length && out.at(-1).g) out.at(-1).w.push(w); else out.push({ g, w:[w] }); });
  return out.map(r => r.g ? `<span class="g">${esc(r.w.join(' '))}</span>` : esc(r.w.join(' '))).join(' ');
}
const brIdx = x => x.t.map((t, j) => t[1] ? j : -1).filter(j => j >= 0);
const sentHtml = x => greenRuns(x.t.map(t => [t[0], t[1]])) + esc(x.p);

/* 일치 규칙의 주어 — 의문문은 조동사 뒤(소유격이면 두 낱말: your kids), 평서문은 앞(I do like) */
const DET = new Set(['your', 'my', 'his', 'her', 'our', 'their', 'the']);
const subjectOf = (x, at) => at === 0 ? (DET.has(norm(x.t[1][0])) ? `${x.t[1][0]} ${x.t[2][0]}` : x.t[1][0]) : x.t[at - 1][0];
/* ALT — 뱅크에 [ ] 말고 하나 더 오는 낱말과, 그걸 놓았을 때 보여 줄 한 줄 */
function altOf(u, i) {
  const x = u.s[i], br = brIdx(x), has = w => br.some(j => norm(x.t[j][0]) === norm(w));
  if (u.kind === 'form' && !NO_BASE.has(u.id)) {
    const v = u.plan && u.plan.info && u.plan.info[i];
    if (v && !v.peri && !/\s/.test(v.base) && norm(v.base) !== norm(v.w) && !has(v.base))
      return { w:v.base, why:norm(v.wrong || '') === norm(v.base) && v.why ? `${v.base} — ${v.why}` : `${v.base} 말고 ${v.w} 꼴이 와요` };
  }
  if (u.kind === 'agree') {
    const opts = (u.plan.decide && u.plan.decide.opts) || [];
    const at = br.find(j => opts.some(o => norm(o) === norm(x.t[j][0])));
    if (at !== undefined) { const o = opts.find(o => norm(o) !== norm(x.t[at][0]));
      if (o) return { w:o, why:`주어 ${subjectOf(x, at)} 에는 ${o.toLowerCase()} 말고 ${x.t[at][0].toLowerCase()}` }; }
  }
  const list = CHOICE[u.id];
  if (list) {
    const at = br.find(j => list.some(o => norm(o) === norm(x.t[j][0])));
    if (at !== undefined) {
      const mine = norm(x.t[at][0]);
      /* 다른 쪽은 이 유닛 문장에 실제로 나온 것 먼저 — 그 문장의 한국어 초록이 곧 '그건 이런 뜻' 설명이 된다 */
      const seen = u.s.map(y => ({ y, j:brIdx(y).find(j => list.some(o => norm(o) === norm(y.t[j][0])) && norm(y.t[j][0]) !== mine) })).filter(z => z.j !== undefined);
      const o = seen.length ? seen[0].y.t[seen[0].j][0] : list.find(o => norm(o) !== mine);
      const kr = seen.length ? seen[0].y.kr.replace(/\[([^\]]+)\]/g, '‘$1’') : '';
      return { w:o, why:kr ? `${o.toLowerCase()}: ${kr}` : `여기선 ${o.toLowerCase()} 말고 ${x.t[at][0].toLowerCase()}` };
    }
  }
  return null;
}

/* 문장 고르기 — S1 은 1단계 예시. 독립 문장(주어 변형이 아닌 것)을 2·3단계에 나눠 쓰고, 마지막 독립 문장은 3단계 몫으로 남긴다.
   다시 풀기는 남은 독립 문장 → 없으면 주어 변형(같은 결정을 한 번 더) */
function pick(stage) {
  const u = unit(), all = u.s.map((_, i) => i).filter(i => i > 0 && brIdx(u.s[i]).length);
  const ind = all.filter(i => !u.s[i].tag.startsWith('문장1-')), vari = all.filter(i => u.s[i].tag.startsWith('문장1-'));
  const free = a => a.filter(i => !run.used.has(i));
  const reserve = ind.at(-1), s1br = norm(brIdx(u.s[0]).map(j => u.s[0].t[j][0]).join(' '));
  if (stage === '2-1' || stage === '2-2') {
    const c = free(ind).filter(i => i !== reserve);
    const diff = c.filter(i => norm(brIdx(u.s[i]).map(j => u.s[i].t[j][0]).join(' ')) !== s1br);
    const pool = [...diff, ...c, ...free(vari), ...free(ind)];
    return pool.find(i => altOf(u, i)) ?? pool[0] ?? all[0];
  }
  if (stage === '3-1') return run.used.has(reserve) ? (free(ind)[0] ?? free(vari)[0] ?? all[0]) : reserve;
  if (stage === '3-2') return free(ind)[0] ?? free(vari)[0] ?? all.find(i => i !== run.lastArrange) ?? all[0];
  if (stage === '4-1') return run.lastArrange ?? all[0];
  return free(ind)[0] ?? free(vari)[0] ?? all.find(i => i !== run.lastBlank) ?? all[0];
}

function header() {
  const name = u => { const f = u.form.replace(/\s+/g, ' '); return f.length > 20 ? f.slice(0, 19) + '…' : f; };
  const chips = FEATURED.filter(id => byId[id]).map(id => `<button class="unit${id === uid ? ' on' : ''}" data-id="${id}">${esc(name(byId[id]))}</button>`);
  if (!FEATURED.includes(uid)) chips.push(`<button class="unit on" data-id="${uid}">${esc(name(unit()))}</button>`);
  chips.push(`<button class="unit rand" id="rand">다른 유닛 ↻</button>`);
  $('#units').innerHTML = chips.join('');
  $$('.unit[data-id]').forEach(b => b.onclick = () => open(b.dataset.id));
  $('#rand').onclick = () => { const pool = U.filter(x => x.id !== uid); open(pool[Math.floor(Math.random() * pool.length)].id); };
}
function drawTable() {
  const marks = {}; run && run.log.forEach(l => marks[l.stage] = l.ok ? '<span class="mk o">O</span>' : '<span class="mk x">X</span>');
  const u = unit(), alt = u && u.s.some((_, i) => altOf(u, i));
  $('#tblBody').innerHTML = `<table class="st"><tr><th>단계</th><th>퀴즈</th><th>문장</th><th>다 맞힘</th><th>틀림</th><th></th></tr>`
    + ORDER.map(id => { const s = STAGES[id], d = id.charAt(0);
      const which = id.endsWith('-2') ? '다른 문장' : d === '1' ? 'S1' : d === '2' ? '새 문장 (예시 S1)' : d === '3' ? '새 문장' : '3단계와 같은 문장';
      return `<tr class="${run && run.phase === 'quiz' && run.stage === id ? 'cur' : ''}"><td>${id} <span class="tg ${s.tag}">${s.tag === 'b' ? '기초' : '실전'}</span></td><td>${s.name}</td><td style="color:#8a98ad">${which}</td><td>${s.pass || '완료'}</td><td>${s.fail || '완료'}</td><td>${marks[id] || ''}</td></tr>`; }).join('')
    + `</table><div class="rules"><b>다루는 부분은 언제나 [ ]</b> — 찾고 · 놓고 · 문장째 만들고 · 쓴다.<br>`
    + `<b>뱅크</b> 패턴형은 [ ] 낱말 그대로. 형태 규칙은 + 원형 하나, 일치 규칙은 + 다른 꼴 하나, 뜻으로 고르는 목록은 + 같은 유닛의 다른 쪽 하나 — 이 유닛: ${alt ? '<b>하나 더 있음</b>' : '없음'}.<br>`
    + `<b>규칙</b> 다 맞히면 다음 단계, 틀리면 같은 퀴즈를 다른 문장으로 한 번 더, 그다음은 결과와 상관없이 다음 단계.<br>`
    + Object.entries(NOTE).map(([k, v]) => `<b>${k}단계</b> ${v}`).join('<br>') + `<br><b>완료</b> 틀린 것과 설명이 있을 때만</div>`;
}
function drawBar() {
  const n = !run ? 0 : run.phase === 'done' ? 4 : +run.stage.charAt(0) - 1;
  $('#barI').style.width = `${n / 4 * 100}%`;
  $('#barN').textContent = run && run.phase === 'quiz' ? `${run.stage.charAt(0)} / 4` : run && run.phase === 'done' ? '완료' : '';
}
function refresh() { header(); drawTable(); drawBar(); }
function open(id) {
  uid = id; try { localStorage.setItem('veduo', JSON.stringify({ uid })); } catch (e) {}
  run = { stage:null, used:new Set([0]), log:[], miss:[], lastArrange:null, lastBlank:null, phase:'quiz' };
  goStage('1-1');
}
function goStage(id) {
  if (!id) return finish();
  run.stage = id; refresh();
  const s = STAGES[id];
  const i = s.kind === 'find' ? 0 : pick(id);
  run.used.add(i);
  if (s.kind === 'arrange') run.lastArrange = i;
  if (s.kind === 'blank') run.lastBlank = i;
  ({ find:quizFind, same:quizSame, arrange:quizArrange, blank:quizBlank })[s.kind](s, i);
}
function shell(s, body) {
  const u = unit();
  $('#stage').innerHTML = `<div class="card"><div class="tag ${s.tag}">${s.tag === 'b' ? '기초' : '실전'}</div>
    <div class="stage">${run.stage} · ${s.name}</div>${s.ask ? `<div class="ask">${s.ask}</div>` : ''}${body}<div id="res"></div><div id="bb"></div>
    <div class="src">유닛 ${esc(u.id)} · ${esc(u.form)}</div></div>`;
}
function report(ok, i, given, why = '') {
  const s = STAGES[run.stage], u = unit(), x = u.s[i];
  run.log.push({ stage:run.stage, ok });
  if (!ok && given !== null) run.miss.push({ stage:run.stage, i, given, why });
  const next = ok ? s.pass : s.fail;
  $('#res').innerHTML = `<div class="res ${ok ? 'ok' : 'no'}"><div class="h">${ok ? '정답!' : '아쉬워요'}</div><div class="a">${sentHtml(x)}</div>${!ok && why ? `<div class="why">${esc(why)}</div>` : ''}</div>`;
  $('#bb').innerHTML = `<button class="btn" id="nx">${next ? '다음' : '완료'}</button>`;
  $('#nx').onclick = () => goStage(next);
  drawTable();
}

/* 1 찾기 — 한국어 초록에 해당하는 영어를 짚는다. 같은 낱말이 [ ] 밖에도 있으면 어느 쪽을 짚어도 [ ] 쪽으로 친다 */
function quizFind(s, i) {
  const u = unit(), x = u.s[i], br = brIdx(x);
  shell(s, `<div class="kr">${krHtml(x.kr)}</div><div class="wline" id="wl">${x.t.map((t, j) => /[A-Za-z0-9]/.test(t[0]) ? `<button class="wk" data-j="${j}">${esc(t[0])}</button>` : `<span class="wk plain">${esc(t[0])}</span>`).join(' ')}<span class="punct">${esc(x.p)}</span></div>
    <div id="nt"></div><button class="lad" id="lad">정답 보기</button>`);
  const got = new Set(); let wrong = 0, fin = false;
  const done = shown => { fin = true; $('#lad').remove(); $$('#wl .wk[data-j]').forEach(b => { b.classList.toggle('ok', br.includes(+b.dataset.j)); b.classList.remove('miss'); });
    $('#nt').innerHTML = ''; say(x.en); report(!wrong && !shown, i, null); };
  $$('#wl .wk[data-j]').forEach(b => b.onclick = () => {
    if (fin) return; const j = +b.dataset.j;
    const hit = br.includes(j) ? j : br.find(k => !got.has(k) && norm(x.t[k][0]) === norm(x.t[j][0]));
    if (hit === undefined) { wrong++; b.classList.add('miss'); $('#nt').innerHTML = `<div class="note">초록 뜻과 다른 말이에요</div>`; return; }
    got.add(hit); $(`#wl .wk[data-j="${hit}"]`).classList.add('ok');
    const left = br.length - got.size;
    $('#nt').innerHTML = left ? `<div class="note">${left}낱말 더 있어요</div>` : '';
    if (!left) done(false);
  });
  $('#lad').onclick = () => { wrong++; done(true); };
}

/* 2 같은 패턴으로 완성 — 위 예시(S1, [ ] 초록) · 아래 새 문장의 [ ] 자리가 빈칸. 뱅크 = [ ] 낱말 + ALT */
function quizSame(s, i) {
  const u = unit(), m = u.s[0], x = u.s[i], br = brIdx(x), alt = altOf(u, i);
  const tiles = shuffle([...br.map(j => x.t[j][0]), ...(alt ? [alt.w] : [])]);
  shell(s, `<div class="model"><div class="av">A</div><div class="bub"><div class="en"><button class="sp" id="sp">🔊</button>${sentHtml(m)}</div><div class="k">${esc(plain(m.kr))}</div></div></div>
    <div class="kr sm">${krHtml(x.kr)}</div>
    <div class="sline">${x.t.map((t, j) => br.includes(j) ? `<span class="slot" data-j="${j}"></span>` : esc(t[0])).join(' ')}${esc(x.p)}</div>
    <div class="bank" id="bank">${tiles.map((w, k) => `<button class="w" data-k="${k}">${esc(tileText(w))}</button>`).join('')}</div>`);
  $('#sp').onclick = () => say(m.en); say(m.en);
  const put = {}; let fin = false;
  $('#bb').innerHTML = `<button class="btn" id="ok" disabled>확인</button>`;
  const draw = () => {
    $$('.sline .slot').forEach(e => { const k = put[e.dataset.j]; e.textContent = k === undefined ? '' : tileText(tiles[k]); e.classList.toggle('on', k !== undefined); });
    $$('#bank .w').forEach(b => b.classList.toggle('used', Object.values(put).includes(+b.dataset.k)));
    $('#ok').disabled = br.some(j => put[j] === undefined);
  };
  $$('#bank .w').forEach(b => b.onclick = () => { if (fin) return; const j = br.find(j => put[j] === undefined); if (j === undefined) return; put[j] = +b.dataset.k; draw(); });
  $$('.sline .slot').forEach(e => e.onclick = () => { if (fin) return; delete put[e.dataset.j]; draw(); });
  $('#ok').onclick = () => {
    fin = true;
    const ok = br.every(j => norm(tiles[put[j]]) === norm(x.t[j][0]));
    $$('.sline .slot').forEach(e => e.classList.add(norm(tiles[put[e.dataset.j]]) === norm(x.t[e.dataset.j][0]) ? 'ok' : 'bad'));
    $('#bank').style.display = 'none';
    const usedAlt = alt && br.some(j => norm(tiles[put[j]]) === norm(alt.w) && norm(x.t[j][0]) !== norm(alt.w));
    report(ok, i, x.t.map((t, j) => br.includes(j) ? tiles[put[j]] : t[0]).join(' ') + x.p, usedAlt ? alt.why : '');
  };
  draw();
}

/* 3 문장 만들기 — 한국어만 보고 통째로. 초록 없음, 뱅크에 ALT */
function quizArrange(s, i) {
  const u = unit(), x = u.s[i], alt = altOf(u, i);
  shell(s, `<div class="kr">${krHtml(x.kr)}</div><div class="fill" id="fill"></div><div class="bank" id="bank"></div>`);
  const items = [...x.t.map(t => t[0]), ...(alt ? [alt.w] : [])];
  const order = shuffle(items.map((_, k) => k)), placed = [];
  let fin = false;
  $('#bank').innerHTML = order.map(k => `<button class="w" data-k="${k}">${esc(tileText(items[k]))}</button>`).join('');
  $('#bb').innerHTML = `<button class="btn" id="ok" disabled>확인</button>`;
  const draw = () => {
    $('#fill').innerHTML = placed.map((k, j) => `<button class="w" data-j="${j}">${esc(tileText(items[k]))}</button>`).join('') + (placed.length === x.t.length && x.p ? `<span class="punct">${esc(x.p)}</span>` : '');
    $$('#bank .w').forEach(b => b.classList.toggle('used', placed.includes(+b.dataset.k)));
    $$('#fill .w').forEach(b => b.onclick = () => { if (fin) return; placed.splice(+b.dataset.j, 1); draw(); });
    $('#ok').disabled = placed.length !== x.t.length;
  };
  $$('#bank .w').forEach(b => b.onclick = () => { if (fin || placed.length >= x.t.length) return; placed.push(+b.dataset.k); draw(); });
  $('#ok').onclick = () => {
    fin = true;
    const ok = placed.every((k, j) => norm(items[k]) === norm(x.t[j][0]));
    $$('#fill .w').forEach((b, j) => b.classList.add(norm(items[placed[j]]) === norm(x.t[j][0]) ? 'g' : 'bad'));
    $('#bank').style.display = 'none';
    const usedAlt = alt && placed.some(k => k === items.length - 1);
    report(ok, i, placed.map(k => items[k]).join(' ') + x.p, usedAlt ? alt.why : '');
  };
  draw();
}

/* 4 빠진 부분 쓰기 — [ ] 가 빈칸. 이어진 낱말은 칸 하나, 막히면 첫 글자, 형태 규칙은 원형 */
function quizBlank(s, i) {
  const u = unit(), x = u.s[i], idx = brIdx(x), alt = altOf(u, i), hint = u.kind === 'form' && alt ? alt.w : '';
  const groups = []; idx.forEach(j => { if (groups.length && groups.at(-1).at(-1) === j - 1) groups.at(-1).push(j); else groups.push([j]); });
  const ans = groups.map(g => g.map(j => x.t[j][0]).join(' '));
  const mask = w => w.split(' ').map(p => p.replace(/[A-Za-z0-9]/g, '_')).join('  ');
  let html = '', j = 0;
  while (j < x.t.length) { const gi = groups.findIndex(g => g[0] === j);
    if (gi >= 0) { html += `<input class="inp" data-g="${gi}" size="${ans[gi].length + 2}" placeholder="${esc(mask(ans[gi]))}" autocomplete="off" autocapitalize="off" spellcheck="false">` + (hint && groups[gi].includes(u.plan.info[i].ti) ? `<span class="base">(${esc(hint)})</span>` : '') + ' '; j = groups[gi].at(-1) + 1; }
    else { html += esc(x.t[j][0]) + ' '; j++; } }
  shell(s, `<div class="kr">${krHtml(x.kr)}</div><div class="sent">${html.trim()}${esc(x.p)}</div><button class="lad" id="hint">첫 글자 보기</button>`);
  $('#bb').innerHTML = `<button class="btn" id="ok" disabled>확인</button>`;
  const ins = $$('.sent .inp');
  ins.forEach(e => { e.oninput = () => { $('#ok').disabled = ins.some(f => !f.value.trim()); }; e.onkeydown = ev => { if (ev.key === 'Enter' && !$('#ok').disabled) $('#ok').click(); }; });
  $('#hint').onclick = () => { ins.forEach(e => { e.placeholder = ans[+e.dataset.g].split(' ').map(w => w[0] + w.slice(1).replace(/[A-Za-z0-9]/g, '_')).join('  '); }); $('#hint').remove(); };
  ins[0].focus();
  $('#ok').onclick = () => {
    const vals = ins.map(e => e.value.trim()), ok = ins.every(e => norm(e.value) === norm(ans[+e.dataset.g]));
    if ($('#hint')) $('#hint').remove();
    ins.forEach(e => e.readOnly = true);
    const given = [];
    for (let n = 0; n < x.t.length; n++) { const gi = groups.findIndex(g => g[0] === n); if (gi >= 0) { given.push(vals[gi]); n = groups[gi].at(-1); } else given.push(x.t[n][0]); }
    report(ok, i, given.join(' ') + x.p);
  };
}

function finish() {
  run.phase = 'done'; run.stage = null; refresh();
  const u = unit();
  const miss = run.miss.map(m => `<div class="miss"><div class="no">${esc(m.given)}</div><div class="yes">→ ${sentHtml(u.s[m.i])}<span class="st2">${m.stage} ${STAGES[m.stage].name}</span></div>${m.why ? `<div style="font-size:13px;color:#8a5a2e">${esc(m.why)}</div>` : ''}</div>`).join('');
  const body = (miss ? `<div class="sec"><div class="t">틀렸던 곳</div>${miss}</div>` : '') + (u.desc ? `<div class="sec"><div class="t">알아 두기</div><div class="d">${esc(u.desc)}</div></div>` : '');
  $('#stage').innerHTML = `<div class="card"><div class="intro"><div class="stage">유닛 완료</div><div class="f">${esc(u.form)}</div><div class="m">${esc(u.mean)}</div>${body}</div>
    <button class="btn" id="nxu">다음 유닛</button><button class="btn" id="again" style="background:#fff;color:#6b7c93;box-shadow:0 1px 4px rgba(30,60,110,.12);margin-top:8px">다시</button></div>`;
  $('#again').onclick = () => open(uid);
  $('#nxu').onclick = () => $('#rand').click();
}

fetch('units/flow-units.gen.json').then(r => r.json()).then(d => {
  U = d.units.filter(u => brIdx(u.s[0]).length && u.s.some((x, i) => i > 0 && brIdx(x).length)); U.forEach(u => byId[u.id] = u);
  if (!byId[uid]) uid = FEATURED[0];
  const q = $('#q');
  q.onkeydown = e => {
    if (e.key !== 'Enter') return;
    const v = q.value.trim().toLowerCase(); if (!v) return;
    const hit = U.find(x => x.id.toLowerCase() === v) || U.find(x => x.form.toLowerCase().includes(v) || x.mean.includes(v));
    if (hit) { open(hit.id); q.value = ''; q.blur(); } else { q.value = ''; q.placeholder = `"${v}" 에 맞는 유닛이 없어요`; }
  };
  open(uid);
}).catch(e => { $('#stage').innerHTML = `<div class="card">문장을 불러오지 못했어요. (${esc(e.message)})</div>`; });
</script>
</body>
</html>
