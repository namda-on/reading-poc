<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>리스닝 핑퐁 프로토타입</title>
<style>
  :root { --bg:#a9ccf2; --card:#fff; --ink:#1f2937; --sub:#6b7c93; --blue:#4b83d6; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--ink); display:flex; justify-content:center; }
  .app { width:100%; max-width:460px; height:100dvh; min-height:100vh; display:flex; flex-direction:column; }

  .topbar { display:flex; align-items:center; gap:12px; padding:14px 14px; flex-shrink:0; }
  .icon-btn { width:34px; height:34px; border:none; background:transparent; color:#fff; font-size:24px; cursor:pointer; border-radius:50%; }
  .progress { flex:1; }
  .bar-count { font-size:12px; font-weight:700; color:rgba(255,255,255,.9); }
  .bar-track { height:10px; border-radius:6px; background:rgba(255,255,255,.35); overflow:hidden; margin-top:2px; }
  .bar-fill { height:100%; background:#6f9bd6; width:0; transition:width .4s ease; }

  .home { flex:1; padding:24px 18px; overflow-y:auto; }
  .home h1 { font-size:24px; margin:8px 0 4px; color:#25406a; }
  .home p.sub { color:#3a567d; margin:0 0 20px; font-size:14px; }
  .dlg-card { display:block; width:100%; text-align:left; background:var(--card); border:none; border-radius:16px;
    padding:16px 18px; margin-bottom:12px; cursor:pointer; box-shadow:0 3px 12px rgba(30,60,110,.12); }
  .dlg-card .t { font-size:17px; font-weight:800; color:#2f3e52; }
  .dlg-card .f { font-size:12px; color:var(--sub); margin-top:4px; }
  .home .note { font-size:12px; color:#3a567d; opacity:.85; margin-top:16px; line-height:1.6; }

  /* 채팅 — reading-poc 리스닝 모드와 동일한 연출. 내부에서만 스크롤(문제 패널은 하단 고정) */
  .chat { flex:1; min-height:0; padding:10px 14px 16px; overflow-y:auto; }
  .msg { display:flex; align-items:flex-start; gap:10px; margin:14px 0; animation:pop .25s ease; }
  @keyframes pop { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:none;} }
  .avatar-col { display:flex; flex-direction:column; align-items:center; gap:4px; flex-shrink:0; width:52px; }
  .avatar { width:48px; height:48px; border-radius:50%; background:#fff; display:flex; align-items:center;
    justify-content:center; font-size:26px; box-shadow:0 2px 6px rgba(30,60,110,.15); }
  .avatar-name { font-size:12px; font-weight:700; color:#45566b; text-align:center; line-height:1.2; }
  .bubble { position:relative; max-width:100%; padding:13px 16px; border-radius:16px; background:#fff;
    box-shadow:0 2px 8px rgba(30,60,110,.12); }
  .hidden-bubble { min-width:72px; min-height:22px; display:flex; align-items:center; justify-content:center; }
  .hidden-bubble .wave { display:none; }
  .hidden-bubble:not(.playing) { opacity:.5; }
  .hidden-bubble.playing .wave { display:inline-flex; gap:4px; align-items:center; height:20px; }
  .hidden-bubble.playing .wave i { width:4px; height:8px; border-radius:2px; background:#4b83d6; animation:wave .9s ease-in-out infinite; }
  .hidden-bubble.playing .wave i:nth-child(2){animation-delay:.15s;} .hidden-bubble.playing .wave i:nth-child(3){animation-delay:.3s;}
  @keyframes wave { 0%,100%{height:8px;} 50%{height:18px;} }

  /* 배운 표현: 해당 줄이 재생될 때 그 말풍선 아래에 붙어 뜬다 */
  .learn-chip { margin:-6px 0 14px 62px; background:#fff6dc; border:1px solid #f2e2a8; border-radius:12px;
    padding:8px 12px; font-size:13px; color:#6b5410; line-height:1.45; animation:chipin .3s ease; max-width:calc(100% - 62px); }
  @keyframes chipin { from{opacity:0;transform:translateX(-6px);} to{opacity:1;transform:none;} }
  .learn-chip b { color:#8a6d15; }
  .learn-chip .k { display:inline-block; background:#f0b429; color:#fff; font-size:11px; font-weight:800; border-radius:999px; padding:1px 8px; margin-right:6px; }

  .quiz { flex-shrink:0; max-height:60vh; overflow-y:auto; background:#eef4fb; border-top:1px solid #d3e0f1; padding:14px 14px 20px; }
  .quiz-q { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .quiz-q span { font-size:15px; font-weight:800; color:#25406a; }
  .replay { border:none; background:#6b5bd6; color:#fff; border-radius:999px; padding:7px 14px; font-size:13px; font-weight:700; cursor:pointer; }
  .opt { display:block; width:100%; text-align:left; background:#fff; border:1.5px solid #d3e0f1; border-radius:12px;
    padding:13px 15px; margin:8px 0; font-size:15.5px; color:#2f3e52; cursor:pointer; }
  .opt .why { display:none; margin-top:8px; font-size:13px; line-height:1.45; color:#5b6b80; border-top:1px dashed #d3e0f1; padding-top:7px; }
  .opt.show-why .why { display:block; }
  .opt.answered { cursor:pointer; }
  .opt.correct { background:#ddf3e2; border-color:#46b366; }
  .opt.correct .why { color:#2e6b45; }
  .opt.wrong { background:#fbe1e1; border-color:#e5645a; }
  .opt.wrong .why { color:#a33; }
  .opt .tag { font-weight:800; margin-right:6px; }
  .learned-box { background:#fff6dc; border:1px solid #f2e2a8; border-radius:12px; padding:10px 13px; margin:8px 0 4px; font-size:13.5px; color:#6b5410; line-height:1.5; }
  .learned-box .k { display:inline-block; background:#f0b429; color:#fff; font-size:11px; font-weight:800; border-radius:999px; padding:1px 8px; margin-right:6px; }
  .learned-box b { color:#8a6d15; }
  .next-btn { width:100%; border:none; border-radius:14px; padding:13px; background:var(--blue); color:#fff; font-size:16px; font-weight:800; cursor:pointer; margin-top:8px; }
  .hint-tap { font-size:12px; color:var(--sub); text-align:center; margin-top:6px; }

  .done { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:30px 22px; text-align:center; overflow-y:auto; }
  .done .emoji { font-size:52px; }
  .done h2 { color:#25406a; margin:0; }
  .done p { color:#3a567d; margin:0; }
  .learned-list { width:100%; background:#fff6dc; border:1px solid #f2e2a8; border-radius:14px; padding:12px 14px; text-align:left; }
  .learned-list .h { font-size:13px; font-weight:800; color:#8a6d15; margin-bottom:6px; }
  .learned-list .it { font-size:14px; color:#6b5410; margin:5px 0; line-height:1.4; }
  .learned-list .it b { color:#7a5f12; }
  .btn { border:none; border-radius:26px; padding:14px 30px; background:var(--blue); color:#fff; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 4px 14px rgba(30,60,110,.25); }
  .btn.ghost { background:#fff; color:#45566b; }
  .row { display:flex; gap:10px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar hidden" id="topbar">
    <button class="icon-btn" id="backBtn" aria-label="뒤로">‹</button>
    <div class="progress"><div class="bar-count" id="barCount">0/3</div><div class="bar-track"><div class="bar-fill" id="barFill"></div></div></div>
  </div>

  <div class="home" id="home">
    <h1>리스닝 핑퐁</h1>
    <p class="sub">대화를 <b>듣고</b>, B가 할 말을 골라 대화를 완성하세요.</p>
    <div id="dlgList"></div>
    <p class="note">🎧 소리를 켜 주세요. 대화는 <b>텍스트 없이 음성만</b> 나옵니다 — 들어야 풀 수 있어요.<br>💡 배운 표현이 대화나 정답에 나오면 자동으로 짚어드려요.</p>
  </div>

  <div class="chat hidden" id="chat"></div>

  <div class="quiz hidden" id="quiz">
    <div class="quiz-q"><span>B가 할 말로 알맞은 것은?</span><button class="replay" id="replayBtn">🔊 다시 듣기</button></div>
    <div id="opts"></div>
    <div id="quizAfter"></div>
  </div>

  <div class="done hidden" id="done">
    <div class="emoji">🎉</div>
    <h2>대화 완료!</h2>
    <p id="doneScore"></p>
    <div class="learned-list hidden" id="learnedList"></div>
    <div class="row">
      <button class="btn ghost" id="doneList">목록으로</button>
      <button class="btn" id="doneRetry">다시 듣기</button>
    </div>
  </div>
</div>

<script>
// ── 콘텐츠 — learned 는 실제 표현 뱅크(ExpressionUnitKR) 패턴(t/tr) ────────────
const DIALOGUES = [
  {
    title: "Bloom Café", focus: "카페에서 주문하기",
    turns: [
      { s:'A', text:"Hi! Welcome to Bloom Café. What can I get for you?" },
      { s:'B', text:"Hi! I'll have a latte, please.", learned:{ name:"I'll have ~.", note:"~로 주세요." } },
      { s:'A', text:"Sure. We're actually out of oat milk today — is regular milk okay?" },
      { s:'B', quiz:true, options:[
        { text:"Hmm, can I get it with soy milk instead?", correct:true, why:"오트밀크가 품절이라, 두유(soy)로 바꿔 달라고 자연스럽게 요청했어요.",
          learned:{ name:"Can I get it with ~?", note:"~랑 같이 주실 수 있나요?" } },
        { text:"Great, oat milk it is!", why:"A가 방금 오트밀크가 <b>품절</b>이라고 했어요. 들었다면 고를 수 없죠." },
        { text:"No thanks, I'll pay in cash.", why:"문법은 맞지만 우유 얘기 중인데 결제 얘기는 아직 맥락이 아니에요." },
        { text:"Do you have any puppies?", why:"카페 주문과 전혀 상관없는 엉뚱한 질문이에요." },
      ]},
      { s:'A', text:"Of course, soy is no problem. Would you like a pastry with that?" },
      { s:'B', quiz:true, options:[
        { text:"Maybe — what do you recommend?", correct:true, why:"먹을 것을 물어봐서, 추천을 되물으며 자연스럽게 대화를 이어갔어요.",
          learned:{ name:"What do you recommend?", note:"무엇을 추천하시나요?" } },
        { text:"Yes, another latte, please.", why:"A는 <b>먹을 것(pastry)</b>을 물었는데 음료 얘기를 했어요." },
        { text:"I'd like to cancel, please.", why:"취소할 상황이 아니에요. 맥락에 안 맞아요." },
        { text:"No, I've already climbed Everest.", why:"대화와 상관없는 엉뚱한 답이에요." },
      ]},
      { s:'A', text:"The almond croissant is a favorite. Is that for here or to go?" },
      { s:'B', quiz:true, options:[
        { text:"Sounds good — to go, please.", correct:true, why:"‘여기서/포장’을 물었고, 포장(to go)을 골랐어요.",
          learned:{ name:"To go.", note:"가져갈게요." } },
        { text:"It was delicious, thank you!", why:"아직 받지도 않았어요. 시점이 안 맞아요." },
        { text:"Sure, two sugars please.", why:"여기/포장을 물었는데 설탕 얘기예요." },
        { text:"I'll return it tomorrow.", why:"무엇을 반납한다는 건지 맥락이 없어요(유머)." },
      ]},
    ],
  },
  {
    title: "Lost near the station", focus: "길 묻고 교통편 확인하기",
    turns: [
      { s:'A', text:"You look a little lost — can I help you find something?" },
      { s:'B', text:"Oh, thanks! How do I get to the train station?", learned:{ name:"How do I get ~?", note:"~에 어떻게 가나요?" } },
      { s:'A', text:"Sure. Go straight two blocks and turn left at the bakery." },
      { s:'B', quiz:true, options:[
        { text:"Got it. How long does it take to get there?", correct:true, why:"길 안내를 이해한 뒤, 소요 시간을 물으며 대화를 이어갔어요.",
          learned:{ name:"How long does it take to get to ~?", note:"~까지 얼마나 걸리나요?" } },
        { text:"Turn right at the bakery, thanks!", why:"A는 <b>왼쪽(left)</b>이라고 했어요. 오른쪽이 아니에요." },
        { text:"So the station is closed today?", why:"문 닫았다는 얘기는 나온 적이 없어요." },
        { text:"Great, I'll buy ten cakes!", why:"빵집이 나왔다고 케이크 열 개는 엉뚱하죠(유머)." },
      ]},
      { s:'A', text:"About ten minutes on foot. Are you in a hurry?" },
      { s:'B', quiz:true, options:[
        { text:"A little — when's the next train?", correct:true, why:"급하냐는 물음에 답하며, 다음 기차 시간을 물었어요.",
          learned:{ name:"When's the next train?", note:"다음 기차가 언제인가요?" } },
        { text:"Yes, five blocks that way.", why:"B는 길을 <b>묻는</b> 쪽이에요. 길안내를 하면 안 되죠." },
        { text:"No thanks, I'm not hungry.", why:"급한지 물었는데 배고픔 얘기는 엉뚱해요." },
        { text:"Sure, I'll race you there!", why:"대화와 무관한 유머예요." },
      ]},
      { s:'A', text:"There's one in fifteen minutes. You can buy tickets inside." },
      { s:'B', quiz:true, options:[
        { text:"Perfect. Where's the ticket machine?", correct:true, why:"안에서 표를 살 수 있다는 안내를 듣고, 매표기 위치를 물었어요.",
          learned:{ name:"Where's ~?", note:"~은 어디인가요?" } },
        { text:"Okay, I'll just take a taxi.", why:"방금 시간 충분하고 안에서 표를 살 수 있다고 했는데 택시는 모순이에요." },
        { text:"Which way was the bakery again?", why:"목적지는 <b>역</b>인데 빵집을 다시 묻는 건 엉뚱해요." },
        { text:"Thanks, I'll return it tomorrow.", why:"무엇을 반납한다는 건지 맥락이 없어요(유머)." },
      ]},
    ],
  },
];

// ── 음성 (자연스러운 음성 우선) ─────────────────────────────────────────────
let voices=[], vA=null, vB=null;
function chooseVoices(){
  voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  const en = voices.filter(v=>/en(-|_)/i.test(v.lang));
  if(!en.length){ vA=vB=null; return; }
  const rank = v => (v.localService?0:4) + (/Google|Natural|Neural|Samantha|Daniel|Karen|Aaron|Zoe|Serena/i.test(v.name)?2:0) + (/en-US|en-GB/i.test(v.lang)?1:0);
  const sorted = en.slice().sort((a,b)=>rank(b)-rank(a));
  vA = sorted[0];
  vB = sorted.find(v=>v!==vA) || sorted[0];
}
if(window.speechSynthesis){ chooseVoices(); speechSynthesis.onvoiceschanged=chooseVoices; }
function speak(text, who){
  return new Promise(res=>{
    if(!window.speechSynthesis) return setTimeout(res,700);
    if(!vA) chooseVoices();
    try{ speechSynthesis.cancel(); }catch(e){}
    const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.9;
    const v = who==='B'?vB:vA; if(v) u.voice=v;
    u.pitch = (vA && vB && vA!==vB) ? 1.0 : (who==='B'?1.08:0.94); // 목소리가 하나뿐이면 피치로 구분
    let done=false; const fin=()=>{ if(!done){done=true;res();} };
    u.onend=fin; u.onerror=fin; speechSynthesis.speak(u);
    setTimeout(fin, Math.max(1900, text.length*95));
  });
}
function stopAudio(){ try{ speechSynthesis.cancel(); }catch(e){} }
const wait = ms => new Promise(r=>setTimeout(r,ms));

// ── 화면 ──────────────────────────────────────────────────────────────────
const el=id=>document.getElementById(id);
const home=el('home'), chat=el('chat'), quiz=el('quiz'), done=el('done'), topbar=el('topbar');
let current=null, lastA='', correctCount=0, learnedSeen=[], runId=0;
function show(...ids){ [home,chat,quiz,done,topbar].forEach(n=>n.classList.add('hidden')); ids.forEach(n=>n.classList.remove('hidden')); }
function noteLearned(x){ if(x && !learnedSeen.some(y=>y.name===x.name)) learnedSeen.push(x); }
function scrollToBottom(){ requestAnimationFrame(()=>{ chat.scrollTo({top:chat.scrollHeight, behavior:'smooth'}); }); }

function renderHome(){
  show(home); const list=el('dlgList'); list.innerHTML='';
  DIALOGUES.forEach((d,i)=>{ const b=document.createElement('button'); b.className='dlg-card';
    b.innerHTML=`<div class="t">${d.title}</div><div class="f">${d.focus}</div>`; b.onclick=()=>startDialogue(i); list.appendChild(b); });
}

function addBubble(who){
  const info = who==='B' ? {n:'B',a:'🐰'} : {n:'A',a:'🐻'};
  const m=document.createElement('div'); m.className='msg';
  m.innerHTML=`<div class="avatar-col"><div class="avatar">${info.a}</div><div class="avatar-name">${info.n}</div></div>
    <div class="bubble hidden-bubble"><span class="wave"><i></i><i></i><i></i></span></div>`;
  chat.appendChild(m); scrollToBottom();
  return m.querySelector('.bubble');
}
function addLearnChip(x){
  const c=document.createElement('div'); c.className='learn-chip';
  c.innerHTML=`<span class="k">배운 표현</span><b>${x.name}</b> — ${x.note}`;
  chat.appendChild(c); scrollToBottom();
}

function correctOpt(turn){ return turn.options.find(o=>o.correct); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function setProgress(n){ const t=current.turns.filter(x=>x.quiz).length; el('barCount').textContent=`${n}/${t}`; el('barFill').style.width=`${Math.round(n/t*100)}%`; }

async function startDialogue(i){
  const myRun=++runId; stopAudio();
  current=DIALOGUES[i]; correctCount=0; learnedSeen=[]; chat.innerHTML=''; show(topbar,chat); setProgress(0);
  let quizDone=0;
  for(const turn of current.turns){
    if(myRun!==runId) return; // 화면을 벗어나면 중단
    if(!turn.quiz){
      const bub=addBubble(turn.s); if(turn.s==='A') lastA=turn.text;
      if(turn.learned){ noteLearned(turn.learned); addLearnChip(turn.learned); } // 재생되는 순간 표현 배너
      bub.classList.add('playing'); await speak(turn.text, turn.s);
      if(myRun!==runId) return;
      bub.classList.remove('playing');
      await wait(250);
    } else {
      show(topbar,chat,quiz); scrollToBottom();
      const gotCorrect=await askQuiz(turn, myRun);
      if(myRun!==runId) return;
      if(gotCorrect) correctCount++;
      quiz.classList.add('hidden'); el('quizAfter').innerHTML='';
      const co=correctOpt(turn);
      const bub=addBubble('B');
      bub.classList.add('playing'); await speak(co.text,'B');
      if(myRun!==runId) return;
      bub.classList.remove('playing');
      if(co.learned) noteLearned(co.learned); // 정답 표현은 문제 결과 박스에서 이미 안내됨
      quizDone++; setProgress(quizDone); await wait(300);
    }
  }
  if(myRun!==runId) return;
  showDone();
}

function askQuiz(turn, myRun){
  return new Promise(resolve=>{
    const box=el('opts'); box.innerHTML=''; el('quizAfter').innerHTML='';
    const opts=shuffle(turn.options); let answered=false;
    const tag = ok => ok?'<span class="tag" style="color:#2e9e57">✓ 정답</span>':'<span class="tag" style="color:#d1584e">✕</span>';
    opts.forEach(o=>{
      const b=document.createElement('button'); b.className='opt';
      b.innerHTML=`<div>${o.text}</div><div class="why"></div>`;
      b.onclick=()=>{
        if(!answered){
          answered=true;
          // 모든 선택지의 이유를 미리 채워, 나중에 탭하면 바로 보이게
          Array.from(box.children).forEach(c=>{ c.classList.add('answered');
            const opt=opts.find(x=>x.text===c.querySelector('div').textContent);
            c.querySelector('.why').innerHTML=tag(!!opt.correct)+opt.why; });
          if(o.correct) b.classList.add('correct'); else b.classList.add('wrong');
          const correctBtn=Array.from(box.children).find(c=>c.querySelector('div').textContent===correctOpt(turn).text);
          correctBtn.classList.add('correct');
          b.classList.add('show-why'); correctBtn.classList.add('show-why'); // 고른 것 + 정답 자동 공개
          const after=el('quizAfter'); const co=correctOpt(turn);
          if(co.learned){ const lb=document.createElement('div'); lb.className='learned-box';
            lb.innerHTML=`<span class="k">배운 표현</span>이 정답에 들어있어요 — <b>${co.learned.name}</b><br>${co.learned.note}`; after.appendChild(lb); }
          const tip=document.createElement('div'); tip.className='hint-tap'; tip.textContent='다른 선택지를 눌러 왜 아닌지 볼 수 있어요'; after.appendChild(tip);
          const nx=document.createElement('button'); nx.className='next-btn'; nx.textContent='다음 ▶'; nx.onclick=()=>{ if(myRun===runId) resolve(!!o.correct); }; after.appendChild(nx);
          quiz.scrollTo({top:quiz.scrollHeight, behavior:'smooth'});
        } else { b.classList.toggle('show-why'); } // 답한 뒤 탭하면 이유 토글(모두 채워져 있음)
      };
      box.appendChild(b);
    });
  });
}

function showDone(){
  show(topbar,done);
  const t=current.turns.filter(x=>x.quiz).length;
  el('doneScore').textContent=`${t}번 중 ${correctCount}번 한 번에 맞혔어요.`;
  const ll=el('learnedList');
  if(learnedSeen.length){ ll.classList.remove('hidden');
    ll.innerHTML='<div class="h">💡 이번 대화에 나온 배운 표현</div>'+learnedSeen.map(x=>`<div class="it"><b>${x.name}</b> — ${x.note}</div>`).join('');
  } else ll.classList.add('hidden');
}

function leave(){ runId++; stopAudio(); renderHome(); } // 나가면 음성·진행 중단
el('backBtn').onclick=leave;
el('doneList').onclick=leave;
el('doneRetry').onclick=()=>startDialogue(DIALOGUES.indexOf(current));
el('replayBtn').onclick=()=>{ if(lastA) speak(lastA,'A'); };
window.addEventListener('pagehide', stopAudio);
renderHome();
</script>
</body>
</html>
