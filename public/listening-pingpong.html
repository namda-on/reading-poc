<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>리스닝 핑퐁 프로토타입</title>
<style>
  :root { --bg:#a9ccf2; --card:#fff; --ink:#1f2937; --sub:#6b7c93; --blue:#4b83d6; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--ink);
    display:flex; justify-content:center;
  }
  .app { width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column; }

  /* 상단바 */
  .topbar { display:flex; align-items:center; gap:12px; padding:14px 14px; }
  .icon-btn { width:34px; height:34px; border:none; background:transparent; color:#fff; font-size:24px; cursor:pointer; border-radius:50%; }
  .progress { flex:1; }
  .bar-count { font-size:12px; font-weight:700; color:rgba(255,255,255,.9); }
  .bar-track { height:10px; border-radius:6px; background:rgba(255,255,255,.35); overflow:hidden; margin-top:2px; }
  .bar-fill { height:100%; background:#6f9bd6; width:0; transition:width .4s ease; }

  /* 시작 화면 */
  .home { flex:1; padding:24px 18px; }
  .home h1 { font-size:24px; margin:8px 0 4px; color:#25406a; }
  .home p.sub { color:#3a567d; margin:0 0 20px; font-size:14px; }
  .dlg-card { display:block; width:100%; text-align:left; background:var(--card); border:none; border-radius:16px;
    padding:16px 18px; margin-bottom:12px; cursor:pointer; box-shadow:0 3px 12px rgba(30,60,110,.12); }
  .dlg-card .t { font-size:17px; font-weight:800; color:#2f3e52; }
  .dlg-card .f { font-size:12px; color:var(--sub); margin-top:4px; }
  .home .note { font-size:12px; color:#3a567d; opacity:.8; margin-top:16px; line-height:1.5; }

  /* 채팅 */
  .chat { flex:1; padding:8px 14px 12px; overflow-y:auto; }
  .msg { display:flex; align-items:flex-start; gap:8px; margin:12px 0; animation:pop .25s ease; }
  .msg.b { flex-direction:row-reverse; }
  @keyframes pop { from { opacity:0; transform:translateY(6px);} to {opacity:1; transform:none;} }
  .avatar { width:42px; height:42px; border-radius:50%; background:#fff; display:flex; align-items:center;
    justify-content:center; font-size:22px; flex-shrink:0; box-shadow:0 2px 6px rgba(30,60,110,.15); }
  .bubble { max-width:74%; padding:11px 15px; border-radius:16px; background:#fff; font-size:16px; line-height:1.5;
    box-shadow:0 2px 8px rgba(30,60,110,.12); }
  .msg.b .bubble { background:#4b83d6; color:#fff; }
  .speaking { outline:2px solid rgba(75,131,214,.5); }

  /* 문제 패널 */
  .quiz { background:#eef4fb; border-top:1px solid #d3e0f1; padding:14px 14px 20px; }
  .quiz-q { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .quiz-q span { font-size:15px; font-weight:800; color:#25406a; }
  .replay { border:none; background:#6b5bd6; color:#fff; border-radius:999px; padding:7px 14px; font-size:13px;
    font-weight:700; cursor:pointer; }
  .opt { display:block; width:100%; text-align:left; background:#fff; border:1.5px solid #d3e0f1; border-radius:12px;
    padding:13px 15px; margin:8px 0; font-size:15.5px; color:#2f3e52; cursor:pointer; transition:transform .05s; }
  .opt:active { transform:scale(.99); }
  .opt.correct { background:#ddf3e2; border-color:#46b366; }
  .opt.wrong { background:#fbe1e1; border-color:#e5645a; }
  .opt:disabled { cursor:default; }

  /* 완료 */
  .done { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:30px; text-align:center; }
  .done .emoji { font-size:56px; }
  .done h2 { color:#25406a; margin:0; }
  .done p { color:#3a567d; margin:0; }
  .btn { border:none; border-radius:26px; padding:14px 34px; background:var(--blue); color:#fff; font-size:16px;
    font-weight:700; cursor:pointer; box-shadow:0 4px 14px rgba(30,60,110,.25); }
  .btn.ghost { background:#fff; color:#45566b; }
  .row { display:flex; gap:10px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="app">
  <!-- 상단바 -->
  <div class="topbar hidden" id="topbar">
    <button class="icon-btn" id="backBtn" aria-label="뒤로">‹</button>
    <div class="progress">
      <div class="bar-count" id="barCount">0/3</div>
      <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    </div>
  </div>

  <!-- 시작 화면 -->
  <div class="home" id="home">
    <h1>리스닝 핑퐁</h1>
    <p class="sub">대화를 들으며, B가 할 말을 골라 대화를 완성하세요.</p>
    <div id="dlgList"></div>
    <p class="note">🎧 소리를 켜 주세요. 선택지에는 한국어 번역이 없어요 — 들어야 풀 수 있습니다.</p>
  </div>

  <!-- 채팅 -->
  <div class="chat hidden" id="chat"></div>

  <!-- 문제 패널 -->
  <div class="quiz hidden" id="quiz">
    <div class="quiz-q">
      <span>B가 할 말로 알맞은 것은?</span>
      <button class="replay" id="replayBtn">🔊 다시 듣기</button>
    </div>
    <div id="opts"></div>
  </div>

  <!-- 완료 -->
  <div class="done hidden" id="done">
    <div class="emoji">🎉</div>
    <h2>대화 완료!</h2>
    <p id="doneScore"></p>
    <div class="row">
      <button class="btn ghost" id="doneList">목록으로</button>
      <button class="btn" id="doneRetry">다시 듣기</button>
    </div>
  </div>
</div>

<script>
// ── 콘텐츠 (저작) ────────────────────────────────────────────────
// 각 대화: 하나의 상황. A1·B1 은 들려주며 세팅, 이후 B 턴 3개를 퀴즈로.
// 오답: (1) 안 듣고 상황상식만으로 고르면 걸리는 함정, (2) 문법상 그럴듯하나 틀림, (3) 살짝 엉뚱/유머.
const DIALOGUES = [
  {
    title: "Bloom Café",
    focus: "주문·선택하기 — \"Would you prefer ~?\" / \"I'll go with ~\"",
    turns: [
      { s:'A', text:"Hi! Welcome to Bloom Café. Can I take your order?" },
      { s:'B', text:"Hi, yes — I'll have a latte, please." },
      { s:'A', text:"Sure! We just ran out of oat milk, though. Is regular milk okay, or would you prefer soy?" },
      { s:'B', quiz:true, options:[
        { text:"Soy would be great, thanks.", correct:true },
        { text:"Oat milk's perfect, thanks!" },      // 함정: 오트밀크는 품절이라고 말함
        { text:"Actually, I'd like a refund." },      // 그럴듯하나 맥락상 틀림
        { text:"Do you sell umbrellas here?" },        // 엉뚱
      ]},
      { s:'A', text:"Great. Would you like anything to eat with that?" },
      { s:'B', quiz:true, options:[
        { text:"Just the latte for now, thanks.", correct:true },
        { text:"Yes, make it a large latte." },        // 함정: 먹을 것(food)을 물었는데 음료 답
        { text:"Could I get that for here?" },          // 그럴듯하나 질문(음식)과 어긋남
        { text:"No, I've never been to Rome." },        // 엉뚱
      ]},
      { s:'A', text:"Perfect. That comes to $4.50. Is this for here or to go?" },
      { s:'B', quiz:true, options:[
        { text:"To go, please.", correct:true },
        { text:"It was delicious, thank you!" },        // 함정: 아직 마시지도 않음
        { text:"Sure, two sugars please." },            // 그럴듯하나 here/to-go 질문과 어긋남
        { text:"I'll pay with my library card." },       // 유머
      ]},
    ],
  },
  {
    title: "Lost near the station",
    focus: "길 묻기 — \"How do I get to ~?\" / 방향 듣기",
    turns: [
      { s:'A', text:"You look a little lost — can I help you find something?" },
      { s:'B', text:"Oh, thanks! How do I get to the train station?" },
      { s:'A', text:"Sure. Go straight two blocks, then turn left at the bakery. You can't miss it." },
      { s:'B', quiz:true, options:[
        { text:"Left at the bakery — got it, thanks!", correct:true },
        { text:"Right at the bakery, okay!" },          // 함정: A는 left 라고 했음
        { text:"So I take the elevator up?" },           // 그럴듯하나 언급 안 됨
        { text:"Great, I'll order a cake first." },       // 유머
      ]},
      { s:'A', text:"No problem. It's about a ten-minute walk. Are you catching a train soon?" },
      { s:'B', quiz:true, options:[
        { text:"Yeah, mine leaves in twenty minutes.", correct:true },
        { text:"It's five blocks that way." },           // 함정: 나는 물어보는 쪽인데 길안내 답
        { text:"No thanks, I already ate." },            // 엉뚱
        { text:"Sure, I'd love to walk your dog." },      // 유머
      ]},
      { s:'A', text:"You've got plenty of time, then. There's a ticket machine right by the entrance." },
      { s:'B', quiz:true, options:[
        { text:"Perfect — I'll grab my ticket there.", correct:true },
        { text:"Okay, I'll take a taxi instead." },      // 그럴듯하나 방금 시간 충분+매표기 안내와 모순
        { text:"Which way was the bakery again?" },      // 함정: 목적지는 역인데 엉뚱한 재질문
        { text:"Thanks, I'll return it tomorrow." },      // 유머
      ]},
    ],
  },
];

// ── 음성 (브라우저 TTS) ──────────────────────────────────────────
let voices = [];
function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(pref){
  const en = voices.filter(v => /en(-|_)/i.test(v.lang));
  if (!en.length) return null;
  for (const name of pref) { const v = en.find(x => x.name.includes(name)); if (v) return v; }
  return en[0];
}
function speak(text, who){
  return new Promise(res => {
    if (!window.speechSynthesis) return setTimeout(res, 700);
    try { speechSynthesis.cancel(); } catch(e){}
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.95;
    // A / B 목소리를 다르게
    const v = who==='B' ? pickVoice(['Daniel','Google US English','Male','Alex'])
                        : pickVoice(['Samantha','Google UK English Female','Female','Karen']);
    if (v) u.voice = v;
    u.pitch = who==='B' ? 1.06 : 0.94;
    let done=false; const finish=()=>{ if(!done){done=true; res();} };
    u.onend = finish; u.onerror = finish;
    speechSynthesis.speak(u);
    setTimeout(finish, Math.max(1800, text.length*90)); // 안전장치
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));

// ── DOM ──────────────────────────────────────────────────────────
const el = id => document.getElementById(id);
const home=el('home'), chat=el('chat'), quiz=el('quiz'), done=el('done'), topbar=el('topbar');
let current = null, lastA = '', correctCount = 0;

function show(...ids){ [home,chat,quiz,done,topbar].forEach(n=>n.classList.add('hidden')); ids.forEach(n=>n.classList.remove('hidden')); }

function renderHome(){
  show(home);
  const list = el('dlgList'); list.innerHTML='';
  DIALOGUES.forEach((d,i)=>{
    const b=document.createElement('button'); b.className='dlg-card';
    b.innerHTML = `<div class="t">${d.title}</div><div class="f">${d.focus}</div>`;
    b.onclick=()=>startDialogue(i);
    list.appendChild(b);
  });
}

function addBubble(who, text){
  const m=document.createElement('div'); m.className='msg '+(who==='B'?'b':'a');
  m.innerHTML = `<div class="avatar">${who==='B'?'🐰':'🐻'}</div><div class="bubble">${text}</div>`;
  chat.appendChild(m); chat.scrollTop=chat.scrollHeight;
  return m.querySelector('.bubble');
}

function correctText(turn){ return turn.options.find(o=>o.correct).text; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function setProgress(dividerTotal){
  const total = current.turns.filter(t=>t.quiz).length;
  el('barCount').textContent = `${dividerTotal}/${total}`;
  el('barFill').style.width = `${Math.round(dividerTotal/total*100)}%`;
}

async function startDialogue(i){
  current = DIALOGUES[i]; correctCount=0;
  chat.innerHTML=''; show(topbar, chat);
  setProgress(0);
  let quizDone=0;
  for (const turn of current.turns){
    if (!turn.quiz){
      const bub = addBubble(turn.s, turn.text);
      if (turn.s==='A') lastA = turn.text;
      bub.classList.add('speaking');
      await speak(turn.text, turn.s);
      bub.classList.remove('speaking');
      await wait(250);
    } else {
      show(topbar, chat, quiz);
      const gotCorrect = await askQuiz(turn);
      if (gotCorrect) correctCount++;
      quiz.classList.add('hidden');
      // 정답 발화를 B 버블로 확정하고 대화를 이어감(오답이어도 정답 문장으로 진행)
      const bub = addBubble('B', correctText(turn));
      bub.classList.add('speaking');
      await speak(correctText(turn), 'B');
      bub.classList.remove('speaking');
      quizDone++; setProgress(quizDone);
      await wait(300);
    }
  }
  showDone();
}

function askQuiz(turn){
  return new Promise(resolve => {
    const box = el('opts'); box.innerHTML='';
    const opts = shuffle(turn.options);
    let answered=false;
    opts.forEach(o=>{
      const b=document.createElement('button'); b.className='opt'; b.textContent=o.text;
      b.onclick=()=>{
        if (answered) return; answered=true;
        Array.from(box.children).forEach(c=>c.disabled=true);
        if (o.correct){ b.classList.add('correct'); }
        else { b.classList.add('wrong');
          Array.from(box.children).forEach(c=>{ if(c.textContent===correctText(turn)) c.classList.add('correct'); });
        }
        setTimeout(()=>resolve(!!o.correct), o.correct?900:1500); // 오답이면 정답 잠깐 보여준 뒤 진행
      };
      box.appendChild(b);
    });
  });
}

function showDone(){
  show(topbar, done);
  const total = current.turns.filter(t=>t.quiz).length;
  el('doneScore').textContent = `${total}번 중 ${correctCount}번 한 번에 맞혔어요.`;
}

// 이벤트
el('backBtn').onclick = ()=>{ try{speechSynthesis.cancel();}catch(e){} renderHome(); };
el('doneList').onclick = ()=>renderHome();
el('doneRetry').onclick = ()=>{ const i=DIALOGUES.indexOf(current); startDialogue(i); };
el('replayBtn').onclick = ()=>{ if(lastA) speak(lastA,'A'); };

renderHome();
</script>
</body>
</html>
