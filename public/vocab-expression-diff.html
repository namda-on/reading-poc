<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>개선안 비교 — 어휘→표현</title>
<style>
  /* 두 실험 랩(`-rcg` · `-arr`)을 **지금 / 개선** 두 프레임으로 나란히 놓고, **같은 동작을
     같은 순간에** 양쪽에 건다. 랩 안의 토글만으로는 켜고 끌 때 화면이 리셋돼 같은 동작을
     두 번 해야 하고, 그러면 연출을 나란히 볼 수가 없다.
     프레임은 같은 출처라 부모가 `contentWindow.__demo()` 를 직접 부른다(메시지 프로토콜 없음). */
  :root { --ink:#22354d; --sub:#5f7493; --line:#d9e4f2; --green:#2e9e57; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:#eef3fa; color:var(--ink); padding:18px 16px 40px; }
  .wrap { max-width:1060px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { font-size:13px; color:var(--sub); margin:0 0 16px; line-height:1.6; }

  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tab { border:1.5px solid var(--line); background:#fff; border-radius:11px; padding:9px 14px; cursor:pointer;
    font:inherit; font-size:13.5px; font-weight:800; color:#51688a; }
  .tab.on { background:var(--ink); border-color:var(--ink); color:#fff; }

  .bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; background:#fff; border:1px solid var(--line);
    border-radius:13px; padding:10px 12px; margin-bottom:14px; }
  .bar button { border:1.5px solid var(--line); background:#fff; border-radius:9px; padding:7px 12px; cursor:pointer;
    font:inherit; font-size:13px; font-weight:800; color:#3a6bb0; }
  .bar button.go { background:#4b83d6; border-color:#4b83d6; color:#fff; }
  .bar button.ghost { color:#7a8ca6; font-weight:700; }
  .bar .pos { display:flex; align-items:center; gap:4px; font-size:13px; font-weight:800; color:#3a6bb0; }
  .bar .pos input { width:62px; border:1.5px solid var(--line); border-radius:8px; padding:6px; text-align:center;
    font:inherit; font-weight:800; color:#3a6bb0; }
  .bar .sp { flex:1; }
  .bar .cap { font-size:12px; color:var(--sub); font-weight:700; }

  .pair { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:900px){ .pair { grid-template-columns:1fr; } }
  .side { background:#fff; border:1px solid var(--line); border-radius:15px; overflow:hidden; }
  .side > h2 { margin:0; font-size:13px; font-weight:800; padding:10px 14px; display:flex; align-items:center; gap:8px; }
  .side.now > h2 { background:#f1f4f9; color:#6b7c93; }
  .side.next > h2 { background:#e8f7ee; color:#1f7a49; }
  .side > h2 small { font-weight:700; font-size:11.5px; opacity:.8; }
  .side iframe { display:block; width:100%; height:700px; border:0; background:#bfe0ef; }

  .notes { margin-top:22px; }
  .notes h3 { font-size:15px; margin:0 0 10px; }
  .chg { background:#fff; border:1px solid var(--line); border-radius:13px; padding:13px 15px; margin-bottom:9px; }
  .chg .t { font-size:14px; font-weight:800; margin-bottom:6px; }
  .chg .t em { font-style:normal; color:var(--green); }
  .chg table { width:100%; border-collapse:collapse; font-size:13px; }
  .chg td { padding:5px 0; vertical-align:top; line-height:1.55; }
  .chg td.k { width:52px; color:#97a6ba; font-weight:800; white-space:nowrap; }
  .chg td.a { color:#7a8ca6; }
  .chg td.b { color:#1f7a49; font-weight:700; }
  .chg .why { font-size:12.5px; color:var(--sub); line-height:1.6; margin-top:7px;
    border-top:1px dashed #e6ecf5; padding-top:7px; }
  .chg .jump { margin-top:8px; }
  .chg .jump button { border:1.5px solid var(--line); background:#fff; border-radius:8px; padding:5px 10px;
    cursor:pointer; font:inherit; font-size:12px; font-weight:800; color:#3a6bb0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>개선안 비교</h1>
  <p class="sub">왼쪽이 <b>지금</b>, 오른쪽이 <b>개선</b>입니다. 같은 문항·같은 데이터이고,
    아래 버튼을 누르면 <b>양쪽에 같은 동작이 같은 순간에</b> 걸립니다 — 입력이 같을 때 결과가 어떻게 갈리는지가 비교의 전부라, 손으로 따로 조작하면 어긋납니다.</p>

  <div class="tabs">
    <button class="tab on" data-tab="rcg">[1]·[2] 패턴 찾기</button>
    <button class="tab" data-tab="arr">[3] 탭 배열 — 함정 고지</button>
    <button class="tab" data-tab="arr2">[3] 탭 배열 — 난이도</button>
    <button class="tab" data-tab="pay">표현 카드</button>
  </div>

  <div class="bar" id="bar"></div>

  <div class="pair">
    <div class="side now"><h2>지금 <small id="capL"></small></h2><iframe id="fL"></iframe></div>
    <div class="side next"><h2>개선 <small id="capR"></small></h2><iframe id="fR"></iframe></div>
  </div>

  <div class="notes" id="notes"></div>
</div>
<script>
// `urlL`/`urlR` 가 다를 수도 있다 — 난이도 탭은 같은 실험 파일을 양쪽에 다른 설정으로 띄운다
const SRC={
  rcg:{ url:'/vocab-expression-rcg.html', now:'fm=0&fx=0', next:'fm=1&fx=1',
        capL:'형태 슬롯 인정 꺼짐 · 연출 꺼짐', capR:'형태 슬롯 인정 · 수렴 · 손맛' },
  arr:{ url:'/vocab-expression-arr.html', now:'fix=0', next:'fix=1',
        capL:'칸·뱅크 표기 그대로', capR:'칸이 개수를 말한다' },
  arr2:{ url:'/vocab-expression-arr2.html', now:'a=0&b=0&c=0', next:'a=1&b=1&c=1',
         capL:'칸 공개 · 함정 1~2 (현재)', capR:'칸 비공개 · 함정 3~5 · 부류' },
  pay:{ url:'/vocab-expression-pay.html', now:'g=0&d=0&l=0', next:'g=1&d=1&l=1',
        capL:'모든 문항에 요약 카드', capR:'줄 게 있을 때만 · desc 주인공 · 세션 내 연결' },
};
let tab='rcg', idx=0, total=633;
const el=id=>document.getElementById(id);
const L=()=>el('fL').contentWindow, R=()=>el('fR').contentWindow;

function load(){
  const s=SRC[tab];
  el('capL').textContent=s.capL; el('capR').textContent=s.capR;
  el('fL').src=`${s.urlL||s.url}?i=${idx}&${s.now}`;
  el('fR').src=`${s.urlR||s.url}?i=${idx}&${s.next}`;
}
// 두 프레임이 모두 그려진 뒤에 동작을 건다 — 한쪽만 준비됐을 때 걸면 비교가 어긋난다
function both(fn){
  // 랩의 `items` 는 top-level `let` 이라 `window` 에 없다 — 훅과 그려진 카드로 판정한다
  const ready=w=>{ try{ return w && typeof w.__demo==='function' && w.document.querySelector('.chat-card'); }
                   catch(e){ return false; } };
  let n=0;
  (function wait(){
    if(ready(L()) && ready(R())) return fn();
    if(n++>80) return;
    setTimeout(wait, 50);
  })();
}
function demo(kind){ both(()=>{ try{ L().__demo(kind); }catch(e){} try{ R().__demo(kind); }catch(e){} }); }
function reset(){ both(()=>{ L().__reset(); R().__reset(); }); }
function goto(n){ idx=((n%total)+total)%total; el('posIn') && (el('posIn').value=idx+1);
  both(()=>{ L().__goto(idx); R().__goto(idx); }); }

const BARS={
  rcg:`<button class="ghost" data-act="prev">‹</button>
       <span class="pos"><input id="posIn" type="text" inputmode="numeric"> / ${'{T}'}</span>
       <button class="ghost" data-act="next">›</button>
       <span class="cap">같은 동작 걸기</span>
       <button class="go" data-act="pick">프레임만 짚고 확인</button>
       <button class="go" data-act="plus">프레임 + 바뀌는 자리 짚고 확인</button>
       <span class="sp"></span>
       <button data-act="reset">처음으로</button>`,
  pay:`<button class="ghost" data-act="prev">‹</button>
       <span class="pos"><input id="posIn" type="text" inputmode="numeric"> / ${'{T}'}</span>
       <button class="ghost" data-act="next">›</button>
       <span class="cap">같은 동작 걸기</span>
       <button class="go" data-act="stuck">막혔다고 가정 / 해제</button>
       <span class="sp"></span>
       <button data-act="reset">처음으로</button>`,
  arr2:`<button class="ghost" data-act="prev">‹</button>
       <span class="pos"><input id="posIn" type="text" inputmode="numeric"> / ${'{T}'}</span>
       <button class="ghost" data-act="next">›</button>
       <span class="cap">같은 동작 걸기</span>
       <button class="go" data-act="half">절반만 놓기</button>
       <button class="go" data-act="fill">정답 낱말만 놓기</button>
       <span class="sp"></span>
       <button data-act="reset">처음으로</button>`,
  arr:`<button class="ghost" data-act="prev">‹</button>
       <span class="pos"><input id="posIn" type="text" inputmode="numeric"> / ${'{T}'}</span>
       <button class="ghost" data-act="next">›</button>
       <span class="cap">같은 동작 걸기</span>
       <button class="go" data-act="half">절반만 놓기</button>
       <button class="go" data-act="fill">끝까지 놓기</button>
       <button class="go" data-act="rest">다 놓고 남은 타일 누르기</button>
       <span class="sp"></span>
       <button data-act="reset">처음으로</button>`,
};

const NOTES={
  rcg:[
    {t:'[1] <em>형태 슬롯</em>을 짚어도 막지 않는다',
     rows:[['지금','`needs` 옆의 `cleaning`까지 짚으면 <b>오답 처리</b>되고 줄이 흔들린다'],
           ['개선','통과한다. 통과 화면에서 <b>프레임=꽉 찬 초록</b>, <b>함께 짚은 자리=점선 초록</b>, 나머지=흐림으로 <b>세 종류</b>가 갈린다']],
     why:'학습자가 보는 패턴(`need ~ing`·`one of the 최상급`)이 프레임보다 클 때가 있다. 그걸 오답이라고 하면 맞는 직관을 틀렸다고 하게 된다. 다 짚고 통과하는 것은 프레임에 인접한 자리 최대 2개로 막는다.',
     jump:'label', jumpLabel:'형태 라벨이 붙는 문항으로'},
    {t:'[1] 그 자리의 <em>형태 이름</em>을 범례에 적는다',
     rows:[['지금','없음'],['개선','줄 아래 한 줄 — <b>문장마다 바뀌는 자리 — 늘 ~ing</b> (37/633문항)']],
     why:'저작된 `pattern.form`의 마커와 형제 문장 관찰에서 나온다. 불규칙 최상급(`best`)은 목록으로 적어 두고, `-s`는 복수·3인칭·축약형을 구분할 수 없어 쓰지 않는다 — 틀리게 이름 붙이느니 안 붙인다.'},
    {t:'[2]-B <em>수렴</em> — 같은 것만 남는 그림',
     rows:[['지금','통과하면 색만 바뀐다'],
           ['개선','슬롯이 <b>제자리에서 작아지고</b>, 두 줄의 초록 조각이 <b>세로로 정렬</b>된다']],
     why:'줄바꿈되거나 밀면 넘치는 줄이 있으면 건너뛴다(564/625에서 걸린다) — 어긋나 보이면 수렴이 아니라 고장으로 읽힌다.'},
    {t:'[2]-C <em>짚는 손맛</em>',
     rows:[['지금','알약이 위로 튀어오른다(0.3s) · 쌍둥이 낱말 40ms 차'],
           ['개선','알약이 <b>좌→우로 채워진다</b>(0.22s) · 60ms 차로 둘이 차례로 켜진다']]},
  ],
  pay:[
    {t:'진단 — 카드가 <em>이미 아는 것</em>을 다시 말한다',
     rows:[['지금','카드가 뜨는 시점에 유저는 그 표현을 <b>세 번 산출</b>했고(짚기·타이핑·배열) 같은 표현 문장을 중앙값 <b>3개</b> 봤다. 그런데 예문은 <b>632/633</b>에서 이미 본 문장이고 <b>381/633</b>은 둘 다 이미 본 것이다'],
           ['개선','<b>새로 알려줄 것이 있을 때만</b> 뜬다 — 요약은 전부 걷어낸다']],
     why:'`form`·`meaning`도 `[2]`·`[3]` 타이틀이 초록으로 이미 말한 것이다. 유일하게 새로운 것은 `desc` 인데 맨 아래 회색 각주로 깔려 있고 268/633(42%)에만 있다. 받은 피드백 그대로 — "왜 나오는지 모르겠다".'},
    {t:'① <em>desc</em>를 각주에서 주인공으로',
     rows:[['지금','`💡 새로운 표현을 배웠어요` + 형태 + 뜻 + 회색 각주 + 예문 2개'],
           ['개선','<b>한 줄</b> — `⚠ 이건 헷갈리기 쉬워요` + <b>one of the</b> — 뒤에 반드시 복수 명사가 와요']],
     why:'`desc` 는 전부 "네가 틀리게 알고 있었을 법한 것"이다(`bring up` 은 들어 올리다가 아니다 · `Will you` 보다 `Would` 가 정중 · got·made·bought 는 for, passed·sent 는 to). 이것만 남긴다.',
     jump:'desc', jumpLabel:'desc 가 있는 문항으로'},
    {t:'② <em>이번 세션에 이미 나온</em> 자리',
     rows:[['지금','없음'],
           ['개선','<b>miss out · run out of</b> — 둘 다 `out` 자리를 써요 (97/632)']],
     why:'`앞에서 배운`이라고 말할 수 없다 — 패턴은 커리큘럼 순서가 아니라 **트리거 어휘가 나와야** 따라 나온다. 그 시점에 앱이 확실히 아는 것은 `이번 세션에 등장했는가` 하나뿐이고, 무엇이 먼저 나올지 예상해 **문안을 미리 써 둘 수도 없다**. 그래서 이 줄은 저작물이 아니라 **세션 이력에서 런타임 계산**한 것이고, 임의의 창(30문항 같은 것)도 두지 않는다.',
     jump:'link', jumpLabel:'연결이 있는 문항으로'},
    {t:'③ 줄 게 없으면 <em>안 띄운다</em> — 빈도가 핵심이다',
     rows:[['지금','<b>633/633</b> 전 문항에서 뜬다 → 몇 문항 만에 "안 보게 된다"'],
           ['개선','<b>338/633 (53%)</b>. 그리고 <b>막혔으면</b> `desc` 를 그 자리(오답노트 팁)에서 받으므로 끝 카드는 <b>97개(15%)</b>만 남는다']],
     why:'이 레포에 이미 같은 규약이 있다 — `[4] h` 의 `aidLevel`: "막히지 않고 넘긴 문항이면 앱이 덜 해준다". 카드는 **드물어져야** 읽힌다. 화면 아래 빈도 스트립에서 직접 세어 볼 수 있다.'},
  ],
  arr2:[
    {t:'진단 — 지금 <em>[4] c</em>는 <em>[3]</em>보다 어렵지 않다',
     rows:[['지금','배열할 문장이 <b>중앙값 4낱말</b>로 `[3]`과 거의 같고(509/633 동일), 뱅크 차이는 <b>타일 1개</b>뿐이다'],
           ['개선','선택·길이 두 축을 올려 `[3]`을 지나온 유저에게 한 단계 위를 준다']],
     why:'함정이 제 역할을 못 한 이유 둘 — ① 칸 수가 답의 길이를 알려줘 함정을 역산으로 걸러낼 수 있다 ② 1~2개는 과잉으로 보이지도 않고 고민거리도 안 된다.'},
    {t:'① <em>칸 비공개</em> — 답의 길이를 안 알려준다',
     rows:[['지금','정답 낱말 수만큼 칸을 미리 그려 준다 → `5개 중 4개`가 역산된다'],
           ['개선','놓은 만큼만 서고 <b>다음 자리 하나만 캐럿</b>으로 열린다. 한 낱말만 놓아도 <b>확인</b>을 누를 수 있다']],
     why:'`o`(안 준다) 방식이 이미 같은 구조다. "이것도 써야 하나?"가 버그에서 과제로 바뀐다 — 답의 범위를 유저가 정하는 것이 이 단계의 과제라면 그 의문은 정상이다.'},
    {t:'② 함정 <em>3~5개</em> — 과잉임이 보인다',
     rows:[['지금','1개 477문항 · 2개 156 · <b>3개 이상 0</b>. 4+1=5는 과잉으로 안 보인다'],
           ['개선','정답 수에 비례해 <b>3~5개</b>. 뱅크 중앙값 <b>7타일</b>(최대 12) — 보는 즉시 `여기서 고르는 거구나`']],
     why:'사전 인지가 여기서 해결된다 — 고지 문구도 코치마크도 필요 없다. 대신 읽는 부담은 오른다(7낱말 답에 12타일).'},
    {t:'③ <em>부류 함정</em> — 대상 문장 기준, 같은 부류',
     rows:[['지금','학습 문장+프레임 기준이라 대상 문장과 무관하다 — `I can\'t fall asleep.`에 <b>refers</b>'],
           ['개선','대상 문장의 기능어 자리에 같은 부류를 — `out`에 <b>along·over</b>, `of`에 <b>to</b>, `I`에 <b>he·we</b>']],
     why:'빌드에 이미 부류 목록(particle/prep/aux/pron…)이 있는데 학습 문장에만 돌린다. 대상 문장에 돌리면 "왜 여기 있지?"가 "어느 쪽이지?"가 된다. 새 저작 0. 대상에 기능어가 있는 문항은 563/633이고, 나머지 70은 내용어 풀로 떨어져 여전히 노이즈다.'},
  ],
  arr:[
    {t:'① 빈 칸은 <em>점선</em>, 채운 칸은 실선',
     rows:[['지금','둘 다 솔리드라 빈 칸이 플레이스홀더로 보이고 <b>개수로 안 읽힌다</b>'],
           ['개선','줄 자체가 <b>N칸 중 몇 개 채움</b>으로 읽힌다']]},
    {t:'② 마지막 칸 뒤에 <em>종결부호</em>를 미리 박는다',
     rows:[['지금','없음 — 문장이 어디서 끝나는지 화면에 없다'],
           ['개선','<b>[ ][ ][ ][ ] .</b> — 길이가 추측이 아니라 확정된 사실이 된다']],
     why:'`[3] 문장 배열`이 이미 쓰는 표기(`withPunct`)라 새 규약이 아니다.'},
    {t:'③ 칸이 다 차면 남은 타일이 <em>저절로 흐려진다</em>',
     rows:[['지금','그대로 남아 "이것도 써야 하나?"가 된다'],
           ['개선','흐려진다 — 고지 없이 <b>이건 네 것이 아니다</b>']],
     why:'`안 쓰는 낱말이 섞여 있어요` 같은 문장은 앱이 자기 규칙을 변명하는 말이 되어 부자연스럽다. 그래서 글자를 늘리지 않고 상태로 말한다.'},
    {t:'④ 꽉 찬 뒤 남은 타일을 누르면 <em>칸 줄이 펄스</em>한다',
     rows:[['지금','<b>아무 일도 일어나지 않는다</b> — 왜 안 들어가는지가 화면에 없다'],
           ['개선','줄이 한 번 펄스해 <b>자리가 없다</b>를 동작으로 말한다']],
     jump:'trap2', jumpLabel:'함정이 2개인 문항으로'},
  ],
};

function paint(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  el('bar').innerHTML=BARS[tab].replace('{T}', total);
  el('posIn').value=idx+1;
  el('posIn').onchange=()=>{ const n=parseInt(el('posIn').value,10);
    if(n>=1 && n<=total) goto(n-1); else el('posIn').value=idx+1; };
  el('bar').querySelectorAll('button[data-act]').forEach(b=> b.onclick=()=>{
    const a=b.dataset.act;
    if(a==='prev') return goto(idx-1);
    if(a==='next') return goto(idx+1);
    if(a==='reset') return reset();
    demo(a);
  });
  el('notes').innerHTML=`<h3>무엇이 달라졌나</h3>` + NOTES[tab].map((c,ci)=>`
    <div class="chg">
      <div class="t">${c.t}</div>
      <table>${c.rows.map(r=>`<tr><td class="k">${r[0]}</td><td class="${r[0]==='지금'?'a':'b'}">${r[1]}</td></tr>`).join('')}</table>
      ${c.why?`<div class="why">${c.why}</div>`:''}
      ${c.jump?`<div class="jump"><button data-jump="${c.jump}">${c.jumpLabel} ›</button></div>`:''}
    </div>`).join('');
  el('notes').querySelectorAll('button[data-jump]').forEach(b=> b.onclick=()=>{
    both(()=>{
      // 그 변경이 **실제로 보이는** 문항으로 양쪽을 함께 옮긴다
      let list=[];
      try{ const w=R();
        list = b.dataset.jump==='label' ? w.__labelItems()
             : b.dataset.jump==='desc'  ? w.__descItems()
             : b.dataset.jump==='link'  ? w.__linkItems()
             : w.__trap2(); }catch(e){}
      if(!list || !list.length) return;
      const nx = list.find(n=>n>idx);
      goto(nx===undefined ? list[0] : nx);
    });
  });
}
document.querySelectorAll('.tab').forEach(b=> b.onclick=()=>{ tab=b.dataset.tab; paint(); load(); });

fetch('/vocab-expression.data.json').then(r=>r.json()).then(d=>{ total=(d.items||d).length; paint(); load(); });
paint(); load();
</script>
