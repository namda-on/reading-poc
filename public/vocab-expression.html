<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>어휘 → 표현 프로토타입</title>
<style>
  :root { --bg:#a9ccf2; --ink:#2f3e52; --sub:#6b7c93; --blue:#4b83d6; --green:#2e9e57; --purple:#7b6ef0; --purple-d:#5b3fb0; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--ink); display:flex; justify-content:center; }
  .app { width:100%; max-width:460px; height:100dvh; min-height:100vh; display:flex; flex-direction:column;
    background:linear-gradient(#aacdf3,#bfe0ef); }
  .hidden { display:none !important; }

  /* 상단바 */
  .topbar { display:flex; align-items:center; gap:10px; padding:12px 14px 8px; flex-shrink:0; }
  .icon-btn { width:32px; height:32px; border:none; background:transparent; color:#fff; font-size:22px; cursor:pointer; }
  .trophy { width:34px; height:34px; border-radius:50%; background:#4b83d6; color:#fff; display:flex; align-items:center; justify-content:center; font-size:17px; box-shadow:0 2px 6px rgba(30,60,110,.25); flex-shrink:0; }
  .progress { flex:1; display:flex; align-items:center; gap:10px; }
  .bar-wrap { flex:1; position:relative; }
  .bar-track { height:11px; border-radius:7px; background:rgba(255,255,255,.45); overflow:hidden; }
  .bar-fill { height:100%; background:#6f9bd6; width:0; transition:width .35s ease; border-radius:7px; }
  .bar-star { position:absolute; top:50%; transform:translate(-50%,-50%); font-size:15px; transition:left .35s ease; }
  .bar-count { font-size:12px; font-weight:800; color:#3a6bb0; flex-shrink:0; }
  .gear { color:#5b83b8; }

  /* 홈 */
  .home { flex:1; padding:18px 18px 24px; overflow-y:auto; }
  .home h1 { font-size:23px; margin:6px 0 4px; color:#25406a; }
  .home p.sub { color:#3a567d; margin:0 0 16px; font-size:14px; line-height:1.5; }
  .tabs { display:flex; gap:8px; margin-bottom:6px; }
  .tab { flex:1; border:none; border-radius:12px; padding:11px; font-size:15px; font-weight:800; cursor:pointer; background:#ffffff88; color:#3a567d; }
  .tab.on { background:#fff; color:#25406a; box-shadow:0 2px 8px rgba(30,60,110,.14); }
  .tab .td { display:block; font-size:11px; font-weight:600; opacity:.7; margin-top:2px; }
  .lv-card { position:relative; display:block; width:100%; text-align:left; background:#fff; border:none; border-radius:16px; padding:15px 18px; margin-bottom:10px; cursor:pointer; box-shadow:0 3px 12px rgba(30,60,110,.12); }
  .lv-card.cleared { background:#f1faf3; box-shadow:0 2px 8px rgba(46,158,87,.12); }
  .lv-card .t { font-size:16px; font-weight:800; color:#2f3e52; }
  .lv-card.cleared .t { color:#3f6b50; }
  .lv-card .f { font-size:12.5px; color:var(--sub); margin-top:4px; line-height:1.4; }
  .lv-card .step { display:inline-block; font-size:11px; font-weight:800; color:#2f6ab0; background:#e7f0fb; border:1px solid #cfe0f5; border-radius:999px; padding:2px 8px; margin-top:8px; }
  .lv-card .clear-badge { position:absolute; top:14px; right:16px; font-size:13px; font-weight:800; color:var(--green); }
  .restart-btn { display:block; width:100%; background:none; border:none; color:#3a6bb0; font-size:13px; font-weight:700; padding:8px 6px 0; cursor:pointer; text-decoration:underline; }
  /* 홈 — 진입 CTA를 확실히 드러내는 시작 카드 */
  .start-card { background:#fff; border-radius:18px; padding:18px 18px 16px; box-shadow:0 4px 14px rgba(30,60,110,.14); }
  .start-flow { font-size:13.5px; font-weight:800; color:#3a6bb0; }
  .start-flow .ar { color:#9db8dd; margin:0 3px; }
  .start-count { font-size:20px; font-weight:800; color:#25406a; margin-top:8px; }
  .start-count b { color:var(--purple-d); }
  .start-note { font-size:12.5px; color:var(--sub); margin-top:4px; }
  .start-btn { width:100%; border:none; border-radius:15px; padding:16px; margin-top:14px; cursor:pointer;
    background:linear-gradient(#7f8cf2,#5b6ef0); color:#fff; font-size:17px; font-weight:800;
    box-shadow:0 5px 14px rgba(80,90,220,.32); }
  .start-btn:active { transform:translateY(1px); }
  .opt-head { font-size:12.5px; font-weight:800; color:#4a6b95; opacity:.9; margin:20px 4px 6px; }
  /* 옵션 (홈 / 상단 설정 팝오버 공용) */
  .opt-box { background:#ffffffcc; border-radius:14px; padding:12px 14px; margin-top:14px; }
  .opt-label { font-size:12.5px; font-weight:800; color:#3a567d; margin-bottom:8px; }
  .setting-pop { position:absolute; z-index:60; top:52px; right:14px; width:250px; background:#fff; border-radius:14px;
    box-shadow:0 8px 24px rgba(30,60,110,.24); padding:13px 14px; }
  .home .note { font-size:12px; color:#3a567d; opacity:.85; margin-top:18px; line-height:1.6; }


  /* 옵션 스위치 */
  .opt-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 0; }
  .opt-row .rt { font-size:12.5px; font-weight:700; color:#3a567d; }
  .seg { display:flex; gap:6px; }
  /* 방식이 넷이면 라벨만으로는 무엇이 다른지 읽히지 않는다 — 한 줄 설명을 함께 세운다 */
  .seg.seg-v { flex-direction:column; }
  .seg-v .seg-b { text-align:left; padding:9px 11px; }
  .seg-v .seg-b i { display:block; font-style:normal; font-weight:600; font-size:11px; opacity:.72; margin-top:2px; }
  .seg-b { flex:1; border:1.5px solid #cfe0f5; background:#fff; color:#5b7c93; border-radius:10px; padding:9px 6px; font-size:12.5px; font-weight:800; cursor:pointer; }
  .seg-b.on { background:#46b366; border-color:#46b366; color:#fff; }
  .opt-div { height:1px; background:#e4ebf4; margin:11px 0 9px; }
  .opt-sw { width:40px; height:23px; border-radius:999px; border:none; background:#cfd8e6; position:relative; cursor:pointer; flex-shrink:0; transition:background .18s; }
  .opt-sw::after { content:''; position:absolute; top:2.5px; left:2.5px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left .18s; }
  .opt-sw.on { background:#46b366; }
  .opt-sw.on::after { left:19px; }

  /* 세션 */
  .stage { flex:1; min-height:0; display:flex; flex-direction:column; padding:10px 16px 0; }
  .stage-scroll { flex:1; min-height:0; overflow-y:auto; padding-top:22px; }
  .stage-bottom { flex-shrink:0; padding:10px 0 16px; }

  /* 채팅 말풍선 카드 */
  .chat-card { position:relative; background:linear-gradient(#e9f1fb 0%, #f4f8fd 42%, #ffffff 42%, #ffffff 100%);
    border-radius:22px; box-shadow:0 6px 18px rgba(30,60,110,.13); padding:22px 20px 16px; }
  .chat-card.correct { background:linear-gradient(#dff3e4 0%,#eaf8ee 46%,#fbfffc 46%,#fbfffc 100%); }
  .chat-tag { position:absolute; top:-13px; left:16px; background:#cfe0f5; color:#3a6bb0; font-size:12px; font-weight:800; border-radius:11px 11px 11px 3px; padding:3px 11px; display:flex; align-items:center; gap:5px; }
  .chat-tag .q { width:15px; height:15px; border-radius:50%; background:#a9c4e8; color:#fff; font-size:10px; display:inline-flex; align-items:center; justify-content:center; }
  .chat-badge { position:absolute; top:-11px; right:16px; font-size:12px; font-weight:800; padding:3px 10px; border-radius:9px 9px 3px 9px; }
  .chat-badge.new { background:#ff6f6f; color:#fff; }
  .chat-badge.old { background:#5b8fd6; color:#fff; }
  .check-mark { position:absolute; top:-22px; left:2px; font-size:46px; color:var(--green); text-shadow:0 2px 4px rgba(0,0,0,.12); animation:pop .3s ease; }
  @keyframes pop { from{opacity:0; transform:scale(.5) rotate(-15deg);} to{opacity:1; transform:none;} }

  .chat-situation { font-size:12.5px; color:#9aa8bc; margin-bottom:4px; }
  .chat-ko { font-size:18px; line-height:1.55; color:#33465c; font-weight:600; }
  .chat-ko.note { font-size:13px; color:#9aa8bc; font-weight:400; margin-top:2px; }
  .chat-ko.b-hint { font-size:13px; color:#9aa8bc; font-weight:600; margin-top:6px; }
  .tgt { color:var(--green); font-weight:800; }
  .chat-en { font-size:19px; line-height:1.7; color:#2f3e52; font-weight:600; margin-top:18px; }
  .chat-src { text-align:right; font-size:11px; color:#c0cad8; margin-top:12px; }

  /* 인라인 빈칸(입력) */
  .blank { field-sizing:content; min-width:66px; max-width:100%; background:#dbe8fb; border:none; border-radius:9px; padding:2px 10px;
    font:inherit; font-weight:800; color:#3a6bb0; text-align:center; outline:none; vertical-align:baseline; }
  .blank::placeholder { color:#9db8dd; font-weight:700; letter-spacing:.08em; }
  .blank.revealed::placeholder { color:#3a6bb0; letter-spacing:0; }   /* 정답 공개 상태 */
  .blank.correct { background:#cdefd8; color:var(--green); }
  /* 카드 내 오답 피드백 박스 */
  .wrong-box { background:#cdd8f2; color:#42527a; border-radius:11px; padding:10px 14px; font-size:15px; font-weight:600; margin:14px 0 2px; }
  .wrong-box .wc { color:#e14b46; font-weight:800; }
  /* 정답 보기 후 — placeholder는 타이핑하면 가려지므로 문장 아래에 정답을 남겨둔다 */
  .reveal-note { margin-top:10px; font-size:13.5px; font-weight:700; color:#7d97b8; }
  .reveal-note b { font-size:16px; font-weight:800; color:#3a6bb0; margin-left:2px; }

  /* 어휘 하단 — 풀이 중 */
  .vtools { display:flex; justify-content:space-between; align-items:center; padding:4px 6px; }
  .vtool { display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; cursor:pointer; color:#8a7fc0; font-size:12px; font-weight:700; padding:4px 8px; }
  .vtool .ic { width:30px; height:30px; border-radius:50%; background:#eae6fb; display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--purple-d); }
  .vtool.mic .ic { background:#eef1fb; color:#5b83b8; }
  .vtool:disabled { opacity:.85; cursor:default; }

  /* 정답 후 카드 안 액션 줄 — 다시 듣기·다시 말하기처럼 **방금 푼 문장에 거는**
     동작이므로 하단이 아니라 그 문장이 있는 카드 안에 둔다(전부 비작동 표시). */
  .pf-actions { display:flex; align-items:flex-start; gap:4px; border-top:1px dashed #dde5f0; margin-top:16px; padding-top:14px; }
  .pf-act { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:none;
    color:#9aa8bc; font-size:10.5px; font-weight:700; line-height:1.3; text-align:center; }
  .pf-act .ic { width:34px; height:34px; border-radius:11px; background:#f0f3f9; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .pf-more { display:flex; justify-content:center; align-items:center; gap:3px; width:100%; background:none; border:none;
    margin-top:12px; color:#b3bfd0; font-size:12px; font-weight:700; }

  /* 어휘 하단 — 정답 후: 탭 + 3버튼 */
  .vtabs { display:flex; justify-content:space-between; padding:6px 2px 12px; border-bottom:1px solid #cfdcec; margin-bottom:12px; }
  .vtab { flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; background:none; border:none; cursor:pointer; color:#9aa8bc; font-size:10.5px; font-weight:700; }
  .vtab .ic { width:34px; height:34px; border-radius:10px; background:#e7ecf5; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .vtab .badge { position:relative; }
  .vtab .badge::after { content:attr(data-n); position:absolute; top:-6px; right:-8px; background:#ff7a45; color:#fff; font-size:9px; font-weight:800; border-radius:50%; width:15px; height:15px; display:flex; align-items:center; justify-content:center; }
  .vbtns { position:relative; display:flex; gap:10px; }
  .vbtn { flex:1; border:none; border-radius:16px; padding:16px 6px; color:#fff; font-weight:800; font-size:14.5px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; box-shadow:0 4px 10px rgba(80,70,160,.22); }
  .vbtn .ic { font-size:20px; }
  .vbtn.b1 { background:linear-gradient(#b39cf2,#9b7ef0); }
  .vbtn.b2 { background:linear-gradient(#9b8cf0,#7d6cf0); }
  .vbtn.b3 { background:linear-gradient(#6f8ef0,#5b6ef0); }
  /* 다음으로 가는 길은 하나다 — 부가 동작은 카드 안 액션 줄이 맡는다 */
  .vbtn.wide { flex-direction:row; gap:8px; padding:17px 6px; font-size:16px; }

  /* 정답 후 '학습 정보' — 문제 카드 **밖의 별도 카드**다. 문제 카드는 방금 푼
     문장의 것이고, 학습 정보는 그 문장이 아니라 **표현**의 것이라 소유가 다르다.
     좌상단 탭이 그 소유를 이름으로 밝힌다. */
  .payoff { position:relative; background:#fff; border-radius:22px; box-shadow:0 6px 18px rgba(30,60,110,.13);
    margin:32px 0 6px; padding:20px 20px 22px; }
  .pf-div { height:1px; background:#eaeff6; margin:16px 0 0; }
  .pf-label { font-size:11.5px; font-weight:800; color:#9aa8bc; letter-spacing:-.02em; }
  .pf-top { display:flex; align-items:center; gap:5px; font-size:14px; font-weight:800; color:#2f3e52; margin-top:8px; }
  .pf-form { font-size:20px; font-weight:800; color:var(--green); line-height:1.4; margin-top:10px; }
  .pf-form .slot { display:inline-block; min-width:44px; border-bottom:2.5px solid #7bbd96; }
  .pf-mean { font-size:14px; color:#8c9aab; font-weight:600; margin-top:4px; line-height:1.5; }
  .pf-desc { background:#f2f5fa; border-radius:11px; padding:11px 13px; font-size:13px; color:#7c8b9e; line-height:1.6; margin-top:12px; }
  .pf-sub { display:flex; align-items:center; gap:5px; font-size:13px; font-weight:700; color:#7c8b9e; margin:18px 0 2px; }
  .pf-ex { margin-top:10px; }
  .pf-ex-en { font-size:16px; font-weight:700; color:var(--green); line-height:1.45; }
  .pf-ex-kr { font-size:13px; color:#9aa8bc; margin-top:2px; }

  /* 배열 — 인라인 문장 채우기 */
  .fill { position:relative; display:flex; flex-wrap:wrap; align-items:center; gap:7px 8px; margin-top:16px; min-height:44px;
    transition:opacity .22s ease, transform .26s cubic-bezier(.32,.02,.24,1); }
  .fill.fade-out { opacity:0; }
  /* 들어올 때는 살짝 아래에서 올라온다 — 나갈 때와 방향을 갈라 두 동작이 겹쳐 보이지 않게 */
  .fill.pre-in { opacity:0; transform:translateY(9px); transition:none; }
  .fill-word { background:#eaf1fb; border:1px solid #cdddf3; border-radius:9px; padding:6px 13px; font-size:17px; color:#2f3e52; cursor:pointer; }
  .fill-blank { min-width:52px; border-bottom:2px solid #b9c7db; height:26px; }
  .grow-in { animation:growIn .34s ease both; }
  @keyframes growIn { from{ opacity:0; transform:translateY(5px);} to{ opacity:1; transform:none;} }
  /* 1박자 완료를 먼저 인정한다 — 곧바로 줄을 비우면 '회수'로 읽힌다 */
  .fill-word.ok-pop { animation:okPop .28s ease; }
  @keyframes okPop { 0%{transform:scale(1);} 44%{transform:scale(1.1);} 100%{transform:scale(1);} }
  /* 2박자 재료가 도착하는 방향 — 위에서 끌어내리는 게 아니라 아래에서 올라온다 */
  .bank { transition:opacity .2s ease; }
  .bank.fade-out { opacity:0; }
  .bank.bank-in .tile { animation:bankIn .32s cubic-bezier(.32,.02,.24,1) both; animation-delay:calc(var(--i, 0) * 36ms); }
  @keyframes bankIn { from{ opacity:0; transform:translateY(12px);} to{ opacity:1; transform:none;} }
  /* 2박자에서 타이틀이 문장 뜻으로 바뀔 때 표현 뜻은 초록 칩으로 남아 연결을 잇는다.
     `이 표현 …` 처럼 라벨을 붙이면 화면 문구로 어색하고, 칩은 문장 해석의 일부로 읽히지 않는다. */
  .expand-mean { margin-top:6px; }
  /* 흐름 2 [2] — 문장 해석은 타이틀이 아니라 영어 아래에 둔다(타이틀은 표현 뜻) */
  .sent-kr { font-size:13.5px; color:#9aa8bc; font-weight:600; margin-top:10px; }
  /* [4] 답 줄에 박혀 있는 프레임 — 내가 쓰는 도구다 */
  .fill-fixed { background:#e3fbec; border:1px solid #8ed9ab; border-radius:9px; padding:6px 13px;
    font-size:17px; color:#22794a; font-weight:800; }
  .sit-bubble .fill { margin-top:0; min-height:38px; gap:6px 7px; }
  .fill-nw { display:inline-flex; align-items:center; gap:6px; }
  /* 흐름 1 — 표현만 세우는 동안 프레임 조각 사이의 슬롯 자리 */
  .fr-slot { display:inline-flex; align-items:flex-end; height:26px; line-height:1; padding:0 3px;
    font-size:16px; font-weight:800; color:#b6c3d4; letter-spacing:2px; }
  /* [4] 말해보기 — 배운 표현으로 새 문장 만들기 */
  .sp-q { font-size:13.5px; font-weight:700; color:#5b7c93; }
  /* [4] 재료 — 표현은 여기 없다. 답의 범위만 닫아 두고 조합은 유저가 한다.
     답 자리(슬롯) **위**에 둔다 — 아래는 키보드가 올라오는 자리이고, 읽는 순서가
     `뜻 → 재료 → 그 재료를 놓을 자리`가 되어야 조립하는 화면으로 읽힌다. */
  .sp-mat { display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-top:14px; }
  .sp-mat .mat { background:#eef2f8; color:#7d8fa6; border-radius:8px; padding:5px 11px; font-size:15px; font-weight:700;
    transition:opacity .18s ease, background .18s ease; }
  /* 쓴 낱말은 죽인다 — 배열 화면의 `.tile.placed` 와 같은 규약. 이 줄의 용도는
     '무엇을 썼나'가 아니라 **'아직 뭐가 남았나'**이므로 남은 것만 진하게 둔다. */
  .sp-mat .mat.used { background:#f4f6fa; color:#c3cede; opacity:.6; }
  .sp-mat .mat.used::after { content:'✓'; margin-left:5px; font-size:11px; color:#9ec7ad; }
  .sp-mat .lbl { font-size:12.5px; font-weight:700; color:#b3bfd0; margin-right:2px; }
  /* 놓은 카드는 눌러서 되가져온다(C·D) */
  .sp-slot.on { cursor:pointer; }
  /* [4] 답 자리 — 한 줄 입력칸이 아니라 **낱말 한 칸씩**이다. 답의 낱말 수는
     재료+표현으로 이미 정해져 있으므로 칸을 그려도 새로 새는 정보가 없고,
     대신 '몇 낱말을 어디까지 놓았나'가 눈에 보인다. 실제 타이핑은 칸 위에 깔린
     투명 입력이 받는다(모바일 키보드·데스크톱 타이핑 모두 그대로 동작). */
  .sp-in { position:relative; margin-top:12px; min-height:42px; }
  .sp-slots { display:flex; flex-wrap:wrap; gap:8px; }
  .sp-slot { min-width:56px; min-height:42px; background:#eaf1fb; border:1.5px solid #dce7f6; border-radius:10px;

  /* 칸보다 많이 쓰면 넘친 칸을 따로 표시한다 — 재료를 더 쓴 것이 바로 보인다 */
  .sp-slot.extra { background:#fdeff0; border-color:#f3cdd0; }

     "내가 만든 문장"이라, 어디까지가 내 손인지 흐려지면 효용감의 근거가 사라진다. */
  .sp-slot.gift { background:#fdf3d8; border-color:#e6c979; color:#8a6a1c; }

  /* 배열 지시문 — 데이터에 지시문 필드가 없어 종결부호로 유도한다 */

  /* A 화면 오답노트 팁 — 표현을 못 떠올렸을 때(오답/표현 보기) 열리고, 이어지는
     B 화면까지 남아 문장을 배열하는 동안 계속 보인다. 뱅크와 버튼 사이라 확인 버튼

  /* [3] 미리 주어지는 슬롯 — '내가 놓은 것'과 시각적으로 갈려야 프레임 산출이 체감된다 */

  /* [5] 구간 정리 */

  /* [5] 지시문은 한국어지만 generic — 정답의 번역이 아니다 */

  .sit-opts { display:flex; flex-direction:column; gap:9px; margin-top:18px; }
  .sit-opt { display:flex; align-items:center; gap:9px; text-align:left; font:inherit; cursor:pointer;
    background:#fff; border:1.5px solid #cfdcec; border-radius:12px; padding:13px 15px;

  /* 개발 확인용 — 학습 UI 가 아니라는 게 한눈에 보여야 한다 */
  .devbox { margin-top:20px; padding:11px 12px; border:1px dashed #c3cede; border-radius:10px;
    background:#f7f9fc; display:flex; flex-direction:column; gap:5px;
    font-family:ui-monospace,"SF Mono",Menlo,monospace; }

    border-radius:4px; padding:1px 5px; }

  .dev-en { color:#4a5a6d; }
  .dev-fr { color:#9aa8bc; }
  .sit-hint.answer { background:#e3fbec; color:#22794a; }
  .sit-card { margin-top:12px; }
  .sit-input { width:100%; margin-top:9px; resize:none; overflow:hidden; background:#fff; min-height:44px;
    border:1.5px solid #cdddf3; border-radius:10px; padding:9px 11px; font:inherit; font-size:17px;
    font-weight:700; color:#2f3e52; outline:none; }
  .sit-input:focus { border-color:#8fb0dd; }
  .sit-input.ok { background:#e3fbec; border-color:#8ed9ab; color:#22794a; }
  .sit-fb { margin-top:14px; }
  .sit-wrong { background:#fdeeea; color:#b5533c; border-radius:11px; padding:11px 13px; font-size:14px; font-weight:600; }
  .sit-hint { display:flex; flex-wrap:wrap; align-items:center; gap:7px; background:#f2f5fa;
    border-radius:11px; padding:11px 13px; font-size:13px; color:#7d8fa6; }
  .sit-hint b { color:#5b7c93; margin-right:3px; }

  .rv-q { font-size:20px; font-weight:700; color:#33465c; line-height:1.5; margin-top:2px; }
  .rv-sub { font-size:13.5px; color:#8e9aaa; font-weight:600; margin:18px 0 0; }
  .rv-opts { display:flex; flex-direction:column; gap:9px; margin-top:10px; }
  .rv-opt { display:flex; flex-direction:column; gap:2px; text-align:left; font:inherit; cursor:pointer;
    background:#fff; border:1.5px solid #cfdcec; border-radius:12px; padding:12px 15px; }
  .rv-opt:hover { border-color:#8fb0dd; }
  .rv-opt:focus-visible { outline:2px solid #3a6bb0; outline-offset:2px; }
  .rv-opt.wrong { opacity:.45; border-style:dashed; cursor:default; }
  .rv-fr { font-size:17px; font-weight:800; color:#22794a; }

  .mic-float { align-self:flex-end; width:52px; height:52px; border-radius:50%; background:#fff; box-shadow:0 3px 10px rgba(30,60,110,.2); display:flex; align-items:center; justify-content:center; font-size:22px; margin:6px 2px 0 auto; color:#5b6ef0; }


  /* 배열 — 단어 뱅크 (자리 유지) */

  .tile { position:relative; border:1px solid #cdddf3; background:#fff; border-radius:11px; padding:12px 16px; font-size:16.5px; color:#2f3e52; cursor:pointer; box-shadow:0 1px 3px rgba(30,60,110,.08); }
  /* 방금 만든 표현 낱말 — 통째로 배열하면서도 무엇이 그 표현인지 보이게 */
  .tile.fr { border-color:#8ed9ab; background:#f4fdf7; color:#22794a; font-weight:800; }
  .tile.placed { background:#e3e9f2; border-color:#dbe2ee; color:transparent; box-shadow:none; cursor:default; pointer-events:none; }

  /* 배열 하단 버튼 */
  .arr-btns { display:flex; gap:10px; }
  .btn-ghost2 { flex:0 0 27%; border:none; border-radius:16px; padding:15px 6px; background:linear-gradient(#c9b8f2,#b49cf0); color:#fff; font-weight:800; font-size:13px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .btn-ghost2 .ic { font-size:16px; }

  .btn-confirm:disabled { background:#c2c7d2; cursor:default; }

  /* 완료 */
  .done { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:30px 22px; text-align:center; overflow-y:auto; }
  .done .emoji { font-size:52px; }
  .done h2 { color:#25406a; margin:0; }
  .done p { color:#3a567d; margin:0; }

  .learned-list .it .en { color:#6b7c93; }

<body>
<div class="app">
  <div class="topbar hidden" id="topbar">
    <button class="icon-btn" id="backBtn" aria-label="뒤로">‹</button>
    <div class="trophy">🏆</div>
    <div class="progress"><div class="bar-wrap"><div class="bar-track"><div class="bar-fill" id="barFill"></div></div><span class="bar-star" id="barStar">⭐</span></div><div class="bar-count" id="barCount">0 / 0</div></div>
    <button class="icon-btn gear" id="gearBtn" aria-label="설정">⚙</button>
  </div>

  <div class="home" id="home">
    <h1>어휘 → 표현</h1>
    <p class="sub">어휘를 배운 뒤 그 어휘가 트리거한 <b>표현 문장을 배열</b>해요. 두 버전을 바꿔가며 비교할 수 있어요.</p>
    <div class="tabs" id="tabs"></div>
    <div id="levelList"></div>
    <div class="note"><b>버전 A</b> — 어휘는 어휘 예문으로 배우고, 표현은 그와 다른 문장으로 배워요(현재 앱 구조).<br>
      <b>버전 B</b> — 표현 문장 자체에서 트리거 어휘를 빈칸으로 배우고, 같은 문장을 그대로 배열해요.<br>
      두 버전은 <b>같은 문항·같은 진행 위치</b>를 공유하니, 버전만 바꿔 같은 문항을 바로 비교할 수 있어요.</div>
  </div>

  <div class="stage hidden" id="stage"></div>
  <div class="setting-pop hidden" id="settingPop"></div>
</div>

<script>
const el = id => document.getElementById(id);
const topbar = el('topbar'), home = el('home'), stage = el('stage');
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// localStorage — 버전(A/B)과 진행 위치. 위치는 두 버전이 공유해서
// 같은 문항을 버전만 바꿔 바로 비교할 수 있게 한다.
const VER_KEY='ve:ver', POS_KEY='ve:pos', SIT_KEY='ve:sit', FLOW_KEY='ve:flow', SPK_KEY='ve:spk', SPKV_KEY='ve:spkv';
function getPos(){ try{ return Number(localStorage.getItem(POS_KEY))||0; }catch(e){ return 0; } }
function setPos(n){ try{ localStorage.setItem(POS_KEY, String(n)); }catch(e){} }

// 버전 정의 — A: 어휘 문장과 표현 문장이 서로 다름 / B: 표현 문장으로 어휘까지 배움
const VERSIONS={
  a:{label:'버전 A', desc:'어휘 예문 따로', vocabKey:'vocabA'},
  b:{label:'버전 B', desc:'표현 문장으로', vocabKey:'vocabB'},
};

// [5] 상황 카드를 낄지 — 유일한 옵션. 켜면 REVIEW_EVERY 문항마다 한 번 나온다.
const SIT_ROW='[5] 상황 카드 넣기 (3문항마다)';
// [4] 말해보기의 자극 — 'kr' 한국어 문장 → 영어 / 'en' A의 영어 질문 → 영어
let spkMode=(()=>{ try{ return localStorage.getItem(SPK_KEY)==='en'?'en':'kr'; }catch(e){ return 'kr'; } })();
function setSpkMode(m){
  spkMode = m==='en' ? 'en' : 'kr';
  try{ localStorage.setItem(SPK_KEY, spkMode); }catch(e){}
  renderSitOption(); applyStepOption();
}
// [4] 말해보기의 **방식**(자극 언어와는 직교하는 축). 넷 다 같은 대상 문장·같은 채점
// 규칙·같은 단계 수를 쓰고 새 데이터도 쓰지 않는다. 다른 것은 **과제를 어떤 조작으로
// 세우고 지원을 어떤 형태로 주는가**뿐이다.
const SPK_VARS={
  a:{label:'A 재료 상시', desc:'함께 쓸 낱말을 처음부터 보여주고 문장 전체를 타이핑'},
  b:{label:'B 칸 채우기', desc:'재료를 감추고, 힌트는 지금 막힌 칸을 하나씩 채운다'},
  c:{label:'C 트랩 배열', desc:'낱말을 탭해 배열한다 — 뱅크에 함정이 섞여 있다'},
  e:{label:'E 고르고 직접 쓰기', desc:'이 표현으로 할 말을 내가 고르고, 재료 없이 직접 쓴다'},
};
let spkVar=(()=>{ try{ const v=localStorage.getItem(SPKV_KEY); return SPK_VARS[v]?v:'a'; }catch(e){ return 'a'; } })();
function setSpkVar(v){
  spkVar = SPK_VARS[v] ? v : 'a';
  try{ localStorage.setItem(SPKV_KEY, spkVar); }catch(e){}
  renderSitOption(); applyStepOption();
}
let sitOn=(()=>{ try{ return localStorage.getItem(SIT_KEY)!=='0'; }catch(e){ return true; } })();
function setSitOn(v){
  sitOn=!!v;
  try{ localStorage.setItem(SIT_KEY, sitOn?'1':'0'); }catch(e){}
  buildStepIndex();          // 단계 수가 달라지므로 진행바 기준을 다시 잡는다
  renderSitOption(); applyStepOption();
}
// 바꾼 옵션을 지금 화면에 바로 적용한다. [4]의 방식·자극은 그 단계를 다시 그려야
// 보이고, 그 밖의 단계는 진행바 기준만 달라지므로 **다시 그리지 않는다** — 배열
// 도중에 화면을 갈아엎으면 풀던 것이 날아간다.
function applyStepOption(){
  if(curStep===renderSpeak) renderSpeak();
}
function renderSitOption(){
  ['optHome','settingPop'].forEach(id=>{
    const box=el(id);
    if(!box || box.classList.contains('hidden')) return;
    box.innerHTML=`<div class="opt-row"><span class="rt">${SIT_ROW}</span>
        <button class="opt-sw${sitOn?' on':''}" data-k="sit" aria-label="${SIT_ROW}"></button></div>
      <div class="opt-div"></div>
      <div class="opt-label">[4] 말해보기 자극</div>
      <div class="seg">
        <button class="seg-b" data-m="kr">${spkMode==='kr'?'✓ ':''}한국어 → 영어</button>
        <button class="seg-b" data-m="en">${spkMode==='en'?'✓ ':''}영어 질문 → 영어</button>
      </div>
      <div class="opt-div"></div>
      <div class="opt-label">[4] 말해보기 방식</div>
      <div class="seg seg-v">
        ${Object.keys(SPK_VARS).map(k=>`<button class="seg-b" data-v="${k}"><b>${spkVar===k?'✓ ':''}${SPK_VARS[k].label}</b><i>${SPK_VARS[k].desc}</i></button>`).join('')}
      </div>`;
    box.querySelectorAll('.seg-b[data-m]').forEach(b=> b.classList.toggle('on', b.dataset.m===spkMode));
    box.querySelectorAll('.seg-b[data-v]').forEach(b=> b.classList.toggle('on', b.dataset.v===spkVar));
    box.querySelector('.opt-sw').onclick=()=>setSitOn(!sitOn);
    box.querySelectorAll('.seg-b[data-m]').forEach(b=> b.onclick=()=>setSpkMode(b.dataset.m));

  });
}

// 채점 정규화 / 배열 토큰
function norm(s){ return s.toLowerCase().trim().replace(/^[^\w']+|[^\w']+$/g,'').replace(/\s+/g,' '); }
function tokenize(sent){ return sent.trim().replace(/[.?!]+$/,'').split(/\s+/); }
function trailPunct(sent){ const m=sent.trim().match(/[.?!]+$/); return m?m[0]:''; }

// 표현을 방금 만들어 본 뒤에 오는 것이라, [4]만 떼어 보면 판단이 어긋난다.

// [5] 구간이 몇 문항마다 끼어드므로 총 단계 수를 미리 합산해 진행바가 튀지 않게 한다.
let stepStart=[], stepTotal=0;
// 문항당 4단계 — 어휘 · 표현 산출 · 문장 배열 · 질문에 답하기
function itemSteps(){ return 4; }
function buildStepIndex(){
  stepStart=[]; let acc=0;
  if(sitOnly){ sessionItems.forEach((_,i)=>stepStart.push(i)); stepTotal=sessionItems.length; return; }
  sessionItems.forEach((_,i)=>{ stepStart.push(acc); acc+=itemSteps(); if(isReviewAfter(i)) acc+=1; });
  stepTotal=acc;
}
// 진행바: 문항 내 단계 위치(step)를 전체 누적 위치로 환산한다
function setProgress(step){
  const stepDone=(stepStart[itemIdx]||0)+step;
  const total=stepTotal||sessionItems.length*itemSteps(), pct=Math.min(100, stepDone/total*100);
  el('barFill').style.width=pct+'%';
  el('barStar').style.left=pct+'%';
  el('barCount').textContent=`${itemIdx+1} / ${sessionItems.length}`;
}
// 카드 좌상단 태그 — 문항마다 레벨이 다르므로 해당 문항의 레벨을 쓴다
function chatTag(item){ return `<div class="chat-tag">레벨 ${item.level}<span class="q">?</span></div>`; }

// 2박자 타이틀 — 문장 뜻 안에서 표현 뜻만 초록으로(`[1]` 어휘와 같은 표기).
// 못 찾은 문항(222 중 62)은 뜻을 초록 칩으로 따로 보여준다.
function sentTitleHtml(s){
  return s.krMark
    ? escapeHtml(s.krMark).replace(/\[([^\]]+)\]/g, (m,g)=>`<span class="tgt">${g}</span>`)
    : escapeHtml(s.kr);
}
// 한국어 번역 줄: [뜻]을 초록, (설명)줄은 muted
function koHtml(line){
  const note=/^\s*\(/.test(line);
  const html=escapeHtml(line).replace(/\[([^\]]+)\]/g,(m,g)=>`<span class="tgt">${g}</span>`);
  return `<div class="chat-ko${note?' note':''}">${html}</div>`;
}
// 힌트 placeholder: level1=첫글자+길이, level2=정답 전체
// 힌트 단계: 1=앞 2글자 공개(나머지는 길이만), 2=정답 전체
function hintPlaceholder(answer, level){
  if(level>=2) return answer;
  if(level===1){
    const show=Math.min(2, answer.length);
    let s=answer.slice(0, show);
    for(let i=show;i<answer.length;i++) s+= answer[i]===' ' ? '  ' : '_';
    return s;
  }
  return '';
}
// 오답 글자 비교(빨강 강조) + 다른 글자 수
function diffSpell(typed, answer){
  let out='', wrong=0;
  for(let i=0;i<Math.max(typed.length,answer.length);i++){
    const t=typed[i];
    if(i>=typed.length){ out+='<span class="wc">_</span>'; wrong++; }
    else if(t.toLowerCase()===(answer[i]||'').toLowerCase()) out+=escapeHtml(t);
    else { out+=`<span class="wc">${escapeHtml(t)}</span>`; wrong++; }
  }
  return {html:out, wrong};
}
function hlTrigger(sent, trig){
  const re=new RegExp('\\b('+trig.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')\\b','i');
  return escapeHtml(sent).replace(re, m=>`<span class="tgt">${m}</span>`);
}

// [1] 어휘 빈칸 ────────────────────────────────────────────────────────────────
function renderVocab(){
  curStep=renderVocab;
  const item=sessionItems[itemIdx], v=item[VERSIONS[curVer].vocabKey], answer=v.answer;
  setProgress(0);
  let hintLevel=0, done=false;

  // 버전 A는 번역 안의 [뜻]이 초록으로 표시되지만, 버전 B(표현 문장)엔 그 마크업이 없어
  // 어휘의 뜻을 별도 줄로 보여준다 — 두 버전이 같은 만큼의 단서를 주도록.
  const ko=v.koLines.map(koHtml).join('')
    + (v.hint ? `<div class="chat-ko b-hint">빈칸 뜻 <span class="tgt">${escapeHtml(v.hint)}</span></div>` : '');
  const en=v.enLines.map(ln=>`<div class="chat-en">${escapeHtml(ln).replace(/\[[^\]]+\]/,
      `<input class="blank" id="vin" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" />`)}</div>`).join('');

  stage.innerHTML=`
    <div class="stage-scroll">
      <div class="chat-card" id="card">
        ${chatTag(item)}<div class="chat-badge new">NEW</div>
        ${ko}
        <div class="wrong-box hidden" id="wrongBox"></div>
        ${en}
        <div class="reveal-note hidden" id="revealNote"></div>
      </div>
    </div>
    <div class="stage-bottom" id="bottom">
      <div class="vtools" id="vtools">
        <button class="vtool" id="hintBtn"><span class="ic">?</span><span id="hintLabel">힌트 보기</span></button>
        <button class="vtool mic" disabled><span class="ic">🎤</span><span>음성 모드</span></button>
      </div>
    </div>`;

  const vin=el('vin'), wrongBox=el('wrongBox'), card=el('card');
  const applyHint=()=>{ vin.placeholder=hintPlaceholder(answer, hintLevel); };
  applyHint();
  setTimeout(()=>vin.focus(),60);

  function markCorrect(){
    done=true;
    vin.value=answer; vin.readOnly=true; vin.classList.add('correct'); vin.placeholder='';
    card.classList.add('correct');
    wrongBox.classList.add('hidden');
    el('revealNote').classList.add('hidden');
    if(!card.querySelector('.check-mark')){ const c=document.createElement('div'); c.className='check-mark'; c.textContent='✓'; card.appendChild(c); }
    card.insertAdjacentHTML('beforeend', resultActionsHtml());
    el('bottom').innerHTML=arrangeBottomHtml('다음 문제');
    el('nextBtn').onclick=patternStep;
  }
  function onInput(){
    if(done) return;
    if(norm(vin.value)===norm(answer)){ markCorrect(); return; }
    const t=vin.value.trim();
    if(t.length>=answer.replace(/ /g,'').length && t.length>0){
      const {html,wrong}=diffSpell(t, answer);
      wrongBox.classList.remove('hidden'); wrongBox.innerHTML=`${html} - 정답과 ${wrong}글자 달라요.`;
    } else wrongBox.classList.add('hidden');
  }
  vin.addEventListener('input', onInput);

  el('hintBtn').onclick=()=>{
    if(hintLevel===0){        // 힌트 보기 → 앞 2글자
      hintLevel=1;
      el('hintLabel').textContent='정답 보기'; el('hintBtn').querySelector('.ic').textContent='✔';
    }
    else {                    // 정답 보기 → 전체 단어
      hintLevel=2;
      vin.classList.add('revealed');
      // 정답은 placeholder로 보여주므로 입력값이 남아 있으면 가려진다 → 입력한 답을 비운다
      if(vin.value){ vin.value=''; wrongBox.classList.add('hidden'); }
      // 다시 타이핑하면 placeholder가 가려지므로 문장 아래에 정답을 남겨둔다
      const rn=el('revealNote');
      rn.classList.remove('hidden');
      rn.innerHTML=`정답<b>${escapeHtml(answer)}</b>`;
    }
    applyHint(); vin.focus();
  };
}

// 방금 배운 어휘와 같은 타일인지 판정. 정확일치 + 규칙 굴절형까지 인정한다
// (days/jobs/going/taxes/dancing/parties/dirtier/fatter, 복합어 round-trip⊃trip).
// speak→spoke, good→best 같은 불규칙은 매칭되지 않고, 그 경우 칩 강조·연출을 생략한다.
const INFL_SUFFIX=/^(?:s|es|ed|d|ing|er|est|ies|ier|iest|'s|')$/;
function normTok(s){ return String(s).toLowerCase().replace(/[^a-z0-9']/g,''); }
function wordParts(s){ return String(s).toLowerCase().split(/[^a-z0-9']+/).filter(Boolean); }
function matchStem(a,b){
  if(!a || !b || b.length<2) return false;
  if(a===b) return true;
  if(a.startsWith(b)){
    let rest=a.slice(b.length);
    // CVC 자음 중복(fat→fatter): 중복 글자가 어간 끝 글자와 같을 때만 벗겨낸다
    if(rest.length>2 && rest[0]===b[b.length-1]) rest=rest.slice(1);
    if(!rest || INFL_SUFFIX.test(rest)) return true;
  }
  // 어미 e/y 탈락형 (dance→dancing, party→parties, dirty→dirtier)
  const stem=b.replace(/[ey]$/,'');
  return stem.length>=3 && stem!==b && a.startsWith(stem) && INFL_SUFFIX.test(a.slice(stem.length));
}
function isTriggerToken(tok, trigger){
  // 하이픈 조각 단위로 비교 — Round-trip ⊃ trip은 잡고, wondering ⊃ ring 같은 오탐은 막는다
  const parts=wordParts(tok), trigs=wordParts(trigger);
  return parts.some(a=> trigs.some(b=> matchStem(a,b)));
}

// 정답 후 '학습 정보': 배열 중엔 숨겨둔 표현 프레임(형태·뜻·설명)을 처음 공개하고,
// 단어만 바꾼 실제 예문으로 "이제 이런 말도 할 수 있다"를 눈으로 확인시킨다.
function patternPayoffHtml(item){
  const p=item.pattern||{}, form=(p.form||'').trim(), pmean=(p.meaning||'').trim(), pdesc=(p.desc||'').trim();
  const all=item.siblings||[];
  const rest=all.filter(x=>!builtSet.has(x.en));
  const sibs=(rest.length?rest:all).slice(0,2);
  if(!form && !pmean && !sibs.length) return '';
  // 슬롯(______ / ~)은 빈칸으로 그려 '단어만 갈아끼우는 틀'로 읽히게 한다
  const frameEn = form ? `<div class="pf-form">${escapeHtml(form).replace(/_{2,}|~/g,'<span class="slot"></span>')}</div>` : '';
  const frameKr = pmean ? `<div class="pf-mean">${escapeHtml(pmean)}</div>` : '';
  const desc = pdesc ? `<div class="pf-desc">${escapeHtml(pdesc)}</div>` : '';
  // 응용 예문은 구분 없이 전부 초록 — 내부자 테스트 기준
  const exs = sibs.length ? `<div class="pf-div"></div><div class="pf-sub"><span class="ic">ⓘ</span>단어만 바꿔서 이렇게도 말할 수 있어요</div>`
    + sibs.map(x=>`<div class="pf-ex"><div class="pf-ex-en">${escapeHtml(x.en)}</div><div class="pf-ex-kr">${escapeHtml(x.kr)}</div></div>`).join('') : '';
  return `<div class="payoff">
      <div class="chat-tag rv">학습 정보</div>
      <div class="pf-top"><span class="ic">💡</span>새로운 표현을 배웠어요</div>
      ${frameEn}${frameKr}${desc}${exs}
    </div>`;
}

// 오답노트 팁에 쓸 표현 표기 — `pattern.form`의 자리표시자를 걷어내 **인용 라벨**로 줄인다.
// `feel like ______` → `feel like`, `put ______ on` → `put … on`(사이에 낀 자리는 남긴다).
// 자리표시자를 품은 괄호는 통째로 뺀다(`come over (to ______)` → `come over`).
function exprLabel(form){
  const M='\u0001';
  let x=String(form||'').replace(/_{2,}/g, M).replace(/~/g, M);
  x=x.replace(new RegExp('\\s*\\([^)]*'+M+'[^)]*\\)','g'), '');
  x=x.replace(new RegExp('^\\s*'+M+'\\s*'), '');
  x=x.replace(new RegExp(M+'[\\s.?!,]*$'), '');
  return x.split(M).join('…').replace(/\s+/g,' ').trim();
}
// A 화면에서 표현을 못 떠올렸을 때 여는 줄 — 표현과 그 뜻을 한 줄로 짚어 준다
function nbTipHtml(item){
  const p=item.pattern||{}, label=exprLabel(p.form)||(item.frame||[]).join(' … ');
  const mean=(p.meaning||'').trim();
  return `<b>${escapeHtml(label)}</b> : ${escapeHtml(mean)}`;
}
// 배열 지시문: 데이터에 해당 필드가 없어 종결부호로 유도한다
// 종결부호는 flex 항목이라 그냥 두면 **부호만** 다음 줄로 떨어진다 — 마지막 칸과 묶어 함께 넘긴다
function withPunct(parts, punct){
  if(!punct) return parts.join('');
  const tail=`<span class="fill-punct">${escapeHtml(punct)}</span>`;
  if(!parts.length) return tail;
  return parts.slice(0,-1).join('') + `<span class="fill-nw">${parts[parts.length-1]}${tail}</span>`;
}

// ── 배열 화면 공용 ────────────────────────────────────────────────────────────
// 정답 후 하단은 **다음으로 가는 버튼 하나**다. 여러 버튼을 늘어놓으면 무엇이
// 다음 단계인지가 흐려진다 — 부가 동작은 카드 안 액션 줄로 내린다.
function arrangeBottomHtml(nextLabel){
  return `
      <div class="vbtns">
        <button class="vbtn b3 wide" id="nextBtn"><span class="ic">▶</span>${nextLabel}</button>
      </div>`;
}
// 방금 푼 문장에 거는 동작들 — 카드 안, 점선 아래에 붙는다(비작동)
function resultActionsHtml(){
  return `<div class="pf-actions">
      <button class="pf-act" disabled><span class="ic">🔊</span>다시 듣기</button>
      <button class="pf-act" disabled><span class="ic">🐢</span>듣기 평가 속도</button>
      <button class="pf-act" disabled><span class="ic">🎤</span>다시 말하기</button>
      <button class="pf-act" disabled><span class="ic">📊</span>발음 진단</button>
    </div>
    <button class="pf-more" disabled>더보기<span>⌄</span></button>`;
}
// 문항의 마지막 단계에서 다음 문항([5] 구간)으로 넘긴다
function advanceItem(){
  learned.push(sessionItems[itemIdx]);
  if(itemIdx>=sessionItems.length-1) return renderDone();
  if(isReviewAfter(itemIdx)) return renderReview();
  itemIdx++; renderVocab();
}
function lastItem(){ return itemIdx>=sessionItems.length-1; }


// [2]·[3] 표현 넣기 → 문장 전체 ───────────────────────────────────────────────────
// **두 박자 모두 같은 문장**(학습 문장 = 트리거 어휘가 든 문장)을 쓴다:
//   1박자 — 변하는 부분(슬롯)은 회색으로 주어진 채 **프레임 자리만** 채운다(표현 인지)
//   2박자 — **같은 문장을 표현까지 포함해 통째로** 배열한다
// **화면을 교체하지 않는다** — 교체하면 2박자가 새 문제로 읽히고 1박자에서 이어졌다는
// 감각이 끊긴다. 같은 카드에서 타이틀만 바뀌고 줄이 다시 열린다.
// 방금 만든 표현 낱말은 뱅크·완성 줄에서 **초록**(`.tile.fr`·`.frame-w`)이라, 통째로
// 배열하면서도 그중 무엇이 방금 익힌 표현인지가 계속 보인다.
//
// 배열 단위는 조각(`baseSegs`)이 아니라 **문장을 공백으로 자른 토큰**이다 — 조각을
// 공백으로 자르면 `, grandpa` 같은 슬롯에서 쉼표만 든 타일이 생긴다. 토큰 쪽은 `time,`
// 처럼 부호가 낱말에 붙어 자연스럽고, 어느 토큰이 프레임인지는 조각을 순서대로 소진해
// 표시한다(`frameFlags`).
function frameFlags(tokens, segs){
  const bare=w=>String(w).toLowerCase().replace(/[^a-z0-9']/g,'');
  const flags=new Array(tokens.length).fill(false);
  let ti=0;
  segs.forEach(sg=>{
    const n=sg.s.split(/\s+/).map(bare).filter(Boolean).length;
    for(let k=0;k<n && ti<tokens.length;k++, ti++) if(sg.t==='frame') flags[ti]=true;
  });
  return flags;
}
// 연속한 비프레임 토큰을 한 덩어리로 묶는다 — 1박자에서 회색으로 주어지는 단위다
function slotRuns(tokens, flags){
  const runs=[]; let cur=null;
  tokens.forEach((w,i)=>{
    if(flags[i]){ cur=null; runs.push({fr:true, i}); return; }
    if(!cur){ cur={fr:false, ws:[], idx:[]}; runs.push(cur); }
    cur.ws.push(w); cur.idx.push(i);
  });
  return runs;
}
function renderPattern(){
  curStep=patternStep;
  const item=sessionItems[itemIdx], s=item.sentence;
  const pmean=((item.pattern||{}).meaning||'').trim(), punct=trailPunct(s.en);
  const tok=tokenize(s.en), flag=frameFlags(tok, item.baseSegs);
  const runs=slotRuns(tok, flag);
  const frameIdx=tok.map((w,i)=>i).filter(i=>flag[i]);

  let phase=0, done=false, switching=false, bankIn=false;
  let bank=shuffle(frameIdx.map((ti,i)=>({id:i, text:tok[ti].toLowerCase(), placed:false, fr:true})));
  let ans=[];

  setProgress(1);
  stage.innerHTML=`
    <div class="stage-scroll">
      <div class="chat-card" id="card">
        ${chatTag(item)}<div class="chat-badge new">NEW</div>
        <div class="chat-ko" id="koLine"><span class="tgt">${escapeHtml(pmean||s.kr)}</span></div>
        <div class="expand-mean hidden" id="meanLine"></div>
        <div class="fill" id="fill"></div>
        <div class="sent-kr" id="sentKr">${escapeHtml(s.kr)}</div>
        <div class="mic-float" id="micFloat">🎤</div>
      </div>
      <div id="payoffBox"></div>
    </div>
    <div class="stage-bottom" id="bottom">
      <div class="bank" id="bank"></div>
      <div class="nb-tip hidden" id="nbTip"></div>
      <div class="arr-btns" id="arrBtns">
        <button class="btn-ghost2" id="revealBtn"><span class="ic">✔</span><span id="revealLabel">표현 보기</span></button>
        <button class="btn-confirm" id="confirmBtn" disabled>확인</button>
      </div>
    </div>`;

  const fillEl=el('fill'), bankEl=el('bank');
  const need=()=> phase===0 ? frameIdx.length : tok.length;

  function renderFill(){
    const parts=[];
    if(phase===0){
      let fi=0;
      runs.forEach(r=>{
        if(!r.fr){ parts.push(`<span class="fill-given">${escapeHtml(r.ws.join(' '))}</span>`); return; }
        const i=fi++;
        parts.push(i<ans.length
          ? `<span class="fill-word frame-w" data-i="${i}">${escapeHtml(ans[i].text)}</span>`
          : `<span class="fill-blank"></span>`);
      });
    } else {
      for(let i=0;i<tok.length;i++){
        parts.push(i<ans.length
          ? `<span class="fill-word${ans[i].fr?' frame-w':''}" data-i="${i}">${escapeHtml(ans[i].text)}</span>`
          : `<span class="fill-blank"></span>`);
      }
    }
    fillEl.innerHTML=withPunct(parts, punct);
    if(!done) fillEl.querySelectorAll('.fill-word[data-i]').forEach(w=> w.onclick=()=>{
      const i=+w.dataset.i; ans[i].placed=false; ans.splice(i,1); renderAll();
    });
  }
  function renderBank(){
    bankEl.innerHTML='';
    bank.forEach(t=>{
      const b=document.createElement('button');
      b.className='tile'+(t.placed?' placed':'')+(t.fr&&!done?' fr':'');
      b.textContent=t.text;
      if(bankIn) b.style.setProperty('--i', String(bankEl.childElementCount));
      if(!t.placed && !done) b.onclick=()=>{
        if(ans.length>=need()) return;
        t.placed=true; ans.push(t); renderAll();
      };
      bankEl.appendChild(b);
    });
    bankEl.classList.toggle('bank-in', bankIn);
    if(bankIn) setTimeout(()=>bankEl.classList.remove('bank-in'), 700);
  }
  function renderAll(){
    renderFill(); renderBank();
    el('confirmBtn').disabled = ans.length<need();
  }

  // 1박자 통과 → 2박자. **먼저 1박자 완료를 인정하고**(놓은 프레임이 초록으로 팝) 그
  // 다음에 줄이 제자리에서 비고, 뱅크가 아래에서 올라온다. 내가 놓은 타일을 뱅크로
  // 끌어내리면 순서가 '회수'로 읽힌다 — 완료 → 재료 도착으로 읽히게 방향을 바꾼 것이다.
  function toPhase2(){
    if(switching) return;
    switching=true;
    fillEl.querySelectorAll('.fill-word.frame-w').forEach(w=> w.classList.add('ok-pop'));
    setTimeout(()=>{ if(!fillEl.isConnected) return;
      fillEl.classList.add('fade-out'); bankEl.classList.add('fade-out'); }, 190);
    setTimeout(()=>{
      if(!fillEl.isConnected) return;          // 전환 중 화면이 바뀌면 새 화면을 건드리지 않는다
      phase=1; ans=[]; switching=false;
      bank=shuffle(tok.map((w,i)=>({id:i, text:w.toLowerCase(), placed:false, fr:flag[i]})));
      setProgress(2);
      el('koLine').innerHTML=sentTitleHtml(s);    // 표현 뜻 → 문장 뜻(표현 부분만 초록)
      el('koLine').classList.add('grow-in');
      el('revealLabel').textContent='정답 보기'; el('revealBtn').disabled=false;
      el('nbTip').classList.add('hidden');       // 팁은 1박자의 것이다 — 함께 닫는다
      el('sentKr').classList.add('hidden');
      // 문장 뜻에서 표현 구간을 못 찾은 문항만 뜻을 칩으로 따로 보여준다
      if(!s.krMark){ const m=el('meanLine'); m.classList.remove('hidden');
        m.innerHTML=`<span class="rv-chip fr">${escapeHtml(pmean||'')}</span>`; }
      bankIn=true; renderAll(); bankIn=false;
      // 나간 방향과 겹치지 않게 pre-in 으로 한 프레임 눌러 두고 놓아 준다
      fillEl.classList.remove('fade-out'); fillEl.classList.add('pre-in');
      bankEl.classList.remove('fade-out');
      const release=()=> fillEl.classList.remove('pre-in');
      requestAnimationFrame(()=>requestAnimationFrame(release));
      setTimeout(release, 90);
    }, 400);
  }

  function finish(){
    done=true;
    el('card').classList.add('correct');
    if(!el('card').querySelector('.check-mark')){ const c=document.createElement('div'); c.className='check-mark'; c.textContent='✓'; el('card').appendChild(c); }
    builtSet.add(s.en);
    ans=tok.map((w,i)=>({text:w, placed:true, fr:flag[i]}));   // 원문 대소문자로 교정
    renderFill();
    el('micFloat').classList.add('hidden');
    el('card').insertAdjacentHTML('beforeend', resultActionsHtml());
    el('payoffBox').innerHTML=patternPayoffHtml(item);
    el('bottom').innerHTML=arrangeBottomHtml('다음 단계');
    el('nextBtn').onclick=renderSpeak;
  }

  function grade(){
    const target=(phase===0 ? frameIdx.map(i=>tok[i]) : tok).map(w=>w.toLowerCase()).join(' ');
    return ans.map(x=>x.text).join(' ')===target;
  }
  // 1박자에서 표현을 못 떠올린 경우(오답 · 표현 보기) — 오답노트 팁을 열고 정답으로
  // 교정한 뒤 2박자로 넘긴다. 팁은 2박자 내내 남아 문장을 배열하는 동안 계속 보인다.
  function showTip(){
    const tip=el('nbTip');
    tip.innerHTML=nbTipHtml(item);
    tip.classList.remove('hidden');
  }
  function clearLine(){ ans.forEach(x=>{ x.placed=false; }); ans=[]; renderAll(); }
  el('confirmBtn').onclick=()=>{
    if(ans.length<need()) return;
    if(grade()) return phase===0 ? toPhase2() : finish();
    fillEl.querySelectorAll('.fill-word').forEach(w=>w.style.color='#e14b46');
    if(phase===1) return void setTimeout(finish, 700);
    // 1박자는 대신 채워 주지 않는다 — 팁을 열고 줄을 비워 **직접 다시 배열**하게 한다.
    // 표현을 스스로 놓아야 넘어가므로, 못 떠올린 경우에도 결국 손으로 한 번은 만든다.
    showTip();
    setTimeout(()=>{ if(fillEl.isConnected) clearLine(); }, 700);
  };
  el('revealBtn').onclick=()=>{
    if(phase===1) return finish();
    showTip(); clearLine();                   // 오답을 확인했을 때와 같다 — 팁을 열고 다시 배열
  };

  renderAll();
}

// [2]·[3] 흐름 1 — 프레임을 굳히고 그 위로 문장을 키운다 ──────────────────────────
// `renderPattern`과 같은 문장·같은 두 박자를 쓰지만 **2박자에서 프레임을 다시 배열하지
// 않는다** — 1박자에 놓은 프레임이 `.locked`로 그 자리에 남고 나머지만 자란다.
// 1박자에는 슬롯 자리를 아예 안 보여주고 **프레임 조각 사이에만 `···` 칩**을 둔다
// (표현 앞뒤의 슬롯까지 표시하면 `get up`이 `~ get up`처럼 보여 표현이 아닌 걸 배우는
// 것처럼 읽힌다). 두 흐름의 차이는 2박자의 조작뿐이므로 진입점만 갈라 비교한다.
function renderExpand(){
  curStep=patternStep;
  const item=sessionItems[itemIdx], s=item.sentence;
  const pmean=((item.pattern||{}).meaning||'').trim(), punct=trailPunct(s.en);
  const tok=tokenize(s.en), flag=frameFlags(tok, item.baseSegs);
  const runs=slotRuns(tok, flag);
  const frameIdx=tok.map((w,i)=>i).filter(i=>flag[i]);
  const slotIdx=tok.map((w,i)=>i).filter(i=>!flag[i]);
  const fFirst=flag.indexOf(true), fLast=flag.lastIndexOf(true);

  let phase=0, done=false, switching=false, bankIn=false;
  let bank=shuffle(frameIdx.map((ti,i)=>({id:i, text:tok[ti].toLowerCase(), placed:false, fr:true})));
  let ans=[];

  setProgress(1);
  stage.innerHTML=`
    <div class="stage-scroll">
      <div class="chat-card" id="card">
        ${chatTag(item)}<div class="chat-badge new">NEW</div>
        <div class="chat-ko" id="koLine"><span class="tgt">${escapeHtml(pmean||s.kr)}</span></div>
        <div class="expand-mean hidden" id="meanLine"></div>
        <div class="fill" id="fill"></div>
        <div class="fill-hint" id="fillHint">표현을 먼저 만들어 보세요</div>
        <div class="mic-float" id="micFloat">🎤</div>
      </div>
      <div id="payoffBox"></div>
    </div>
    <div class="stage-bottom" id="bottom">
      <div class="bank" id="bank"></div>
      <div class="nb-tip hidden" id="nbTip"></div>
      <div class="arr-btns" id="arrBtns">
        <button class="btn-ghost2" id="revealBtn"><span class="ic">✔</span><span id="revealLabel">표현 보기</span></button>
        <button class="btn-confirm" id="confirmBtn" disabled>확인</button>
      </div>
    </div>`;

  const fillEl=el('fill'), bankEl=el('bank');
  const need=()=> phase===0 ? frameIdx.length : slotIdx.length;

  function renderFill(){
    const parts=[]; let fi=0, si=0;
    if(phase===0){
      runs.forEach(r=>{
        if(!r.fr){
          // 프레임 조각 사이의 슬롯만 자리를 알린다(앞뒤는 2박자에서 드러난다)
          if(r.idx[0]>fFirst && r.idx[r.idx.length-1]<fLast) parts.push(`<span class="fr-slot">···</span>`);
          return;
        }
        const i=fi++;
        parts.push(i<ans.length
          ? `<span class="fill-word frame-w" data-i="${i}">${escapeHtml(ans[i].text)}</span>`
          : `<span class="fill-blank"></span>`);
      });
      fillEl.innerHTML=parts.join('');
    } else {
      tok.forEach((w,i)=>{
        if(flag[i]){ parts.push(`<span class="fill-word frame-w locked">${escapeHtml(w)}</span>`); return; }
        const k=si++;
        parts.push(k<ans.length
          ? `<span class="fill-word grow-in" data-i="${k}">${escapeHtml(ans[k].text)}</span>`
          : `<span class="fill-blank grow-in"></span>`);
      });
      fillEl.innerHTML=withPunct(parts, punct);
    }
    if(!done) fillEl.querySelectorAll('.fill-word[data-i]').forEach(w=> w.onclick=()=>{
      const i=+w.dataset.i; ans[i].placed=false; ans.splice(i,1); renderAll();
    });
  }
  function renderBank(){
    bankEl.innerHTML='';
    bank.forEach(t=>{
      const b=document.createElement('button');
      b.className='tile'+(t.placed?' placed':'')+(t.fr&&!done?' fr':'');
      b.textContent=t.text;
      if(bankIn) b.style.setProperty('--i', String(bankEl.childElementCount));
      if(!t.placed && !done) b.onclick=()=>{
        if(ans.length>=need()) return;
        t.placed=true; ans.push(t); renderAll();
      };
      bankEl.appendChild(b);
    });
    bankEl.classList.toggle('bank-in', bankIn);
    if(bankIn) setTimeout(()=>bankEl.classList.remove('bank-in'), 700);
  }
  function renderAll(){
    renderFill(); renderBank();
    el('fillHint').classList.toggle('hidden', phase===1 || done || ans.length>0);
    el('confirmBtn').disabled = ans.length<need();
  }

  function toPhase2(){
    if(switching) return;
    switching=true;
    // 1박자 완료를 먼저 인정하고(놓은 프레임이 팝) 나서 나머지가 그 위로 자란다
    fillEl.querySelectorAll('.fill-word.frame-w').forEach(w=> w.classList.add('ok-pop'));
    setTimeout(()=>{
      if(!fillEl.isConnected) return;          // 전환 중 화면이 바뀌면 새 화면을 건드리지 않는다
      phase=1; ans=[]; switching=false;
      bank=shuffle(slotIdx.map((ti,i)=>({id:i, text:tok[ti].toLowerCase(), placed:false})));
      setProgress(2);
      el('koLine').innerHTML=sentTitleHtml(s);  // 표현 뜻 → 문장 뜻(표현 부분만 초록)
      el('koLine').classList.add('grow-in');

// 철자를 정확히 치느냐가 아니다. 화면에 `This`가 보이는데 `Thsi`로 쳤다고
// "이 낱말은 필요하지 않아요"라고 하면 아는 답이 막힌다.
// 바꿔치기(`thsi`↔`this`)가 가장 흔한 오타라 Damerau 거리를 쓴다.
function editDist(a,b){

      let v=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+c);
      if(i>1 && j>1 && a[i-1]===b[j-2] && a[i-2]===b[j-1]) v=Math.min(v, prev2[j-2]+1);
      cur[j]=v;

function frameWordFlags(words, frame){
  const flags=words.map(()=>false);
  const bare=w=>String(w).toLowerCase().replace(/[^a-z0-9']/g,'');
  let from=0;

    const ws=lit.split(/\s+/).map(w=>bare(w)).filter(Boolean);
    for(let i=from;i+ws.length<=words.length;i++){
      const hit=ws.every((w,k)=>{ const c=bare(words[i+k]);
        return c===w || ['s','es','ed','d','ing'].some(sfx=>c===w+sfx); });

// 문장 구조까지 새것이면 표현을 쓰는 과제가 아니라 새 문법을 푸는 과제가 된다.
// `Take off your sweater.`를 배우고 `Should I take off my shoes?`가 나오면(평서문 →
// 의문문 도치) 확 어려워지고, `How about a lemonade?` → `How about Thursday?`처럼
// **틀은 그대로 두고 단어만 바뀌는 것**이 딱 맞는 난이도다. 그래서 순서대로:
//   ① 학습 문장의 부분/포함 문장 제외 — 새로 세울 것이 없다
//   ② **조각 구조가 같은 것**(`F,S` ↔ `F,S`) — 난이도를 가르는 가장 큰 축(170/222 가능)
//   ③ **종결부호가 같은 것** — 평서문/의문문이 갈리면 구조가 멀어진다

const spkEnd=x=>{ const m=String(x).trim().match(/[.?!]+$/); return m?m[0][0]:'.'; };

// 넷을 모두 만족할 때만 인정한다. 하나라도 어긋나면 난이도가 튄다.
function isTwin(item, a){

      && spkShape(a.segs)===spkShape(item.baseSegs)

  const mats=spkMats, shape=spkShape, endp=spkEnd;
  const base=nz(item.sentence.en);
  const baseShape=shape(item.baseSegs), baseEnd=endp(item.sentence.en);

  const pool=cands.length?cands:(item.apply||[]);
  const free=pool.filter(a=>{ const x=nz(a.en); return !base.includes(x) && !x.includes(base); });
  let step=free.length?free:pool;
  // **틀은 그대로 두고 낱말만 바뀌는 짝**이 있으면 무조건 그것을 쓴다 — `Don't be late.`
  // → `Don't be sad.` 가 이 단계가 노리는 크기다. 표현은 내 손에서 나오면서도 문장이
  // 4낱말이라 부담이 없다. 조건은 넷을 모두 만족할 때뿐이다(하나라도 어긋나면 난이도가 튄다):
  // 재료 2낱말 이하 · 문장 5낱말 이하 · 조각 구조 일치 · 종결부호 일치.
  // 데이터에 그런 짝이 있는 문항은 38/222뿐이라, 나머지는 기존 규칙으로 고른다.
  const twin=step.filter(a=>isTwin(item, a));
  if(twin.length) step=twin;

                  endp(a.en)===baseEnd ? 0 : 1,
                  mats(a).length, a.en.split(/\s+/).length];

    if(!b) return a;
    const sb=score(b), sa=score(a);
    for(let i=0;i<sa.length;i++){ if(sa[i]!==sb[i]) return sa[i]<sb[i] ? a : b; }

}

// 후보는 형제 문장의 한국어를 그대로 쓰므로 새 데이터가 필요 없다 — 짧은 것부터 셋.

    <div class="stage-bottom" id="bottom">
      ${place?'<div class="bank" id="bank"></div>':''}
      <div class="vtools" id="vtools">
        <button class="vtool" id="hintBtn"><span class="ic">?</span><span id="hintLabel">표현 보기</span></button>
        <button class="vtool mic" disabled><span class="ic">🎤</span><span>음성 모드</span></button>
      </div>
      <div class="arr-btns" style="margin-top:12px">
        <button class="btn-confirm" id="okBtn" disabled>확인</button>
      </div>
    </div>`;

  const inp = place ? null : el('spCatch');
  const matEl = el('spMat'), wrongBox=el('wrongBox');
  if(inp) setTimeout(()=>inp.focus(), 80);
  const typedWords=()=> place ? ansArr.map(x=>String(x.text).trim()).filter(Boolean)
                              : inp.value.trim().split(/\s+/).filter(Boolean);

  // 답 자리를 낱말 칸으로 그린다. 칸 수는 대상 문장의 낱말 수(= 재료 + 표현)이고,
  // 그보다 많이 놓으면 넘친 칸을 덧붙여 표시한다. 재료를 감춰도(B) 이 칸은 남는다 —
  // 길이 감각이 백지의 막막함을 받쳐 주는 최소한의 지지대다.
  function renderSlots(){
    let h='';
    const n=Math.max(tok.length, place ? ansArr.length : inp.value.split(' ').length);
    if(place){
      for(let i=0;i<n;i++){
        const a=ansArr[i], ex=i>=tok.length?' extra':'';
        h+=`<span class="sp-slot${a&&!done?' on':''}${ex}"${a&&!done?` data-i="${i}"`:''}>${escapeHtml(a?a.text:'')}</span>`;
      }
    } else {
      const ws=inp.value.split(' ');
      for(let i=0;i<n;i++){
        const cur=(i===ws.length-1 && !done) ? ' cur' : '';
        const g=(gift.has(i) && bare(ws[i]||'')===bare(tok[i]||'')) ? ' gift' : '';
        h+=`<span class="sp-slot${cur}${g}${i>=tok.length?' extra':''}">${escapeHtml(ws[i]||'')}</span>`;
      }
    }
    el('spSlots').innerHTML=h;
    if(!place || done) return;
    // 놓은 카드를 눌러 되가져온다 — 배열 화면과 같은 규약
    el('spSlots').querySelectorAll('.sp-slot[data-i]').forEach(x=> x.onclick=()=>takeBack(+x.dataset.i));
  }
  function takeBack(i){
    const a=ansArr[i]; if(!a) return;
    a.placed=false; ansArr.splice(i,1);
    wrongBox.classList.add('hidden'); renderAll();
  }
  // 뱅크(C) — **프레임 타일을 초록으로 칠하지 않는다**. 어느 것이 방금 배운 표현인지
  // 알아보는 것이 과제라, 표시해 주면 과제가 사라진다.
  function renderBank(){
    const bankEl=el('bank'); if(!bankEl) return;
    bankEl.innerHTML='';
    bankArr.forEach(tl=>{
      const b=document.createElement('button');
      b.className='tile'+(tl.placed?' placed':'');
      b.textContent=tl.text;
      if(!tl.placed && !done) b.onclick=()=>{
        if(ansArr.length>=tok.length) return;
        tl.placed=true; ansArr.push(tl); renderAll();
      };
      bankEl.appendChild(b);
    });
  }
  // 입력에 쓴 낱말만큼 칩을 소진시킨다. 같은 낱말이 둘이면 둘 다 써야 둘 다 꺼진다.
  function syncMats(){
    if(!matEl) return;
    const left=new Map();
    typedWords().forEach(w=>{ const k=bare(w); if(k) left.set(k, (left.get(k)||0)+1); });
    matEl.querySelectorAll('.mat').forEach(m=>{
      const k=m.dataset.w, n=left.get(k)||0, use=n>0;
      if(use) left.set(k, n-1);
      m.classList.toggle('used', use);
    });
  }
  function updateOk(){
    el('okBtn').disabled = done || (place ? ansArr.length<tok.length : !inp.value.trim());
  }
  function renderAll(){
    renderSlots();
    if(place) renderBank(); else syncMats();
    updateOk();
  }
  renderAll();

  // 표현을 아직 안 썼을 때 여는 줄. [2] 화면과 같은 규약이라 새 표기가 아니다.
  function openTip(){
    const tip=el('nbTip');
    tip.innerHTML=nbTipHtml(item);
    tip.classList.remove('hidden');
  }
  // 오답으로 열려도 **사다리 첫 칸을 쓴 것**으로 친다 — 같은 지원을 두 번 세지 않는다
  function tipByFail(){ if(hintLevel===0) advanceHint(); else openTip(); }
  if(inp) inp.addEventListener('input', ()=>{
    if(!done) wrongBox.classList.add('hidden');
    renderAll();
  });

  // 방식 B의 "막힌 칸" — 모범 답안과 좌→우로 **처음 어긋나는 자리**다. 앞을 맞게 썼으면
  // 그다음 낱말이 나오고, 중간에서 잘못 갔으면 그 칸이 바로잡힌다. 아무 칸이나 채우면
  // 지원이 아니라 정답의 무작위 분할 지급이 된다.
  function gapIndex(){
    const ws=typedWords();
    let i=0;
    while(i<tok.length && i<ws.length && bare(ws[i])===bare(tok[i])) i++;
    return i<tok.length ? i : -1;
  }
  function fillGap(){
    const i=gapIndex(); if(i<0) return;
    const ws=typedWords();
    ws[i]=tok[i]; gift.add(i);
    inp.value=ws.join(' ')+(ws.length<tok.length?' ':'');
    wrongBox.classList.add('hidden'); renderAll();
  }

  function finish(exact, fixes){
    done=true;
    let said;
    if(place){
      said=typedWords().join(' ');
      said = exact ? t.en : said.charAt(0).toUpperCase()+said.slice(1)+trailPunct(t.en);
    } else {
      // 오타로 통과한 낱말은 **정답 철자로 굳힌다** — 내가 만든 문장으로 남는 것이므로
      // 틀린 철자가 그대로 남으면 안 된다. 무엇을 고쳤는지는 아래 한 줄로 짚어 준다.
      if(!exact && (fixes||[]).length){
        const ws=inp.value.trim().split(/\s+/);
        fixes.forEach(f=>{ if(ws[f.i]!==undefined) ws[f.i]=f.to; });
        inp.value=ws.join(' ');
      }
      if(exact) inp.value=t.en;
      inp.readOnly=true; inp.blur();
      said=inp.value.trim();
    }
    el('okBtn').disabled=true;
    el('card').classList.add('correct');
    if(!el('card').querySelector('.check-mark')){ const c=document.createElement('div'); c.className='check-mark'; c.textContent='✓'; el('card').appendChild(c); }
    builtSet.add(t.en);
    if(!made.some(x=>x.en===said)) made.push({en:said, kr:t.kr});
    wrongBox.classList.add('hidden'); el('nbTip').classList.add('hidden');
    const rn=el('revealNote');
    if(!exact && (fixes||[]).length){
      rn.classList.remove('hidden');
      rn.innerHTML=`철자<b>${fixes.map(f=>escapeHtml(f.from)+' → '+escapeHtml(f.to)).join(' · ')}</b>`;
    } else rn.classList.add('hidden');
    // 답 자리를 완성 문장으로 굳힌다 — 칸이 그대로 낱말 타일이 되고 프레임만 초록이라
    // 내가 놓은 것 중 무엇이 방금 배운 표현인지가 눈에 남는다
    const sw=said.split(/\s+/), sf=frameWordFlags(sw, item.frame);
    el('spIn').innerHTML=`<div class="sp-tiles">${sw.map((w,i)=>
      `<span class="sp-tile${sf[i]?' fr':''}">${escapeHtml(w)}</span>`).join('')}</div>`;
    if(matEl) matEl.classList.add('hidden');
    const bankEl=el('bank'); if(bankEl) bankEl.classList.add('hidden');
    el('card').insertAdjacentHTML('beforeend', resultActionsHtml());
    const p=item.pattern||{}, form=(p.form||'').trim(), pmean=(p.meaning||'').trim();
    // 효용감의 근거는 문구가 아니라 **같은 초록 조각이 두 문장에 반복되는 것**이다.
    // 학습 문장([2]·[3]에서 만든 것)과 방금 만든 문장을 나란히 둔다.
    el('payoffBox').innerHTML=`<div class="payoff">
        <div class="chat-tag rv">학습 정보</div>
        ${form?`<div class="pf-form">${escapeHtml(form).replace(/_{2,}|~/g,'<span class="slot"></span>')}</div>`:''}
        ${pmean?`<div class="pf-mean">${escapeHtml(pmean)}</div>`:''}
        <div class="pf-div"></div>
        <div class="pf-sub"><span class="ic">ⓘ</span>이 표현으로 만든 문장</div>
        <div class="pf-cmp"><div class="pf-cmp-en">${frameLine(item.sentence.en, item.baseSegs, item.frame)}</div>
          <div class="pf-cmp-kr">${escapeHtml(item.sentence.kr)}</div></div>
        <div class="pf-cmp"><div class="pf-cmp-en">${frameLine(said, exact?t.segs:null, item.frame)}</div>
          <div class="pf-cmp-kr">${escapeHtml(t.kr)}</div></div>
        ${exact?'':`<div class="pf-sub"><span class="ic">ⓘ</span>이렇게도 말해요</div>
        <div class="pf-cmp"><div class="pf-cmp-en">${frameLine(t.en, t.segs, item.frame)}</div></div>`}
      </div>`;
    el('bottom').innerHTML=arrangeBottomHtml(lastItem()?'완료하기':'다음 문제');
    el('nextBtn').onclick=advanceItem;
  }

  // 채점은 모범 답안과의 정확일치가 아니다 — 같은 한국어를 옮기는 영어는 여러 가지고,
  // 정확일치만 받으면 맞는 답을 틀렸다고 하게 된다(`It's time to go to school`).
  // 이 단계의 조건은 두 개뿐이다: **배운 표현을 썼는가**, **주어진 재료로만 만들었는가**.
  // 그래서 재료+프레임 낱말의 다중집합이 맞으면 어순이 달라도 통과시키고, 모범 답안과
  // 다르면 `ⓘ 이렇게도 말해요`로 함께 보여준다. 안 될 때는 무엇이 어긋났는지 짚어 준다.
  // 함정 낱말은 `allowed`에 넣지 않으므로 '필요하지 않아요'로 그대로 걸린다(C).
  // 쓴 낱말을 써야 할 낱말에 짝지운다 — 정확히 같은 것부터 맞추고, 남은 것만
  // 오타 하나까지 봐준다(순서를 바꾸면 멀쩡한 낱말이 오타로 잡힌다).
  const allowedWords=frWords.concat(matWords);
  function matchWords(typedArr){
    const need=allowedWords.map(bare), got=typedArr.map(bare);
    const usedN=need.map(()=>false), usedG=got.map(()=>false), fixes=[];
    got.forEach((g,gi)=>{ if(!g) { usedG[gi]=true; return; }
      const ni=need.findIndex((n,k)=>!usedN[k] && n===g);
      if(ni>=0){ usedN[ni]=true; usedG[gi]=true; } });
    got.forEach((g,gi)=>{ if(usedG[gi]) return;
      const ni=need.findIndex((n,k)=>!usedN[k] && nearWord(n,g));
      if(ni>=0){ usedN[ni]=true; usedG[gi]=true; fixes.push({i:gi, from:typedArr[gi], to:allowedWords[ni]}); } });
    return { extra:got.filter((_,i)=>!usedG[i]), missing:need.filter((_,i)=>!usedN[i]), fixes };
  }
  // 프레임 조각이 순서대로 들어 있는지(굴절·오타 허용) — 들어 있으면 **그 낱말들의
  // 자리**를 돌려준다. 채점이 인정한 자리를 그대로 오타 교정·길이 검사에 쓰므로
  // 무엇을 프레임으로 봤는지와 무엇을 고칠지가 어긋나지 않는다.
  const SFX=['s','es','ed','d','ing'];
  function framePositions(words){
    let from=0; const hit=[];
    const ok=(item.frame||[]).every(lit=>{
      const ws=lit.split(/\s+/).map(bare).filter(Boolean);
      for(let i=from;i+ws.length<=words.length;i++){
        if(ws.every((w,k)=>{ const c=words[i+k];
          return nearWord(c,w) || SFX.some(sfx=>nearWord(c,w+sfx)); })){
          ws.forEach((w,k)=>hit.push({at:i+k, want:w}));
          from=i+ws.length; return true;
        }
      }
      return false;
    });
    return ok ? hit : null;
  }
  function usedFrame(words){ return !!framePositions(words); }
  // E 는 재료를 주지 않으므로 **표현만 맞으면 통과**시킨다 — 같은 한국어를 옮기는 영어는
  // 여러 가지라, 재료로 답을 닫아 두지 않으면서 정확일치만 받으면 `다른 낱말이 생각나는`
  // 맞는 답이 전부 막힌다. 대신 프레임뿐인 답(`Don't be.`)은 문장이 아니므로 막는다.
  // 그때 프레임 낱말의 오타만 정답 철자로 굳힌다(굴절형은 건드리지 않는다).
  function frameFixes(words, pos){
    const frAll=(item.frame||[]).join(' ').split(/\s+/).filter(Boolean), fixes=[];
    pos.forEach(p=>{
      const w=words[p.at], b=bare(w);
      if(b===p.want) return;
      if(SFX.some(sfx=>p.want+sfx===b)) return;
      fixes.push({i:p.at, from:w, to:(frAll.find(f=>bare(f)===p.want) || p.want)});
    });
    return fixes;
  }
  el('okBtn').onclick=()=>{
    if(done) return;
    const words=typedWords();
    if(!words.length) return;
    const txt=words.join(' ');
    const nz=x=>x.toLowerCase().replace(/[^a-z0-9']+/g,' ').trim();
    const { extra, missing, fixes } = matchWords(words);
    wrongBox.classList.remove('hidden');
    if(nz(txt)===nz(t.en)) return finish(true, []);
    // 표현을 아직 안 썼으면 지적하는 대신 **오답노트 팁을 연다** — [2] 화면과 같은 규약
    const pos=framePositions(words.map(bare));
    if(!pos){ wrongBox.classList.add('hidden'); tipByFail(); return; }
    if(choose){
      if(words.length-pos.length<1){ wrongBox.innerHTML='표현만으로는 문장이 되지 않아요. 하고 싶은 말을 이어서 써 보세요.'; return; }
      return finish(false, frameFixes(words, pos));
    }
    if(extra.length){ wrongBox.innerHTML=`<b>${escapeHtml(extra.join(', '))}</b> 는 이 문장에 필요하지 않아요.`; return; }
    if(missing.length){ wrongBox.innerHTML=`<b>${escapeHtml(missing.join(', '))}</b> 를 아직 안 썼어요.`; return; }
    finish(false, fixes);                      // 표현 + 재료를 모두 썼으면 통과(오타는 교정해 준다)
  };

  // 지원 사다리 — **첫 칸은 언제나 `표현 보기`**다. [2] 화면에서 표현을 못 떠올렸을 때
  // 오답노트 팁을 여는 것과 같은 규약이고, 막혔을 때 가장 먼저 필요한 것도 표현이다.
  // 그다음 칸만 방식에 따라 갈린다. B의 `한 칸 채우기`는 **다 채울 때까지 반복**되는
  // 칸이라, 지원의 양을 유저가 필요한 만큼만 가져간다.
  const ladder = place
    ? [ {label:'표현 보기', run:openTip},
        {label:'정답 보기', note:()=>`정답<b>${escapeHtml(t.en)}</b>`} ]
    : V==='b'
    ? [ {label:'표현 보기', run:openTip},
        {label:'한 칸 채우기', run:fillGap, repeat:true, left:()=>gapIndex()>=0} ]
    : [ {label:'표현 보기', run:openTip},
        {label:'첫 단어 보기', note:()=>`첫 단어<b>${escapeHtml(tok[0])} …</b>`},
        {label:'정답 보기', note:()=>`정답<b>${escapeHtml(t.en)}</b>`} ];
  function advanceHint(){
    const d=ladder[hintLevel]; if(!d) return;
    if(d.run) d.run();
    if(d.note){ const rn=el('revealNote'); rn.classList.remove('hidden'); rn.innerHTML=d.note(); }
    if(!d.repeat) hintLevel++;
    const next = d.repeat ? (d.left() ? d : null) : ladder[hintLevel];
    if(next){ el('hintLabel').textContent=next.label; el('hintBtn').querySelector('.ic').textContent='✔'; }
    else { el('hintBtn').disabled=true; el('hintLabel').textContent='정답 공개됨'; wrongBox.classList.add('hidden'); }
  }
  el('hintBtn').onclick=()=>{ advanceHint(); if(inp) inp.focus(); };
}

// [5] 상황 ──────────────────────────────────────────────────────────────────────
// 기획 의도: "임의의 상황에서 배운 표현을 가지고 내가 새로 말을 할 수 있다".
// **영어를 보고 영어로 인출**하는 단계이므로 푸는 동안 한국어 해석을 노출하지 않는다.
//
// 자유 입력으로 만들었더니 "뭘 써야 할지 감이 안 온다"는 문제가 생겼다 — 답의 범위가
// 보이지 않기 때문이다. 듀오링고는 이 자리에서 **응답을 2~3개 중에 고르게** 한다:
// 선택지가 전부 직전에 배운 문장이라 답의 범위가 보이고, 오답은 문법은 맞지만 상황에
// 안 맞는 문장이라 과제가 **문맥 적합성 판단**이 된다. 그 형태를 따른다.
//   · 지시문은 한국어지만 generic 하다(`적절히 답변하세요`) — 정답의 번역이 아니다
//   · 오답 선택지는 같은 구간의 다른 표현 문장에서 뽑는다 → 새 데이터가 필요 없다
//   · 정답 후에야 `의미:`로 한국어를 열고 A 해석도 함께 공개한다
// 자유 입력 버전은 `ve:opts.sitType` 으로 비교할 수 있게 남겨둔다(기본 = 선택형).
function renderSituation(target, pool){
  setProgress(sitOnly ? 0 : 4);
  const sit=target.situation;
  const typing = sitOnly && sitTypeMode;   // 직접 입력은 '상황만 풀기'의 별도 진입점에서만
  let done=false, picked=null, revealedList=false;

  // 오답 — 같은 구간(또는 인접 문항)의 다른 표현 문장. 문법은 맞고 상황엔 안 맞는다.
  const frameKey=x=>(x.frame||[]).join(' ').toLowerCase();
  const wrongs=(pool||[]).filter(x=>x.en!==target.en && frameKey(x)!==frameKey(target)).slice(0,2);
  const choices=shuffle([{...target, ok:true}].concat(wrongs.map(x=>({...x, ok:false}))));

  stage.innerHTML=`
    <div class="stage-scroll">
      <div class="chat-card" id="card">
        <div class="chat-tag rv">상황</div>
        <div class="sit-task">A의 말을 보고 적절히 답변하세요</div>
        <div class="sit-turn a">
          <div class="sit-role">A</div>
          <div class="sit-bubble">
            <div class="sit-en">${escapeHtml(sit.a_en)}</div>
            <div class="sit-kr hidden" id="aKr">${escapeHtml(sit.a_kr)}</div>
          </div>
        </div>
        <div id="sitAnswer"></div>
        <div class="sit-fb hidden" id="sitFb"></div>
        ${sitOnly ? devPanel(target, choices, typing) : ''}
      </div>
      <div id="sitDone"></div>
    </div>
    <div class="stage-bottom" id="bottom"></div>`;

  const ansBox=el('sitAnswer'), fb=el('sitFb');

  function escapeRe(x){ return x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
  function usedFrame(txt){
    return (target.frame||[]).every(lit=>{
      const ws=lit.split(/\s+/).map(w=>w.replace(/[^A-Za-z']/g,''));
      const pat=new RegExp('\\b'+ws.map(w=>escapeRe(w)+"(?:s|es|ed|d|ing)?").join('\\s+')+'\\b','i');
      return pat.test(txt);
    });
  }

  // ── 선택형 (기본) ──
  // 선택지는 전부 직전에 배운 문장이고 오답은 **문법은 맞지만 상황에 안 맞는** 문장이라
  // 과제가 문맥 적합성 판단이 된다. 표현 칩을 고르게 해본 버전(v2)은 정작 '말한다'는
  // 감각이 더 옅어져 되돌렸다 — 여기서 남는 건 완성된 한 문장이어야 한다.
  function renderPick(){
    ansBox.innerHTML=`<div class="sit-opts">${choices.map((c,i)=>
      `<button class="sit-opt" data-i="${i}" data-ok="${c.ok?1:0}"><span class="ic">🎤</span>${escapeHtml(c.en)}</button>`).join('')}</div>`;
    el('bottom').innerHTML=`<div class="arr-btns">
        <button class="btn-ghost2" id="skipBtn"><span class="ic">↷</span>건너뛰기</button>
        <button class="btn-confirm" id="okBtn" disabled>확인</button>
      </div>`;
    el('skipBtn').onclick=goNext;
    ansBox.querySelectorAll('.sit-opt').forEach(b=> b.onclick=()=>{
      if(done) return;
      ansBox.querySelectorAll('.sit-opt').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); picked=choices[+b.dataset.i];
      el('okBtn').disabled=false;
    });
    el('okBtn').onclick=()=>{
      if(!picked) return;
      if(!picked.ok){
        ansBox.querySelector('.sit-opt.on').classList.add('bad');
        fb.classList.remove('hidden');
        fb.innerHTML=`<div class="sit-wrong">이 상황에는 맞지 않아요. 다시 골라 볼까요?</div>`;
        picked=null; el('okBtn').disabled=true;
        return;
      }
      finish(picked.en);
    };
  }

  // ── 직접 입력 (비교 버전) ──
  function renderType(){
    ansBox.innerHTML=`
      <div class="sit-turn b">
        <div class="sit-role">B</div>
        <div class="sit-bubble mine">
          <textarea class="sit-input" id="sitIn" rows="1" autocomplete="off"
            autocapitalize="off" autocorrect="off" spellcheck="false"
            placeholder="Type in English"></textarea>
        </div>
      </div>`;
    el('bottom').innerHTML=`
      <div class="vtools">
        <button class="vtool" id="hintBtn2"><span class="ic">?</span><span id="hintLbl2">배운 표현 보기</span></button>
        <button class="vtool mic" id="skipBtn"><span class="ic">↷</span><span>건너뛰기</span></button>
      </div>
      <div class="arr-btns" style="margin-top:12px">
        <button class="btn-confirm" id="okBtn" disabled>말하기</button>
      </div>`;
    const inp=el('sitIn');
    setTimeout(()=>inp.focus(), 80);
    inp.addEventListener('input', ()=>{
      inp.style.height='auto'; inp.style.height=inp.scrollHeight+'px';
      el('okBtn').disabled = !inp.value.trim() || done;
    });
    el('skipBtn').onclick=goNext;

    // 아무 단서 없이 쓰게 하면 막히고, 다 주면 인출이 아니다 — 지원을 한 칸씩만 연다.
    // [1] 어휘의 `힌트 보기 → 정답 보기` 규약을 그대로 쓴다.
    const STEPS=[
      { lbl:'표현 좁히기', html:()=>`<div class="sit-hint"><b>배운 표현</b>
          ${[...new Set(choices.map(c=>(c.frame||[]).join(' … ')))].map(f=>`<span class="rv-chip fr">${escapeHtml(f)}</span>`).join('')}</div>` },
      { lbl:'첫 단어 보기', html:()=>`<div class="sit-hint"><b>이 상황의 표현</b>
          <span class="rv-chip fr">${escapeHtml((target.frame||[]).join(' … '))}</span></div>` },
      { lbl:'정답 보기', html:()=>`<div class="sit-hint"><b>첫 단어</b>
          <span class="rv-chip fr">${escapeHtml(target.en.split(/\s+/)[0])} …</span></div>` },
      { lbl:'', html:()=>`<div class="sit-hint answer"><b>정답</b>
          <span class="rv-chip fr">${escapeHtml(target.en)}</span></div>` },
    ];
    let step=0;
    el('hintBtn2').onclick=()=>{
      if(step>=STEPS.length) return;
      fb.classList.remove('hidden');
      fb.innerHTML=STEPS[step].html();
      const next=STEPS[step].lbl;
      step++;
      if(next) el('hintLbl2').textContent=next;
      else { el('hintBtn2').disabled=true; el('hintLbl2').textContent='정답 공개됨'; }
      inp.focus();
    };
    el('okBtn').onclick=()=>{
      const txt=inp.value.trim();
      if(!txt) return;
      if(!usedFrame(txt)){
        fb.classList.remove('hidden'); revealedList=false;
        fb.innerHTML=`<div class="sit-wrong">배운 표현이 아직 안 보여요. 다시 떠올려 볼까요?</div>`;
        return;
      }
      inp.readOnly=true; inp.classList.add('ok');
      finish(txt);
    };
  }

  // 정답 후에야 한국어를 연다 — 듀오링고의 `의미:` 자리
  function finish(said){
    done=true;
    made.push({en:said, kr:target.kr});
    fb.classList.add('hidden');
    el('card').classList.add('correct');
    el('aKr').classList.remove('hidden');
    if(!typing){
      ansBox.querySelectorAll('.sit-opt').forEach(b=>{
        b.disabled=true;
        if(b.dataset.ok==='1') b.classList.add('good');
      });
    }
    const pf=(target.form||'').trim(), pm=(target.meaning||'').trim();
    const exact = norm(said)===norm(target.en);
    // `의미`는 **내가 말한 문장**의 뜻이다. 직접 입력에서 모범 답안과 다르면
    // 모범 답안의 한국어를 내 문장의 뜻으로 붙일 수 없다 — 따로 떼어 보여준다.
    el('card').insertAdjacentHTML('beforeend', resultActionsHtml());
    el('sitDone').innerHTML=`<div class="payoff">
        <div class="chat-tag rv">학습 정보</div>
        <div class="pf-ok"><span class="ic">✓</span>좋아요!</div>
        ${exact?`<div class="pf-label">의미</div>
        <div class="pf-mean big">${escapeHtml(target.kr)}</div>`:''}
        ${pf?`<div class="pf-sub"><span class="ic">ⓘ</span>쓴 표현</div>
        <div class="pf-form">${escapeHtml(pf).replace(/_{2,}|~/g,'<span class="slot"></span>')}</div>
        ${pm?`<div class="pf-mean">${escapeHtml(pm)}</div>`:''}`:''}
        ${exact?'':`<div class="pf-sub"><span class="ic">ⓘ</span>이 상황에선 이렇게 말해요</div>
        <div class="pf-cmp"><div class="pf-cmp-en">${escapeHtml(target.en)}</div><div class="pf-cmp-kr">${escapeHtml(target.kr)}</div></div>`}
      </div>`;
    el('bottom').innerHTML=`<button class="btn-next" id="goBtn">계속하기</button>`;
    el('goBtn').onclick=goNext;
  }

  function goNext(){
    if(sitOnly){
      if(itemIdx>=sessionItems.length-1) return renderDone();
      itemIdx++; return showSituation();
    }
    itemIdx++; renderVocab();
  }

  typing ? renderType() : renderPick();
}

// 개발 확인용 — 이 상황이 어떤 표현으로 만들어졌고 오답이 어디서 왔는지.
// 학습 UI 가 아니므로 점선·모노 표기로 확실히 구분한다.
function devPanel(target, choices, typing){
  const wrongs=choices.filter(c=>!c.ok);
  const row=(c,label)=>`<div class="dev-row"><span class="dev-tag ${c.ok?'ok':''}">${label}</span>
      <span class="dev-en">${escapeHtml(c.en)}</span>
      <span class="dev-fr">${escapeHtml((c.frame||[]).join(' … ') || '—')}</span></div>`;
  return `<div class="devbox">
      <div class="dev-h">DEV · 이 상황의 근거</div>
      <div class="dev-row"><span class="dev-tag ok">정답</span>
        <span class="dev-en">${escapeHtml(target.en)}</span>
        <span class="dev-fr">${escapeHtml((target.frame||[]).join(' … '))}</span></div>
      <div class="dev-row"><span class="dev-tag">표현</span>
        <span class="dev-en">${escapeHtml(target.form||'—')}</span>
        <span class="dev-fr">${escapeHtml(target.meaning||'')}</span></div>
      ${typing ? '' : wrongs.map(c=>row(c,'오답')).join('')}
      <div class="dev-row"><span class="dev-tag">A 대사</span>
        <span class="dev-en">${escapeHtml(target.situation.a_en)}</span>
        <span class="dev-fr">손저작 (situations.json)</span></div>
    </div>`;
}

// 상황 전용 모드 — 오답 선택지는 인접 문항에서 뽑는다
function showSituation(){
  curStep=showSituation;
  const it=sessionItems[itemIdx];
  const near=sessionItems.filter((_,i)=>i!==itemIdx)
    .slice(Math.max(0,itemIdx-2), itemIdx+3)
    .map(x=>({en:x.sentence.en, kr:x.sentence.kr, frame:x.frame}));
  renderSituation(sitTarget(it), shuffle(near));
}
function sitTarget(it){
  return {en:it.sentence.en, kr:it.sentence.kr, frame:it.frame, segs:it.baseSegs, situation:it.situation,
          form:(it.pattern||{}).form, meaning:(it.pattern||{}).meaning};
}

// 구간이 끝나면 [5]로 — 상황 대사가 붙은 문항이 구간에 있을 때만 열린다
function renderReview(){
  const start=Math.max(0, itemIdx-REVIEW_EVERY+1);
  const block=sessionItems.slice(start, itemIdx+1);
  const withSit=block.filter(it=>it.situation);
  if(!withSit.length){ itemIdx++; return renderVocab(); }
  const it=withSit[withSit.length-1];
  const pool=block.filter(x=>x!==it).map(x=>({en:x.sentence.en, kr:x.sentence.kr, frame:x.frame}));
  renderSituation(sitTarget(it), shuffle(pool));
}

// ── 완료 ──// ── 완료 ──────────────────────────────────────────────────────────────────────
function renderDone(){
  if(!sampleMode) setPos(sessionItems.length);
  topbar.classList.add('hidden'); stage.classList.remove('hidden'); home.classList.add('hidden');
  const items=learned.length?learned:sessionItems;
  const modeWord = '표현';
  stage.innerHTML=`<div class="done">
    <div class="emoji">🎉</div>
    <h2>${items.length}문항 완료!</h2>
    <p>어휘 ${items.length}개와 서로 다른 ${modeWord} ${items.length}개를 배웠어요.</p>
    ${made.length?`<div class="learned-list">
      <div class="h">내가 직접 말한 문장 ${made.length}개</div>
      ${made.map(x=>`<div class="it"><span class="en">${escapeHtml(x.en)}</span><br>${escapeHtml(x.kr)}</div>`).join('')}
    </div>`:''}
    <div class="learned-list">
      <div class="h">배운 어휘 & ${modeWord}</div>
      ${items.map(it=>`<div class="it"><b>${escapeHtml(it.word)}</b> · ${escapeHtml(it.meaning)}<br><span class="en">${escapeHtml(it.sentence.en)}</span></div>`).join('')}
    </div>
    <div class="row" style="margin-top:8px;">
      <button class="btn ghost" id="againBtn">처음부터 다시</button>
      <button class="btn" id="homeBtn">홈으로</button>
    </div>
  </div>`;
  el('againBtn').onclick=()=> sampleMode && sampleRestart ? sampleRestart() : (setPos(0), startSession(0));
  el('homeBtn').onclick=()=>renderHome();
}
</script>
