    // 주어지는 낱말 — 지원 단계가 형태를 정한다. 0단은 **조각을 문장 순서대로**(순서를
    // 숨길 이유가 없다 — 이 줄의 용도는 표현 말고는 떠올릴 것이 없게 만드는 것이다),
    // 1단은 **낱말로 쪼개 섞어서**(A의 `함께 쓸 낱말` 줄과 같은 표기라 새 표기가 아니다),
    // 2단은 주지 않는다. 화면이 덜 해주는 것이 곧 내가 나아졌다는 근거다.
    const pieces=(t.segs||[]).filter(s=>s.t==='slot').map(s=>s.s.trim()).filter(s=>/[a-z0-9]/i.test(s));
    const gives=spkGives(own, t);
    let hintLevel=0;

    el('shRows').innerHTML = doneHtml() + `
      <div class="sh-row cur grow-in">${numbered()?`<span class="sh-n">${wrote.length+1}</span>`:''}
        <div class="sh-body">
          ${t.again?`<div class="sh-rv again">한 번 더</div>`:''}
          ${spkAskHtml(t)}${spkKrHtml(t)}
          ${spkGivesHtml(gives, 'spMatRow')}
          <div class="sp-in" id="spIn"><div class="sp-slots" id="spSlots"></div><input class="sp-catch" id="spCatch" type="text"
            autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" /></div>
        </div></div>`;
    const inp=el('spCatch');
    wrongBox.classList.add('hidden');
    el('nbTip').classList.add('hidden');
    el('revealNote').classList.add('hidden');
    setTimeout(()=>inp.focus(), 80);

    const typedWords=()=>inp.value.trim().split(/\s+/).filter(Boolean);
    function renderSlots(){
      const ws=inp.value.split(' '), n=Math.max(tok.length, ws.length);
      let h='';
      for(let i=0;i<n;i++)
        h+=`<span class="sp-slot${i===ws.length-1?' cur':''}${i>=tok.length?' extra':''}">${escapeHtml(ws[i]||'')}</span>`;
      el('spSlots').innerHTML=h;
      el('okBtn').disabled=!inp.value.trim();
    }
    renderSlots();
    const matRow=el('spMatRow');
    // 쓴 낱말만큼 칩을 죽인다(A와 같은 규약) — 이 줄의 용도는 '아직 뭐가 남았나'다
    function syncMats(){
      if(!matRow) return;
      const left=new Map();
      typedWords().forEach(w=>{ const k=bare(w); if(k) left.set(k, (left.get(k)||0)+1); });
      matRow.querySelectorAll('.mat').forEach(m=>{
        const k=m.dataset.w, n=left.get(k)||0, use=n>0;
        if(use) left.set(k, n-1);
        m.classList.toggle('used', use);
      });
    }
    syncMats();
    inp.addEventListener('input', ()=>{ wrongBox.classList.add('hidden'); renderSlots(); syncMats(); });

    // 채점은 방식과 무관하게 같은 함수를 쓴다 — 표현을 썼는가 + 주어진 낱말로만 만들었는가.
    const matchWords=arr=>spkMatch(arr, allowedWords);

    function pass(exact, fixes){
      let said=inp.value.trim();
      if(!exact && (fixes||[]).length){
        const ws=said.split(/\s+/);
        fixes.forEach(f=>{ if(ws[f.i]!==undefined) ws[f.i]=f.to; });
        said=ws.join(' ');
      }
      if(exact) said=t.en;
      builtSet.add(t.en);
      if(!made.some(x=>x.en===said)) made.push({en:said, kr:t.kr});
      // 통과한 줄은 **모범 표기로 굳혀** 위에 쌓는다 — 다음 줄을 쓰는 동안 바로 위에
      // 같은 초록 조각이 남아 있어야 '같은 표현을 자리만 바꿔 쓰고 있다'가 보인다.
      wrote.push({en:said, kr:t.kr, krMark:t.krMark||null, own, again:!!t.again, segs:(exact||!fixes||!fixes.length)&&said===t.en?t.segs:null,
                  alt:said!==t.en?t.en:null,
                  fixes:(fixes||[]).map(f=>f.from+' → '+f.to)});
      // 막힌 줄이면 같은 표현으로 한 줄 더 — 잘 넘긴 유저에게는 반복을 시키지 않는다
      if(struggled && poolNext<pool.length)
        rows.splice(ri+1, 0, Object.assign({}, pool[poolNext++], {again:true}));
      ri++;
      if(ri<rows.length) startRow(); else finish();
    }

    el('okBtn').onclick=()=>{
      const words=typedWords();
      if(!words.length) return;
      const nz=x=>x.join(' ').toLowerCase().replace(/[^a-z0-9']+/g,' ').trim();
      if(nz(words)===nz(tokenize(t.en).concat(trailPunct(t.en)))) return pass(true, []);
      struggled=true; itemStuck=true;
      wrongBox.classList.remove('hidden');
      // 표현을 아직 안 썼으면 지적하는 대신 **오답노트 팁을 연다**([2]·A와 같은 규약).
      // 그때 사다리 첫 칸을 쓴 것으로 친다 — 같은 지원을 두 번 세지 않는다.
      if(!framePos(words.map(bare), own.frame)){
        wrongBox.classList.add('hidden');
        if(hintLevel===0 && ladder[0].run) hb.click(); else openTip(own);
        return;
      }
      const { extra, missing, fixes } = matchWords(words);
      if(extra.length){ wrongBox.innerHTML=`<b>${escapeHtml(extra.join(', '))}</b> 는 이 문장에 필요하지 않아요.`; return; }
      if(missing.length){ wrongBox.innerHTML=`<b>${escapeHtml(missing.join(', '))}</b> 를 아직 안 썼어요.`; return; }
      pass(false, fixes);
    };

    // 사다리 첫 칸은 `표현 보기`다([2]·A와 같은 규약) — 표현은 화면 어디에도 없다.
    // 단 **두 줄째부터는 빼낸다**: 내가 쓴 줄이 위에 있고 거기 표현이 초록으로 보이므로
    // 같은 것을 두 번 주게 된다.
    const ladder=[ ...(wrote.length?[]:[{label:'표현 보기', run:()=>openTip(own)}]),
                   // 2단은 낱말을 안 주므로 **한 칸으로 되돌릴 수 있어야** 백지가 막막해지지 않는다.
                   // 지원을 아예 없애 놓고 되돌릴 길을 안 두면 그건 벌이지 졸업이 아니다.
                   ...(aidLevel===2?[{label:'낱말 보기', note:()=>`낱말<b>${escapeHtml(pieces.join(' · '))}</b>`}]:[]),
                   {label:'첫 단어 보기', note:()=>`첫 단어<b>${escapeHtml(tok[0])} …</b>`},
                   {label:'정답 보기', note:()=>`정답<b>${escapeHtml(t.en)}</b>`} ];
    const hb=el('hintBtn'), hl=el('hintLabel');
    hb.disabled=false; hb.querySelector('.ic').textContent='?'; hl.textContent=ladder[0].label;
    hb.onclick=()=>{
      const d=ladder[hintLevel]; if(!d) return;
      struggled=true; itemStuck=true;
      if(d.run) d.run();
      if(d.note){ const rn=el('revealNote'); rn.classList.remove('hidden'); rn.innerHTML=d.note(); }
      hintLevel++;
      const next=ladder[hintLevel];
      if(next){ hl.textContent=next.label; hb.querySelector('.ic').textContent='✔'; }
      else { hb.disabled=true; hl.textContent='정답 공개됨'; wrongBox.classList.add('hidden'); }
      inp.focus();
    };
  }

  function finish(){
    // 막히지 않고 넘겼으면 다음 문항은 앱이 **덜** 해준다. 막혔으면 한 칸 되돌린다.
    setAid(itemStuck ? aidLevel-1 : aidLevel+1);
    el('shRows').innerHTML=doneHtml();
    el('okBtn').disabled=true;
    wrongBox.classList.add('hidden'); el('nbTip').classList.add('hidden');
    el('card').classList.add('correct');
    if(!el('card').querySelector('.check-mark')){ const c=document.createElement('div'); c.className='check-mark'; c.textContent='✓'; el('card').appendChild(c); }
    const fixes=wrote.flatMap(w=>w.fixes), rn=el('revealNote');
    if(fixes.length){ rn.classList.remove('hidden'); rn.innerHTML=`철자<b>${escapeHtml(fixes.join(' · '))}</b>`; }
    else rn.classList.add('hidden');
    el('card').insertAdjacentHTML('beforeend', resultActionsHtml());
    const form=(p.form||'').trim(), pmean=(p.meaning||'').trim();
    const alts=wrote.filter(w=>w.alt);
    el('payoffBox').innerHTML=`<div class="payoff">
        <div class="chat-tag rv">학습 정보</div>
        ${form?`<div class="pf-form">${escapeHtml(form).replace(/_{2,}|~/g,'<span class="slot"></span>')}</div>`:''}
        ${pmean?`<div class="pf-mean">${escapeHtml(pmean)}</div>`:''}
        <div class="pf-div"></div>
        <div class="pf-sub"><span class="ic">ⓘ</span>이 표현으로 만든 문장</div>
        <div class="pf-cmp"><div class="pf-cmp-en">${frameLine(item.sentence.en, item.baseSegs, item.frame)}</div>
          <div class="pf-cmp-kr">${escapeHtml(item.sentence.kr)}</div></div>
        ${wrote.map(w=>`<div class="pf-cmp"><div class="pf-cmp-en">${frameLine(w.en, w.segs, item.frame)}</div>
          <div class="pf-cmp-kr">${escapeHtml(w.kr)}</div></div>`).join('')}
        ${alts.length?`<div class="pf-sub"><span class="ic">ⓘ</span>이렇게도 말해요</div>
        ${alts.map(w=>`<div class="pf-cmp"><div class="pf-cmp-en">${frameLine(w.alt, null, item.frame)}</div></div>`).join('')}`:''}
      </div>`;
    el('bottom').innerHTML=arrangeBottomHtml(lastItem()?'완료하기':'다음 문제');
    el('nextBtn').onclick=advanceItem;
  }

  startRow();
}


// 방식 C — **트랩 배열**. 낱말을 탭해 배열하고 뱅크에 함정이 섞인다.
// `함께 쓸 낱말`이라면서 안 쓸 낱말을 주면 화면이 거짓말을 하지만, 배열 뱅크는 애초에
// "이 중에서 고르라"는 약속이라 그 문제가 없다 — 그래서 재료 줄 대신 `[2]`·`[3]`과
// 같은 `.bank`를 쓴다. **뱅크의 프레임 타일을 초록으로 칠하지 않는다** — 어느 것이 방금
// 배운 표현인지 알아보는 것이 과제라, 표시해 주면 과제가 사라진다.
function renderSpeakArrange(t){
  curStep=renderSpeak;
  const item=sessionItems[itemIdx];
  setProgress(3);
  const p=item.pattern||{};
  const bare=w=>String(w).toLowerCase().replace(/[^a-z0-9']/g,'');
  const tok=tokenize(t.en), flag = t.segs ? frameFlags(tok, t.segs) : frameWordFlags(tok, item.frame);
  // 함정은 데이터에 이미 있는 `traps`(다른 표현들의 내용어)를 쓰므로 새 저작이 필요 없다.
  // 대상 문장에 이미 든 낱말은 함정이 될 수 없으니 걸러낸다.
  const traps=(item.traps||[]).filter(w=>!tok.some(x=>bare(x)===bare(w))).slice(0,2);
  let done=false, hintLevel=0, ansArr=[];
  const bankArr=shuffle(tok.map((w,i)=>({id:i, text:w.toLowerCase(), placed:false}))
    .concat(traps.map((w,i)=>({id:900+i, text:String(w).toLowerCase(), placed:false}))));

  stage.innerHTML=`
    <div class="stage-scroll">
      <div class="chat-card" id="card">
        <div class="chat-tag rv">말해보기</div>
        ${spkHeadHtml(item)}${spkAskHtml(t)}${spkMode==='dlg'?'':spkKrHtml(t)}
        <div class="nb-tip hidden" id="nbTip"></div>
        ${spkAnswerHtml(t, `<div class="sp-in" id="spIn"><div class="sp-slots" id="spSlots"></div></div>`)}
        ${spkAfterHtml(t)}
        <div class="wrong-box hidden" id="wrongBox"></div>
        <div class="reveal-note hidden" id="revealNote"></div>
      </div>
      <div id="payoffBox"></div>
    </div>
    <div class="stage-bottom" id="bottom">
      <div class="bank" id="bank"></div>
      <div class="vtools" id="vtools">
        <button class="vtool" id="hintBtn"><span class="ic">?</span><span id="hintLabel">표현 보기</span></button>
        <button class="vtool mic" disabled><span class="ic">🎤</span><span>음성 모드</span></button>
      </div>
      <div class="arr-btns" style="margin-top:12px">
        <button class="btn-confirm" id="okBtn" disabled>확인</button>
      </div>
    </div>`;
  const wrongBox=el('wrongBox');

  function renderSlots(){
    const n=Math.max(tok.length, ansArr.length);
    let h='';
    for(let i=0;i<n;i++){
      const a=ansArr[i], on=(a&&!done);
      h+=`<span class="sp-slot${on?' on':''}${i>=tok.length?' extra':''}"${on?` data-i="${i}"`:''}>${escapeHtml(a?a.text:'')}</span>`;
    }
    el('spSlots').innerHTML=h;
    if(done) return;
    // 놓은 카드를 눌러 되가져온다 — 배열 화면과 같은 규약
    el('spSlots').querySelectorAll('.sp-slot[data-i]').forEach(x=> x.onclick=()=>{
      const a=ansArr[+x.dataset.i]; if(!a) return;
      a.placed=false; ansArr.splice(+x.dataset.i,1);
      wrongBox.classList.add('hidden'); renderAll();
    });
  }
  function renderBank(){
    const bankEl=el('bank'); bankEl.innerHTML='';
    bankArr.forEach(tl=>{
      const b=document.createElement('button');
      b.className='tile'+(tl.placed?' placed':'');
      b.textContent=tl.text;
      if(!tl.placed && !done) b.onclick=()=>{
        if(ansArr.length>=tok.length) return;
        tl.placed=true; ansArr.push(tl); renderAll();
      };
      bankEl.appendChild(b);
    });
  }
  function renderAll(){ renderSlots(); renderBank(); el('okBtn').disabled = done || ansArr.length<tok.length; }
  renderAll();

  function openTip(it){ const tip=el('nbTip'); tip.innerHTML=nbTipHtml(it||item); tip.classList.remove('hidden'); }

  const frWords=tok.filter((w,i)=>flag[i]), matWords=tok.filter((w,i)=>!flag[i]);
  const allowedWords=frWords.concat(matWords);
  el('okBtn').onclick=()=>{
    if(done) return;
    const words=ansArr.map(x=>x.text);
    const nz=x=>x.join(' ').toLowerCase().replace(/[^a-z0-9']+/g,' ').trim();
    if(nz(words)===nz(tok)) return finish(true);
    wrongBox.classList.remove('hidden');
    if(!framePos(words.map(bare), item.frame)){
      wrongBox.classList.add('hidden');
      if(hintLevel===0) advanceHint(); else openTip();
      return;
    }
    // 함정은 `allowedWords`에 없으므로 그대로 걸린다
    const need=allowedWords.map(bare).sort().join('|'), got=words.map(bare).sort().join('|');
    if(need!==got){
      const extra=words.filter(w=>!allowedWords.some(a=>bare(a)===bare(w)));
      wrongBox.innerHTML = extra.length
        ? `<b>${escapeHtml(extra.join(', '))}</b> 는 이 문장에 필요하지 않아요.`
        : `아직 다 쓰지 않은 낱말이 있어요.`;
      return;
    }
    finish(false);
  };

  function finish(exact){
    done=true;
    let said=ansArr.map(x=>x.text).join(' ');
    said = exact ? t.en : said.charAt(0).toUpperCase()+said.slice(1)+trailPunct(t.en);
    el('okBtn').disabled=true;
    el('card').classList.add('correct');
    if(!el('card').querySelector('.check-mark')){ const c=document.createElement('div'); c.className='check-mark'; c.textContent='✓'; el('card').appendChild(c); }
    builtSet.add(t.en);
    if(!made.some(x=>x.en===said)) made.push({en:said, kr:t.kr});
    wrongBox.classList.add('hidden'); el('nbTip').classList.add('hidden');
    const sw=said.split(/\s+/), sf=frameWordFlags(sw, item.frame);
    el('spIn').innerHTML=`<div class="sp-tiles">${sw.map((w,i)=>
      `<span class="sp-tile${sf[i]?' fr':''}">${escapeHtml(w)}</span>`).join('')}</div>`;
    el('bank').classList.add('hidden');
    // 뒷 대사는 내가 채우기 전까지 흐려 둔다 — 내 말이 들어가서야 대화가 이어진다
    const after=el('card').querySelector('.dlg-after');
    if(after) after.classList.add('on');
    el('card').insertAdjacentHTML('beforeend', resultActionsHtml());
    const form=(p.form||'').trim(), pmean=(p.meaning||'').trim();
    el('payoffBox').innerHTML=`<div class="payoff">
        <div class="chat-tag rv">학습 정보</div>
        ${form?`<div class="pf-form">${escapeHtml(form).replace(/_{2,}|~/g,'<span class="slot"></span>')}</div>`:''}
        ${pmean?`<div class="pf-mean">${escapeHtml(pmean)}</div>`:''}
        <div class="pf-div"></div>
        <div class="pf-sub"><span class="ic">ⓘ</span>이 표현으로 만든 문장</div>
        <div class="pf-cmp"><div class="pf-cmp-en">${frameLine(item.sentence.en, item.baseSegs, item.frame)}</div>
          <div class="pf-cmp-kr">${escapeHtml(item.sentence.kr)}</div></div>
        <div class="pf-cmp"><div class="pf-cmp-en">${frameLine(said, exact?t.segs:null, item.frame)}</div>
          <div class="pf-cmp-kr">${escapeHtml(t.kr)}</div></div>
      </div>`;
    el('bottom').innerHTML=arrangeBottomHtml(lastItem()?'완료하기':'다음 문제');
    el('nextBtn').onclick=advanceItem;
  }

  // 뱅크에 낱말이 다 있으므로 `첫 단어 보기`는 의미가 없다 — 표현 다음이 바로 정답이다
  const ladder=[ {label:'표현 보기', run:openTip},
                 {label:'정답 보기', note:()=>`정답<b>${escapeHtml(t.en)}</b>`} ];
  function advanceHint(){
    const d=ladder[hintLevel]; if(!d) return;
    if(d.run) d.run();
    if(d.note){ const rn=el('revealNote'); rn.classList.remove('hidden'); rn.innerHTML=d.note(); }
    hintLevel++;
    const next=ladder[hintLevel];
    if(next){ el('hintLabel').textContent=next.label; el('hintBtn').querySelector('.ic').textContent='✔'; }
    else { el('hintBtn').disabled=true; el('hintLabel').textContent='정답 공개됨'; wrongBox.classList.add('hidden'); }
  }
  el('hintBtn').onclick=advanceHint;
}

// [4] O 「내 말로 하나」 ────────────────────────────────────────────────────────
// **답을 닫으려고 재료를 화면에 놓는 순간 과제가 조립이 된다** — 낱말을 다 주는
// 연습지(H)든 섞어 주는 재료(A)든 후보 목록(W)이든 같은 실패였다. 답을 닫으려고
// 준 것이 매번 답을 대신 써 줬다.
//
// 일본어 수업의 와우(`~の上に~が あります`를 배우고 "앞에 있는 거라면 뭐든 말할 수
// 있겠구나")는 **한 문장을 맞힌 것이 아니라 아무거나 된다는 자각**이다. 거기서
// 무료였던 것은 내용(츠쿠에·혼)이고 일거리는 구성이었다. 우리 데이터는 한 문항에서
// 어휘와 표현이 **동시에** 새로 들어오므로(앞서 배운 어휘가 이 프레임 슬롯에 맞는
// 문항은 43/222뿐이다) 그 구조를 데이터로는 만들 수 없다. 그러면 이 시점에 진짜로
// 무료인 것은 **유저 머릿속의 어휘 전체**다 — 앱이 목록으로 줄 수 없는 것. 그래서
// 아무것도 주지 않는다.
//
// 채점 조건은 셋이고 내용은 **완전히 자유**다:
//   ① 배운 표현을 썼는가(`framePos`, 조각 순서·굴절·오타 허용)
//   ② 표현 밖 낱말이 하나라도 있는가 — 표현만 치고 넘기는 것을 막는다
//      (프레임이 문장 전체인 문항은 0/222라 이 조건은 항상 성립한다)
//   ③ 앞에서 이미 만든/본 문장이 아닌가 — 베껴 쓰기를 막는다
// 틀린 영어가 통과할 수 있는 것은 이 채점의 상한이고([5] 자유 입력도 같다),
// 실시간 LLM 없이는 막을 수 없다.
//
// **와우는 통과 뒤에 온다**:
//   · 내가 쓴 문장이 예문들과 **같은 목록의 첫 줄**로 선다 — 학습 문장과 내 문장
//     두 줄은 "같은 표현"만 보여주고 "뭐든 된다"는 안 보여준다(형제 예문이 1개
//     이상인 문항이 222/222, 2개 이상이 193)
//   · 예문에 없는 낱말을 썼으면 **그것을 짚어 인정한다** — 앱이 몰랐던 문장을 내가
//     만든 것이고, 그게 감점이 아니라 칭찬이면 다음 문항부터 일부러 새 낱말을 밀어
//     넣어 본다. 그 순간이 "뭐든 말할 수 있겠구나"다
// 지원 사다리는 `표현 보기` → `예문 보기` → `정답 보기`. **본 예문은 제외 목록에
// 들어간다**(보고 베끼면 산출이 아니다) — 다만 마지막 칸은 그 제외를 풀고 칸을
// 채워 준다. 완전히 막힌 유저의 탈출구가 없으면 진행이 끊긴다.
const OP_FN=new Set(['the','a','an','my','your','his','her','its','our','their','this','that','these','those',
  'i','you','he','she','it','we','they','me','him','us','them','to','of','in','on','at','for','with','and',
  'or','but','is','are','am','was','were','be','do','does','did','not','so','too','very','some','any']);
function renderSpeakOpen(item){
  setProgress(3);
  const p=item.pattern||{}, pmean=(p.meaning||'').trim();
  // 이 표현으로 **앱이 아는** 문장들. 내 문장이 여기 끼어들고, 예문에 없는 낱말을
  // 가려내는 기준도 이것이다.
  const known=[{en:item.sentence.en, kr:item.sentence.kr, segs:item.baseSegs}], seen=new Set([item.sentence.en]);
  (item.apply||[]).concat(item.siblings||[]).forEach(a=>{
    if(a && a.en && !seen.has(a.en)){ seen.add(a.en); known.push({en:a.en, kr:a.kr||'', segs:a.segs||null}); }
  });
  const knownWords=new Set();
  known.forEach(k=>tokenize(k.en).forEach(w=>knownWords.add(bareW(w))));
  (item.frame||[]).forEach(f=>f.split(/\s+/).forEach(w=>knownWords.add(bareW(w))));
  // 자극은 재료와 직교한다 — 재료를 안 줘도 A는 말을 건다. 대사만 세우고
  // **채점은 그대로 열어 둔다**(그 질문의 모범 답이 아니라 내 말을 하면 된다).
  const ask0 = spkMode!=='kr' ? speakTarget(item) : null;

  const nz=x=>String(x).split(/\s+/).map(bareW).filter(Boolean).join(' ');
  // 제외 목록 — [2]·[3]에서 만든 문장과, 사다리로 이미 본 예문
  const taken=new Set([nz(item.sentence.en)]);
  known.forEach(k=>{ if(builtSet.has(k.en)) taken.add(nz(k.en)); });
  // 사다리의 예문은 그 자신이 **이 화면의 채점을 통과하는 문장**이어야 한다 —
  // 탈출구인데 그대로 쳤을 때 다시 막히면 진행이 끝난다. 걸러지는 것은 둘이다:
  // 형제 문장이 **표현 그 자신**인 경우(`Have fun!`·`How come?`)와, 불규칙 활용이라
  // `framePos`가 표현을 못 집는 경우(`get home` → `I got home`). 그 다음에 짧은 것.
  const egOk=k=>{ const w=tokenize(k.en).map(bareW), pos=framePos(w, item.frame);
                  return !!pos && w.length-pos.length>=1; };
  const egPool=known.filter(k=>k.en!==item.sentence.en && egOk(k))
                    .sort((x,y)=>tokenize(x.en).length-tokenize(y.en).length);
  // 다 걸러지면 학습 문장으로 돌아간다 — 제외 목록에 있지만 마지막 칸이 그걸 푼다
  const eg=egPool[0]||known[0];
  let done=false, hintLevel=0;

  stage.innerHTML=`
    <div class="stage-scroll">
      <div class="chat-card" id="card">
        <div class="chat-tag rv">말해보기</div>
        ${spkHeadHtml(item, '이 표현으로 <b>하고 싶은 말</b>을 만들어 보세요')}${spkAskHtml(ask0)}
        <div class="nb-tip hidden" id="nbTip"></div>
        <div class="sp-in" id="spIn"><div class="sp-slots" id="spSlots"></div><input class="sp-catch" id="spCatch" type="text"
          autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" /></div>
        <div class="wrong-box hidden" id="wrongBox"></div>
        <div class="reveal-note hidden" id="revealNote"></div>
      </div>
      <div id="payoffBox"></div>
    </div>
    <div class="stage-bottom" id="bottom">
      <div class="vtools" id="vtools">
        <button class="vtool" id="hintBtn"><span class="ic">?</span><span id="hintLabel">표현 보기</span></button>
        <button class="vtool mic" disabled><span class="ic">🎤</span><span>음성 모드</span></button>
      </div>
      <div class="arr-btns" style="margin-top:12px">
        <button class="btn-confirm" id="okBtn" disabled>확인</button>
      </div>
    </div>`;

  const inp=el('spCatch'), wrongBox=el('wrongBox');
  setTimeout(()=>inp.focus(), 80);
  const typedWords=()=> inp.value.trim().split(/\s+/).filter(Boolean);
  // 칸 수를 미리 정하지 않는다 — 낱말 수가 곧 답의 범위를 알려주는 정보인데,
  // 여기서는 그 범위 자체가 유저의 것이다. 칸은 치는 만큼 자란다.
  function renderSlots(){
    const ws=inp.value.split(' '), n=Math.max(ws.length, 1);
    let h='';
    for(let i=0;i<n;i++)
      h+=`<span class="sp-slot${(i===ws.length-1 && !done)?' cur':''}">${escapeHtml(ws[i]||'')}</span>`;
    el('spSlots').innerHTML=h;
  }
  function renderAll(){ renderSlots(); el('okBtn').disabled = done || !inp.value.trim(); }
  renderAll();

  function openTip(){ const tip=el('nbTip'); tip.innerHTML=nbTipHtml(item); tip.classList.remove('hidden'); }
  function tipByFail(){ if(hintLevel===0) advanceHint(); else openTip(); }
  inp.addEventListener('input', ()=>{ if(!done) wrongBox.classList.add('hidden'); renderAll(); });

  function finish(fixes){
    done=true;
    // 프레임 오타는 정답 철자로 굳힌다 — 내가 만든 문장으로 남는 것이므로
    if((fixes||[]).length){
      const ws=inp.value.trim().split(/\s+/);
      fixes.forEach(f=>{ if(ws[f.i]!==undefined) ws[f.i]=f.to; });
      inp.value=ws.join(' ');
    }
    inp.readOnly=true; inp.blur();
    const said=inp.value.trim();
    el('okBtn').disabled=true;
    el('card').classList.add('correct');
    if(!el('card').querySelector('.check-mark')){ const c=document.createElement('div'); c.className='check-mark'; c.textContent='✓'; el('card').appendChild(c); }
    if(!made.some(x=>x.en===said)) made.push({en:said, kr:''});
    wrongBox.classList.add('hidden'); el('nbTip').classList.add('hidden');
    const rn=el('revealNote');
    if((fixes||[]).length){
      rn.classList.remove('hidden');
      rn.innerHTML=`철자<b>${fixes.map(f=>escapeHtml(f.from)+' → '+escapeHtml(f.to)).join(' · ')}</b>`;
    } else rn.classList.add('hidden');
    const sw=said.split(/\s+/), sf=frameWordFlags(sw, item.frame);
    el('spIn').innerHTML=`<div class="sp-tiles">${sw.map((w,i)=>
      `<span class="sp-tile${sf[i]?' fr':''}">${escapeHtml(w)}</span>`).join('')}</div>`;
    el('card').insertAdjacentHTML('beforeend', resultActionsHtml());

    // 예문에 없던 낱말 — 기능어와 세 글자 미만은 뺀다(`my`·`it`을 짚으면 소음이다)
    const fresh=sw.map(w=>bareW(w)).filter((w,i)=>!sf[i] && w.length>=3 && !OP_FN.has(w) && !knownWords.has(w));
    const form=(p.form||'').trim();
    // 효용감의 근거는 문구가 아니라 **내 문장이 예문들과 같은 목록에 서는 것**이다.
    // 두 줄로는 "같은 표현"까지만 보이고 "뭐든 된다"는 안 보인다.
    el('payoffBox').innerHTML=`<div class="payoff">
        <div class="chat-tag rv">학습 정보</div>
        ${form?`<div class="pf-form">${escapeHtml(form).replace(/_{2,}|~/g,'<span class="slot"></span>')}</div>`:''}
        ${pmean?`<div class="pf-mean">${escapeHtml(pmean)}</div>`:''}
        <div class="pf-div"></div>
        <div class="pf-sub"><span class="ic">ⓘ</span>이 표현으로 이렇게 말할 수 있어요</div>
        <div class="pf-cmp mine"><div class="pf-cmp-en">${frameLine(said, null, item.frame)}<span class="op-badge">내가 만든 문장</span></div></div>
        ${known.map(k=>`<div class="pf-cmp"><div class="pf-cmp-en">${frameLine(k.en, k.segs, item.frame)}</div>
          ${k.kr?`<div class="pf-cmp-kr">${escapeHtml(k.kr)}</div>`:''}</div>`).join('')}
        ${fresh.length?`<div class="op-new"><span class="ic">✨</span><span><b>${escapeHtml(fresh.join(' · '))}</b> 는 예문에 없는 말이에요 —
          이 표현을 내가 아는 말에 붙여서 쓴 거예요.</span></div>`:''}
      </div>`;
    el('bottom').innerHTML=arrangeBottomHtml(lastItem()?'완료하기':'다음 문제');
    el('nextBtn').onclick=advanceItem;
  }

  el('okBtn').onclick=()=>{
    if(done) return;
    const words=typedWords();
    if(!words.length) return;
    const pos=framePos(words.map(bareW), item.frame);
    // 표현을 아직 안 썼으면 지적하는 대신 **오답노트 팁을 연다**([2] 화면과 같은 규약)
    if(!pos){ wrongBox.classList.add('hidden'); tipByFail(); return; }
    wrongBox.classList.remove('hidden');
    if(words.length - pos.length < 1){
      wrongBox.innerHTML=`표현만 있어요. <b>무엇을</b> 그렇게 할지 한 낱말이라도 붙여 보세요.`; return;
    }
    if(taken.has(nz(words.join(' ')))){
      wrongBox.innerHTML=`이미 나온 문장이에요. <b>다른 말</b>을 만들어 보세요.`; return;
    }
    finish(frameFix(words, pos, item.frame));
  };

  const ladder=[ {label:'표현 보기', run:openTip},
                 {label:'예문 보기', run:()=>{ taken.add(nz(eg.en)); },
                  note:()=>`예문<b>${escapeHtml(eg.en)}</b>`},
                 // 마지막 칸은 제외를 풀고 칸까지 채워 준다 — 탈출구가 없으면 진행이 끊긴다
                 {label:'정답 보기', run:()=>{ taken.delete(nz(eg.en)); inp.value=tokenize(eg.en).join(' '); renderAll(); },
                  note:()=>`이대로 써도 돼요<b>${escapeHtml(eg.en)}</b>`} ];
  function advanceHint(){
    const d=ladder[hintLevel]; if(!d) return;
    if(d.run) d.run();
    if(d.note){ const rn=el('revealNote'); rn.classList.remove('hidden'); rn.innerHTML=d.note(); }
    hintLevel++;
    const next=ladder[hintLevel];
    if(next){ el('hintLabel').textContent=next.label; el('hintBtn').querySelector('.ic').textContent='✔'; }
    else { el('hintBtn').disabled=true; el('hintLabel').textContent='정답 공개됨'; wrongBox.classList.add('hidden'); }
  }
  el('hintBtn').onclick=()=>{ advanceHint(); inp.focus(); };
}

// [4] D 대화 한가운데 ─────────────────────────────────────────────────────────
// **내 차례가 대화의 가운데에 있다** — 앞 대사와 뒷 대사가 모두 정해져 있고 내 말만
// 비어 있다. 앞 대사만 주면 *질문에 답하는 일*이 되어 `영어 질문 → 영어` 자극과
// 구조가 같아진다(재료를 빼고 말풍선을 씌워도 같다). 뒤가 있어야 과제가 **"이 사이에
// 맞는 말"**이 되고, 그것이 번역도 조립도 아닌 유일한 대화 과제다.
// 닫는 일을 **문맥이** 하므로 재료를 화면에 놓지 않아도 된다 — 재료는 화면에 놓이는
// 순간 조립이 되지만 문맥은 부품이 아니다. 채점은 O와 같이 프레임까지만 건다.
// 해석은 양쪽 대사 모두 함께 연다 — 이 단계의 과제는 영어를 알아듣는 것이 아니라
// 답하는 것이다(`[5]`가 해석을 잠그는 것은 거기가 *영어를 보고 영어로 인출*하는
// 단계라서다).
// 뒷 대사는 `apply[].reply`(`scripts/vocab_expression_replies.json`, 손저작 222개)다.
// **내가 무엇을 말하든 이어지도록 내용어를 고정하지 않았다** — 답이 열려 있으므로
// 반응이 특정 내용을 전제하면 내 답과 어긋난다.
// 방식 = **낱말을 어떻게 주나**. 자극과 직교하므로 한 곳에서 정하고 화면들이 같이 쓴다.
// `ordered`는 조각을 문장 순서대로(순서를 숨길 이유가 없다 — 이 줄의 용도는 답의 범위만
// 닫는 것이 아니라 **표현 말고는 떠올릴 것이 없게 만드는 것**이다), `shuffled`는 낱말로
// 쪼개 섞어서, `none`은 주지 않는다(답이 열린다).
// **카드 머리는 자극이 정한다** — 방식은 재료만 바꾼다. 방식을 바꿨는데 표제·지시문·
// 대상 문장의 표기까지 같이 달라지면 무엇을 비교하고 있는지가 흐려진다(`줄어든다`와
// `섞어서 준다`의 차이는 **재료 줄 하나**여야 한다). 그래서 모든 방식이 이 둘을 같이 쓰고,
// 순서는 늘 **표제 → 지시문 → 자극 본문 → 팁 → 재료 → 답 자리**다.
// **지시문은 만들 문장이 화면에 없을 때만 둔다** — 한국어 문장이 표현 구간을 초록으로
// 달고 서 있으면 `이 표현을 넣어 …`는 그 문장이 이미 하는 말이라 줄만 하나 늘린다.
function spkHeadHtml(item, task){
  const pmean=((item.pattern||{}).meaning||'').trim();
  return `<div class="sh-head">
      <div class="sh-lbl">이번에 배운 표현</div>
      <div class="sh-form">${escapeHtml(pmean)}</div>
    </div>` + (task ? `<div class="sp-q">${task}</div>` : '');
}
// A 대사 — `영어 질문`·`대화 한가운데`의 자극
function spkAskHtml(t){
  if(!t || !t.ask || (spkMode!=='en' && spkMode!=='dlg')) return '';
  return `<div class="sit-turn${spkMode==='en'?' a':''}">
      <div class="sit-role">A</div>
      <div class="sit-bubble"><div class="sit-en">${escapeHtml(t.ask.en)}</div>
        <div class="sit-kr">${escapeHtml(t.ask.kr)}</div></div>
    </div>`;
}
// **내가 할 말의 한국어**(표현 구간 초록) — 자극과 무관하게 늘 같은 자리에 선다.
// A의 영어만 주면 무슨 말을 해야 하는지가 화면에 없어 답이 A의 해석에 딸려 버린다.
function spkKrHtml(t){
  return t ? `<div class="sp-kr">${sentTitleHtml(t)}</div>` : '';
}
// 내 말 뒤에 오는 A의 반응 — 푸는 동안 흐리고, 통과하면 켜진다.
// **내 말이 그 반응을 끌어냈다**는 것이 `대화 한가운데`의 산출물이다.
function spkAfterHtml(t){
  if(spkMode!=='dlg' || !t || !t.reply) return '';
  return `<div class="sit-turn dlg-after">
      <div class="sit-role">A</div>
      <div class="sit-bubble"><div class="sit-en">${escapeHtml(t.reply.en)}</div>
        <div class="sit-kr">${escapeHtml(t.reply.kr)}</div></div>
    </div>`;
}
// 답 자리 — `대화 한가운데`에서는 내 말풍선 안에 들어간다(그래야 대화의 한가운데가 된다)
function spkAnswerHtml(t, inner){
  if(spkMode!=='dlg' || !t || !t.reply) return inner;
  // 대화에서는 내가 할 말의 한국어가 **내 말풍선 안**에 선다 — 카드 위쪽에 따로 두면
  // 앞 대사와 내 차례 사이에 낀 줄이 되어 누구 말인지가 흐려진다.
  return `<div class="sit-turn b"><div class="sit-role">나</div>
      <div class="sit-bubble mine">${spkKrHtml(t)}${inner}</div></div>`;
}
function spkGives(item, t){
  const tok=tokenize(t.en), flag = t.segs ? frameFlags(tok, t.segs) : frameWordFlags(tok, item.frame);
  const words=tok.filter((w,i)=>!flag[i]);
  if(spkVar==='o') return {kind:'none', list:[], words};
  if(spkVar==='a') return {kind:'shuffled', list:shuffle(words), words};
  // 줄어든다 — 지원 단계가 형태를 정한다. 화면이 덜 해주는 것이 곧 내가 나아졌다는 근거다.
  const pieces=(t.segs||[]).filter(g=>g.t==='slot').map(g=>g.s.trim()).filter(x=>/[a-z0-9]/i.test(x));
  if(aidLevel===0 && pieces.length) return {kind:'ordered', list:pieces, words};
  if(aidLevel<=1) return {kind:'shuffled', list:shuffle(words), words};
  return {kind:'none', list:[], words};
}
// 재료 줄 — `ordered`는 조각 칩, `shuffled`는 `함께 쓸 낱말`(다 쓴 칩은 죽는다)
function spkGivesHtml(g, id){
  if(!g.list.length) return '';
  const bare=w=>String(w).toLowerCase().replace(/[^a-z0-9']/g,'');
  return g.kind==='ordered'
    ? `<div class="sh-give">${g.list.map(x=>`<span class="give">${escapeHtml(x)}</span>`).join('')}</div>`
    : `<div class="sp-mat sh-mat" id="${id}"><span class="lbl">함께 쓸 낱말</span>${
        g.list.map(w=>`<span class="mat" data-w="${escapeHtml(bare(w))}">${escapeHtml(w)}</span>`).join('')}</div>`;
}
// 주어진 낱말로만 만들었는지 — 정확히 같은 것부터 소진한 뒤 남은 것만 오타로 본다
// (순서를 바꾸면 멀쩡한 낱말이 오타로 잡힌다).
function spkMatch(typedArr, allowed){
  const bare=w=>String(w).toLowerCase().replace(/[^a-z0-9']/g,'');
  const need=allowed.map(bare), got=typedArr.map(bare);
  const usedN=need.map(()=>false), usedG=got.map(()=>false), fixes=[];
  got.forEach((g,gi)=>{ if(!g){ usedG[gi]=true; return; }
    const ni=need.findIndex((n,k)=>!usedN[k] && n===g);
    if(ni>=0){ usedN[ni]=true; usedG[gi]=true; } });
  got.forEach((g,gi)=>{ if(usedG[gi]) return;
    const ni=need.findIndex((n,k)=>!usedN[k] && nearWord(n,g));
    if(ni>=0){ usedN[ni]=true; usedG[gi]=true; fixes.push({i:gi, from:typedArr[gi], to:allowed[ni]}); } });
  return { extra:got.filter((_,i)=>!usedG[i]), missing:need.filter((_,i)=>!usedN[i]), fixes };
}

function dialogTarget(item){
  const ok=a=>a && a.ask && a.reply;
  const t=speakTarget(item);
  if(ok(t)) return t;
  // 앞뒤 대사가 다 있는 형제 중 `speakTarget`의 꼬리 규칙(재료 적은 것 → 짧은 것)으로
  const both=(item.apply||[]).filter(ok);
  if(!both.length) return null;
  return both.slice().sort((x,y)=>
    spkMats(x).length-spkMats(y).length || tokenize(x.en).length-tokenize(y.en).length)[0];
}
function renderSpeakDialog(item, t){
  setProgress(3);
  const p=item.pattern||{}, pmean=(p.meaning||'').trim();
  const nz=x=>String(x).split(/\s+/).map(bareW).filter(Boolean).join(' ');
  // **재료는 방식이 정한다.** 문맥만 주고 아무것도 안 주면 `~하지 마` + `I didn't make
  // the team.`을 보고 영어를 세우라는 뜻이 되어 막막하다(`재료를 감추고 힌트로 채우기`가
  // 기각된 것과 같은 실패다). 재료가 있으면 답이 하나로 닫히고, 없으면 열린다.
  const gives=spkGives(item, t);
  const closed=gives.kind!=='none';
  const tok=tokenize(t.en), flag = t.segs ? frameFlags(tok, t.segs) : frameWordFlags(tok, item.frame);
  const allowedWords=tok.filter((w,i)=>flag[i]).concat(gives.words);
  // 제외 목록은 O보다 느슨하다 — **대상 문장 그대로가 이 질문의 가장 자연스러운 답**이라
  // 그걸 막으면 맞는 답을 틀렸다고 하게 된다. 앞에서 이미 만든 문장만 막는다.
  const taken=new Set([nz(item.sentence.en)]);
  made.forEach(m=>taken.add(nz(m.en)));
  let done=false, hintLevel=0;

  stage.innerHTML=`
    <div class="stage-scroll">
      <div class="chat-card" id="card">
        <div class="chat-tag rv">말해보기</div>
        ${spkHeadHtml(item)}${spkAskHtml(t)}
        <div class="nb-tip hidden" id="nbTip"></div>
        ${spkGivesHtml(gives, 'spMat')}
        ${spkAnswerHtml(t, `<div class="sp-in" id="spIn"><div class="sp-slots" id="spSlots"></div><input class="sp-catch" id="spCatch" type="text"
              autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" /></div>`)}
        ${spkAfterHtml(t)}
        <div class="wrong-box hidden" id="wrongBox"></div>
        <div class="reveal-note hidden" id="revealNote"></div>
      </div>
      <div id="payoffBox"></div>
    </div>
    <div class="stage-bottom" id="bottom">
      <div class="vtools" id="vtools">
        <button class="vtool" id="hintBtn"><span class="ic">?</span><span id="hintLabel">표현 보기</span></button>
        <button class="vtool mic" disabled><span class="ic">🎤</span><span>음성 모드</span></button>
      </div>
      <div class="arr-btns" style="margin-top:12px">
        <button class="btn-confirm" id="okBtn" disabled>확인</button>
      </div>
    </div>`;

  const inp=el('spCatch'), wrongBox=el('wrongBox'), matEl=el('spMat');
  setTimeout(()=>inp.focus(), 80);
  const typedWords=()=>inp.value.trim().split(/\s+/).filter(Boolean);
  const bare=w=>String(w).toLowerCase().replace(/[^a-z0-9']/g,'');
  // 재료가 있으면 답의 낱말 수가 정해져 있어 칸을 미리 그려도 새로 새는 정보가 없다.
  // 안 주면 그 범위 자체가 내 것이라 칸이 치는 만큼 자란다.
  function renderSlots(){
    const ws=inp.value.split(' '), n=closed ? Math.max(tok.length, ws.length) : Math.max(ws.length, 1);
    let h='';
    for(let i=0;i<n;i++)
      h+=`<span class="sp-slot${(i===ws.length-1 && !done)?' cur':''}${(closed && i>=tok.length)?' extra':''}">${escapeHtml(ws[i]||'')}</span>`;
    el('spSlots').innerHTML=h;
  }
  // 쓴 낱말은 칩에서 죽인다 — 이 줄의 용도는 '무엇을 썼나'가 아니라 '아직 뭐가 남았나'다
  function syncMats(){
    if(!matEl) return;
    const left=new Map();
    typedWords().forEach(w=>{ const k=bare(w); if(k) left.set(k, (left.get(k)||0)+1); });
    matEl.querySelectorAll('.mat').forEach(m=>{
      const k=m.dataset.w, n=left.get(k)||0, use=n>0;
      if(use) left.set(k, n-1);
      m.classList.toggle('used', use);
    });
  }
  function renderAll(){ renderSlots(); syncMats(); el('okBtn').disabled = done || !inp.value.trim(); }
  renderAll();

  function openTip(){ const tip=el('nbTip'); tip.innerHTML=nbTipHtml(item); tip.classList.remove('hidden'); }
  function tipByFail(){ if(hintLevel===0) advanceHint(); else openTip(); }
  inp.addEventListener('input', ()=>{ if(!done) wrongBox.classList.add('hidden'); renderAll(); });

  function finish(fixes){
    done=true;
    // 오타로 통과한 낱말은 **정답 철자로 굳힌다** — 내가 만든 문장으로 남는 것이므로
    if((fixes||[]).length){
      const ws=inp.value.trim().split(/\s+/);
      fixes.forEach(f=>{ if(ws[f.i]!==undefined) ws[f.i]=f.to; });
      inp.value=ws.join(' ');
    }
    inp.readOnly=true; inp.blur();
    const said=inp.value.trim(), exact=nz(said)===nz(t.en);
    el('okBtn').disabled=true;
    el('card').classList.add('correct');
    if(!el('card').querySelector('.check-mark')){ const c=document.createElement('div'); c.className='check-mark'; c.textContent='✓'; el('card').appendChild(c); }
    builtSet.add(t.en);
    if(!made.some(x=>x.en===said)) made.push({en:said, kr:exact?t.kr:''});
    wrongBox.classList.add('hidden'); el('nbTip').classList.add('hidden');
    const rn=el('revealNote');
    if((fixes||[]).length){
      rn.classList.remove('hidden');
      rn.innerHTML=`철자<b>${fixes.map(f=>escapeHtml(f.from)+' → '+escapeHtml(f.to)).join(' · ')}</b>`;
    } else rn.classList.add('hidden');
    // 내 대사가 대화에 그대로 남는 것이 '말해봤다'의 실체다([5] `renderSay`와 같은 원리)
    const sw=said.split(/\s+/), sf=frameWordFlags(sw, item.frame);
    el('spIn').innerHTML=`<div class="sp-tiles">${sw.map((w,i)=>
      `<span class="sp-tile${sf[i]?' fr':''}">${escapeHtml(w)}</span>`).join('')}</div>`;
    if(matEl) matEl.classList.add('hidden');
    // 뒷 대사는 내가 채우기 전까지 흐려 둔다 — 내 말이 들어가서야 대화가 이어진다
    const after=el('card').querySelector('.dlg-after');
    if(after) after.classList.add('on');
    el('card').insertAdjacentHTML('beforeend', resultActionsHtml());
    const form=(p.form||'').trim();
    el('payoffBox').innerHTML=`<div class="payoff">
        <div class="chat-tag rv">학습 정보</div>
        ${form?`<div class="pf-form">${escapeHtml(form).replace(/_{2,}|~/g,'<span class="slot"></span>')}</div>`:''}
        ${pmean?`<div class="pf-mean">${escapeHtml(pmean)}</div>`:''}
        <div class="pf-div"></div>
        <div class="pf-sub"><span class="ic">ⓘ</span>이 표현으로 만든 문장</div>
        <div class="pf-cmp"><div class="pf-cmp-en">${frameLine(item.sentence.en, item.baseSegs, item.frame)}</div>
          <div class="pf-cmp-kr">${escapeHtml(item.sentence.kr)}</div></div>
        <div class="pf-cmp mine"><div class="pf-cmp-en">${frameLine(said, exact?t.segs:null, item.frame)}</div>
          ${exact?`<div class="pf-cmp-kr">${escapeHtml(t.kr)}</div>`:''}</div>
        ${exact?'':`<div class="pf-sub"><span class="ic">ⓘ</span>이 상황에선 이렇게 말해요</div>
        <div class="pf-cmp"><div class="pf-cmp-en">${frameLine(t.en, t.segs, item.frame)}</div>
          <div class="pf-cmp-kr">${escapeHtml(t.kr)}</div></div>`}
      </div>`;
    el('bottom').innerHTML=arrangeBottomHtml(lastItem()?'완료하기':'다음 문제');
    el('nextBtn').onclick=advanceItem;
  }

  el('okBtn').onclick=()=>{
    if(done) return;
    const words=typedWords();
    if(!words.length) return;
    const txt=words.join(' ');
    const pos=framePos(words.map(bareW), item.frame);
    // 표현을 아직 안 썼으면 지적하는 대신 **오답노트 팁을 연다**([2] 화면과 같은 규약)
    if(!pos){ wrongBox.classList.add('hidden'); tipByFail(); return; }
    wrongBox.classList.remove('hidden');
    if(nz(txt)===nz(t.en)) return finish(frameFix(words, pos, item.frame));
    if(closed){
      const { extra, missing, fixes } = spkMatch(words, allowedWords);
      if(extra.length){ wrongBox.innerHTML=`<b>${escapeHtml(extra.join(', '))}</b> 는 이 문장에 필요하지 않아요.`; return; }
      if(missing.length){ wrongBox.innerHTML=`<b>${escapeHtml(missing.join(', '))}</b> 를 아직 안 썼어요.`; return; }
      return finish(fixes);
    }
    if(words.length - pos.length < 1){
      wrongBox.innerHTML=`표현만 있어요. <b>무엇을</b> 그렇게 할지 한 낱말이라도 붙여 보세요.`; return;
    }
    if(taken.has(nz(txt))){
      wrongBox.innerHTML=`이미 나온 문장이에요. <b>다른 말</b>로 답해 보세요.`; return;
    }
    finish(frameFix(words, pos, item.frame));
  };

  const ladder=[ {label:'표현 보기', run:openTip},
                 {label:'첫 단어 보기', note:()=>`첫 단어<b>${escapeHtml(tok[0])} …</b>`},
                 // 마지막 칸은 모범 답안을 채워 준다 — 탈출구가 없으면 진행이 끊긴다
                 {label:'정답 보기', run:()=>{ inp.value=tokenize(t.en).join(' '); renderAll(); },
                  note:()=>`이렇게 답해요<b>${escapeHtml(t.en)}</b>`} ];
  function advanceHint(){
    const d=ladder[hintLevel]; if(!d) return;
    if(d.run) d.run();
    if(d.note){ const rn=el('revealNote'); rn.classList.remove('hidden'); rn.innerHTML=d.note(); }
    hintLevel++;
    const next=ladder[hintLevel];
    if(next){ el('hintLabel').textContent=next.label; el('hintBtn').querySelector('.ic').textContent='✔'; }
    else { el('hintBtn').disabled=true; el('hintLabel').textContent='정답 공개됨'; wrongBox.classList.add('hidden'); }
  }
  el('hintBtn').onclick=()=>{ advanceHint(); inp.focus(); };
}

function renderSpeak(preset){
  curStep=renderSpeak;
  if(preset && !preset.en) preset=null;        // 이벤트 등이 새어 들어오면 무시한다
  const item=sessionItems[itemIdx];
  // **자극이 화면 골격을, 방식이 재료를 정한다.** `대화 한가운데`는 내 차례 앞뒤에
  // 대사를 두므로 골격이 아예 달라 전용 화면을 쓴다 — 단 **탭해서 배열은 예외다**:
  // 뱅크가 카드 밖(하단)에 있어 대화를 그대로 두고 답 자리만 말풍선 안에 넣으면 된다.
  // 폴백으로 문장 카드를 내보내면 지시문만 `가운데를 채워 보세요`로 남아 화면이 거짓말한다.
  const dt = (spkMode==='dlg' && !preset) ? dialogTarget(item) : null;
  if(dt && spkVar==='c') return renderSpeakArrange(dt);
  if(dt) return renderSpeakDialog(item, dt);
  if(spkVar==='o' && !preset) return renderSpeakOpen(item);
  if(spkVar==='h' && !preset && sheetRows(item).length) return renderSpeakSheet();
  const t = preset || speakTarget(item);
  if(spkVar==='c') return renderSpeakArrange(t);
  setProgress(3);

  const bare=w=>String(w).toLowerCase().replace(/[^a-z0-9']/g,'');
  // 재료 = 프레임이 아닌 낱말들(섞어서). 표현은 넣지 않는다 — 그게 이 단계의 과제다.
  // 형제 문장에는 조각 정보(`segs`)가 없으므로 프레임 낱말을 굴절 허용으로 찾는다
  const tok=tokenize(t.en), flag = t.segs ? frameFlags(tok, t.segs) : frameWordFlags(tok, item.frame);
  const matWords=tok.filter((w,i)=>!flag[i]);
  const frWords=tok.filter((w,i)=>flag[i]);
  const mats=shuffle(matWords);
  let done=false, hintLevel=0;

  const head = spkHeadHtml(item) + spkAskHtml(t) + (spkMode==='dlg' ? '' : spkKrHtml(t));

  stage.innerHTML=`
    <div class="stage-scroll">
      <div class="chat-card" id="card">
        <div class="chat-tag rv">말해보기</div>
        ${head}
        <div class="nb-tip hidden" id="nbTip"></div>
        <div class="sp-mat" id="spMat"><span class="lbl">함께 쓸 낱말</span>${mats.map(w=>`<span class="mat" data-w="${escapeHtml(bare(w))}">${escapeHtml(w)}</span>`).join('')}</div>
        <div class="sp-in" id="spIn"><div class="sp-slots" id="spSlots"></div><input class="sp-catch" id="spCatch" type="text"
          autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" /></div>
        <div class="wrong-box hidden" id="wrongBox"></div>
        <div class="reveal-note hidden" id="revealNote"></div>
      </div>
      <div id="payoffBox"></div>
    </div>
    <div class="stage-bottom" id="bottom">
      <div class="vtools" id="vtools">
        <button class="vtool" id="hintBtn"><span class="ic">?</span><span id="hintLabel">표현 보기</span></button>
        <button class="vtool mic" disabled><span class="ic">🎤</span><span>음성 모드</span></button>
      </div>
      <div class="arr-btns" style="margin-top:12px">
        <button class="btn-confirm" id="okBtn" disabled>확인</button>
      </div>
    </div>`;

  const inp = el('spCatch');
  const matEl = el('spMat'), wrongBox=el('wrongBox');
  setTimeout(()=>inp.focus(), 80);
  const typedWords=()=> inp.value.trim().split(/\s+/).filter(Boolean);

  // 답 자리를 낱말 칸으로 그린다. 칸 수는 대상 문장의 낱말 수(= 재료 + 표현)이고,
  // 그보다 많이 쓰면 넘친 칸을 덧붙여 표시한다.
  function renderSlots(){
    const ws=inp.value.split(' '), n=Math.max(tok.length, ws.length);
    let h='';
    for(let i=0;i<n;i++)
      h+=`<span class="sp-slot${(i===ws.length-1 && !done)?' cur':''}${i>=tok.length?' extra':''}">${escapeHtml(ws[i]||'')}</span>`;
    el('spSlots').innerHTML=h;
  }
  // 입력에 쓴 낱말만큼 칩을 소진시킨다. 같은 낱말이 둘이면 둘 다 써야 둘 다 꺼진다.
  function syncMats(){
    if(!matEl) return;
    const left=new Map();
    typedWords().forEach(w=>{ const k=bare(w); if(k) left.set(k, (left.get(k)||0)+1); });
    matEl.querySelectorAll('.mat').forEach(m=>{
      const k=m.dataset.w, n=left.get(k)||0, use=n>0;
      if(use) left.set(k, n-1);
      m.classList.toggle('used', use);
    });
  }
  function renderAll(){ renderSlots(); syncMats(); el('okBtn').disabled = done || !inp.value.trim(); }
  renderAll();

  // 표현을 아직 안 썼을 때 여는 줄. [2] 화면과 같은 규약이라 새 표기가 아니다.
  function openTip(){
    const tip=el('nbTip');
    tip.innerHTML=nbTipHtml(item);
    tip.classList.remove('hidden');
  }
  // 오답으로 열려도 **사다리 첫 칸을 쓴 것**으로 친다 — 같은 지원을 두 번 세지 않는다
  function tipByFail(){ if(hintLevel===0) advanceHint(); else openTip(); }
  inp.addEventListener('input', ()=>{
    if(!done) wrongBox.classList.add('hidden');
    renderAll();
  });

  function finish(exact, fixes){
    done=true;
    // 오타로 통과한 낱말은 **정답 철자로 굳힌다** — 내가 만든 문장으로 남는 것이므로
    // 틀린 철자가 그대로 남으면 안 된다. 무엇을 고쳤는지는 아래 한 줄로 짚어 준다.
    if(!exact && (fixes||[]).length){
      const ws=inp.value.trim().split(/\s+/);
      fixes.forEach(f=>{ if(ws[f.i]!==undefined) ws[f.i]=f.to; });
      inp.value=ws.join(' ');
    }
    if(exact) inp.value=t.en;
    inp.readOnly=true; inp.blur();
    const said=inp.value.trim();
    el('okBtn').disabled=true;
    el('card').classList.add('correct');
    if(!el('card').querySelector('.check-mark')){ const c=document.createElement('div'); c.className='check-mark'; c.textContent='✓'; el('card').appendChild(c); }
    builtSet.add(t.en);
    if(!made.some(x=>x.en===said)) made.push({en:said, kr:t.kr});
    wrongBox.classList.add('hidden'); el('nbTip').classList.add('hidden');
    const rn=el('revealNote');
    if(!exact && (fixes||[]).length){
      rn.classList.remove('hidden');
      rn.innerHTML=`철자<b>${fixes.map(f=>escapeHtml(f.from)+' → '+escapeHtml(f.to)).join(' · ')}</b>`;
    } else rn.classList.add('hidden');
    // 답 자리를 완성 문장으로 굳힌다 — 칸이 그대로 낱말 타일이 되고 프레임만 초록이라
    // 내가 놓은 것 중 무엇이 방금 배운 표현인지가 눈에 남는다
    const sw=said.split(/\s+/), sf=frameWordFlags(sw, item.frame);
    el('spIn').innerHTML=`<div class="sp-tiles">${sw.map((w,i)=>
      `<span class="sp-tile${sf[i]?' fr':''}">${escapeHtml(w)}</span>`).join('')}</div>`;
    if(matEl) matEl.classList.add('hidden');
    el('card').insertAdjacentHTML('beforeend', resultActionsHtml());
    const p=item.pattern||{}, form=(p.form||'').trim(), pmean=(p.meaning||'').trim();
    // 효용감의 근거는 문구가 아니라 **같은 초록 조각이 두 문장에 반복되는 것**이다.
    el('payoffBox').innerHTML=`<div class="payoff">
        <div class="chat-tag rv">학습 정보</div>
        ${form?`<div class="pf-form">${escapeHtml(form).replace(/_{2,}|~/g,'<span class="slot"></span>')}</div>`:''}
        ${pmean?`<div class="pf-mean">${escapeHtml(pmean)}</div>`:''}
        <div class="pf-div"></div>
        <div class="pf-sub"><span class="ic">ⓘ</span>이 표현으로 만든 문장</div>
        <div class="pf-cmp"><div class="pf-cmp-en">${frameLine(item.sentence.en, item.baseSegs, item.frame)}</div>
          <div class="pf-cmp-kr">${escapeHtml(item.sentence.kr)}</div></div>
        <div class="pf-cmp"><div class="pf-cmp-en">${frameLine(said, exact?t.segs:null, item.frame)}</div>
          <div class="pf-cmp-kr">${escapeHtml(t.kr)}</div></div>
        ${exact?'':`<div class="pf-sub"><span class="ic">ⓘ</span>이렇게도 말해요</div>
        <div class="pf-cmp"><div class="pf-cmp-en">${frameLine(t.en, t.segs, item.frame)}</div></div>`}
      </div>`;
    el('bottom').innerHTML=arrangeBottomHtml(lastItem()?'완료하기':'다음 문제');
    el('nextBtn').onclick=advanceItem;
  }

  // 채점은 모범 답안과의 정확일치가 아니다 — 같은 한국어를 옮기는 영어는 여러 가지고,
  // 정확일치만 받으면 맞는 답을 틀렸다고 하게 된다(`It's time to go to school`).
  // 조건은 두 개뿐이다: **배운 표현을 썼는가**, **주어진 재료로만 만들었는가**.
  const allowedWords=frWords.concat(matWords);
  const matchWords=arr=>spkMatch(arr, allowedWords);
  el('okBtn').onclick=()=>{
    if(done) return;
    const words=typedWords();
    if(!words.length) return;
    const txt=words.join(' ');
    const nz=x=>x.toLowerCase().replace(/[^a-z0-9']+/g,' ').trim();
    const { extra, missing, fixes } = matchWords(words);
    wrongBox.classList.remove('hidden');
    if(nz(txt)===nz(t.en)) return finish(true, []);
    // 표현을 아직 안 썼으면 지적하는 대신 **오답노트 팁을 연다** — [2] 화면과 같은 규약
    if(!framePos(words.map(bare), item.frame)){ wrongBox.classList.add('hidden'); tipByFail(); return; }
    if(extra.length){ wrongBox.innerHTML=`<b>${escapeHtml(extra.join(', '))}</b> 는 이 문장에 필요하지 않아요.`; return; }
    if(missing.length){ wrongBox.innerHTML=`<b>${escapeHtml(missing.join(', '))}</b> 를 아직 안 썼어요.`; return; }
    finish(false, fixes);                      // 표현 + 재료를 모두 썼으면 통과(오타는 교정해 준다)
  };

  // 지원 사다리 — **첫 칸은 언제나 `표현 보기`**다. [2] 화면에서 표현을 못 떠올렸을 때
  // 오답노트 팁을 여는 것과 같은 규약이고, 막혔을 때 가장 먼저 필요한 것도 표현이다.
  const ladder = [ {label:'표현 보기', run:openTip},
                   {label:'첫 단어 보기', note:()=>`첫 단어<b>${escapeHtml(tok[0])} …</b>`},
                   {label:'정답 보기', note:()=>`정답<b>${escapeHtml(t.en)}</b>`} ];
  function advanceHint(){
    const d=ladder[hintLevel]; if(!d) return;
    if(d.run) d.run();
    if(d.note){ const rn=el('revealNote'); rn.classList.remove('hidden'); rn.innerHTML=d.note(); }
    hintLevel++;
    const next=ladder[hintLevel];
    if(next){ el('hintLabel').textContent=next.label; el('hintBtn').querySelector('.ic').textContent='✔'; }
    else { el('hintBtn').disabled=true; el('hintLabel').textContent='정답 공개됨'; wrongBox.classList.add('hidden'); }
  }
  el('hintBtn').onclick=()=>{ advanceHint(); inp.focus(); };
}

// [5] 상황 ──────────────────────────────────────────────────────────────────────
// 기획 의도: "임의의 상황에서 배운 표현을 가지고 내가 새로 말을 할 수 있다".
// **영어를 보고 영어로 인출**하는 단계이므로 푸는 동안 한국어 해석을 노출하지 않는다.
//
// 자유 입력으로 만들었더니 "뭘 써야 할지 감이 안 온다"는 문제가 생겼다 — 답의 범위가
// 보이지 않기 때문이다. 듀오링고는 이 자리에서 **응답을 2~3개 중에 고르게** 한다:
// 선택지가 전부 직전에 배운 문장이라 답의 범위가 보이고, 오답은 문법은 맞지만 상황에
// 안 맞는 문장이라 과제가 **문맥 적합성 판단**이 된다. 그 형태를 따른다.
//   · 지시문은 한국어지만 generic 하다(`적절히 답변하세요`) — 정답의 번역이 아니다
//   · 오답 선택지는 같은 구간의 다른 표현 문장에서 뽑는다 → 새 데이터가 필요 없다
//   · 정답 후에야 `의미:`로 한국어를 열고 A 해석도 함께 공개한다
// 자유 입력 버전은 `ve:opts.sitType` 으로 비교할 수 있게 남겨둔다(기본 = 선택형).
function renderSituation(target, pool){
  setProgress(sitOnly ? 0 : 4);
  const sit=target.situation;
  const typing = sitOnly && sitTypeMode;   // 직접 입력은 '상황만 풀기'의 별도 진입점에서만
  let done=false, picked=null, revealedList=false;

  // 오답 — 같은 구간(또는 인접 문항)의 다른 표현 문장. 문법은 맞고 상황엔 안 맞는다.
  const frameKey=x=>(x.frame||[]).join(' ').toLowerCase();
  const wrongs=(pool||[]).filter(x=>x.en!==target.en && frameKey(x)!==frameKey(target)).slice(0,2);
  const choices=shuffle([{...target, ok:true}].concat(wrongs.map(x=>({...x, ok:false}))));

  stage.innerHTML=`
    <div class="stage-scroll">
      <div class="chat-card" id="card">
        <div class="chat-tag rv">상황</div>
        <div class="sit-task">A의 말을 보고 적절히 답변하세요</div>
        <div class="sit-turn a">
          <div class="sit-role">A</div>
          <div class="sit-bubble">
            <div class="sit-en">${escapeHtml(sit.a_en)}</div>
            <div class="sit-kr hidden" id="aKr">${escapeHtml(sit.a_kr)}</div>
          </div>
        </div>
        <div id="sitAnswer"></div>
        <div class="sit-fb hidden" id="sitFb"></div>
        ${sitOnly ? devPanel(target, choices, typing) : ''}
      </div>
      <div id="sitDone"></div>
    </div>
    <div class="stage-bottom" id="bottom"></div>`;

  const ansBox=el('sitAnswer'), fb=el('sitFb');

  function escapeRe(x){ return x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
  function usedFrame(txt){
    return (target.frame||[]).every(lit=>{
      const ws=lit.split(/\s+/).map(w=>w.replace(/[^A-Za-z']/g,''));
      const pat=new RegExp('\\b'+ws.map(w=>escapeRe(w)+"(?:s|es|ed|d|ing)?").join('\\s+')+'\\b','i');
      return pat.test(txt);
    });
  }

  // ── 선택형 (기본) ──
  // 선택지는 전부 직전에 배운 문장이고 오답은 **문법은 맞지만 상황에 안 맞는** 문장이라
  // 과제가 문맥 적합성 판단이 된다. 표현 칩을 고르게 해본 버전(v2)은 정작 '말한다'는
  // 감각이 더 옅어져 되돌렸다 — 여기서 남는 건 완성된 한 문장이어야 한다.
  function renderPick(){
    ansBox.innerHTML=`<div class="sit-opts">${choices.map((c,i)=>
      `<button class="sit-opt" data-i="${i}" data-ok="${c.ok?1:0}"><span class="ic">🎤</span>${escapeHtml(c.en)}</button>`).join('')}</div>`;
    el('bottom').innerHTML=`<div class="arr-btns">
        <button class="btn-ghost2" id="skipBtn"><span class="ic">↷</span>건너뛰기</button>
        <button class="btn-confirm" id="okBtn" disabled>확인</button>
      </div>`;
    el('skipBtn').onclick=goNext;
    ansBox.querySelectorAll('.sit-opt').forEach(b=> b.onclick=()=>{
      if(done) return;
      ansBox.querySelectorAll('.sit-opt').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); picked=choices[+b.dataset.i];
      el('okBtn').disabled=false;
    });
    el('okBtn').onclick=()=>{
      if(!picked) return;
      if(!picked.ok){
        ansBox.querySelector('.sit-opt.on').classList.add('bad');
        fb.classList.remove('hidden');
        fb.innerHTML=`<div class="sit-wrong">이 상황에는 맞지 않아요. 다시 골라 볼까요?</div>`;
        picked=null; el('okBtn').disabled=true;
        return;
      }
      finish(picked.en);
    };
  }

  // ── 직접 입력 (비교 버전) ──
  function renderType(){
    ansBox.innerHTML=`
      <div class="sit-turn b">
        <div class="sit-role">B</div>
        <div class="sit-bubble mine">
          <textarea class="sit-input" id="sitIn" rows="1" autocomplete="off"
            autocapitalize="off" autocorrect="off" spellcheck="false"
            placeholder="Type in English"></textarea>
        </div>
      </div>`;
    el('bottom').innerHTML=`
      <div class="vtools">
        <button class="vtool" id="hintBtn2"><span class="ic">?</span><span id="hintLbl2">배운 표현 보기</span></button>
        <button class="vtool mic" id="skipBtn"><span class="ic">↷</span><span>건너뛰기</span></button>
      </div>
      <div class="arr-btns" style="margin-top:12px">
        <button class="btn-confirm" id="okBtn" disabled>말하기</button>
      </div>`;
    const inp=el('sitIn');
    setTimeout(()=>inp.focus(), 80);
    inp.addEventListener('input', ()=>{
      inp.style.height='auto'; inp.style.height=inp.scrollHeight+'px';
      el('okBtn').disabled = !inp.value.trim() || done;
    });
    el('skipBtn').onclick=goNext;

    // 아무 단서 없이 쓰게 하면 막히고, 다 주면 인출이 아니다 — 지원을 한 칸씩만 연다.
    // [1] 어휘의 `힌트 보기 → 정답 보기` 규약을 그대로 쓴다.
    const STEPS=[
      { lbl:'표현 좁히기', html:()=>`<div class="sit-hint"><b>배운 표현</b>
          ${[...new Set(choices.map(c=>(c.frame||[]).join(' … ')))].map(f=>`<span class="rv-chip fr">${escapeHtml(f)}</span>`).join('')}</div>` },
      { lbl:'첫 단어 보기', html:()=>`<div class="sit-hint"><b>이 상황의 표현</b>
          <span class="rv-chip fr">${escapeHtml((target.frame||[]).join(' … '))}</span></div>` },
      { lbl:'정답 보기', html:()=>`<div class="sit-hint"><b>첫 단어</b>
          <span class="rv-chip fr">${escapeHtml(target.en.split(/\s+/)[0])} …</span></div>` },
      { lbl:'', html:()=>`<div class="sit-hint answer"><b>정답</b>
          <span class="rv-chip fr">${escapeHtml(target.en)}</span></div>` },
    ];
    let step=0;
    el('hintBtn2').onclick=()=>{
      if(step>=STEPS.length) return;
      fb.classList.remove('hidden');
      fb.innerHTML=STEPS[step].html();
      const next=STEPS[step].lbl;
      step++;
      if(next) el('hintLbl2').textContent=next;
      else { el('hintBtn2').disabled=true; el('hintLbl2').textContent='정답 공개됨'; }
      inp.focus();
    };
    el('okBtn').onclick=()=>{
      const txt=inp.value.trim();
      if(!txt) return;
      if(!usedFrame(txt)){
        fb.classList.remove('hidden'); revealedList=false;
        fb.innerHTML=`<div class="sit-wrong">배운 표현이 아직 안 보여요. 다시 떠올려 볼까요?</div>`;
        return;
      }
      inp.readOnly=true; inp.classList.add('ok');
      finish(txt);
    };
  }

  // 정답 후에야 한국어를 연다 — 듀오링고의 `의미:` 자리
  function finish(said){
    done=true;
    made.push({en:said, kr:target.kr});
    fb.classList.add('hidden');
    el('card').classList.add('correct');
    el('aKr').classList.remove('hidden');
    if(!typing){
      ansBox.querySelectorAll('.sit-opt').forEach(b=>{
        b.disabled=true;
        if(b.dataset.ok==='1') b.classList.add('good');
      });
    }
    const pf=(target.form||'').trim(), pm=(target.meaning||'').trim();
    const exact = norm(said)===norm(target.en);
    // `의미`는 **내가 말한 문장**의 뜻이다. 직접 입력에서 모범 답안과 다르면
    // 모범 답안의 한국어를 내 문장의 뜻으로 붙일 수 없다 — 따로 떼어 보여준다.
    el('card').insertAdjacentHTML('beforeend', resultActionsHtml());
    el('sitDone').innerHTML=`<div class="payoff">
        <div class="chat-tag rv">학습 정보</div>
        <div class="pf-ok"><span class="ic">✓</span>좋아요!</div>
        ${exact?`<div class="pf-label">의미</div>
        <div class="pf-mean big">${escapeHtml(target.kr)}</div>`:''}
        ${pf?`<div class="pf-sub"><span class="ic">ⓘ</span>쓴 표현</div>
        <div class="pf-form">${escapeHtml(pf).replace(/_{2,}|~/g,'<span class="slot"></span>')}</div>
        ${pm?`<div class="pf-mean">${escapeHtml(pm)}</div>`:''}`:''}
        ${exact?'':`<div class="pf-sub"><span class="ic">ⓘ</span>이 상황에선 이렇게 말해요</div>
        <div class="pf-cmp"><div class="pf-cmp-en">${escapeHtml(target.en)}</div><div class="pf-cmp-kr">${escapeHtml(target.kr)}</div></div>`}
      </div>`;
    el('bottom').innerHTML=`<button class="btn-next" id="goBtn">계속하기</button>`;
    el('goBtn').onclick=goNext;
  }

  function goNext(){
    if(sitOnly){
      if(itemIdx>=sessionItems.length-1) return renderDone();
      itemIdx++; return showSituation();
    }
    itemIdx++; renderVocab();
  }

  typing ? renderType() : renderPick();
}

// 개발 확인용 — 이 상황이 어떤 표현으로 만들어졌고 오답이 어디서 왔는지.
// 학습 UI 가 아니므로 점선·모노 표기로 확실히 구분한다.
function devPanel(target, choices, typing){
  const wrongs=choices.filter(c=>!c.ok);
  const row=(c,label)=>`<div class="dev-row"><span class="dev-tag ${c.ok?'ok':''}">${label}</span>
      <span class="dev-en">${escapeHtml(c.en)}</span>
      <span class="dev-fr">${escapeHtml((c.frame||[]).join(' … ') || '—')}</span></div>`;
  return `<div class="devbox">
      <div class="dev-h">DEV · 이 상황의 근거</div>
      <div class="dev-row"><span class="dev-tag ok">정답</span>
        <span class="dev-en">${escapeHtml(target.en)}</span>
        <span class="dev-fr">${escapeHtml((target.frame||[]).join(' … '))}</span></div>
      <div class="dev-row"><span class="dev-tag">표현</span>
        <span class="dev-en">${escapeHtml(target.form||'—')}</span>
        <span class="dev-fr">${escapeHtml(target.meaning||'')}</span></div>
      ${typing ? '' : wrongs.map(c=>row(c,'오답')).join('')}
      <div class="dev-row"><span class="dev-tag">A 대사</span>
        <span class="dev-en">${escapeHtml(target.situation.a_en)}</span>
        <span class="dev-fr">손저작 (situations.json)</span></div>
    </div>`;
}

// 상황 전용 모드 — 오답 선택지는 인접 문항에서 뽑는다
function showSituation(){
  curStep=showSituation;
  const it=sessionItems[itemIdx];
  const near=sessionItems.filter((_,i)=>i!==itemIdx)
    .slice(Math.max(0,itemIdx-2), itemIdx+3)
    .map(x=>({en:x.sentence.en, kr:x.sentence.kr, frame:x.frame}));
  renderSituation(sitTarget(it), shuffle(near));
}
function sitTarget(it){
  return {en:it.sentence.en, kr:it.sentence.kr, frame:it.frame, segs:it.baseSegs, situation:it.situation,
          form:(it.pattern||{}).form, meaning:(it.pattern||{}).meaning};
}

// 구간이 끝나면 [5]로 — 상황 대사가 붙은 문항이 구간에 있을 때만 열린다
function renderReview(){
  const start=Math.max(0, itemIdx-REVIEW_EVERY+1);
  const block=sessionItems.slice(start, itemIdx+1);
  const withSit=block.filter(it=>it.situation);
  if(!withSit.length){ itemIdx++; return renderVocab(); }
  const it=withSit[withSit.length-1];
  const pool=block.filter(x=>x!==it).map(x=>({en:x.sentence.en, kr:x.sentence.kr, frame:x.frame}));
  renderSituation(sitTarget(it), shuffle(pool));
}

// ── 완료 ──// ── 완료 ──────────────────────────────────────────────────────────────────────
function renderDone(){
  if(!sampleMode) setPos(sessionItems.length);
  topbar.classList.add('hidden'); stage.classList.remove('hidden'); home.classList.add('hidden');
  const items=learned.length?learned:sessionItems;
  const modeWord = '표현';
  stage.innerHTML=`<div class="done">
    <div class="emoji">🎉</div>
    <h2>${items.length}문항 완료!</h2>
    <p>어휘 ${items.length}개와 서로 다른 ${modeWord} ${items.length}개를 배웠어요.</p>
    ${made.length?`<div class="learned-list">
      <div class="h">내가 직접 말한 문장 ${made.length}개</div>
      ${made.map(x=>`<div class="it"><span class="en">${escapeHtml(x.en)}</span>${x.kr?'<br>'+escapeHtml(x.kr):''}</div>`).join('')}
    </div>`:''}
    <div class="learned-list">
      <div class="h">배운 어휘 & ${modeWord}</div>
      ${items.map(it=>`<div class="it"><b>${escapeHtml(it.word)}</b> · ${escapeHtml(it.meaning)}<br><span class="en">${escapeHtml(it.sentence.en)}</span></div>`).join('')}
    </div>
    <div class="row" style="margin-top:8px;">
      <button class="btn ghost" id="againBtn">처음부터 다시</button>
      <button class="btn" id="homeBtn">홈으로</button>
    </div>
  </div>`;
  el('againBtn').onclick=()=> sampleMode && sampleRestart ? sampleRestart() : (setPos(0), startSession(0));
  el('homeBtn').onclick=()=>renderHome();
}
</script>
