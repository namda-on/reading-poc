<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>어휘 → 표현 프로토타입</title>
<style>
  :root { --bg:#a9ccf2; --ink:#2f3e52; --sub:#6b7c93; --blue:#4b83d6; --green:#2e9e57; --purple:#7b6ef0; --purple-d:#5b3fb0; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--ink); display:flex; justify-content:center; }
  .app { width:100%; max-width:460px; height:100dvh; min-height:100vh; display:flex; flex-direction:column;
    background:linear-gradient(#aacdf3,#bfe0ef); }
  .hidden { display:none !important; }

  /* 상단바 */
  .topbar { display:flex; align-items:center; gap:10px; padding:12px 14px 8px; flex-shrink:0; }
  .icon-btn { width:32px; height:32px; border:none; background:transparent; color:#fff; font-size:22px; cursor:pointer; }
  .trophy { width:34px; height:34px; border-radius:50%; background:#4b83d6; color:#fff; display:flex; align-items:center; justify-content:center; font-size:17px; box-shadow:0 2px 6px rgba(30,60,110,.25); flex-shrink:0; }
  .progress { flex:1; position:relative; }
  .bar-track { height:11px; border-radius:7px; background:rgba(255,255,255,.45); overflow:hidden; }
  .bar-fill { height:100%; background:#6f9bd6; width:0; transition:width .35s ease; border-radius:7px; }
  .bar-star { position:absolute; top:50%; transform:translate(-50%,-50%); font-size:15px; transition:left .35s ease; }
  .bar-count { position:absolute; top:-14px; font-size:11px; font-weight:800; color:#3a6bb0; transform:translateX(-50%); transition:left .35s ease; }
  .gear { color:#5b83b8; }

  /* 홈 */
  .home { flex:1; padding:18px 18px 24px; overflow-y:auto; }
  .home h1 { font-size:23px; margin:6px 0 4px; color:#25406a; }
  .home p.sub { color:#3a567d; margin:0 0 16px; font-size:14px; line-height:1.5; }
  .tabs { display:flex; gap:8px; margin-bottom:6px; }
  .tab { flex:1; border:none; border-radius:12px; padding:11px; font-size:15px; font-weight:800; cursor:pointer; background:#ffffff88; color:#3a567d; }
  .tab.on { background:#fff; color:#25406a; box-shadow:0 2px 8px rgba(30,60,110,.14); }
  .tab .td { display:block; font-size:11px; font-weight:600; opacity:.7; margin-top:2px; }
  .lv-card { position:relative; display:block; width:100%; text-align:left; background:#fff; border:none; border-radius:16px; padding:15px 18px; margin-bottom:10px; cursor:pointer; box-shadow:0 3px 12px rgba(30,60,110,.12); }
  .lv-card.cleared { background:#f1faf3; box-shadow:0 2px 8px rgba(46,158,87,.12); }
  .lv-card .t { font-size:16px; font-weight:800; color:#2f3e52; }
  .lv-card.cleared .t { color:#3f6b50; }
  .lv-card .f { font-size:12.5px; color:var(--sub); margin-top:4px; line-height:1.4; }
  .lv-card .step { display:inline-block; font-size:11px; font-weight:800; color:#2f6ab0; background:#e7f0fb; border:1px solid #cfe0f5; border-radius:999px; padding:2px 8px; margin-top:8px; }
  .lv-card .clear-badge { position:absolute; top:14px; right:16px; font-size:13px; font-weight:800; color:var(--green); }
  .restart-btn { display:block; width:100%; background:none; border:none; color:#3a6bb0; font-size:13px; font-weight:700; padding:6px; cursor:pointer; text-decoration:underline; }
  /* 옵션 (홈 / 상단 설정 팝오버 공용) */
  .opt-box { background:#ffffffcc; border-radius:14px; padding:12px 14px; margin-top:14px; }
  .opt-label { font-size:12.5px; font-weight:800; color:#3a567d; margin-bottom:8px; }
  .opt-hint { font-size:11.5px; color:#6b8ab0; margin-top:7px; line-height:1.5; }
  .seg { display:flex; gap:6px; }
  .seg-b { flex:1; border:1.5px solid #cfe0f5; background:#fff; color:#5b7c93; border-radius:10px; padding:9px 6px; font-size:13px; font-weight:800; cursor:pointer; }
  .seg-b.on { background:#46b366; border-color:#46b366; color:#fff; }
  .setting-pop { position:absolute; z-index:60; top:52px; right:14px; width:250px; background:#fff; border-radius:14px;
    box-shadow:0 8px 24px rgba(30,60,110,.24); padding:13px 14px; }
  .home .note { font-size:12px; color:#3a567d; opacity:.85; margin-top:18px; line-height:1.6; }

  /* 단계 배너 — 어휘·표현이 한 문항의 1·2단계임을 상시 표시하고 배운 단어를 이어간다 */
  .step-banner { display:flex; align-items:center; gap:8px; padding:2px 18px 8px; flex-shrink:0; }
  .sb-step { flex:0 0 auto; display:flex; flex-direction:row; align-items:center; gap:5px; font-size:12px; font-weight:800;
    border-radius:999px; padding:5px 11px; background:#ffffff66; color:#5b7c93; white-space:nowrap; }
  .sb-step.active { background:#fff; color:#2f6ab0; box-shadow:0 2px 6px rgba(30,60,110,.14); }
  .sb-step.solved { background:#cdefd8; color:#22794a; }
  .sb-step .n { width:15px; height:15px; border-radius:50%; background:#c9d8ea; color:#fff; font-size:10px;
    display:inline-flex; align-items:center; justify-content:center; }
  .sb-step.active .n { background:#4b83d6; }
  .sb-step.solved .n { background:#46b366; }
  .sb-word { font-weight:800; }
  .sb-arrow { color:#7fa2cc; font-weight:800; font-size:13px; }

  /* 어휘 → 표현으로 단어가 이어지는 이동 연출 */
  .fly-word { position:fixed; z-index:80; display:flex; align-items:center; justify-content:center;
    background:#cdefd8; color:var(--green); font-weight:800; font-size:17px; border-radius:9px; pointer-events:none;
    transition:transform .5s cubic-bezier(.34,.02,.24,1), opacity .5s ease; }

  /* 어휘 정답 후 다음 단계 예고 — '다음 문제' 버튼을 가리키는 말풍선 */
  .tip-bubble { position:absolute; bottom:calc(100% + 10px); left:84%; z-index:5;
    background:var(--purple-d); color:#fff; font-size:12.5px; font-weight:800; padding:7px 13px; border-radius:13px;
    white-space:nowrap; box-shadow:0 4px 12px rgba(80,60,160,.3); animation:tipBob 1.8s ease-in-out infinite; }
  .tip-bubble::after { content:''; position:absolute; top:100%; left:50%; margin-left:-6px;
    border:6px solid transparent; border-top-color:var(--purple-d); }
  @keyframes tipBob {
    0%,100%{ transform:translateX(-50%) translateY(0); }
    50%{ transform:translateX(-50%) translateY(-4px); }
  }

  /* 옵션 스위치 */
  .opt-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 0; }
  .opt-row .rt { font-size:12.5px; font-weight:700; color:#3a567d; }
  .opt-sw { width:40px; height:23px; border-radius:999px; border:none; background:#cfd8e6; position:relative; cursor:pointer; flex-shrink:0; transition:background .18s; }
  .opt-sw::after { content:''; position:absolute; top:2.5px; left:2.5px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left .18s; }
  .opt-sw.on { background:#46b366; }
  .opt-sw.on::after { left:19px; }
  .opt-div { height:1px; background:#e4ebf4; margin:9px 0 4px; }

  /* 세션 */
  .stage { flex:1; min-height:0; display:flex; flex-direction:column; padding:10px 16px 0; }
  .stage-scroll { flex:1; min-height:0; overflow-y:auto; padding-top:22px; }
  .stage-bottom { flex-shrink:0; padding:10px 0 16px; }

  /* 채팅 말풍선 카드 */
  .chat-card { position:relative; background:linear-gradient(#e9f1fb 0%, #f4f8fd 42%, #ffffff 42%, #ffffff 100%);
    border-radius:22px; box-shadow:0 6px 18px rgba(30,60,110,.13); padding:22px 20px 16px; }
  .chat-card.correct { background:linear-gradient(#dff3e4 0%,#eaf8ee 46%,#fbfffc 46%,#fbfffc 100%); }
  .chat-tag { position:absolute; top:-13px; left:16px; background:#cfe0f5; color:#3a6bb0; font-size:12px; font-weight:800; border-radius:11px 11px 11px 3px; padding:3px 11px; display:flex; align-items:center; gap:5px; }
  .chat-tag .q { width:15px; height:15px; border-radius:50%; background:#a9c4e8; color:#fff; font-size:10px; display:inline-flex; align-items:center; justify-content:center; }
  .chat-badge { position:absolute; top:-11px; right:16px; font-size:12px; font-weight:800; padding:3px 10px; border-radius:9px 9px 3px 9px; }
  .chat-badge.new { background:#ff6f6f; color:#fff; }
  .chat-badge.old { background:#5b8fd6; color:#fff; }
  .check-mark { position:absolute; top:-22px; left:2px; font-size:46px; color:var(--green); text-shadow:0 2px 4px rgba(0,0,0,.12); animation:pop .3s ease; }
  @keyframes pop { from{opacity:0; transform:scale(.5) rotate(-15deg);} to{opacity:1; transform:none;} }

  .chat-situation { font-size:12.5px; color:#9aa8bc; margin-bottom:4px; }
  .chat-ko { font-size:18px; line-height:1.55; color:#33465c; font-weight:600; }
  .chat-ko.note { font-size:13px; color:#9aa8bc; font-weight:400; margin-top:2px; }
  .tgt { color:var(--green); font-weight:800; }
  .chat-en { font-size:19px; line-height:1.7; color:#2f3e52; font-weight:600; margin-top:18px; }
  .chat-src { text-align:right; font-size:11px; color:#c0cad8; margin-top:12px; }

  /* 인라인 빈칸(입력) */
  .blank { field-sizing:content; min-width:66px; max-width:100%; background:#dbe8fb; border:none; border-radius:9px; padding:2px 10px;
    font:inherit; font-weight:800; color:#3a6bb0; text-align:center; outline:none; vertical-align:baseline; }
  .blank::placeholder { color:#9db8dd; font-weight:700; letter-spacing:.08em; }
  .blank.revealed::placeholder { color:#3a6bb0; letter-spacing:0; }   /* 정답 공개 상태 */
  .blank.correct { background:#cdefd8; color:var(--green); }
  /* 카드 내 오답 피드백 박스 */
  .wrong-box { background:#cdd8f2; color:#42527a; border-radius:11px; padding:10px 14px; font-size:15px; font-weight:600; margin:14px 0 2px; }
  .wrong-box .wc { color:#e14b46; font-weight:800; }
  /* 정답 보기 후 — placeholder는 타이핑하면 가려지므로 문장 아래에 정답을 남겨둔다 */
  .reveal-note { margin-top:10px; font-size:13.5px; font-weight:700; color:#7d97b8; }
  .reveal-note b { font-size:16px; font-weight:800; color:#3a6bb0; margin-left:2px; }

  /* 어휘 하단 — 풀이 중 */
  .vtools { display:flex; justify-content:space-between; align-items:center; padding:4px 6px; }
  .vtool { display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; cursor:pointer; color:#8a7fc0; font-size:12px; font-weight:700; padding:4px 8px; }
  .vtool .ic { width:30px; height:30px; border-radius:50%; background:#eae6fb; display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--purple-d); }
  .vtool.mic .ic { background:#eef1fb; color:#5b83b8; }
  .vtool:disabled { opacity:.85; cursor:default; }

  /* 어휘 하단 — 정답 후: 탭 + 3버튼 */
  .vtabs { display:flex; justify-content:space-between; padding:6px 2px 12px; border-bottom:1px solid #cfdcec; margin-bottom:12px; }
  .vtab { flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; background:none; border:none; cursor:pointer; color:#9aa8bc; font-size:10.5px; font-weight:700; }
  .vtab .ic { width:34px; height:34px; border-radius:10px; background:#e7ecf5; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .vtab .badge { position:relative; }
  .vtab .badge::after { content:attr(data-n); position:absolute; top:-6px; right:-8px; background:#ff7a45; color:#fff; font-size:9px; font-weight:800; border-radius:50%; width:15px; height:15px; display:flex; align-items:center; justify-content:center; }
  .vbtns { position:relative; display:flex; gap:10px; }
  .vbtns.has-tip { margin-top:50px; }   /* 말풍선(높이 30 + 10 오프셋)이 위 탭을 가리지 않도록 */
  .vbtn { flex:1; border:none; border-radius:16px; padding:16px 6px; color:#fff; font-weight:800; font-size:14.5px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; box-shadow:0 4px 10px rgba(80,70,160,.22); }
  .vbtn .ic { font-size:20px; }
  .vbtn.b1 { background:linear-gradient(#b39cf2,#9b7ef0); }
  .vbtn.b2 { background:linear-gradient(#9b8cf0,#7d6cf0); }
  .vbtn.b3 { background:linear-gradient(#6f8ef0,#5b6ef0); }

  /* 배열 전 — 이번에 배울 것(무엇 + 얼마나 쓸모있나) */
  .learn-box { background:#e2d7f8; border-radius:14px; padding:12px 14px; margin:14px 0 4px; }
  .learn-label { font-size:11.5px; font-weight:800; color:#8878b3; }
  .learn-pat { font-size:18.5px; font-weight:800; color:var(--purple-d); margin-top:3px; line-height:1.35; }
  /* 정답 문장의 핵심 표현 구간(형광펜) — 안의 트리거 어휘는 .tgt 초록 유지 */
  .core { background:#e4d9fb; border-radius:6px; padding:2px 5px; box-decoration-break:clone; -webkit-box-decoration-break:clone; }
  /* 핵심 표현 뒤 — 단어만 바뀌는 영역 */
  .rest { text-decoration:underline; text-decoration-color:#a9bdd8; text-decoration-thickness:2px; text-underline-offset:4px; }

  /* 배열 정답 후 — 재사용 프레임 공개 + 응용 예문(효용 체감) */
  .payoff { background:#eefaf2; border:1px solid #c6ecd5; border-radius:14px; padding:12px 14px; margin-top:16px; }
  .payoff-top { font-size:13.5px; font-weight:800; color:#2f7d51; margin-bottom:9px; }
  .frame { background:#fff; border:1.5px dashed #a8dcbd; border-radius:11px; padding:11px 12px; text-align:center; }
  .frame-en { font-size:18.5px; font-weight:800; color:#22794a; line-height:1.4; }
  .frame-en .slot { display:inline-block; min-width:38px; border-bottom:2.5px solid #7bbd96; }
  .frame-kr { font-size:12.5px; color:#7d9a8b; margin-top:4px; }
  .swap-label { font-size:12.5px; font-weight:700; color:#3f6b50; margin:12px 0 2px; }
  .swap-label b { color:#22794a; font-weight:800; }
  .swap-ex { background:#fff; border-radius:9px; padding:9px 12px; margin-top:7px; }
  .swap-en { font-size:15px; font-weight:700; color:#2f3e52; line-height:1.4; }
  .swap-en .sw { color:var(--green); font-weight:800; }
  .swap-kr { font-size:12px; color:#8c9aab; margin-top:3px; }

  /* 배열 — 인라인 문장 채우기 */
  .fill { position:relative; display:flex; flex-wrap:wrap; align-items:center; gap:7px 8px; margin-top:16px; min-height:44px; }
  .fill-word { background:#eaf1fb; border:1px solid #cdddf3; border-radius:9px; padding:6px 13px; font-size:17px; color:#2f3e52; cursor:pointer; }
  .fill-word.trigger-w { background:#e3fbec; border-color:#8ed9ab; color:#22794a; font-weight:800; }
  .fill-blank { min-width:52px; border-bottom:2px solid #b9c7db; height:26px; }
  .fill-punct { font-size:18px; color:#2f3e52; font-weight:700; }
  .mic-float { align-self:flex-end; width:52px; height:52px; border-radius:50%; background:#fff; box-shadow:0 3px 10px rgba(30,60,110,.2); display:flex; align-items:center; justify-content:center; font-size:22px; margin:6px 2px 0 auto; color:#5b6ef0; }

  /* 방금 배운 어휘를 '써먹는' 순간의 연출 (팝 + 링 반사 + 배지) */
  .fill-word.just-used { animation:usedPop .5s ease; }
  @keyframes usedPop { 0%{transform:scale(1);} 34%{transform:scale(1.16);} 100%{transform:scale(1);} }
  .ring { position:absolute; border:2.5px solid #46b366; border-radius:11px; opacity:.8; pointer-events:none; animation:ringOut .62s ease-out forwards; }
  @keyframes ringOut { to { transform:scale(1.85); opacity:0; } }
  .used-badge { position:absolute; background:#46b366; color:#fff; font-size:11.5px; font-weight:800; padding:3px 10px; border-radius:9px; white-space:nowrap;
    box-shadow:0 3px 8px rgba(46,158,87,.32); pointer-events:none; animation:badgeUp 1.2s ease forwards; }
  @keyframes badgeUp {
    0%{ opacity:0; transform:translate(-50%,5px) scale(.85); }
    18%{ opacity:1; transform:translate(-50%,-6px) scale(1); }
    76%{ opacity:1; transform:translate(-50%,-9px); }
    100%{ opacity:0; transform:translate(-50%,-18px); }
  }

  /* 배열 — 단어 뱅크 (자리 유지) */
  .bank { display:flex; flex-wrap:wrap; gap:9px; margin-bottom:12px; padding-top:9px; }
  .tile { position:relative; border:1px solid #cdddf3; background:#fff; border-radius:11px; padding:12px 16px; font-size:16.5px; color:#2f3e52; cursor:pointer; box-shadow:0 1px 3px rgba(30,60,110,.08); }
  /* 방금 배운 어휘 칩 — 어휘 단계의 초록 정답과 시각적으로 이어짐 */
  .tile.trigger { border-color:#8ed9ab; background:#f4fdf7; color:#22794a; font-weight:800; animation:tilePulse 1.7s ease-in-out infinite; }
  .tile.trigger::before { content:attr(data-label); position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    background:#46b366; color:#fff; font-size:9px; font-weight:800; padding:1px 7px; border-radius:6px; white-space:nowrap; letter-spacing:-.02em; max-width:150px; overflow:hidden; text-overflow:ellipsis; }
  @keyframes tilePulse {
    0%,100%{ box-shadow:0 0 0 3px rgba(70,179,102,.16), 0 2px 6px rgba(46,158,87,.16); }
    50%{ box-shadow:0 0 0 8px rgba(70,179,102,.04), 0 3px 11px rgba(46,158,87,.28); }
  }
  .tile.placed { background:#e3e9f2; border-color:#dbe2ee; color:transparent; box-shadow:none; cursor:default; pointer-events:none; animation:none; }
  .tile.placed::before { display:none; }

  /* 배열 하단 버튼 */
  .arr-btns { display:flex; gap:10px; }
  .btn-ghost2 { flex:0 0 27%; border:none; border-radius:16px; padding:15px 6px; background:linear-gradient(#c9b8f2,#b49cf0); color:#fff; font-weight:800; font-size:13px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .btn-ghost2 .ic { font-size:16px; }
  .btn-confirm { flex:1; border:none; border-radius:16px; padding:16px; background:linear-gradient(#8b7cf0,#6f5bf0); color:#fff; font-weight:800; font-size:16px; cursor:pointer; }
  .btn-confirm:disabled { background:#c2c7d2; cursor:default; }
  .btn-next { width:100%; border:none; border-radius:16px; padding:16px; background:linear-gradient(#6f8ef0,#5b6ef0); color:#fff; font-weight:800; font-size:16px; cursor:pointer; }

  /* 완료 */
  .done { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:30px 22px; text-align:center; overflow-y:auto; }
  .done .emoji { font-size:52px; }
  .done h2 { color:#25406a; margin:0; }
  .done p { color:#3a567d; margin:0; }
  .learned-list { width:100%; background:#fff; border-radius:14px; padding:12px 14px; text-align:left; box-shadow:0 3px 12px rgba(30,60,110,.1); }
  .learned-list .h { font-size:13px; font-weight:800; color:#3a6bb0; margin-bottom:8px; }
  .learned-list .it { font-size:14px; color:#42527a; margin:7px 0; line-height:1.45; }
  .learned-list .it b { color:#25406a; }
  .learned-list .it .en { color:#6b7c93; }
  .btn { border:none; border-radius:26px; padding:14px 30px; background:var(--blue); color:#fff; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 4px 14px rgba(30,60,110,.25); }
  .btn.ghost { background:#fff; color:#45566b; box-shadow:none; }
  .row { display:flex; gap:10px; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar hidden" id="topbar">
    <button class="icon-btn" id="backBtn" aria-label="뒤로">‹</button>
    <div class="trophy">🏆</div>
    <div class="progress"><div class="bar-count" id="barCount">0/0</div><div class="bar-track"><div class="bar-fill" id="barFill"></div></div><span class="bar-star" id="barStar">⭐</span></div>
    <button class="icon-btn gear" id="gearBtn" aria-label="설정">⚙</button>
  </div>

  <div class="home" id="home">
    <h1>어휘 → 표현</h1>
    <p class="sub"><b>빈칸으로 어휘를 배우고</b>, 그 어휘가 트리거하는 문장을 <b>단어 배열</b>로 완성해요.</p>
    <div class="tabs" id="tabs"></div>
    <div id="levelList"></div>
    <div class="note">진입점은 하나예요. 들어가면 문항마다 <b>트리거 어휘가 달라지고, 그에 따라 배우는 표현도 매번 달라져요.</b><br>빈칸은 힌트·정답을 봐도 직접 입력해야 정답 처리돼요.</div>
  </div>

  <div class="step-banner hidden" id="stepBanner"></div>
  <div class="stage hidden" id="stage"></div>
  <div class="setting-pop hidden" id="settingPop"></div>
</div>

<script>
const el = id => document.getElementById(id);
const topbar = el('topbar'), home = el('home'), stage = el('stage');
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// localStorage — 진입점이 하나이므로 '어디까지 풀었는지'만 모드별로 기억한다
const MODE_KEY='ve:mode', POS_KEY='ve:pos';
function getPos(mode){ try{ return Number(JSON.parse(localStorage.getItem(POS_KEY)||'{}')[mode])||0; }catch(e){ return 0; } }
function setPos(mode,n){
  try{ const o=JSON.parse(localStorage.getItem(POS_KEY)||'{}'); o[mode]=n; localStorage.setItem(POS_KEY, JSON.stringify(o)); }catch(e){}
}

// 트리거 어휘 칩 라벨 옵션: 'learned'(방금 배운) | 'meaning'(단어 뜻)
const CHIP_KEY='ve:chipLabel';
let chipLabelMode=(()=>{ try{ return localStorage.getItem(CHIP_KEY)||'learned'; }catch(e){ return 'learned'; } })();
function setChipLabelMode(m){
  chipLabelMode=m;
  try{ localStorage.setItem(CHIP_KEY,m); }catch(e){}
  renderChipOptions();
  applyChipLabels();          // 세션 중에도 즉시 반영
}
// 뜻 문자열을 라벨용으로 다듬는다: <주석>·(부연) 제거 후 앞쪽 뜻만 10자 내로
function shortMeaning(m){
  let t=String(m||'').replace(/<[^>]*>/g,' ').replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').trim();
  const parts=t.split(/[,;/]/).map(x=>x.trim()).filter(Boolean);
  let out='';
  for(const p of parts){ const cand=out?out+', '+p:p; if(cand.length>10) break; out=cand; }
  if(!out) out=(parts[0]||t).slice(0,10);
  return out;
}
function chipLabelText(item){
  if(chipLabelMode==='meaning'){ const m=shortMeaning(item.meaning); if(m) return m; }
  return '방금 배운';
}
function applyChipLabels(){
  const it=sessionItems[itemIdx];
  if(!it) return;
  document.querySelectorAll('.tile.trigger').forEach(t=>{ t.dataset.label=chipLabelText(it); });
}
// 연결 강화 옵션 3종 — 각각 켜고 끌 수 있게(기본 ON)
const OPTS_KEY='ve:opts';
const OPT_DEF={banner:true, preview:true, fly:true};
let OPTS=(()=>{ try{ return Object.assign({}, OPT_DEF, JSON.parse(localStorage.getItem(OPTS_KEY)||'{}')); }catch(e){ return {...OPT_DEF}; } })();
function setOpt(k,v){
  OPTS[k]=v;
  try{ localStorage.setItem(OPTS_KEY, JSON.stringify(OPTS)); }catch(e){}
  renderOptions();
  // 배너를 끄면 즉시 감추고, 켜면 현재 단계에 맞춰 다시 그린다
  if(k==='banner') refreshBanner();
}

// 단계 배너: [① 어휘] → [② 표현]. 어휘를 맞히면 1단계가 `✓ {단어}`로 바뀌어 표현 화면까지 이어진다
let bannerStep=0, bannerWord='';
function renderStepBanner(step, word){
  bannerStep=step; bannerWord=word||'';
  refreshBanner();
}
function refreshBanner(){
  const el2=el('stepBanner');
  if(!OPTS.banner || !bannerStep){ el2.classList.add('hidden'); el2.innerHTML=''; return; }
  const modeWord = curMode==='grammar' ? '문장' : '표현';
  const s1 = bannerWord
    ? `<span class="sb-step solved"><span class="n">✓</span><span class="sb-word">${escapeHtml(bannerWord)}</span></span>`
    : `<span class="sb-step${bannerStep===1?' active':''}"><span class="n">1</span>어휘 익히기</span>`;
  const s2 = `<span class="sb-step${bannerStep===2?' active':''}"><span class="n">2</span>${modeWord} 만들기</span>`;
  el2.classList.remove('hidden');
  el2.innerHTML=`${s1}<span class="sb-arrow">→</span>${s2}`;
}

// 배운 단어가 어휘 문장 자리에서 다음 화면의 자리로 날아가 앉는 연출
function flyWord(text, fromRect, toRect){
  if(!fromRect || !toRect || !fromRect.width || !toRect.width) return;
  const f=document.createElement('div'); f.className='fly-word'; f.textContent=text;
  f.style.left=fromRect.left+'px'; f.style.top=fromRect.top+'px';
  f.style.width=fromRect.width+'px'; f.style.height=fromRect.height+'px';
  document.body.appendChild(f);
  const dx=toRect.left-fromRect.left, dy=toRect.top-fromRect.top;
  const sx=Math.max(.2, toRect.width/fromRect.width), sy=Math.max(.2, toRect.height/fromRect.height);
  requestAnimationFrame(()=>{
    f.style.transformOrigin='top left';
    f.style.transform=`translate(${dx}px,${dy}px) scale(${sx},${sy})`;
    f.style.opacity='.35';
  });
  setTimeout(()=>f.remove(), 560);
}

function segHtml(){
  return `<div class="seg">
      <button class="seg-b${chipLabelMode==='learned'?' on':''}" data-m="learned">방금 배운</button>
      <button class="seg-b${chipLabelMode==='meaning'?' on':''}" data-m="meaning">단어 뜻</button>
    </div>`;
}
// 홈과 설정 팝오버 두 곳의 옵션 UI를 함께 다시 그린다
const OPT_ROWS=[
  ['banner','단계 배너 · 배운 단어 이어가기'],
  ['preview','어휘 정답 후 다음 단계 예고'],
  ['fly','어휘 → 표현 단어 이동 연출'],
];
function renderOptions(){
  ['optHome','settingPop'].forEach(id=>{
    const box=el(id);
    if(!box || box.classList.contains('hidden')) return;
    box.innerHTML=`<div class="opt-label">트리거 어휘 칩 라벨</div>${segHtml()}
      <div class="opt-div"></div>
      <div class="opt-label">어휘 → 표현 연결</div>
      ${OPT_ROWS.map(([k,t])=>`<div class="opt-row"><span class="rt">${t}</span><button class="opt-sw${OPTS[k]?' on':''}" data-k="${k}" aria-label="${t}"></button></div>`).join('')}`;
    box.querySelectorAll('.seg-b').forEach(b=> b.onclick=()=>setChipLabelMode(b.dataset.m));
    box.querySelectorAll('.opt-sw').forEach(b=> b.onclick=()=>setOpt(b.dataset.k, !OPTS[b.dataset.k]));
  });
}
const renderChipOptions=renderOptions;   // 기존 호출부 호환

// 채점 정규화 / 배열 토큰
function norm(s){ return s.toLowerCase().trim().replace(/^[^\w']+|[^\w']+$/g,'').replace(/\s+/g,' '); }
function tokenize(sent){ return sent.trim().replace(/[.?!]+$/,'').split(/\s+/); }
function trailPunct(sent){ const m=sent.trim().match(/[.?!]+$/); return m?m[0]:''; }

let DATA=null, curMode='expression', sessionItems=[], itemIdx=0, learned=[];

// 상단 설정(기어) — 세션 중에도 라벨 옵션을 바로 바꿔볼 수 있게.
// 바깥 클릭 닫기는 mousedown에서 처리하고, 기어/팝오버 내부 클릭은 contains로 걸러낸다.
el('gearBtn').addEventListener('click', ()=>{
  const pop=el('settingPop');
  const willOpen=pop.classList.contains('hidden');
  pop.classList.toggle('hidden', !willOpen);
  if(willOpen) renderChipOptions();
});
document.addEventListener('mousedown', e=>{
  const pop=el('settingPop'), g=el('gearBtn');
  if(pop.classList.contains('hidden')) return;
  if(pop.contains(e.target) || g.contains(e.target)) return;
  pop.classList.add('hidden');
});

fetch('vocab-expression.data.json').then(r=>r.json()).then(d=>{ DATA=d; curMode=(localStorage.getItem(MODE_KEY))||'expression'; renderHome(); })
  .catch(e=>{ home.innerHTML='<h1>데이터 로드 실패</h1><p class="sub">'+escapeHtml(String(e))+'</p>'; });

// ── 홈 ──────────────────────────────────────────────────────────────────────
function renderHome(){
  topbar.classList.add('hidden'); stage.classList.add('hidden'); home.classList.remove('hidden');
  renderStepBanner(0);
  const tabs=el('tabs'); tabs.innerHTML='';
  Object.entries(DATA.modes).forEach(([key,m])=>{
    const b=document.createElement('button'); b.className='tab'+(key===curMode?' on':'');
    b.innerHTML=`${m.label}<span class="td">${m.desc}</span>`;
    b.onclick=()=>{ curMode=key; try{localStorage.setItem(MODE_KEY,key);}catch(e){} renderHome(); };
    tabs.appendChild(b);
  });
  // 진입점은 하나 — 들어가면 문항마다 트리거 어휘와 표현/문법이 계속 달라진다
  const m=DATA.modes[curMode], list=el('levelList'); list.innerHTML='';
  const total=m.items.length, pos=Math.min(getPos(curMode), total);
  const rest=total-pos, resume=pos>0&&rest>0;
  const c=document.createElement('button'); c.className='lv-card'+(rest===0?' cleared':'');
  c.innerHTML=`${rest===0?'<span class="clear-badge">✓ 완료</span>':''}
    <div class="t">${resume?`이어서 풀기`:`${escapeHtml(m.label)} 학습 시작`}</div>
    <div class="f">${rest===0?`${total}문항을 모두 풀었어요`:`어휘 빈칸 → 문장 배열 · 남은 ${rest}문항`}</div>
    <span class="step">문항마다 어휘와 ${curMode==='grammar'?'문법':'표현'}이 달라져요 · 총 ${total}문항</span>`;
  c.onclick=()=>startSession(rest===0?0:pos);
  list.appendChild(c);
  if(pos>0){
    const r=document.createElement('button'); r.className='restart-btn';
    r.textContent='처음부터 다시 풀기';
    r.onclick=()=>{ setPos(curMode,0); startSession(0); };
    list.appendChild(r);
  }
  const opt=document.createElement('div'); opt.className='opt-box'; opt.id='optHome';
  list.appendChild(opt);
  renderChipOptions();
}

// ── 세션 ────────────────────────────────────────────────────────────────────
function startSession(startIdx){
  sessionItems=DATA.modes[curMode].items; itemIdx=Math.min(startIdx||0, sessionItems.length-1); learned=[];
  home.classList.add('hidden'); topbar.classList.remove('hidden'); stage.classList.remove('hidden');
  el('backBtn').onclick=()=>{ setPos(curMode, itemIdx); renderHome(); };
  renderVocab();
}
// 진행바: 어휘/배열 2단계 × 전체 문항. 별·카운트는 채워진 위치로 이동
function setProgress(stepDone){
  const total=sessionItems.length*2, pct=Math.min(100, stepDone/total*100);
  el('barFill').style.width=pct+'%';
  el('barStar').style.left=pct+'%';
  const bc=el('barCount'); bc.textContent=`${itemIdx+1}/${sessionItems.length}`; bc.style.left=pct+'%';
}
// 카드 좌상단 태그 — 문항마다 레벨이 다르므로 해당 문항의 레벨을 쓴다
function chatTag(item){ return `<div class="chat-tag">레벨 ${item.level}<span class="q">?</span></div>`; }

// 한국어 번역 줄: [뜻]을 초록, (설명)줄은 muted
function koHtml(line){
  const note=/^\s*\(/.test(line);
  const html=escapeHtml(line).replace(/\[([^\]]+)\]/g,(m,g)=>`<span class="tgt">${g}</span>`);
  return `<div class="chat-ko${note?' note':''}">${html}</div>`;
}
// 힌트 placeholder: level1=첫글자+길이, level2=정답 전체
// 힌트 단계: 1=앞 2글자 공개(나머지는 길이만), 2=정답 전체
function hintPlaceholder(answer, level){
  if(level>=2) return answer;
  if(level===1){
    const show=Math.min(2, answer.length);
    let s=answer.slice(0, show);
    for(let i=show;i<answer.length;i++) s+= answer[i]===' ' ? '  ' : '_';
    return s;
  }
  return '';
}
// 오답 글자 비교(빨강 강조) + 다른 글자 수
function diffSpell(typed, answer){
  let out='', wrong=0;
  for(let i=0;i<Math.max(typed.length,answer.length);i++){
    const t=typed[i];
    if(i>=typed.length){ out+='<span class="wc">_</span>'; wrong++; }
    else if(t.toLowerCase()===(answer[i]||'').toLowerCase()) out+=escapeHtml(t);
    else { out+=`<span class="wc">${escapeHtml(t)}</span>`; wrong++; }
  }
  return {html:out, wrong};
}
function hlTrigger(sent, trig){
  const re=new RegExp('\\b('+trig.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')\\b','i');
  return escapeHtml(sent).replace(re, m=>`<span class="tgt">${m}</span>`);
}

// [1] 어휘 빈칸 ────────────────────────────────────────────────────────────────
function renderVocab(){
  const item=sessionItems[itemIdx], v=item.vocab, answer=v.answer;
  setProgress(itemIdx*2);
  renderStepBanner(1, '');
  let hintLevel=0, done=false;

  const ko=v.koLines.map(koHtml).join('');
  const en=v.enLines.map(ln=>`<div class="chat-en">${escapeHtml(ln).replace(/\[[^\]]+\]/,
      `<input class="blank" id="vin" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" />`)}</div>`).join('');

  stage.innerHTML=`
    <div class="stage-scroll">
      <div class="chat-card" id="card">
        ${chatTag(item)}<div class="chat-badge new">New</div>
        ${ko}
        <div class="wrong-box hidden" id="wrongBox"></div>
        ${en}
        <div class="reveal-note hidden" id="revealNote"></div>
      </div>
    </div>
    <div class="stage-bottom" id="bottom">
      <div class="vtools" id="vtools">
        <button class="vtool" id="hintBtn"><span class="ic">?</span><span id="hintLabel">힌트 보기</span></button>
        <button class="vtool mic" disabled><span class="ic">🎤</span><span>음성 모드</span></button>
      </div>
    </div>`;

  const vin=el('vin'), wrongBox=el('wrongBox'), card=el('card');
  const applyHint=()=>{ vin.placeholder=hintPlaceholder(answer, hintLevel); };
  applyHint();
  setTimeout(()=>vin.focus(),60);

  function markCorrect(){
    done=true;
    vin.value=answer; vin.readOnly=true; vin.classList.add('correct'); vin.placeholder='';
    card.classList.add('correct');
    wrongBox.classList.add('hidden');
    el('revealNote').classList.add('hidden');
    if(!card.querySelector('.check-mark')){ const c=document.createElement('div'); c.className='check-mark'; c.textContent='✓'; card.appendChild(c); }
    renderStepBanner(1, item.word);          // 배운 단어를 배너에 올린다
    // 하단: (예고) + 탭 + 3버튼
    el('bottom').innerHTML=`
      <div class="vtabs">
        <button class="vtab"><span class="ic">💬</span>다른 예문</button>
        <button class="vtab"><span class="ic badge" data-n="1">📝</span>오답 노트</button>
        <button class="vtab"><span class="ic">🤖</span>AI 질문 답변</button>
        <button class="vtab"><span class="ic">🔍</span>사전 검색</button>
        <button class="vtab"><span class="ic">📖</span>단어 정보</button>
      </div>
      <div class="vbtns${OPTS.preview?' has-tip':''}">
        ${OPTS.preview?`<div class="tip-bubble">이제 이 단어를 써볼까요?</div>`:''}
        <button class="vbtn b1" disabled><span class="ic">🎧</span>단어 듣기</button>
        <button class="vbtn b2" disabled><span class="ic">🔊</span>다시 듣기</button>
        <button class="vbtn b3" id="nextBtn"><span class="ic">▶</span>다음 문제</button>
      </div>`;
    el('nextBtn').onclick=()=>{
      // 이동 연출: 초록 정답 칸 → 다음 화면에서 그 단어가 놓이는 자리
      const fromRect = OPTS.fly && vin ? vin.getBoundingClientRect() : null;
      renderArrange();
      if(fromRect){
        const target = (OPTS.banner ? document.querySelector('#stepBanner .sb-step.solved') : null)
                    || document.querySelector('.tile.trigger');
        if(target) flyWord(answer, fromRect, target.getBoundingClientRect());
      }
    };
  }
  function onInput(){
    if(done) return;
    if(norm(vin.value)===norm(answer)){ markCorrect(); return; }
    const t=vin.value.trim();
    if(t.length>=answer.replace(/ /g,'').length && t.length>0){
      const {html,wrong}=diffSpell(t, answer);
      wrongBox.classList.remove('hidden'); wrongBox.innerHTML=`${html} - 정답과 ${wrong}글자 달라요.`;
    } else wrongBox.classList.add('hidden');
  }
  vin.addEventListener('input', onInput);

  el('hintBtn').onclick=()=>{
    if(hintLevel===0){        // 힌트 보기 → 앞 2글자
      hintLevel=1;
      el('hintLabel').textContent='정답 보기'; el('hintBtn').querySelector('.ic').textContent='✔';
    }
    else {                    // 정답 보기 → 전체 단어
      hintLevel=2;
      vin.classList.add('revealed');
      // 정답은 placeholder로 보여주므로 입력값이 남아 있으면 가려진다 → 입력한 답을 비운다
      if(vin.value){ vin.value=''; wrongBox.classList.add('hidden'); }
      // 다시 타이핑하면 placeholder가 가려지므로 문장 아래에 정답을 남겨둔다
      const rn=el('revealNote');
      rn.classList.remove('hidden');
      rn.innerHTML=`정답<b>${escapeHtml(answer)}</b>`;
    }
    applyHint(); vin.focus();
  };
}

// 방금 배운 어휘와 같은 타일인지 판정. 정확일치 + 규칙 굴절형까지 인정한다
// (days/jobs/going/taxes/dancing/parties/dirtier/fatter, 복합어 round-trip⊃trip).
// speak→spoke, good→best 같은 불규칙은 매칭되지 않고, 그 경우 칩 강조·연출을 생략한다.
const INFL_SUFFIX=/^(?:s|es|ed|d|ing|er|est|ies|ier|iest|'s|')$/;
function normTok(s){ return String(s).toLowerCase().replace(/[^a-z0-9']/g,''); }
function wordParts(s){ return String(s).toLowerCase().split(/[^a-z0-9']+/).filter(Boolean); }
function matchStem(a,b){
  if(!a || !b || b.length<2) return false;
  if(a===b) return true;
  if(a.startsWith(b)){
    let rest=a.slice(b.length);
    // CVC 자음 중복(fat→fatter): 중복 글자가 어간 끝 글자와 같을 때만 벗겨낸다
    if(rest.length>2 && rest[0]===b[b.length-1]) rest=rest.slice(1);
    if(!rest || INFL_SUFFIX.test(rest)) return true;
  }
  // 어미 e/y 탈락형 (dance→dancing, party→parties, dirty→dirtier)
  const stem=b.replace(/[ey]$/,'');
  return stem.length>=3 && stem!==b && a.startsWith(stem) && INFL_SUFFIX.test(a.slice(stem.length));
}
function isTriggerToken(tok, trigger){
  // 하이픈 조각 단위로 비교 — Round-trip ⊃ trip은 잡고, wondering ⊃ ring 같은 오탐은 막는다
  const parts=wordParts(tok), trigs=wordParts(trigger);
  return parts.some(a=> trigs.some(b=> matchStem(a,b)));
}

// 문장 안에서 해당 단어(굴절형 포함)만 강조 — 문장부호는 강조 밖으로 뺀다
function hlWord(sent, word, cls){
  cls=cls||'sw';
  return String(sent).split(/(\s+)/).map(t=>{
    if(/^\s*$/.test(t)) return t;
    if(!isTriggerToken(t, word)) return escapeHtml(t);
    const m=t.match(/^([^A-Za-z0-9']*)(.*?)([^A-Za-z0-9']*)$/);
    return escapeHtml(m[1])+`<span class="${cls}">${escapeHtml(m[2])}</span>`+escapeHtml(m[3]);
  }).join('');
}
// 표현 문장 렌더: `[...]` 구간(핵심 표현)은 형광펜, 그 뒤(단어가 바뀌는 영역)는 밑줄,
// 그 안의 해당 어휘는 초록. 문법엔 core 구간이 없어 어휘만 강조하는 폴백으로 동작한다.
function hlExpr(sent, core, word, cls){
  cls=cls||'tgt';
  const s=String(sent);
  const i = core ? s.toLowerCase().indexOf(String(core).toLowerCase()) : -1;
  if(i<0) return hlWord(s, word, cls);
  const head=s.slice(0,i), mid=s.slice(i,i+core.length), tail=s.slice(i+core.length);
  return hlWord(head, word, cls)
    + `<span class="core">${hlWord(mid, word, cls)}</span>`
    + (tail.trim() ? `<span class="rest">${hlWord(tail, word, cls)}</span>` : escapeHtml(tail));
}

// 배열 전: 이번에 뭘 배우는지 + 그게 얼마나 쓸모있는지(활용 규모)를 한눈에.
// 영어 프레임(pattern_en)은 정답 순서가 새므로 여기서 노출하지 않는다.
function learnBoxHtml(item){
  const s=item.sentence, isG=curMode==='grammar';
  const pat=(s.pattern_kr||'').trim();   // 한국어 뜻만 (영어 틀은 정답이 새므로 제외)
  if(!pat) return `<div class="learn-box"><div class="learn-pat">초록색 단어를 넣어 문장을 완성해요</div></div>`;
  return `<div class="learn-box">
      <div class="learn-label">이번에 배울 ${isG?'문법':'표현'}</div>
      <div class="learn-pat">${escapeHtml(pat)}</div>
    </div>`;
}

// 정답 후: 숨겨뒀던 '재사용 프레임'을 공개하고, 단어만 바꾼 실제 예문으로
// "이제 이런 말도 할 수 있다"는 효용을 눈으로 확인시킨다.
function patternPayoffHtml(item){
  const s=item.sentence, isG=curMode==='grammar';
  const patEn=(s.pattern_en||'').trim(), patKr=(s.pattern_kr||'').trim();
  const sibs=(s.siblings||[]).slice(0,2);
  if(!patEn && !patKr && !sibs.length) return '';
  let frame='';
  if(!isG && patEn){
    frame=`<div class="frame"><div class="frame-en">${escapeHtml(patEn).replace(/~/g,'<span class="slot"></span>')}</div>${patKr?`<div class="frame-kr">${escapeHtml(patKr)}</div>`:''}</div>`;
  } else if(patKr){
    frame=`<div class="frame"><div class="frame-en">${escapeHtml(patKr)}</div></div>`;
  }
  const exs=sibs.map(x=>
    `<div class="swap-ex"><div class="swap-en">${hlExpr(x.en, x.coreEn||(!isG?patEn:''), x.word, 'sw')}</div><div class="swap-kr">${escapeHtml(x.kr)}</div></div>`).join('');
  const label = sibs.length ? `<div class="swap-label">단어만 바꿔서 이렇게도 말할 수 있어요</div>` : '';
  return `<div class="payoff">
      <div class="payoff-top">🎉 새로운 ${isG?'문법':'표현'}을 배웠어요</div>
      ${frame}${label}${exs}
    </div>`;
}

// [2] 문장 배열 ────────────────────────────────────────────────────────────────
function renderArrange(){
  const item=sessionItems[itemIdx], s=item.sentence;
  setProgress(itemIdx*2+1);
  renderStepBanner(2, item.word);
  const tokens=tokenize(s.en), punct=trailPunct(s.en);
  const target=tokens.map(t=>t.toLowerCase()).join(' ');
  // 뱅크(자리 유지): placed 플래그 + 방금 배운 어휘 여부(isTrig)
  let bank=shuffle(tokens.map((t,i)=>({id:i, text:t.toLowerCase(), placed:false, isTrig:isTriggerToken(t, s.trigger)})));
  let ans=[], done=false, usedFired=false;

  stage.innerHTML=`
    <div class="stage-scroll">
      <div class="chat-card" id="card">
        ${chatTag(item)}<div class="chat-badge new">New</div>
        <div class="chat-ko">${escapeHtml(s.kr)}</div>
        <div id="patBox">${learnBoxHtml(item)}</div>
        <div class="fill" id="fill"></div>
        <div id="payoffBox"></div>
        <div class="mic-float" id="micFloat">🎤</div>
      </div>
    </div>
    <div class="stage-bottom" id="bottom">
      <div class="bank" id="bank"></div>
      <div class="arr-btns" id="arrBtns">
        <button class="btn-ghost2" id="revealBtn"><span class="ic">✔</span>정답 보기</button>
        <button class="btn-confirm" id="confirmBtn" disabled>확인</button>
      </div>
    </div>`;

  const fillEl=el('fill'), bankEl=el('bank');

  function renderFill(){
    let h='';
    for(let i=0;i<tokens.length;i++){
      if(i<ans.length){
        h+=`<span class="fill-word${ans[i].isTrig?' trigger-w':''}" data-i="${i}">${escapeHtml(ans[i].text)}</span>`;
      } else h+=`<span class="fill-blank"></span>`;
    }
    if(punct) h+=`<span class="fill-punct">${escapeHtml(punct)}</span>`;
    fillEl.innerHTML=h;
    if(!done) fillEl.querySelectorAll('.fill-word').forEach(w=> w.onclick=()=>{
      const i=+w.dataset.i; const t=ans[i]; t.placed=false; ans.splice(i,1); renderAll();
    });
  }
  function renderBank(){
    bankEl.innerHTML='';
    bank.forEach(t=>{
      const b=document.createElement('button');
      b.className='tile'+(t.placed?' placed':'')+(t.isTrig&&!done?' trigger':'');
      b.textContent=t.text;
      if(t.isTrig) b.dataset.label=chipLabelText(item);
      if(!t.placed && !done) b.onclick=()=>{
        if(ans.length>=tokens.length) return;
        t.placed=true; ans.push(t);
        const idx=ans.length-1;
        renderAll();
        if(t.isTrig && !usedFired){ usedFired=true; fireUsedEffect(idx); }
      };
      bankEl.appendChild(b);
    });
  }
  function renderAll(){ renderFill(); renderBank(); el('confirmBtn').disabled = ans.length<tokens.length; }

  // 방금 배운 어휘를 문장에 넣는 순간: 팝 + 링 반사 + 배지 + 햅틱
  function fireUsedEffect(idx){
    const w=fillEl.querySelector(`.fill-word[data-i="${idx}"]`);
    if(!w) return;
    w.classList.add('just-used');
    const ring=document.createElement('span'); ring.className='ring';
    ring.style.left=w.offsetLeft+'px'; ring.style.top=w.offsetTop+'px';
    ring.style.width=w.offsetWidth+'px'; ring.style.height=w.offsetHeight+'px';
    fillEl.appendChild(ring); setTimeout(()=>ring.remove(), 700);
    const badge=document.createElement('span'); badge.className='used-badge'; badge.textContent='방금 배운 단어!';
    badge.style.left=(w.offsetLeft+w.offsetWidth/2)+'px'; badge.style.top=(w.offsetTop-16)+'px';
    fillEl.appendChild(badge); setTimeout(()=>badge.remove(), 1250);
    try{ navigator.vibrate && navigator.vibrate([12,26,18]); }catch(e){}   // Android만 동작
  }

  function finish(ok){
    done=true;
    el('card').classList.add('correct');
    if(!el('card').querySelector('.check-mark')){ const c=document.createElement('div'); c.className='check-mark'; c.textContent='✓'; el('card').appendChild(c); }
    // 완성 문장(트리거 초록) → 그 아래 프레임·응용 예문 순서로 보여준다
    el('patBox').innerHTML='';
    el('micFloat').classList.add('hidden');
    fillEl.innerHTML=`<div style="font-size:19px;font-weight:800;color:#2f3e52;line-height:1.5">${hlExpr(s.en, s.coreEn, s.trigger)}</div>`;
    el('payoffBox').innerHTML=patternPayoffHtml(item);
    const last=itemIdx>=sessionItems.length-1;
    el('bottom').innerHTML=`<button class="btn-next" id="nextBtn">${last?'완료하기 🎉':'다음 문제 ▶'}</button>`;
    el('nextBtn').onclick=()=>{ learned.push(item); if(last) renderDone(); else { itemIdx++; renderVocab(); } };
  }

  el('confirmBtn').onclick=()=>{
    if(ans.length<tokens.length) return;
    const ok=ans.map(x=>x.text).join(' ')===target;
    if(ok) finish(true);
    else { // 오답: 잠깐 표시 후 정답 공개
      fillEl.querySelectorAll('.fill-word').forEach(w=>w.style.color='#e14b46');
      setTimeout(()=>{ finish(false); }, 700);
    }
  };
  el('revealBtn').onclick=()=>{ finish(false); };

  renderAll();
}

// ── 완료 ──────────────────────────────────────────────────────────────────────
function renderDone(){
  setPos(curMode, sessionItems.length);
  topbar.classList.add('hidden'); stage.classList.remove('hidden'); home.classList.add('hidden');
  renderStepBanner(0);
  const items=learned.length?learned:sessionItems;
  const modeWord = curMode==='grammar' ? '문법' : '표현';
  stage.innerHTML=`<div class="done">
    <div class="emoji">🎉</div>
    <h2>${items.length}문항 완료!</h2>
    <p>어휘 ${items.length}개와 서로 다른 ${modeWord} ${items.length}개를 배웠어요.</p>
    <div class="learned-list">
      <div class="h">배운 어휘 & ${modeWord}</div>
      ${items.map(it=>`<div class="it"><b>${escapeHtml(it.word)}</b> · ${escapeHtml(it.meaning)}<br><span class="en">${escapeHtml(it.sentence.en)}</span></div>`).join('')}
    </div>
    <div class="row" style="margin-top:8px;">
      <button class="btn ghost" id="againBtn">처음부터 다시</button>
      <button class="btn" id="homeBtn">홈으로</button>
    </div>
  </div>`;
  el('againBtn').onclick=()=>{ setPos(curMode,0); startSession(0); };
  el('homeBtn').onclick=()=>renderHome();
}
</script>
